function setMlpTieScore(sessionId, tieId, gameIndex, which, value){
  try{
    const session = (DATA.mlpSessions||[]).find(s=>s.id===sessionId);
    if(!session){ showAlert("Session introuvable (id: "+sessionId+")."); return; }
    session.ties = session.ties || [];
    const tie = session.ties.find(x=>x.id===tieId);
    if(!tie){ showAlert("Affrontement introuvable (id: "+tieId+")."); return; }
    if(!tie.games || !tie.games.length) tie.games = newMLPGames(DATA.mlpRosterSize||4);
    const g = tie.games[gameIndex];
    if(!g){ showAlert("Joute introuvable (index "+gameIndex+")."); return; }
    if(which==='A') g.scoreA = value===''?null:Number(value);
    else g.scoreB = value===''?null:Number(value);
    // Volontairement : aucune redessine ici. La saisie se contente d'enregistrer
    // la valeur ; le calcul du gagnant/points/DreamBreaker se fait uniquement
    // au clic sur « Valider ce résultat » (voir recomputeMlpTie), pour ne
    // jamais reconstruire la page pendant que l'admin est en train de taper.
    saveData();
  } catch(e){
    showAlert("Erreur pendant la saisie du score : " + (e && e.message ? e.message : e));
  }
}
function recomputeMlpTie(sessionId, tieId){
  try{
    const session = (DATA.mlpSessions||[]).find(s=>s.id===sessionId);
    if(!session){ showAlert("Session introuvable."); return; }
    const tie = (session.ties||[]).find(x=>x.id===tieId);
    if(!tie){ showAlert("Affrontement introuvable."); return; }
    const cfg = { mlpRosterSize: DATA.mlpRosterSize||4 };
    const result = computeMLPTieWinner(cfg, tie.games, tie.teamAId, tie.teamBId);
    if(result.needsDreambreaker && !tie.games.some(x=>x.type==='dreambreaker')){
      tie.games.push({ type:'dreambreaker', scoreA:null, scoreB:null });
    } else if(!result.needsDreambreaker){
      tie.games = tie.games.filter(x=>x.type!=='dreambreaker');
    }
    tie.winnerTeamId = result.winnerTeamId;
    if(tie.winnerTeamId){
      const pts = computeMLPTiePoints(tie, tie.teamAId, tie.teamBId);
      tie.pointsA = pts.pointsA; tie.pointsB = pts.pointsB;
    } else {
      tie.pointsA = null; tie.pointsB = null;
      showAlert("Résultat pas encore déterminé — vérifie que toutes les joutes ont un score.");
    }
    saveAndRender();
  } catch(e){
    showAlert("Erreur pendant la validation du résultat : " + (e && e.message ? e.message : e));
  }
}

  (DATA.mlpTeams||[]).forEach(t=>{ standings[t.id] = { teamId:t.id, name:t.name, points:0, played:0, wins:0, losses:0 }; });

  </div>`;
}
// ==================== FIN LIGUE MLP ====================
function computeGamesWinner(games, teamAId, teamBId){
  const winsNeeded = Math.ceil((games||[]).length/2) || 1;
  let winsA=0, winsB=0;
  (games||[]).forEach(g=>{
    if(g.scoreA===null || g.scoreB===null || g.scoreA===g.scoreB) return;
    if(g.scoreA > g.scoreB) winsA++; else winsB++;
  });
  let winnerTeamId = null;
  if(winsA>=winsNeeded) winnerTeamId = teamAId;
  else if(winsB>=winsNeeded) winnerTeamId = teamBId;
  return { winnerTeamId, winsA, winsB };
}
function newEmptyGames(bestOf){
  return Array.from({ length: bestOf||1 }, ()=>({ scoreA:null, scoreB:null }));
}
function buildSingleElimBracket(teams, defaultFormat, mlpRosterSize){
  const fmt = defaultFormat || { pointsToWin:11, bestOf:1, winByTwo:true };
  const makeGames = ()=> mlpRosterSize ? newMLPGames(mlpRosterSize) : newEmptyGames(fmt.bestOf);
  const seeded = teams.slice().sort((a,b)=>{
    const as = typeof a.seed==='number' ? a.seed : -Infinity;
    const bs = typeof b.seed==='number' ? b.seed : -Infinity;
    return bs - as;
  });
  const n = seeded.length;
  let bracketSize = 1;
  while(bracketSize < n) bracketSize *= 2;
  const slots = standardBracketOrder(bracketSize);
  const teamsInSlots = slots.map(pos => pos < n ? seeded[pos] : null);
  const round1Matches = [];
  for(let i=0;i<teamsInSlots.length;i+=2){
    const a = teamsInSlots[i], b = teamsInSlots[i+1];
    round1Matches.push({ id: uid('tm'), teamAId: a?a.id:null, teamBId: b?b.id:null, games: makeGames(), winnerTeamId:null, isBye: (!a || !b) });
  }
  const rounds = [{ roundNumber:1, matches: round1Matches, matchFormat: {...fmt} }];
  let prevCount = round1Matches.length;
  let roundNum = 2;
  while(prevCount > 1){
    const matches = [];
    for(let i=0;i<prevCount/2;i++){ matches.push({ id: uid('tm'), teamAId:null, teamBId:null, games: makeGames(), winnerTeamId:null, isBye:false }); }
    rounds.push({ roundNumber: roundNum, matches, matchFormat: {...fmt} });
    prevCount = matches.length;
    roundNum++;
  }
  propagateByeWinners(rounds);
  return { format:'single_elim', rounds };
}
function generateBracket(tournamentId){
  const t = (DATA.tournaments||[]).find(x=>x.id===tournamentId);
  if(!t) return;
  if(!t.teams || t.teams.length < 2){ showAlert("Il faut au moins 2 équipes — forme d'abord les équipes ci-dessus."); return; }
  if(t.format === 'pools_then_elim'){ openGeneratePoolsModal(tournamentId); return; }
  if(t.format !== 'single_elim'){
    showAlert(`Le format « ${TOURNAMENT_FORMAT_LABELS[t.format]||t.format} » arrive dans une prochaine mise à jour — pour l'instant, seuls l'élimination simple et les poules puis élimination sont disponibles. Tu peux changer le format du tournoi dans « ✏️ Modifier » si tu veux commencer avec l'un de ceux-ci.`);
    return;
  }
  const msg = t.bracket ? "Regénérer le bracket effacera tous les résultats déjà entrés. Continuer ?" : "Générer le bracket avec les équipes actuelles ?";
  showConfirm(msg, ()=>{
    t.bracket = buildSingleElimBracket(t.teams, t.matchFormat, t.teamFormat==='mlp' ? (t.mlpRosterSize||4) : null);
    t.status = 'in_progress';
    saveAndRender();
  });
}
function setBracketMatchScore(tournamentId, roundIndex, matchIndex, gameIndex, which, value){
  const t = (DATA.tournaments||[]).find(x=>x.id===tournamentId);
  if(!t || !t.bracket) return;
  const m = t.bracket.rounds[roundIndex].matches[matchIndex];
  if(!m.games) m.games = t.teamFormat==='mlp' ? newMLPGames(t.mlpRosterSize||4) : newEmptyGames(1);
  const g = m.games[gameIndex];
  if(!g) return;
  if(which==='A') g.scoreA = value===''?null:Number(value);
  else g.scoreB = value===''?null:Number(value);
  let result;
  if(t.teamFormat==='mlp'){
    result = (m.teamAId && m.teamBId) ? computeMLPTieWinner(t, m.games, m.teamAId, m.teamBId) : { winnerTeamId:null, needsDreambreaker:false };
    if(result.needsDreambreaker && !m.games.some(x=>x.type==='dreambreaker')){
      m.games.push({ type:'dreambreaker', scoreA:null, scoreB:null });
    } else if(!result.needsDreambreaker){
      m.games = m.games.filter(x=>x.type!=='dreambreaker');
    }
  } else {
    result = (m.teamAId && m.teamBId) ? computeGamesWinner(m.games, m.teamAId, m.teamBId) : { winnerTeamId:null };
  }
  m.winnerTeamId = result.winnerTeamId;
  if(m.winnerTeamId && roundIndex < t.bracket.rounds.length-1){
    const nextMatch = t.bracket.rounds[roundIndex+1].matches[Math.floor(matchIndex/2)];
    if(matchIndex%2===0) nextMatch.teamAId = m.winnerTeamId; else nextMatch.teamBId = m.winnerTeamId;
  }
  const lastRound = t.bracket.rounds[t.bracket.rounds.length-1];
  t.status = lastRound.matches[0].winnerTeamId ? 'completed' : 'in_progress';
  saveData();
}

function generatePools(tournamentId, numPools, advancePerPool){
  const t = (DATA.tournaments||[]).find(x=>x.id===tournamentId);
  if(!t) return;
  const seeded = t.teams.slice().sort((a,b)=>{
    const as = typeof a.seed==='number' ? a.seed : -Infinity;
    const bs = typeof b.seed==='number' ? b.seed : -Infinity;
    return bs - as;
  });
  const pools = [];
  for(let i=0;i<numPools;i++) pools.push({ id: uid('pool'), name: 'Poule ' + String.fromCharCode(65+i), teamIds: [], matches: [] });
  // Répartition en serpentin (1,2,3...N,N...3,2,1) pour équilibrer le niveau entre les poules.
  let dir = 1, idx = 0;
  seeded.forEach(team=>{
    pools[idx].teamIds.push(team.id);
    idx += dir;
    if(idx === numPools){ idx = numPools-1; dir = -1; }
    else if(idx < 0){ idx = 0; dir = 1; }
  });
  pools.forEach(pool=>{
    for(let i=0;i<pool.teamIds.length;i++){
      for(let j=i+1;j<pool.teamIds.length;j++){
        pool.matches.push({ id: uid('pm'), teamAId: pool.teamIds[i], teamBId: pool.teamIds[j], games: newEmptyGames(t.poolsMatchFormat?t.poolsMatchFormat.bestOf:1) });
      }
    }
  });
  t.pools = pools;
  t.poolsConfig = { advancePerPool };
  t.bracket = null;
  t.status = 'in_progress';
  saveAndRender();
}
function computePoolStandings(pool){
  const stats = {};
  pool.teamIds.forEach(id=> stats[id] = { wins:0, losses:0, pf:0, pa:0 });
  pool.matches.forEach(m=>{
    const games = m.games || [];
    let pfA=0, paA=0;
    games.forEach(g=>{
      if(g.scoreA===null || g.scoreB===null) return;
      pfA += g.scoreA; paA += g.scoreB;
    });
    if(pfA===0 && paA===0) return; // rien de joué encore
    const result = computeGamesWinner(games, m.teamAId, m.teamBId);
    stats[m.teamAId].pf += pfA; stats[m.teamAId].pa += paA;
    stats[m.teamBId].pf += paA; stats[m.teamBId].pa += pfA;
    if(result.winnerTeamId===m.teamAId){ stats[m.teamAId].wins++; stats[m.teamBId].losses++; }
    else if(result.winnerTeamId===m.teamBId){ stats[m.teamBId].wins++; stats[m.teamAId].losses++; }
  });
  return pool.teamIds.map(id=>({ teamId:id, ...stats[id], diff: stats[id].pf-stats[id].pa }))
    .sort((a,b)=> b.wins-a.wins || b.diff-a.diff || b.pf-a.pf);
}
function setPoolMatchScore(tournamentId, poolId, matchIndex, gameIndex, which, value){

  if(which==='A') g.scoreA = value===''?null:Number(value);
  else g.scoreB = value===''?null:Number(value);
  saveData();
}
function finalizePoolsAndGenerateBracket(tournamentId){
  const t = (DATA.tournaments||[]).find(x=>x.id===tournamentId);
  if(!t || !t.pools) return;
  const allComplete = t.pools.every(pool=> pool.matches.every(m=> computeGamesWinner(m.games, m.teamAId, m.teamBId).winnerTeamId));
  if(!allComplete){ showAlert("Tous les matchs de poules doivent être complétés avant de générer le bracket final."); return; }
  const advancing = [];
  t.pools.forEach(pool=>{
    const standings = computePoolStandings(pool);
    standings.slice(0, t.poolsConfig.advancePerPool).forEach((row, rank)=>{
      const team = t.teams.find(x=>x.id===row.teamId);
      if(team) advancing.push({ ...team, seed: (t.teams.length*10) - rank }); // priorité au rang de poule
    });
  });
  const msg = t.bracket ? "Regénérer le bracket final effacera les résultats déjà entrés. Continuer ?" : `Générer le bracket final avec les ${advancing.length} équipes qualifiées ?`;
  showConfirm(msg, ()=>{
    t.bracket = buildSingleElimBracket(advancing, t.matchFormat);
    t.status = 'in_progress';
    saveAndRender();
  });
}

        </table>`;

// ---- Mode test : simule tout le tournoi avec des scores aléatoires ----
function simulateMatchGames(seedA, seedB, format){
  const fmt = format || { pointsToWin:11, bestOf:1, winByTwo:true };
  const bestOf = fmt.bestOf || 1;
  const winsNeeded = Math.ceil(bestOf/2);
  const sa = typeof seedA==='number' ? seedA : RATING_DEFAULT;
  const sb = typeof seedB==='number' ? seedB : RATING_DEFAULT;
  const expectedA = 1 / (1 + Math.pow(10, (sb-sa)/RATING_SCALE));
  const games = [];
  let winsA=0, winsB=0;
  while(winsA<winsNeeded && winsB<winsNeeded && games.length<bestOf){
    const aWins = Math.random() < expectedA;
    const winnerScore = fmt.pointsToWin || 11;
    const loserScore = Math.floor(Math.random()*Math.max(1,winnerScore-2)); // sous la barre, pour un peu de suspense
    games.push(aWins ? { scoreA:winnerScore, scoreB:loserScore } : { scoreA:loserScore, scoreB:winnerScore });
    if(aWins) winsA++; else winsB++;
  }
  while(games.length < bestOf) games.push({ scoreA:null, scoreB:null }); // joutes non jouées (ex: 2-0 dans un Bo3)
  return games;
}
function autoFormTeamsForSimulation(t){
  if(t.teamFormat === 'singles'){
    t.teams = t.participants.map(p=>({ id: uid('team'), memberIds:[p.id], memberNames:[p.name], seed: p.seed }));
  } else {
    const shuffled = t.participants.slice().sort(()=>Math.random()-0.5);
    t.teams = [];
    for(let i=0;i+1<shuffled.length;i+=2){
      const pair = [shuffled[i], shuffled[i+1]];
      const seeds = pair.map(p=> typeof p.seed==='number'?p.seed:RATING_DEFAULT);
      t.teams.push({ id: uid('team'), memberIds: pair.map(p=>p.id), memberNames: pair.map(p=>p.name), seed:(seeds[0]+seeds[1])/2 });
    }
  }
}
function simulateOnePool(t, pool){
  pool.matches.forEach(m=>{
    const alreadyPlayed = (m.games||[]).some(g=>g.scoreA!==null);
    if(alreadyPlayed) return; // déjà joué : on ne l'écrase pas
    const teamA = t.teams.find(x=>x.id===m.teamAId);
    const teamB = t.teams.find(x=>x.id===m.teamBId);
    m.games = simulateMatchGames(teamA?teamA.seed:null, teamB?teamB.seed:null, t.poolsMatchFormat);
  });
}
function simulateSinglePool(tournamentId, poolId){
  const t = (DATA.tournaments||[]).find(x=>x.id===tournamentId);
  if(!t || !t.pools) return;

  showConfirm(`Simuler seulement la « ${pool.name} » avec des scores aléatoires ?`, ()=>{

    simulateOnePool(t, pool);
    saveAndRender();

}
function simulatePoolMatches(t){
  t.pools.forEach(pool=> simulateOnePool(t, pool));
}
function simulateOneRound(t, ri){
  const round = t.bracket.rounds[ri];
  round.matches.forEach((m, mi)=>{
    if(m.winnerTeamId) return; // déjà résolu (bye ou déjà joué)
    if(!m.teamAId || !m.teamBId) return; // en attente d'une ronde précédente
    const teamA = t.teams.find(x=>x.id===m.teamAId);
    const teamB = t.teams.find(x=>x.id===m.teamBId);
    const roundFormat = round.matchFormat || t.matchFormat;
    m.games = simulateMatchGames(teamA?teamA.seed:null, teamB?teamB.seed:null, roundFormat);
    const result = computeGamesWinner(m.games, m.teamAId, m.teamBId);
    m.winnerTeamId = result.winnerTeamId;
    if(ri < t.bracket.rounds.length-1){
      const nextMatch = t.bracket.rounds[ri+1].matches[Math.floor(mi/2)];
      if(mi%2===0) nextMatch.teamAId = m.winnerTeamId; else nextMatch.teamBId = m.winnerTeamId;
    }
  });
}
function simulateBracketMatches(t){
  t.bracket.rounds.forEach((round, ri)=> simulateOneRound(t, ri));
}
// Simule seulement une ronde précise du bracket (doit déjà avoir ses deux
// équipes déterminées par la ronde précédente).
function simulateSingleRound(tournamentId, roundIndex){
  const t = (DATA.tournaments||[]).find(x=>x.id===tournamentId);
  if(!t || !t.bracket) return;
  const round = t.bracket.rounds[roundIndex];
  const realMatches = round.matches.filter(m=>!m.isBye);
  if(realMatches.some(m=> !m.teamAId || !m.teamBId)){
    showAlert("Certains affrontements de cette ronde ne sont pas encore déterminés — complète (ou simule) la ronde précédente d'abord.");
    return;
  }
  showConfirm(`Simuler seulement « ${bracketRoundLabel(roundIndex, t.bracket.rounds.length-1)} » avec des scores aléatoires ?`, ()=>{
    round.matches.forEach(m=>{
      if(m.isBye) return;
      m.games = newEmptyGames(round.matchFormat ? round.matchFormat.bestOf : 1);
      m.winnerTeamId = null;
    });
    simulateOneRound(t, roundIndex);
    const lastRound = t.bracket.rounds[t.bracket.rounds.length-1];
    t.status = lastRound.matches[0].winnerTeamId ? 'completed' : 'in_progress';
    saveAndRender();
  });
}
function resetBracketResultsKeepingStructure(bracket){
  bracket.rounds.forEach((round, ri)=>{
    round.matches.forEach(m=>{
      if(m.isBye) return; // les byes n'ont pas de résultat à effacer
      m.games = newEmptyGames(round.matchFormat ? round.matchFormat.bestOf : 1);
      m.winnerTeamId = null;
      if(ri>0){ m.teamAId = null; m.teamBId = null; } // seront repropagés depuis la ronde précédente
    });
  });
  propagateByeWinners(bracket.rounds);
}
function simulateTournament(tournamentId){
  const t = (DATA.tournaments||[]).find(x=>x.id===tournamentId);
  if(!t) return;
  if(t.format === 'double_elim'){ showAlert("La double élimination n'est pas encore disponible — impossible de la simuler pour l'instant."); return; }
  if(t.participants.length < 2){ showAlert("Ajoute au moins 2 participants avant de simuler."); return; }
  showConfirm("Simuler ce tournoi au complet avec des scores aléatoires (pondérés selon la cote de chacun) ? Utile pour prévisualiser le fonctionnement — écrase les scores déjà entrés. Pas pour un vrai tournoi !", ()=>{
    if(!t.teams || t.teams.length===0) autoFormTeamsForSimulation(t);
    if(!t.teams || t.teams.length < 2){ showAlert("Pas assez d'équipes pour simuler."); return; }
    if(t.format === 'pools_then_elim'){
      if(!t.pools){
        const numPools = Math.max(2, Math.min(4, Math.floor(t.teams.length/4) || 2));
        generatePools(t.id, numPools, 2);
      } else {
        // Poules déjà générées : on efface les scores pour une vraie nouvelle simulation.
        t.pools.forEach(pool=> pool.matches.forEach(m=>{ m.games = newEmptyGames(t.poolsMatchFormat?t.poolsMatchFormat.bestOf:1); }));
      }
      simulatePoolMatches(t);
      const advancing = [];
      t.pools.forEach(pool=>{
        const standings = computePoolStandings(pool);
        standings.slice(0, t.poolsConfig.advancePerPool).forEach((row, rank)=>{
          const team = t.teams.find(x=>x.id===row.teamId);
          if(team) advancing.push({ ...team, seed: (t.teams.length*10) - rank });
        });
      });
      // Note : regénère le bracket final au complet (les formats personnalisés
      // ronde par ronde sur un bracket final précédent ne sont pas conservés
      // ici, puisque la liste des équipes qualifiées peut changer).
      t.bracket = buildSingleElimBracket(advancing, t.matchFormat);
    } else if(!t.bracket){
      t.bracket = buildSingleElimBracket(t.teams, t.matchFormat);
    } else {
      resetBracketResultsKeepingStructure(t.bracket); // garde les formats personnalisés par ronde
    }
    simulateBracketMatches(t);
    t.status = 'completed';
    saveAndRender();
  });
}

  const t = (DATA.tournaments||[]).find(x=>x.id===tournamentId);

async function reloadCurrentPlayerNotesAndRefresh(scope){

    await loadPlayerNotesForProfile(scope.profileId);

function togglePlayerInjured(pid){

function addPlayerFromList(){
  const nameEl = document.getElementById('newPlayerName');
  const groupEl = document.getElementById('newPlayerGroup');
  const genderEl = document.getElementById('newPlayerGender');
  const ratingEl = document.getElementById('newPlayerRating');
  const rawName = nameEl.value.trim();
  const desiredGroupId = groupEl.value;
  if(!rawName) return;
  const name = uniquePlayerName(rawName, DATA.players);

  DATA.players.push({ id: uid('p'), name, groupId, rating: Math.round(rating*1000)/1000, ratingGames: 0, order: groupId ? nextOrderInGroup(groupId) : 0, status: 'new', gender: genderEl.value || null });

// Modification manuelle de la cote d'un joueur, avec bornes raisonnables
// (2.0-8.0) et une confirmation renforcée si le joueur a déjà des matchs
// comptabilisés (pour éviter d'écraser une cote gagnée par erreur).
function applyRatingEdit(pid, rawValue){
  const p = findRatablePerson(pid); // joueur régulier OU remplaçant du bassin
  if(!p) return;
  const value = parseFloat(String(rawValue).replace(',', '.'));
  if(isNaN(value)){ showAlert("Valeur invalide."); return; }
  const clamped = Math.min(RATING_MAX, Math.max(RATING_MIN, value));
  p.rating = Math.round(clamped * 1000) / 1000;
  saveAndRender();
}
function editPlayerRating(pid){
  const p = findRatablePerson(pid); // joueur régulier OU remplaçant du bassin
  if(!p) return;
  const current = typeof p.rating === 'number' ? p.rating : RATING_DEFAULT;
  const games = typeof p.ratingGames === 'number' ? p.ratingGames : 0;
  const promptForValue = ()=>{
    showPrompt(`Nouvelle cote de ${p.name} (entre ${RATING_MIN.toFixed(1)} et ${RATING_MAX.toFixed(1)}) :`, current.toFixed(2), (val)=>{
      if(val !== null && val !== undefined && val.trim() !== '') applyRatingEdit(pid, val.trim());
    });
  };
  if(games > 0){
    showConfirm(`${p.name} a déjà ${games} match${games>1?'s':''} comptabilisé${games>1?'s':''} dans sa cote actuelle (${current.toFixed(2)}). La modifier manuellement écrasera cette progression. Continuer ?`, promptForValue);
  } else {
    promptForValue();
  }
}

let CURRENT_PLAYER_NOTES_SCOPE = null; // {type:'profile', profileId} ou {type:'player', playerId, leagueId}
let LEAGUE_PLAYER_LINKS = []; // profile_players de la ligue actuellement affichée

// Ajoute un joueur (par son compte lié) dans une AUTRE ligue : crée un nouveau
// joueur là-bas (dans son premier groupe) et lie le compte à celui-ci.
async function addPlayerToLeagueForProfile(leagueId, profileId, name){
  const { data, error } = await sb.from('league_data').select('data').eq('league_id', leagueId).single();
  if(error){ showAlert("Erreur : " + error.message); return null; }
  const leagueData = (data && data.data && Object.keys(data.data).length>0) ? data.data : defaultData();
  leagueData.players = leagueData.players || [];
  leagueData.groups = leagueData.groups || [];
  const groupId = firstGroupWithRoom(leagueData.groups, leagueData.players);
  if(!groupId){ showAlert("Cette ligue n'a pas encore de groupe (ou tous sont pleins à 5 joueurs) — crée-en un d'abord (en y basculant)."); return null; }
  const finalName = uniquePlayerName(name, leagueData.players);
  const groupMembers = leagueData.players.filter(x=>x.groupId===groupId);
  const nextOrder = groupMembers.reduce((m,x)=>Math.max(m, typeof x.order==='number'?x.order:0), 0) + 1;
  const newPlayer = { id: uid('p'), name: finalName, groupId, order: nextOrder };
  leagueData.players.push(newPlayer);
  const { error: err2 } = await sb.from('league_data').update({ data: leagueData, updated_at: new Date().toISOString() }).eq('league_id', leagueId);
  if(err2){ showAlert("Erreur : " + err2.message); return null; }
  const { error: err3 } = await sb.from('profile_players').insert({ profile_id: profileId, league_id: leagueId, player_id: newPlayer.id });
  if(err3){ showAlert("Erreur : " + err3.message); return null; }
  return newPlayer.id;
}
async function removePlayerFromLeagueForProfile(leagueId, profileId){
  const { error } = await sb.from('profile_players').delete().eq('profile_id', profileId).eq('league_id', leagueId);
  if(error){ showAlert("Erreur : " + error.message); }
}

}

      <span>${l.schedule_label ? escapeHTML(l.schedule_label) : escapeHTML(l.name)}${l.schedule_label ? ' <span class="small">('+escapeHTML(l.name)+')</span>' : ''}${l.id===CURRENT_LEAGUE_ID ? ' <span class="small">— ligue actuelle</span>' : ''}</span>

async function toggleProfileLeague(profileId, leagueId, checked, displayName){
  if(checked){

function adminAccountsHTML(){
  const linkedProfileIds = new Set(LEAGUE_PLAYER_LINKS.map(l=>l.profile_id));
  const pending = ALL_PROFILES.filter(p=>!linkedProfileIds.has(p.id));
  const unlinkedPlayers = DATA.players.filter(pl => !LEAGUE_PLAYER_LINKS.some(l=>l.player_id===pl.id));
  const orphaned = LEAGUE_PLAYER_LINKS
    .map(link=>({ link, profile: ALL_PROFILES.find(p=>p.id===link.profile_id) }))
    .filter(x=>x.profile && !DATA.players.some(p=>p.id===x.link.player_id));
  const adminCount = ALL_PROFILES.filter(p=>p.role==='admin').length;
  const roleButton = (pr)=>{
    const isAdmin = pr.role === 'admin';
    const disable = isAdmin && adminCount<=1;
    return `<button class="btn-ghost" ${disable?'disabled title="Il doit rester au moins un administrateur"':''} onclick="setAccountRole('${pr.id}','${isAdmin?'player':'admin'}')">${isAdmin?'retirer admin':'rendre admin'}</button>`;
  };
  let html = `<div class="card">
    <div class="row" style="justify-content:space-between;">
      <h2>Comptes en attente <span class="small">(${pending.length})</span></h2>
      <button class="btn-ghost" onclick="refreshAccountsTab()">rafraîchir</button>
    </div>
    <p class="small">Ces personnes ont créé un compte mais ne sont pas encore associées à un joueur de cette ligue. Un compte marqué <span class="tag tag-up">👑 Admin</span> a déjà accès complet à l'espace administrateur, même sans être lié à un joueur.</p>
    <table>
      <tr><th>Nom</th><th>Courriel</th><th>Rôle</th><th>Associer à</th></tr>
      ${pending.map(pr=>`<tr${pr.role==='admin' ? ' style="background:rgba(207,234,92,0.06);"' : ''}>
        <td>${escapeHTML(pr.display_name || '—')}${pr.role==='admin' ? ' <span class="tag tag-up">👑 Admin</span>' : ''}</td>
        <td>${escapeHTML(pr.email)}</td>
        <td>${pr.role==='admin'?'Admin':(pr.role==='substitute'?'Remplaçant':'Joueur')}<br>${roleButton(pr)}</td>
        <td>
          <select id="linkSelect_${pr.id}">
            <option value="">— choisir un joueur —</option>
            ${unlinkedPlayers.map(pl=>`<option value="${pl.id}">${escapeHTML(pl.name)}</option>`).join('')}
            <option value="__new__">+ Créer un nouveau joueur « ${escapeHTML(pr.display_name||pr.email)} »</option>
          </select>
          <button class="btn-ghost" onclick="linkAccount('${pr.id}')">lier</button>
        </td>
      </tr>`).join('')}
      ${pending.length===0 ? `<tr><td colspan="4" class="empty">Aucun compte en attente</td></tr>` : ''}
    </table>
  </div>`;
  if(orphaned.length){
    html += `<div class="card">
      <h2 style="color:var(--danger);">Comptes orphelins <span class="small">(${orphaned.length})</span></h2>
      <p class="small">Le joueur associé à ces comptes a été retiré. Reconnecte-les à un joueur existant, ou supprime le lien.</p>
      <table>
        <tr><th>Courriel</th><th>Rôle</th><th>Reconnecter à</th><th></th></tr>
        ${orphaned.map(({profile})=>`<tr>
          <td>${escapeHTML(profile.email)}</td>
          <td>${profile.role==='admin' ? 'Admin' : 'Joueur'}<br>${roleButton(profile)}</td>
          <td>
            <select id="relinkSelect_${profile.id}">
              <option value="">— choisir un joueur —</option>
              ${unlinkedPlayers.map(pl2=>`<option value="${pl2.id}">${escapeHTML(pl2.name)}</option>`).join('')}
              <option value="__new__">+ Créer un nouveau joueur « ${escapeHTML(profile.display_name||profile.email)} »</option>
            </select>
            <button class="btn-ghost" onclick="relinkAccount('${profile.id}')">relier</button>
          </td>
          <td><button class="btn-ghost-danger" onclick="unlinkAccount('${profile.id}')">délier</button></td>
        </tr>`).join('')}
      </table>
    </div>`;
  }
  return html;
}
function setAccountRole(profileId, newRole){
  showConfirm(`Confirmer le changement de rôle vers « ${newRole==='admin'?'Admin':'Joueur'} » ?`, async ()=>{
    const { error } = await sb.from('profiles').update({ role: newRole }).eq('id', profileId);
    if(error){ showAlert("Erreur : " + error.message); return; }
    await loadAllProfiles();
    if(CURRENT_PROFILE && CURRENT_PROFILE.id === profileId){
      CURRENT_PROFILE.role = newRole;
      if(newRole === 'admin'){
        SESSION_USER = { role:'admin', email: CURRENT_PROFILE.email };
        VIEW = { tab:'session' };
        await refreshMyLinkForCurrentLeague();
      } else {
        await loadMyLeagueLinks(CURRENT_PROFILE.id);
        if(MY_LEAGUE_LINKS.length){
          const link = MY_LEAGUE_LINKS[0];
          CURRENT_LEAGUE_ID = link.league_id;
          const loaded = await loadData(CURRENT_LEAGUE_ID);
          DATA = loaded || defaultData();
          migrateData();
          SESSION_USER = { role:'player', playerId: link.player_id };
          VIEW = { tab:'classement' };
        } else {
          SESSION_USER = { role:'pending', email: CURRENT_PROFILE.email, displayName: CURRENT_PROFILE.display_name };
        }
      }
    }
    render();
  });
}
function refreshAccountsTab(){ loadAllProfiles().then(render); }
async function linkAccount(profileId){
  const select = document.getElementById('linkSelect_'+profileId);
  const value = select.value;
  if(!value) return;
  let playerId = value;
  if(value === '__new__'){
    const pr = ALL_PROFILES.find(p=>p.id===profileId);
    const groupId = firstGroupWithRoom(DATA.groups, DATA.players);
    if(!groupId){ showAlert("Crée d'abord au moins un groupe (ou tous sont pleins à 5 joueurs)."); return; }
    const name = uniquePlayerName(pr.display_name || pr.email, DATA.players);
    const newPlayer = { id: uid('p'), name, groupId, order: nextOrderInGroup(groupId) };
    DATA.players.push(newPlayer);
    await saveData();
    playerId = newPlayer.id;
  }
  const { error } = await sb.from('profile_players').insert({ profile_id: profileId, league_id: CURRENT_LEAGUE_ID, player_id: playerId });
  if(error){ showAlert("Erreur lors de la liaison : " + error.message); return; }
  await migratePlayerNotesToProfile(CURRENT_LEAGUE_ID, playerId, profileId);
  await loadAllProfiles();
  if(CURRENT_PROFILE && CURRENT_PROFILE.id === profileId){ await refreshMyOwnLinks(); }
  render();
}
// Reconnecte un compte dont le joueur associé a été retiré par erreur (le
// lien existe déjà en base pour cette ligue, on met juste à jour vers quel
// joueur il pointe, plutôt que de devoir délier puis relier séparément).
async function relinkAccount(profileId){
  const select = document.getElementById('relinkSelect_'+profileId);
  const value = select.value;
  if(!value) return;
  let playerId = value;
  if(value === '__new__'){
    const pr = ALL_PROFILES.find(p=>p.id===profileId);
    const groupId = firstGroupWithRoom(DATA.groups, DATA.players);
    if(!groupId){ showAlert("Crée d'abord au moins un groupe (ou tous sont pleins à 5 joueurs)."); return; }
    const name = uniquePlayerName(pr.display_name || pr.email, DATA.players);
    const newPlayer = { id: uid('p'), name, groupId, order: nextOrderInGroup(groupId) };
    DATA.players.push(newPlayer);
    await saveData();
    playerId = newPlayer.id;
  }
  const { error } = await sb.from('profile_players').update({ player_id: playerId }).eq('profile_id', profileId).eq('league_id', CURRENT_LEAGUE_ID);
  if(error){ showAlert("Erreur lors de la reconnexion : " + error.message); return; }
  await migratePlayerNotesToProfile(CURRENT_LEAGUE_ID, playerId, profileId);
  await loadAllProfiles();
  if(CURRENT_PROFILE && CURRENT_PROFILE.id === profileId){ await refreshMyOwnLinks(); }
  render();
}
async function unlinkAccount(profileId){
  showConfirm("Délier ce compte de son joueur pour cette ligue ? (Ses liens avec d'autres ligues, s'il y en a, ne sont pas touchés.)", async ()=>{
    const { error } = await sb.from('profile_players').delete().eq('profile_id', profileId).eq('league_id', CURRENT_LEAGUE_ID);
    if(error){ showAlert("Erreur : " + error.message); return; }
    await loadAllProfiles();
    if(CURRENT_PROFILE && CURRENT_PROFILE.id === profileId){ ADMIN_VIEWING_AS = null; await refreshMyOwnLinks(); }
    render();
  });
}

// Gestion des absences/remplaçants pour UN groupe en particulier, intégrée
// directement dans sa carte (au lieu d'une vue centralisée à part).
function groupAbsenceManagementHTML(open, g){
  const gd = open.groupsData.find(x=>x.groupId===g.id);
  if(!gd) return '';
  const groupPlayerIds = playersInGroup(g.id).map(p=>p.id);
  const injuredIds = groupPlayerIds.filter(id=>{ const p = DATA.players.find(x=>x.id===id); return p && p.injured; });
  const absentIds = groupPlayerIds.filter(id=>isAbsent(open,id) && !injuredIds.includes(id));
  const allIds = [...injuredIds, ...absentIds];
  if(allIds.length===0) return '';
  const subs = gd.substitutes || {};
  const inUse = substitutesInUse(open, g.id, null);
  let html = `<div style="margin-top:12px;border-top:1px solid rgba(255,255,255,0.08);padding-top:10px;">
    <h3 style="margin-bottom:8px;">Remplaçants — session du ${open.date}</h3>`;
  allIds.forEach(id=>{
    const isInjured = injuredIds.includes(id);
    const currentSub = subs[id];
    const loanedTo = open.loans && open.loans[id] ? groupById(open.loans[id]) : null;
    const eligible = DATA.players.filter(p=> p.id!==id && p.groupId!==g.id && (!inUse.has(p.id) || p.id===currentSub));
    const status = isInjured
      ? `<span class="tag tag-down">🤕 blessé</span> <span class="small">— ne descend pas de groupe pour ça</span>`
      : (loanedTo
        ? `<span class="tag tag-up">changement</span> parti(e) au ${escapeHTML(loanedTo.name)}`
        : `<span class="small">descendra automatiquement d'un groupe</span>`);
    html += `<div class="row" style="margin-bottom:8px;align-items:center;flex-wrap:wrap;">
      <span style="min-width:110px;">${escapeHTML(playerName(id))}</span>
      <span style="min-width:150px;">${status}</span>
      <select onchange="onSubSelect('${g.id}','${id}', this.value)">
        <option value="">— place vide, pas de remplaçant —</option>
        ${eligible.map(p=>{
          const pg = groupById(p.groupId);
          return `<option value="${p.id}" ${p.id===currentSub?'selected':''}>${escapeHTML(p.name)}${pg ? ' ('+escapeHTML(pg.name)+')' : ''}</option>`;
        }).join('')}
        ${(DATA.substitutePool||[]).length ? `<optgroup label="Remplaçants réguliers">
          ${(DATA.substitutePool||[]).map(s=>{
            const subEncoded = 'sub::' + s.id;
            const isAvailable = open && (open.availableSubs||[]).includes(s.id);
            return `<option value="${subEncoded}" ${subEncoded===currentSub?'selected':''}>${escapeHTML(s.name)}${isAvailable ? ' ✓ disponible' : ''}</option>`;
          }).join('')}
        </optgroup>` : ''}
        ${isGuestId(currentSub) ? `<option value="${currentSub}" selected>${escapeHTML(playerName(currentSub))} (invité)</option>` : ''}
        <option value="__guest__">Autre... (invité hors ligue)</option>
      </select>
    </div>`;
  });
  html += `</div>`;
  return html;
}
function addGroup(){
  const maxOrder = Math.max(0, ...DATA.groups.map(g=>g.order));
  DATA.groups.push({ id: uid('g'), name: 'Groupe ' + (maxOrder+1), order: maxOrder+1 });
  saveAndRender();
}
function renameGroup(gid){
  const g = groupById(gid);
  showPrompt('Nouveau nom du groupe :', g.name, (name)=>{
    if(name && name.trim()){ g.name = name.trim(); saveAndRender(); }
  });
}
// Supprime un groupe. S'il contient encore des joueurs, demande confirmation
// et les réassigne automatiquement au premier groupe ayant de la place —
// annule l'opération si un joueur ne peut être replacé nulle part.
// ---------- glisser-déposer d'un joueur entre groupes (ordinateur) ----------
function onPlayerDragStart(ev, pid){
  ev.dataTransfer.setData('text/plain', pid);
  ev.dataTransfer.effectAllowed = 'move';
}
function onGroupDragOver(ev){
  ev.preventDefault();
  ev.currentTarget.classList.add('drop-target-hover');
}
function onGroupDragLeave(ev){
  ev.currentTarget.classList.remove('drop-target-hover');
}
function onGroupDrop(ev, gid){
  ev.preventDefault();
  ev.currentTarget.classList.remove('drop-target-hover');
  const pid = ev.dataTransfer.getData('text/plain');
  if(!pid) return;
  const p = DATA.players.find(x=>x.id===pid);
  const targetGroupId = gid || null;
  if(!p || p.groupId === targetGroupId) return;
  if(!targetGroupId){
    // Déposé sur la carte « En attente d'assignation »
    p.groupId = null;
    p.order = 0;
    saveAndRender();
    return;
  }
  const otherPlayers = DATA.players.filter(x=>x.id!==pid);
  p.groupId = resolveGroupAssignment(targetGroupId, DATA.groups, otherPlayers);
  p.order = nextOrderInGroup(p.groupId);
  saveAndRender();
}
function deleteGroup(gid){
  const g = groupById(gid);
  if(!g) return;
  const members = playersInGroup(gid);
  if(members.length === 0){
    showConfirm(`Supprimer le groupe « ${g.name} » ? Cette action ne peut pas être annulée.`, ()=>{
      DATA.groups = DATA.groups.filter(x=>x.id!==gid);
      saveAndRender();
    });
    return;
  }
  const otherGroups = DATA.groups.filter(x=>x.id!==gid);
  if(otherGroups.length === 0){
    showAlert(`Impossible de supprimer « ${g.name} » : c'est le seul groupe et il contient encore ${members.length} joueur${members.length>1?'s':''}. Crée un autre groupe, ou retire/déplace d'abord ces joueurs.`);
    return;
  }
  showConfirm(`Le groupe « ${g.name} » contient encore ${members.length} joueur${members.length>1?'s':''}. En confirmant, ${members.length>1?'ils seront':'il sera'} automatiquement déplacé${members.length>1?'s':''} vers le premier groupe ayant de la place. Continuer ?`, ()=>{
    const blocked = [];
    members.forEach(p=>{
      const target = firstGroupWithRoom(otherGroups, DATA.players.filter(x=>x.groupId!==gid));
      if(target){ p.groupId = target; } else { blocked.push(p.name); }
    });
    if(blocked.length){
      showAlert(`Tous les autres groupes sont pleins — ${blocked.join(', ')} n'${blocked.length>1?'ont':'a'} pas pu être déplacé${blocked.length>1?'s':''}. Le groupe « ${g.name} » n'a pas été supprimé ; libère de la place ailleurs d'abord.`);
      return;
    }
    DATA.groups = DATA.groups.filter(x=>x.id!==gid);
    saveAndRender();
  });
}

function removePlayer(pid){
  showConfirm('Retirer ce joueur de la ligue ?', ()=>{
    DATA.players = DATA.players.filter(p=>p.id!==pid);
    saveAndRender();
  });
}
function movePlayer(pid){
  const p = DATA.players.find(x=>x.id===pid);
  if(!p) return;
  const currentGroup = groupById(p.groupId);
  const sorted = groupsSorted();
  const choices = sorted.map(g=>g.name).concat(['— Mettre en attente (aucun groupe) —']);
  showChoice(`Déplacer ${p.name} (actuellement dans ${currentGroup ? currentGroup.name : 'en attente'}) vers quel groupe ?`, choices, (idx)=>{
    if(idx === sorted.length){
      p.groupId = null;
      p.order = 0;
      saveAndRender();
      return;
    }
    if(!sorted[idx]) return;
    const otherPlayers = DATA.players.filter(x=>x.id!==pid); // le joueur qu'on déplace ne compte pas contre lui-même
    const groupId = resolveGroupAssignment(sorted[idx].id, DATA.groups, otherPlayers);
    if(!groupId) return;
    p.groupId = groupId;
    p.order = nextOrderInGroup(groupId);
    saveAndRender();
  });
}

// Vue centralisée de toutes les absences/remplaçants de la session, tous
// groupes confondus, pour éviter d'avoir à fouiller dans chaque groupe.
function adminSessionHTML(){
  const open = currentOpenSession();
  if(!open){
    return `<div class="card"><p class="empty">Aucune session en cours.</p></div>`;
  }
  const manual = DATA.matchupMode === 'manual';
  let html = '';
  groupsSorted().forEach(g=>{
    const gd = open.groupsData.find(x=>x.groupId===g.id);
    if(!gd) return;
    const expectedRoster = new Set(activeRosterForGroup(open, g.id));
    const inMatches = new Set();
    gd.matches.forEach(m=>{ m.teamA.forEach(id=>inMatches.add(id)); m.teamB.forEach(id=>inMatches.add(id)); });
    const stale = !manual && (expectedRoster.size !== inMatches.size || [...expectedRoster].some(id=>!inMatches.has(id)));
    const activeCount = expectedRoster.size;
    const info = activeCount>0 ? (manual ? `${gd.matches.length} match${gd.matches.length>1?'s':''} (selon le modèle défini dans Réglages)` : `${matchesCountFor(activeCount)} matchs, en ${targetPointsFor(activeCount)} points`) : '';
    html += `<div class="card"><h3>${escapeHTML(g.name)}</h3>${info ? `<p class="small">${info}</p>` : ''}`;
    if(stale) html += `<p class="small" style="color:var(--danger);">Les matchs affichés ne reflètent plus les absences/remplaçants actuels — clique sur « régénérer » ci-dessous.</p>`;
    if(gd.matches.length===0){ html += `<p class="empty">${manual ? 'Aucun modèle de rotation défini — configure-le dans Réglages → Paramètres de ligue.' : 'Pas assez de joueurs pour générer des matchs.'}</p>`; }
    gd.matches.forEach((m, mi)=>{
      const nameTag = (id)=>{
        if(!id) return '<span class="small">— (position vide)</span>';
        if(isGuestId(id)) return escapeHTML(playerName(id)) + ' <span class="small">(invité)</span>';
        if(isSubPoolId(id)) return escapeHTML(playerName(id)) + ' <span class="small">(remplaçant)</span>';
        const p = DATA.players.find(x=>x.id===id);
        const isSub = p && p.groupId !== g.id;
        return escapeHTML(p ? p.name : '?') + (isSub ? ' <span class="small">(remplaçant)</span>' : '');
      };
      html += `
        <div class="match-row">
          <div class="team">${m.teamA.length ? m.teamA.map(nameTag).join(' & ') : '<span class="small">— (position vide)</span>'}</div>
          <input class="pill-input" type="number" min="0" value="${m.scoreA===null?'':m.scoreA}" onchange="setScore('${g.id}','${mi}','A',this.value)">
          <div class="vs">VS</div>
          <input class="pill-input" type="number" min="0" value="${m.scoreB===null?'':m.scoreB}" onchange="setScore('${g.id}','${mi}','B',this.value)">
          <div class="team" style="text-align:right;">${m.teamB.length ? m.teamB.map(nameTag).join(' & ') : '<span class="small">— (position vide)</span>'}</div>
        </div>`;
    });
    if(!manual && m_hasSitOut(gd.matches)){
      html += `<p class="small">Repos par match : ${gd.matches.map(m=>m.sit?playerName(m.sit):'—').join(', ')}</p>`;
    }
    html += `<button class="btn-ghost" onclick="regenerate('${g.id}')">régénérer les matchs de ce groupe</button>`;
    if(DATA.testMode && gd.matches.length){
      html += ` <button class="btn-ghost" onclick="autoFillGroupScores('${g.id}')">🎲 générer des scores aléatoires (test)</button>`;
    }
    html += `</div>`;
  });
  return html;
}

function m_hasSitOut(matches){ return matches.some(m=>m.sit); }
function onStartSession(){
  const now = new Date();
  if(typeof DATA.playDayOfWeek === 'number' && now.getDay() === DATA.playDayOfWeek){
    const dayNames = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
    const dayName = dayNames[DATA.playDayOfWeek];
    const todayStr = fmtDate(now);
    const nextWeekStr = fmtDate(new Date(now.getFullYear(), now.getMonth(), now.getDate()+7));
    showChoice(`On dirait qu'on est justement ${dayName} aujourd'hui. Cette session est-elle pour aujourd'hui, ou est-ce que tu prépares déjà celle de ${dayName} prochain ?`, [

    .print-page{page-break-after:always;}

// Vérifie que chaque groupe a des matchs générés et à jour par rapport aux
// absences/remplaçants actuels, avant de permettre la publication aux joueurs.
function sessionCompletionIssues(session){
  const issues = [];
  groupsSorted().forEach(g=>{
    const memberCount = playersInGroup(g.id).length;
    if(memberCount > GROUP_MAX_PLAYERS()){
      issues.push(`${g.name} : ${memberCount} joueurs, au-dessus de la limite de ${GROUP_MAX_PLAYERS()} — déplace des joueurs avant de publier`);
    }
    const gd = session.groupsData.find(x=>x.groupId===g.id);
    if(!gd) return;
    if(gd.matches.length===0){
      issues.push(`${g.name} : pas assez de joueurs pour générer des matchs`);
      return;
    }
    const expected = new Set(activeRosterForGroup(session, g.id));
    const inMatches = new Set();
    gd.matches.forEach(m=>{ m.teamA.forEach(id=>inMatches.add(id)); m.teamB.forEach(id=>inMatches.add(id)); });
    const stale = expected.size !== inMatches.size || [...expected].some(id=>!inMatches.has(id));
    if(stale) issues.push(`${g.name} : les matchs ne reflètent plus les absences/remplaçants actuels — régénère-les`);
  });
  return issues;
}
// Liste les places vides (absent sans remplaçant, ni joueur ni invité) par groupe.
function emptySpotWarnings(session){
  const warnings = [];
  groupsSorted().forEach(g=>{
    const gd = session.groupsData.find(x=>x.groupId===g.id);
    if(!gd) return;
    const subs = gd.substitutes || {};
    playersInGroup(g.id).forEach(p=>{
      if(isAbsent(session, p.id) && !subs[p.id]){
        warnings.push(`${g.name} : place de ${p.name} vide (aucun remplaçant)`);
      }
    });
  });
  return warnings;
}
function onPublishSession(){
  const open = currentOpenSession();
  if(!open) return;
  const issues = sessionCompletionIssues(open);
  if(issues.length){
    showAlert("Impossible de publier la session — certains groupes ne sont pas complets :\n\n" + issues.map(i=>'• '+i).join('\n'));
    return;
  }
  const empties = emptySpotWarnings(open);
  if(empties.length){
    showConfirm("Attention, certaines places resteront vides pour cette session, sans remplaçant :\n\n" + empties.map(i=>'• '+i).join('\n') + "\n\nPublier quand même ?", ()=>{
      open.published = true;
      saveAndRender();
    });
    return;
  }
  open.published = true;
  saveAndRender();
}
function onUnpublishSession(){
  const open = currentOpenSession();
  if(!open) return;
  open.published = false;
  saveAndRender();
}
function setScore(gid, mi, which, val){
  const open = currentOpenSession();
  const gd = open.groupsData.find(x=>x.groupId===gid);
  const m = gd.matches[mi];
  if(which==='A') m.scoreA = val===''? null : Number(val);
  else m.scoreB = val===''? null : Number(val);
  saveData();
}

// Remplit des scores aléatoires plausibles (mode test) pour accélérer les essais.
function fillGroupScores(open, gid){
  const gd = open.groupsData.find(x=>x.groupId===gid);
  if(!gd) return;
  const activeCount = activeRosterForGroup(open, gid).length;
  const target = targetPointsFor(activeCount);
  gd.matches.forEach(m=>{
    const aWins = Math.random() < 0.5;
    const loserScore = Math.floor(Math.random() * Math.max(1, target - 1));
    if(aWins){ m.scoreA = target; m.scoreB = loserScore; } else { m.scoreB = target; m.scoreA = loserScore; }
  });
}
function autoFillGroupScores(gid){
  const open = currentOpenSession();
  if(!open) return;
  fillGroupScores(open, gid);
  saveAndRender();
}
function autoFillAllScores(){
  const open = currentOpenSession();
  if(!open) return;
  DATA.groups.forEach(g=> fillGroupScores(open, g.id));
  saveAndRender();
}
function onCancelSession(){
  showConfirm('Annuler cette session ?', ()=>{
    DATA.sessions = DATA.sessions.filter(s=>s.status!=='open');
    saveAndRender();

}
function onFinalize(){
  const open = currentOpenSession();
  const incomplete = open.groupsData.some(gd=>gd.matches.some(m=>m.scoreA===null || m.scoreB===null));
  const afterFinalize = ()=>{
    const finishedDate = open.date;
    finalizeSession(open);
    if(DATA.autoStartSessions){
      autoStartNextSession(finishedDate);
    }
    saveAndRender();
  };
  if(incomplete){
    showConfirm('Certains pointages sont manquants et seront ignorés dans le calcul. Continuer ?', afterFinalize);
  } else {
    afterFinalize();
  }
}
// Tente de créer automatiquement la prochaine session, selon le calendrier
// de saison (dates bloquées, fin de saison). Avertit si des dates ont été
// sautées, ou si la fin de saison est atteinte.
function autoStartNextSession(lastSessionDate){
  // Une semaine après la session qu'on vient de terminer — pas "aujourd'hui",
  // sinon terminer une session le jour même en recréerait une à la même date.
  const base = new Date(lastSessionDate + 'T00:00:00');
  const fromDate = fmtDate(new Date(base.getFullYear(), base.getMonth(), base.getDate() + 7));
  const result = nextValidSessionDate(fromDate);
  if(!result.date){
    showAlert(`Fin de saison atteinte (${DATA.seasonEndDate}) — aucune nouvelle session n'a été créée automatiquement. Tu peux ajuster la date de fin dans Réglages si besoin.`);
    return;
  }
  const session = startNewSession(result.date);
  if(DATA.autoPublishSessions) session.published = true;
  // On bascule directement sur la nouvelle session, pour que ce soit visible
  // à l'écran tout de suite plutôt que de rester sur la session terminée.
  VIEW = { tab:'session', sessionSubTab:'groupes' };
  const skipNote = result.skipped.length
    ? ` (${result.skipped.length>1 ? 'les dates suivantes étaient bloquées et ont été sautées' : 'la date '+result.skipped[0]+' était bloquée et a été sautée'} : ${result.skipped.join(', ')})`
    : '';
  showAlert(`✅ Session terminée — la prochaine a été créée automatiquement pour le ${result.date}${DATA.autoPublishSessions ? ', et publiée aux joueurs' : ''}.${skipNote}`);
}

// ---------- Rapports (statistiques calculées à partir de l'historique) ----------
function computePlayerReports(){
  const closed = DATA.sessions.filter(s=>s.status==='closed');
  const stats = {};
  DATA.players.forEach(p=>{ stats[p.id] = { wins:0, losses:0, played:0, scheduled:0, totalPoints:0, sessionsAbsent:0, sessionsAppeared:0, promotions:0, relegations:0, ratingChange:0, subCount:0 }; });
  closed.forEach(s=>{
    const appeared = new Set();
    if(s.standingsByGroup){
      Object.keys(s.standingsByGroup).forEach(gid=>{
        (s.standingsByGroup[gid]||[]).forEach(r=>{
          if(!stats[r.playerId]) return; // invité ou joueur retiré depuis
          stats[r.playerId].wins += r.wins||0;
          stats[r.playerId].losses += r.losses||0;
          stats[r.playerId].played += r.played||0;
          stats[r.playerId].scheduled += r.scheduled||0;
          stats[r.playerId].totalPoints += r.pf||0;
          appeared.add(r.playerId);
        });
      });
    }
    appeared.forEach(pid=>{ if(stats[pid]) stats[pid].sessionsAppeared++; });
    (s.absences||[]).forEach(pid=>{ if(stats[pid]) stats[pid].sessionsAbsent++; });
    (s.movements||[]).forEach(m=>{
      if(!stats[m.playerId]) return;
      const fromG = groupById(m.fromGroupId), toG = groupById(m.toGroupId);
      if(fromG && toG){
        if(toG.order < fromG.order) stats[m.playerId].promotions++;
        else stats[m.playerId].relegations++;
      }
    });
    if(s.ratingDeltas){
      Object.keys(s.ratingDeltas).forEach(pid=>{ if(stats[pid]) stats[pid].ratingChange += s.ratingDeltas[pid]; });
    }
    if(s.loans){
      Object.keys(s.loans).forEach(pid=>{ if(stats[pid]) stats[pid].subCount++; });
    }
  });
  return DATA.players.map(p=>{
    const st = stats[p.id];
    const totalGames = st.wins + st.losses;
    const totalRelevant = st.sessionsAbsent + st.sessionsAppeared;
    return {
      player: p,
      wins: st.wins, losses: st.losses,
      winRate: totalGames>0 ? st.wins/totalGames : null,
      played: st.played, scheduled: st.scheduled, totalPoints: st.totalPoints,
      sessionsAbsent: st.sessionsAbsent, sessionsAppeared: st.sessionsAppeared,
      absenceRate: totalRelevant>0 ? st.sessionsAbsent/totalRelevant : null,
      promotions: st.promotions, relegations: st.relegations,
      ratingChange: st.ratingChange,
      subCount: st.subCount
    };
  });
}

// Retrouve le groupe où un joueur a réellement joué lors d'une session donnée
// (peut différer de son groupe actuel s'il a été déplacé depuis, ou prêté ce jour-là).
function playerSessionGroupId(s, playerId){
  const byGroup = s.standingsByGroup || {};
  for(const gid in byGroup){
    if(byGroup[gid].some(r=>r.playerId===playerId)) return gid;
  }
  return null;
}
// Contenu détaillé des matchs d'une session. Si onlyGroupId est fourni, seul ce groupe est affiché.
function matchListInnerHTML(s, onlyGroupId){
  let html = '';
  let any = false;
  groupsSorted().forEach(g=>{
    if(onlyGroupId && g.id !== onlyGroupId) return;
    const gd = s.groupsData ? s.groupsData.find(x=>x.groupId===g.id) : null;
    if(!gd || !gd.matches || gd.matches.length===0) return;
    any = true;
    const subValues = new Set(gd.substitutes ? Object.values(gd.substitutes) : []);
    html += `<h3 style="margin-top:10px;">${escapeHTML(g.name)}</h3>`;
    gd.matches.forEach(m=>{
      const nameTag = (id)=>{
        if(isGuestId(id)) return escapeHTML(playerName(id)) + ' <span class="small">(invité)</span>';
        const isSub = subValues.has(id);
        return escapeHTML(playerName(id)) + (isSub ? ' <span class="small">(remplaçant)</span>' : '');
      };
      const sa = (m.scoreA===null || m.scoreA==='' || m.scoreA===undefined) ? '—' : m.scoreA;
      const sb = (m.scoreB===null || m.scoreB==='' || m.scoreB===undefined) ? '—' : m.scoreB;
      html += `<div class="match-row">
        <div class="team">${m.teamA.map(nameTag).join(' & ')}</div>
        <div class="vs">${sa} : ${sb}</div>
        <div class="team" style="text-align:right;">${m.teamB.map(nameTag).join(' & ')}</div>
      </div>`;
    });
  });
  if(!any) html += `<p class="empty">Aucun match enregistré pour cette session.</p>`;
  return html;
}

function deleteSession(sessionId){
  const s = DATA.sessions.find(x=>x.id===sessionId);
  if(!s) return;
  const hasMovements = s.movements && s.movements.length > 0;
  const hasRatingChanges = s.ratingDeltas && Object.keys(s.ratingDeltas).length > 0;
  if(!hasMovements && !hasRatingChanges){
    showConfirm("Supprimer définitivement cette session ? Cette action ne peut pas être annulée.", ()=>{
      DATA.sessions = DATA.sessions.filter(x=>x.id!==sessionId);
      saveAndRender();
    });
    return;
  }
  showChoice("Cette session a appliqué des montées/descentes et/ou des changements de cote. Que veux-tu faire en la supprimant ?", [
    "Supprimer seulement l'historique (garder les joueurs et cotes où ils sont)",
    "Supprimer et tout annuler (déplacements ET cotes, comme si cette session n'avait pas eu lieu)"
  ], (choiceIdx)=>{
    let skipped = [];
    if(choiceIdx === 1){
      (s.movements||[]).forEach(m=>{
        const pl = DATA.players.find(p=>p.id===m.playerId);
        if(!pl) return;
        if(pl.groupId === m.toGroupId){ pl.groupId = m.fromGroupId; }
        else { skipped.push(pl.name); }
      });
      Object.keys(s.ratingDeltas||{}).forEach(pid=>{
        const pl = findRatablePerson(pid); // joueur régulier OU remplaçant du bassin
        if(!pl) return;
        pl.rating = Math.round(((typeof pl.rating==='number'?pl.rating:RATING_DEFAULT) - s.ratingDeltas[pid]) * 1000) / 1000;
        pl.ratingGames = Math.max(0, (typeof pl.ratingGames==='number'?pl.ratingGames:0) - 1);
      });
    }
    DATA.sessions = DATA.sessions.filter(x=>x.id!==sessionId);
    saveAndRender();
    if(skipped.length){
      showAlert("Session supprimée. Le déplacement de " + skipped.join(', ') + " n'a pas pu être annulé, car son groupe a changé depuis par une session plus récente — ajuste-le manuellement si besoin. Les cotes, elles, ont bien été annulées.");
    }
  });
}
function sessionSummaryHTML(s, withDelete, viewerPlayerId){
  const restrictGroupId = viewerPlayerId ? playerSessionGroupId(s, viewerPlayerId) : null;
  const showRating = !viewerPlayerId || DATA.showRatingToPlayers; // toujours visible pour l'admin (pas de viewerPlayerId)
  let html = `<div class="card">
    <div class="row" style="justify-content:space-between;align-items:center;">
      <h3 style="margin:0;">Session du ${s.date}</h3>
      <div class="row" style="gap:8px;">
        <button class="tag tag-stay" style="cursor:pointer;border:none;" onclick="showMatchHistoryModal('${s.id}'${restrictGroupId ? `,'${restrictGroupId}'` : ''})">🎾 Matchs${viewerPlayerId ? ' de mon groupe' : ''}</button>
        ${withDelete ? `<button class="btn-ghost-danger" onclick="deleteSession('${s.id}')">supprimer</button>` : ''}
      </div>
    </div>`;
  groupsSorted().forEach(g=>{
    const rows = s.standingsByGroup ? s.standingsByGroup[g.id] : null;
    if(!rows || rows.length===0) return;
    const gd = s.groupsData ? s.groupsData.find(x=>x.groupId===g.id) : null;
    const subValues = new Set(gd && gd.substitutes ? Object.values(gd.substitutes) : []);
    html += `<h3 style="margin-top:10px;">${escapeHTML(g.name)}</h3><table><tr><th>#</th><th>Joueur</th><th>Points</th><th>Moy./match</th><th>Joués</th><th>V-D</th>${showRating ? '<th>Cote</th>' : ''}<th></th></tr>`;
    rows.forEach((r,i)=>{
      const isGuest = isGuestId(r.playerId);
      const isSub = !isGuest && subValues.has(r.playerId);
      const mv = (s.movements||[]).find(m=>m.playerId===r.playerId && m.fromGroupId===g.id);
      let tag;
      if(isGuest){ tag = `<span class="tag tag-stay">invité</span>`; }
      else {
        const moveTag = mv ? (mv.toGroupId===groupAbove(g.id) ? `<span class="tag tag-up">monte</span>` : `<span class="tag tag-down">descend</span>`) : `<span class="tag tag-stay">reste</span>`;
        tag = isSub ? moveTag + ` <span class="small">(remplaçant)</span>` : moveTag;
      }
      const avg = (r.avgPts === null || r.avgPts === undefined) ? '—' : r.avgPts.toFixed(1);
      const played = r.played || 0;
      const scheduled = r.scheduled || 0;
      const incomplete = scheduled > 0 && played < scheduled;
      const delta = s.ratingDeltas ? s.ratingDeltas[r.playerId] : undefined;
      const currentPlayer = findRatablePerson(r.playerId); // joueur régulier OU remplaçant du bassin
      const currentRating = currentPlayer && typeof currentPlayer.rating === 'number' ? currentPlayer.rating : null;
      const deltaCell = typeof delta === 'number'
        ? `${currentRating!==null ? currentRating.toFixed(2)+' ' : ''}<span style="color:${delta>=0?'var(--ball)':'var(--danger)'};font-weight:600;">(${delta>=0?'+':''}${delta.toFixed(3)})</span>`
        : (currentRating!==null ? currentRating.toFixed(2) : `<span class="small">—</span>`);
      html += `<tr><td>${i+1}</td><td>${escapeHTML(playerName(r.playerId))}</td><td>${r.pf}</td><td>${avg}</td><td>${scheduled ? played+'/'+scheduled : '—'}${incomplete ? ' <span class="small" style="color:var(--paddle);">⚠</span>' : ''}</td><td>${r.wins}-${r.losses}</td>${showRating ? `<td>${deltaCell}</td>` : ''}<td>${tag}</td></tr>`;
    });
    html += `</table>`;
  });
  const absenceDemotions = (s.movements||[]).filter(m=>m.reason==='absence');
  if(absenceDemotions.length){
    html += `<h3 style="margin-top:10px;">Descentes automatiques (absence)</h3><table><tr><th>Joueur</th><th>De</th><th>Vers</th></tr>`;
    absenceDemotions.forEach(m=>{
      const fromG = groupById(m.fromGroupId), toG = groupById(m.toGroupId);
      html += `<tr><td>${escapeHTML(playerName(m.playerId))}</td><td>${escapeHTML(fromG?fromG.name:'—')}</td><td>${escapeHTML(toG?toG.name:'—')}</td></tr>`;
    });
    html += `</table>`;
  }
  html += `</div>`;
  return html;
}
function groupAbove(gid){
  const sorted = groupsSorted();
  const idx = sorted.findIndex(g=>g.id===gid);
  return idx>0 ? sorted[idx-1].id : null;
}

// ==================== VIDÉOS (admin-only, visibilité ciblée) ====================
// Un admin colle un lien YouTube (déjà mis en ligne par lui, non listé de préférence)
// et choisit qui peut la voir : toute la ligue, un groupe/équipe en particulier,
// et/ou des joueurs précis. Aucune intégration d'upload — juste le lien.
function extractYouTubeId(url){
  if(!url) return null;
  const m = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}
function youtubeEmbedHTML(youtubeId, title){
  return `<div style="position:relative;padding-top:56.25%;border-radius:10px;overflow:hidden;background:#000;">
    <iframe src="https://www.youtube.com/embed/${youtubeId}" title="${escapeHTML(title)}" style="position:absolute;inset:0;width:100%;height:100%;border:0;" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
  </div>`;
}
// ---- Dossiers de vidéos (arborescence simple, un parent par dossier) ----
// Les vidéos et leurs dossiers appartiennent à l'ORGANISATION (ORG_VIDEO_DATA,
// partagée entre toutes ses ligues), pas à une ligue précise. La visibilité
// se configure sur le DOSSIER : à quelle(s) ligue(s) de l'organisation il est
// rendu disponible. Un dossier à la racine (aucun parent) sans réglage propre
// n'existe pas — seules les VIDÉOS peuvent être à la racine (aucun dossier),
// et sont alors visibles par toute l'organisation, faute d'un dossier pour
// restreindre leur accès.
function folderById(id){ return (ORG_VIDEO_DATA.folders||[]).find(f=>f.id===id); }
function foldersInParent(parentId){
  return (ORG_VIDEO_DATA.folders||[]).filter(f=>(f.parentId||null)===(parentId||null)).sort((a,b)=>a.name.localeCompare(b.name));
}
function videosInFolder(folderId){
  return (ORG_VIDEO_DATA.videos||[]).filter(v=>(v.folderId||null)===(folderId||null));
}
function folderPath(folderId){
  const path = [];
  let cur = folderId ? folderById(folderId) : null;
  while(cur){ path.unshift(cur); cur = cur.parentId ? folderById(cur.parentId) : null; }
  return path;
}
function allFoldersFlat(){
  const result = [];
  function walk(parentId, depth){
    foldersInParent(parentId).forEach(f=>{ result.push({ id:f.id, name:f.name, depth }); walk(f.id, depth+1); });
  }
  walk(null, 0);
  return result;
}
function setVideoFolder(folderId){ VIEW.videoFolderId = folderId || null; render(); }
function folderVisibleToLeague(f, leagueId){
  if(!f || !leagueId) return false;
  if(f.allOrg) return true;
  return (f.leagueIds||[]).includes(leagueId);
}
function folderVisibilityLabel(f){
  if(f.allOrg) return "Toute l'organisation";
  const names = (f.leagueIds||[]).map(id=>{ const l = LEAGUES.find(x=>x.id===id); return l ? l.name : null; }).filter(Boolean);
  return names.length ? names.join(', ') : "Aucune ligue pour l'instant (à configurer)";
}
function videoVisibleToLeague(v, leagueId){
  if(!v || !leagueId) return false;
  const folderId = v.folderId || null;
  if(!folderId) return true; // racine = toute l'organisation
  const f = folderById(folderId);
  if(!f) return true; // dossier supprimé entretemps : on ne bloque pas l'accès
  return folderVisibleToLeague(f, leagueId);
}
function videoEffectiveVisibilityLabel(v){
  const folderId = v.folderId || null;
  if(!folderId) return "Toute l'organisation (racine)";
  const f = folderById(folderId);
  return f ? folderVisibilityLabel(f) : "Toute l'organisation (racine)";
}

// Supprime une ligue et tout ce qui lui est propre (données, liens de
// comptes). Les comptes des joueurs eux-mêmes ne sont pas touchés.
async function deleteLeagueCascade(leagueId){
  await sb.from('profile_players').delete().eq('league_id', leagueId);
  await sb.from('league_data').delete().eq('league_id', leagueId);
  const { error } = await sb.from('leagues').delete().eq('id', leagueId);
  return error;
}
function onDeleteLeague(){
  const league = LEAGUES.find(l=>l.id===CURRENT_LEAGUE_ID);
  if(!league) return;
  showPrompt(`Pour confirmer la suppression définitive de « ${league.name} », retape exactement son nom :`, '', async (typed)=>{
    if(typed !== league.name){ showAlert("Le nom ne correspond pas — rien n'a été supprimé."); return; }
    const error = await deleteLeagueCascade(league.id);
    if(error){ showAlert("Erreur lors de la suppression : " + error.message); return; }
    await loadLeagues();
    const remaining = myOrgLeagues();
    if(remaining.length === 0){
      CURRENT_LEAGUE_ID = null;
      DATA = defaultData();
      VIEW = { tab:'session' };
      render();
    } else {
      await switchToLeague(remaining[0].id);
    }
  });
}
function onDeleteOrganization(){
  const org = MY_ORGANIZATIONS.find(o=>o.id===CURRENT_ORGANIZATION_ID);
  if(!org) return;
  if(MY_ORGANIZATIONS.length <= 1){ showAlert("Tu ne peux pas supprimer ta seule organisation."); return; }
  showPrompt(`Pour confirmer la suppression définitive de « ${org.name} » et de toutes ses ligues, retape exactement son nom :`, '', async (typed)=>{
    if(typed !== org.name){ showAlert("Le nom ne correspond pas — rien n'a été supprimé."); return; }
    showAlert("Suppression en cours…");
    const { data: orgLeagues } = await sb.from('leagues').select('id').eq('organization_id', org.id);
    for(const l of (orgLeagues||[])){ await deleteLeagueCascade(l.id); }
    // Détache les comptes en attente rattachés à cette organisation, pour ne
    // pas bloquer la suppression (leur compte n'est pas supprimé).
    await sb.from('profiles').update({ organization_id: null }).eq('organization_id', org.id);
    const { error } = await sb.from('organizations').delete().eq('id', org.id);
    if(error){ showAlert("Erreur lors de la suppression : " + error.message); return; }
    await loadMyOrganizations(CURRENT_PROFILE.id);
    await switchToOrganization(MY_ORGANIZATIONS[0].id);
  });

// ---- Pop-up : modèle de rotation par position (un par taille de groupe) ----
let TEMPLATE_MODAL_STATE = null;
function openTemplateModal(size){
  const countKey = size===4 ? 'manualMatchCount4' : 'manualMatchCount5';
  const templateKey = size===4 ? 'manualMatchupTemplate4' : 'manualMatchupTemplate5';
  const count = Math.max(1, DATA[countKey] || (size===4?6:10));
  const saved = DATA[templateKey] || [];
  const rows = Array.from({ length: count }, (_,i)=> saved[i] ? { teamA:(saved[i].teamA||[]).slice(), teamB:(saved[i].teamB||[]).slice() } : { teamA:[], teamB:[] });
  TEMPLATE_MODAL_STATE = { size, count, rows };
  showFormModal(`Modèle de rotation — groupes de ${size}`, templateModalFormHTML, saveTemplateModalForm);
}
function templateModalFormHTML(){
  const st = TEMPLATE_MODAL_STATE;
  const posOptions = (current)=>{
    let opts = '<option value="">—</option>';
    for(let i=1;i<=st.size;i++){ opts += `<option value="${i}" ${current===i?'selected':''}>${i}</option>`; }
    return opts;
  };
  const rowsHtml = st.rows.map((r,i)=>`
    <div class="row" style="align-items:center;margin-bottom:6px;flex-wrap:nowrap;">
      <span class="small" style="min-width:64px;">Match ${i+1}</span>
      <select onchange="updateTemplateSlot(${i},'A',0,this.value)">${posOptions(r.teamA[0])}</select>
      <select onchange="updateTemplateSlot(${i},'A',1,this.value)">${posOptions(r.teamA[1])}</select>
      <span class="vs">VS</span>
      <select onchange="updateTemplateSlot(${i},'B',0,this.value)">${posOptions(r.teamB[0])}</select>
      <select onchange="updateTemplateSlot(${i},'B',1,this.value)">${posOptions(r.teamB[1])}</select>
    </div>`).join('');
  return `
    <div class="field" style="max-width:220px;">
      <label>Nombre de matchs</label>
      <input type="number" min="1" value="${st.count}" onchange="updateTemplateCount(this.value)">
    </div>
    <div style="margin-top:10px;">${rowsHtml}</div>`;
}
function updateTemplateSlot(rowIdx, team, slotIdx, value){
  const st = TEMPLATE_MODAL_STATE;
  if(!st) return;
  const arr = team==='A' ? st.rows[rowIdx].teamA : st.rows[rowIdx].teamB;
  arr[slotIdx] = value ? Number(value) : undefined;
  render();
}
function updateTemplateCount(value){
  const st = TEMPLATE_MODAL_STATE;
  if(!st) return;
  const count = Math.max(1, parseInt(value,10) || st.count);
  if(count > st.rows.length){ while(st.rows.length < count) st.rows.push({ teamA:[], teamB:[] }); }
  else { st.rows.length = count; }
  st.count = count;
  render();
}
function saveTemplateModalForm(){
  const st = TEMPLATE_MODAL_STATE;
  if(!st) return;
  const countKey = st.size===4 ? 'manualMatchCount4' : 'manualMatchCount5';
  const templateKey = st.size===4 ? 'manualMatchupTemplate4' : 'manualMatchupTemplate5';
  DATA[countKey] = st.count;
  DATA[templateKey] = st.rows.map(r=>({ teamA:(r.teamA||[]).filter(x=>x), teamB:(r.teamB||[]).filter(x=>x) }));
  TEMPLATE_MODAL_STATE = null;
}

function filterTabs(tabs, hiddenKeys){

  return visible.length ? visible : tabs;

// Recherche, dans tout l'historique, les sessions où ce remplaçant a
// effectivement joué (peu importe le groupe), avec le résultat pour chacune.
function computeSubstituteAppearances(subId){
  const closed = DATA.sessions.filter(s=>s.status==='closed');
  const appearances = [];
  closed.forEach(s=>{
    (s.groupsData||[]).forEach(gd=>{
      let wins=0, losses=0, pf=0, played=0;
      (gd.matches||[]).forEach(m=>{
        if(m.scoreA===null||m.scoreB===null||m.scoreA===''||m.scoreB==='') return;
        const inA = (m.teamA||[]).includes(subId), inB = (m.teamB||[]).includes(subId);
        if(!inA && !inB) return;
        const sa=Number(m.scoreA), sb=Number(m.scoreB);
        if(sa===sb) return;
        played++;
        const won = inA ? sa>sb : sb>sa;
        if(won) wins++; else losses++;
        pf += inA ? sa : sb;
      });
      if(played>0){
        const g = groupById(gd.groupId);
        appearances.push({ date:s.date, groupName: g?g.name:'(groupe supprimé)', wins, losses, pf, played });
      }
    });
  });
  return appearances.sort((a,b)=> b.date.localeCompare(a.date));
}
function substituteHistoryHTML(sub){
  const appearances = computeSubstituteAppearances(sub.id);
  const totalWins = appearances.reduce((s,a)=>s+a.wins,0);
  const totalLosses = appearances.reduce((s,a)=>s+a.losses,0);
  const totalGames = totalWins+totalLosses;
  const winRate = totalGames>0 ? Math.round(totalWins/totalGames*100)+'%' : '—';
  const groupCounts = {};
  appearances.forEach(a=>{ groupCounts[a.groupName] = (groupCounts[a.groupName]||0)+1; });
  const favoriteGroup = Object.keys(groupCounts).sort((a,b)=>groupCounts[b]-groupCounts[a])[0];
  const ratingCard = DATA.showRatingToSubs ? `<div class="card">
    <h3>Ta cote</h3>
    <table>
      <tr><td class="small">Cote actuelle</td><td><strong>${(typeof sub.rating==='number'?sub.rating:RATING_DEFAULT).toFixed(2)}</strong></td></tr>
      <tr><td class="small">Matchs comptés vers ta cote</td><td>${typeof sub.ratingGames==='number'?sub.ratingGames:0}</td></tr>
    </table>
    <p class="small" style="margin-top:8px;">Ta cote évolue au fil des matchs que tu dépannes, comme pour les joueurs réguliers.</p>
  </div>` : '';
  return `${ratingCard}<div class="card">
    <h3>Tes statistiques comme remplaçant</h3>
    <table>
      <tr><td class="small">Sessions dépannées</td><td>${appearances.length}</td></tr>
      <tr><td class="small">Victoires</td><td>${totalWins}</td></tr>
      <tr><td class="small">Défaites</td><td>${totalLosses}</td></tr>
      <tr><td class="small">Taux de victoire</td><td>${winRate}</td></tr>
      <tr><td class="small">Groupe le plus fréquent</td><td>${favoriteGroup ? escapeHTML(favoriteGroup) : '—'}</td></tr>
    </table>
  </div>
  <div class="card">
    <h3>Historique des sessions</h3>
    <table>
      <tr><th>Date</th><th>Groupe</th><th>V-D</th><th>Points</th></tr>
      ${appearances.map(a=>`<tr><td>${a.date}</td><td>${escapeHTML(a.groupName)}</td><td>${a.wins}-${a.losses}</td><td>${a.pf}</td></tr>`).join('')}
      ${appearances.length===0 ? `<tr><td colspan="4" class="empty">Aucune session jouée comme remplaçant pour l'instant</td></tr>` : ''}
    </table>
  </div>`;
}

// Reconstitue une estimation de l'historique de cote (à partir des
// ajustements enregistrés par session) pour trouver le plus haut/bas atteint.
function computePlayerRatingHistory(pid){
  const closed = DATA.sessions.filter(s=>s.status==='closed');
  let running = RATING_DEFAULT;
  const history = [running];
  closed.forEach(s=>{
    if(s.ratingDeltas && typeof s.ratingDeltas[pid] === 'number'){
      running += s.ratingDeltas[pid];
      history.push(running);
    }
  });
  return history;
}
// Le meilleur (plus haut) groupe atteint par un joueur, selon l'historique des sessions.
function computePlayerBestGroup(pid){
  let best = null;
  DATA.sessions.filter(s=>s.status==='closed').forEach(s=>{
    if(!s.standingsByGroup) return;
    Object.keys(s.standingsByGroup).forEach(gid=>{
      if(s.standingsByGroup[gid].some(r=>r.playerId===pid)){
        const g = groupById(gid);
        if(g && (!best || g.order < best.order)) best = g;
      }
    });
  });
  return best;
}

function computePlayerFunStats(pid){
  const closed = DATA.sessions.filter(s=>s.status==='closed');
  const headToHead = {}; // adversaireId -> {wins, losses} (de mon point de vue)
  const partnerStats = {}; // partenaireId -> {wins, losses}
  const timeline = []; // 'W'/'L' dans l'ordre chronologique
  closed.forEach(s=>{
    (s.groupsData||[]).forEach(gd=>{
      (gd.matches||[]).forEach(m=>{
        if(m.scoreA===null||m.scoreB===null||m.scoreA===''||m.scoreB==='') return;
        const sa=Number(m.scoreA), sb=Number(m.scoreB);
        if(sa===sb) return;
        const inA = m.teamA.includes(pid), inB = m.teamB.includes(pid);
        if(!inA && !inB) return;
        const myTeam = inA ? m.teamA : m.teamB;
        const oppTeam = inA ? m.teamB : m.teamA;
        const won = inA ? sa>sb : sb>sa;
        oppTeam.forEach(oppId=>{
          if(isGuestOrSubId(oppId)) return;
          if(!headToHead[oppId]) headToHead[oppId] = {wins:0, losses:0};
          if(won) headToHead[oppId].wins++; else headToHead[oppId].losses++;
        });
        myTeam.forEach(partnerId=>{
          if(partnerId===pid || isGuestOrSubId(partnerId)) return;
          if(!partnerStats[partnerId]) partnerStats[partnerId] = {wins:0, losses:0};
          if(won) partnerStats[partnerId].wins++; else partnerStats[partnerId].losses++;
        });
        timeline.push(won ? 'W' : 'L');
      });
    });
  });
  return { headToHead, partnerStats, timeline };
}
function playerFunStatsHTML(me){
  const { headToHead, partnerStats, timeline } = computePlayerFunStats(me.id);
  const MIN_COUNT = 2;
  const sameGroup = (id)=>{ const p = DATA.players.find(x=>x.id===id); return p && p.groupId === me.groupId; };
  const opponents = Object.keys(headToHead)
    .filter(sameGroup)
    .map(id=>{ const s=headToHead[id]; const total=s.wins+s.losses; return { id, wins:s.wins, losses:s.losses, total, rate: total>0?s.wins/total:0 }; })
    .filter(o=>o.total>=MIN_COUNT);
  const partners = Object.keys(partnerStats)
    .filter(sameGroup)
    .map(id=>{ const s=partnerStats[id]; const total=s.wins+s.losses; return { id, wins:s.wins, losses:s.losses, total, rate: total>0?s.wins/total:0 }; })
    .filter(o=>o.total>=MIN_COUNT);

  const facts = [];
  const nemesis = opponents.filter(o=>o.rate<0.5).sort((a,b)=>a.rate-b.rate || b.losses-a.losses)[0];
  if(nemesis) facts.push(`🎯 <strong>Ta bête noire</strong> — ${escapeHTML(playerName(nemesis.id))}. Vous vous êtes affrontés ${nemesis.total} fois, il/elle en a gagné ${nemesis.losses}. Il va falloir un plan de match !`);

  const favorite = opponents.filter(o=>o.rate>0.5).sort((a,b)=>b.rate-a.rate || b.wins-a.wins)[0];
  if(favorite) facts.push(`🔥 <strong>Ta cible favorite</strong> — ${escapeHTML(playerName(favorite.id))}. ${favorite.wins} victoires sur ${favorite.total} face à lui/elle. Tu sais comment le/la jouer !`);

  const closest = opponents.filter(o=>o.id!==(nemesis&&nemesis.id) && o.id!==(favorite&&favorite.id))
    .sort((a,b)=>Math.abs(a.rate-0.5)-Math.abs(b.rate-0.5))[0];
  if(closest) facts.push(`⚔️ <strong>Ton duel le plus serré</strong> — contre ${escapeHTML(playerName(closest.id))}, c'est presque du 50/50 (${closest.wins} victoires, ${closest.losses} défaites). Chaque match compte double !`);

  const bestPartner = partners.filter(o=>o.rate>0.5).sort((a,b)=>b.rate-a.rate || b.wins-a.wins)[0];
  if(bestPartner) facts.push(`🤝 <strong>Ton meilleur allié</strong> — en équipe avec ${escapeHTML(playerName(bestPartner.id))}, vous gagnez ${bestPartner.wins} fois sur ${bestPartner.total}. Une paire à ne pas séparer !`);

  if(timeline.length>=MIN_COUNT){
    const last = timeline[timeline.length-1];
    let streak = 0;
    for(let i=timeline.length-1;i>=0 && timeline[i]===last;i--) streak++;
    if(streak>=MIN_COUNT){
      facts.push(last==='W'
        ? `🔥 <strong>En feu</strong> — ${streak} victoires de suite !`
        : `💪 <strong>Ça va revenir</strong> — après ${streak} défaites d'affilée, la prochaine est pour toi.`);
    }
  }

  if(facts.length===0) return '';
  return `<div class="card"><h3>Tes stats</h3>${facts.map(f=>`<p>${f}</p>`).join('')}</div>`;
}

let MODAL = null; // { kind:'confirm'|'prompt'|'alert'|'choice', message, defaultValue, choices, onConfirm }

function showConfirm(message, onConfirm){ MODAL = { kind:'confirm', message, onConfirm }; render(); }
function showAlert(message){ MODAL = { kind:'alert', message }; render(); }
function showPrompt(message, defaultValue, onConfirm){ MODAL = { kind:'prompt', message, defaultValue: defaultValue||'', onConfirm }; render(); }
function showChoice(message, choices, onConfirm){ MODAL = { kind:'choice', message, choices, onConfirm }; render(); }
function showContentModal(title, htmlContent){ MODAL = { kind:'content', title, htmlContent }; render(); }

// bouton Enregistrer qui appelle onSave() (qui lit les champs elle-même,
// pendant que le pop-up est encore ouvert), puis referme et rafraîchit.
function showFormModal(title, htmlContent, onSave){ MODAL = { kind:'form', title, htmlContent, onSave }; render(); }
function modalFormSaveClick(){
  if(!MODAL || !MODAL.onSave) return;
  const cb = MODAL.onSave;
  const result = cb();
  if(result === false){ render(); return; } // validation a échoué : le pop-up reste ouvert (ex: showAlert affiché)
  MODAL = null;
  saveAndRender();
}
function closeModal(){ MODAL = null; render(); }

  if(!MODAL) return;
  const cb = MODAL.onConfirm;

  if(MODAL.kind === 'prompt'){ value = document.getElementById('modalPromptInput').value; }
  MODAL = null;
  if(cb) cb(value);
  render();
}
