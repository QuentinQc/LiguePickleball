// ---------- doubles generation ----------
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
// Règle standard : 5 joueurs → 10 matchs (à 9 points) ; 4 joueurs → 6 matchs (à 11 points) ;
// 6 joueurs (exception) → 6 matchs (à 11 points), 4 matchs joués par joueur, aucun duo répété.
// Le mode test (Réglages) permet de contourner temporairement cette règle pour essayer l'app rapidement.
function matchesCountFor(n){
  if(DATA.testMode){
    if(n === 4) return Math.max(1, DATA.testMatches4 || 2);
    if(n === 5) return Math.max(1, DATA.testMatches5 || 3);
    return Math.max(1, DATA.matchesPerSession || 3);
  }
  if(n === 6) return Math.max(1, DATA.rules6Matches || 6);
  if(n === 5) return Math.max(1, DATA.rules5Matches || 10);
  if(n === 4) return Math.max(1, DATA.rules4Matches || 6);
  return DATA.matchesPerSession || 10; // repli pour une taille de groupe atypique
}
function targetPointsFor(n){
  if(n === 6) return Math.max(1, DATA.rules6Points || 11);
  if(n === 5) return Math.max(1, DATA.rules5Points || 9);
  if(n === 4) return Math.max(1, DATA.rules4Points || 11);
  return 11;
}

function generateUnit(playerIds){
  const p = shuffle(playerIds);
  if(p.length === 4){
    return [
      { sit:null, teamA:[p[0],p[1]], teamB:[p[2],p[3]], scoreA:null, scoreB:null },
      { sit:null, teamA:[p[0],p[2]], teamB:[p[1],p[3]], scoreA:null, scoreB:null },
      { sit:null, teamA:[p[0],p[3]], teamB:[p[1],p[2]], scoreA:null, scoreB:null }
    ];
  }
  // fallback for other sizes: simple rotation, one match per 4, leftover sits
  const matches = [];
  for(let i=0;i+3<p.length;i+=4){
    matches.push({ sit:null, teamA:[p[i],p[i+1]], teamB:[p[i+2],p[i+3]], scoreA:null, scoreB:null });
  }
  // Un effectif impair restant (typiquement 3 joueurs actifs après des
  // absences sans remplaçant) ne peut pas être réparti équitablement en
  // double (2 contre 2) — mieux vaut ne générer aucun match ici que d'en
  // créer un 2 contre 1 qui fausserait le classement et la cote.
  if(matches.length===0 && p.length>=2 && p.length%2===0){
    matches.push({ sit:null, teamA:p.slice(0,p.length/2), teamB:p.slice(p.length/2), scoreA:null, scoreB:null });
  }
  return matches;
}
// Rotation fixe pour un groupe de 5 (calculée pour respecter, sur 10 matchs :
// chaque paire de joueurs partenaire exactement 2 fois, jamais deux matchs de
// suite ensemble, et l'espacement maximal possible entre ces deux fois — ce
// qui force mathématiquement les matchs 6-10 à reproduire l'ordre des matchs
// 1-5. On mélange une seule fois l'ordre des 5 joueurs par session (positions
// 1 à 5), pour varier les duos d'une session à l'autre tout en gardant cette
// structure garantie à l'intérieur d'une même session.
const FIVE_PLAYER_ROTATION = [
  { bench:4, teamA:[0,1], teamB:[2,3] }, // position5 au banc — 1&2 vs 3&4
  { bench:3, teamA:[0,4], teamB:[1,2] }, // position4 au banc — 1&5 vs 2&3
  { bench:2, teamA:[0,3], teamB:[1,4] }, // position3 au banc — 1&4 vs 2&5
  { bench:1, teamA:[0,2], teamB:[3,4] }, // position2 au banc — 1&3 vs 4&5
  { bench:0, teamA:[1,3], teamB:[2,4] }  // position1 au banc — 2&4 vs 3&5
];
// Rotation fixe pour un groupe de 6 (exception) : 6 matchs, 2 joueurs au banc par match.
// Chaque joueur joue exactement 4 matchs avec 4 partenaires différents (aucun duo répété : 12 duos
// distincts), affronte chaque autre joueur 1 ou 2 fois et ne reste jamais au banc deux matchs de suite.
// Positions 0 à 5, mélangées une fois par session.
const SIX_PLAYER_ROTATION = [
  { teamA:[0,2], teamB:[1,4] }, { teamA:[0,3], teamB:[1,5] }, { teamA:[0,4], teamB:[2,5] },
  { teamA:[1,2], teamB:[3,5] }, { teamA:[0,5], teamB:[3,4] }, { teamA:[1,3], teamB:[2,4] }
];
function generateSixPlayerMatches(playerIds, target){
  const p = shuffle(playerIds);
  const matches = [];
  let i = 0;
  while(matches.length < target){
    const r = SIX_PLAYER_ROTATION[i % SIX_PLAYER_ROTATION.length];
    const used = r.teamA.concat(r.teamB);
    const bench = [0,1,2,3,4,5].filter(x=>!used.includes(x));
    matches.push({ sit:p[bench[0]], sit2:p[bench[1]], teamA:[p[r.teamA[0]],p[r.teamA[1]]], teamB:[p[r.teamB[0]],p[r.teamB[1]]], scoreA:null, scoreB:null });
    i++;
  }
  return matches.slice(0, target);
}
function sitLabel(m){
  return [m.sit, m.sit2].filter(Boolean).map(id=>playerName(id)).join(' et ');
}
function generateFivePlayerMatches(playerIds, target){
  const p = shuffle(playerIds);
  const matches = [];
  let i = 0;
  while(matches.length < target){
    const r = FIVE_PLAYER_ROTATION[i % FIVE_PLAYER_ROTATION.length];
    matches.push({ sit:p[r.bench], teamA:[p[r.teamA[0]],p[r.teamA[1]]], teamB:[p[r.teamB[0]],p[r.teamB[1]]], scoreA:null, scoreB:null });
    i++;
  }
  return matches.slice(0, target);
}

// Une session génère un nombre de matchs par groupe selon la règle standard
// (voir matchesCountFor). Groupe de 5 : rotation fixe garantie (voir
// generateFivePlayerMatches). Groupe de 4 (ou autre taille) : on enchaîne des
// blocs (round-robin complet pour 4) en remélangeant à chaque bloc pour
// varier les partenaires.
function generateMatches(playerIds){
  if(playerIds.length < 2) return [];
  const target = matchesCountFor(playerIds.length);
  if(playerIds.length === 5) return generateFivePlayerMatches(playerIds, target);
  if(playerIds.length === 6) return generateSixPlayerMatches(playerIds, target);
  let matches = [];
  let guard = 0;
  while(matches.length < target && guard < 20){
    matches = matches.concat(generateUnit(playerIds));
    guard++;
  }
  return matches.slice(0, target);
}

// ---------- standings ----------
// Confrontations directes entre deux joueurs (équipes adverses uniquement).
// Retourne > 0 si pidA a gagné plus souvent contre pidB, < 0 si l'inverse, 0 sinon.
function headToHead(matches, pidA, pidB){
  let winsA = 0, winsB = 0;
  matches.forEach(m=>{
    if(m.scoreA === null || m.scoreB === null || m.scoreA === '' || m.scoreB === '') return;
    const aInA = m.teamA.includes(pidA), aInB = m.teamB.includes(pidA);
    const bInA = m.teamA.includes(pidB), bInB = m.teamB.includes(pidB);
    if(!((aInA && bInB) || (aInB && bInA))) return; // pas adversaires dans ce match
    const sa = Number(m.scoreA), sb = Number(m.scoreB);
    if(sa === sb) return;
    const aWon = aInA ? sa > sb : sb > sa;
    if(aWon) winsA++; else winsB++;
  });
  return winsA - winsB;
}

// Index (ordre chronologique) du premier match perdu par un joueur. Infinity si jamais perdu.
function firstLossIndex(matches, pid){
  for(let i=0;i<matches.length;i++){
    const m = matches[i];
    if(m.scoreA === null || m.scoreB === null || m.scoreA === '' || m.scoreB === '') continue;
    const inA = m.teamA.includes(pid), inB = m.teamB.includes(pid);
    if(!inA && !inB) continue;
    const sa = Number(m.scoreA), sb = Number(m.scoreB);
    const lost = inA ? sa < sb : sb < sa;
    if(lost) return i;
  }
  return Infinity;
}

// Critères de départage disponibles — chacun retourne un nombre négatif si
// "a" doit être classé avant "b" selon ce critère seul, 0 si égalité.
const TIEBREAK_CRITERIA = {
  points: { label: '🎯 Total de points marqués', cmp: (a,b)=> b.pf - a.pf },
  wins: { label: '🏆 Victoires', cmp: (a,b)=> b.wins - a.wins },
  diff: { label: '➕➖ Différentiel de points (marqués − accordés)', cmp: (a,b)=> b.diff - a.diff },
  h2h: { label: '🤝 Face-à-face direct', cmp: (a,b,matches)=> -headToHead(matches, a.playerId, b.playerId) },
  rating: { label: '📊 Cote actuelle (le mieux coté gagne l\'égalité)', cmp: (a,b)=> ratingOf(b.playerId) - ratingOf(a.playerId) },
  firstLoss: { label: '⏱️ A perdu son premier match le plus tard', cmp: (a,b,matches)=> firstLossIndex(matches,b.playerId) - firstLossIndex(matches,a.playerId) }
};
function defaultTiebreakCriteria(){
  return [
    { key:'points', enabled:true },
    { key:'wins', enabled:true },
    { key:'h2h', enabled:true },
    { key:'firstLoss', enabled:true },
    { key:'diff', enabled:false },
    { key:'rating', enabled:false }
  ];
}
// Complète la liste enregistrée avec tout critère manquant (ex: ajouté dans
// une mise à jour future de l'app), désactivé par défaut, sans perdre l'ordre
// choisi par l'admin pour les critères déjà connus.
function normalizedTiebreakCriteria(){
  const existing = (DATA.tiebreakCriteria && DATA.tiebreakCriteria.length) ? DATA.tiebreakCriteria : defaultTiebreakCriteria();
  const keys = existing.map(c=>c.key);
  const merged = existing.map(c=>({ key:c.key, enabled:!!c.enabled }));
  Object.keys(TIEBREAK_CRITERIA).forEach(k=>{ if(!keys.includes(k)) merged.push({ key:k, enabled:false }); });
  return merged;
}

function computeStandings(groupPlayers, matches){
  const stats = {};
  groupPlayers.forEach(pid => stats[pid] = { wins:0, losses:0, pf:0, pa:0, played:0, scheduled:0 });
  matches.forEach(m=>{
    m.teamA.forEach(pid=>{ if(stats[pid]) stats[pid].scheduled++; });
    m.teamB.forEach(pid=>{ if(stats[pid]) stats[pid].scheduled++; });
    if(m.scoreA === null || m.scoreB === null || m.scoreA === '' || m.scoreB === '') return;
    const sa = Number(m.scoreA), sb = Number(m.scoreB);
    m.teamA.forEach(pid=>{ if(stats[pid]){ stats[pid].pf += sa; stats[pid].pa += sb; stats[pid].played++; if(sa>sb) stats[pid].wins++; else if(sa<sb) stats[pid].losses++; } });
    m.teamB.forEach(pid=>{ if(stats[pid]){ stats[pid].pf += sb; stats[pid].pa += sa; stats[pid].played++; if(sb>sa) stats[pid].wins++; else if(sb<sa) stats[pid].losses++; } });
  });
  const rows = groupPlayers.map(pid => ({
    playerId: pid,
    ...stats[pid],
    diff: stats[pid].pf - stats[pid].pa,
    avgPts: stats[pid].played > 0 ? (stats[pid].pf / stats[pid].played) : null
  }));
  // Classement : selon l'ordre de critères activés dans Réglages → Jeu
  // (par défaut : points, victoires, face-à-face, premier match perdu).
  const order = normalizedTiebreakCriteria().filter(c=>c.enabled).map(c=>c.key);
  rows.sort((a,b)=>{
    for(const key of order){
      const crit = TIEBREAK_CRITERIA[key];
      if(!crit) continue;
      const result = crit.cmp(a,b,matches);
      if(result !== 0) return result;
    }
    return 0;
  });
  return rows;
}

// Retourne le premier groupe (selon l'ordre de l'échelle) qui a encore de la

// Place pour un NOUVEAU joueur dans les données d'une ligue donnée : premier groupe
// qui n'est pas plein, sinon aucun groupe (le joueur reste « en attente d'assignation »).
function newPlayerPlacement(leagueData){
  const max = leagueData.groupMaxPlayers || 5;
  const groups = (leagueData.groups||[]).slice().sort((a,b)=>a.order-b.order);
  const players = leagueData.players || [];

      return { groupId: g.id, order: members.reduce((m,x)=>Math.max(m, typeof x.order==='number'?x.order:0), 0) + 1, waiting:false };
    }

function nextOrderInGroup(groupId){

// Échange la position (haut/bas) d'un joueur avec son voisin immédiat dans
// son groupe.

// Glisser-déposer un joueur sur la ligne d'un autre pour l'insérer à cette

function onRowDragOver(ev){

  ev.currentTarget.classList.add('row-drop-hover');

function onRowDrop(ev, gid, targetPid){
  ev.preventDefault();
  ev.stopPropagation();
  ev.currentTarget.classList.remove('row-drop-hover');
  const draggedPid = ev.dataTransfer.getData('text/plain');
  if(!draggedPid || draggedPid === targetPid) return;
  const dragged = DATA.players.find(x=>x.id===draggedPid);
  if(!dragged) return;
  if(dragged.groupId !== gid){
    const otherPlayers = DATA.players.filter(x=>x.id!==draggedPid);
    dragged.groupId = resolveGroupAssignment(gid, DATA.groups, otherPlayers);
  }
  let members = playersInGroup(gid).sort((a,b)=>(typeof a.order==='number'?a.order:0)-(typeof b.order==='number'?b.order:0));
  members = members.filter(p=>p.id!==draggedPid);
  const targetIdx = members.findIndex(p=>p.id===targetPid);
  members.splice(targetIdx===-1 ? members.length : targetIdx, 0, dragged);
  members.forEach((p,i)=>{ p.order = i+1; });
  saveAndRender();
}
// Vérifie la capacité d'un groupe avant d'y placer un joueur. Si plein,
// avertit et retourne plutôt le premier groupe disponible.
function resolveGroupAssignment(desiredGroupId, groupsList, playersList){
  const count = playersList.filter(p=>p.groupId===desiredGroupId).length;
  if(count + 1 === 6){
    const nm6 = (groupsList.find(g=>g.id===desiredGroupId)||{}).name || 'ce groupe';
    showAlert(`${nm6} aura 6 joueurs (exception acceptée) : rotation fixe de ${DATA.rules6Matches||6} matchs à ${DATA.rules6Points||11} points, 4 matchs joués par joueur.`);
  } else if(count >= GROUP_MAX_PLAYERS()){
    const desiredName = (groupsList.find(g=>g.id===desiredGroupId)||{}).name || 'ce groupe';
    showAlert(`Attention : ${desiredName} aura maintenant ${count+1} joueurs, au-dessus de la limite recommandée de ${GROUP_MAX_PLAYERS()}. Le joueur a quand même été placé — pense à rééquilibrer avant de publier une session.`);
  }
  return desiredGroupId;
}
// Ajoute un suffixe numéroté si le nom existe déjà, pour éviter les doublons.
function uniquePlayerName(desiredName, playersList, excludePlayerId){
  const base = desiredName.trim();
  const existing = new Set(playersList.filter(p=>p.id!==excludePlayerId).map(p=>p.name.trim().toLowerCase()));
  if(!existing.has(base.toLowerCase())) return base;
  let n = 2;
  while(existing.has(`${base} (${n})`.toLowerCase())) n++;
  const finalName = `${base} (${n})`;
  showAlert(`Le nom « ${base} » existe déjà — ce joueur a été nommé « ${finalName} » pour les distinguer.`);
  return finalName;
}

// ---------- session lifecycle ----------
// Retourne la date (YYYY-MM-DD) du prochain jour correspondant au jour de jeu
// configuré pour la ligue (aujourd'hui inclus si on est justement ce jour-là).
// Si aucun jour n'est configuré, retourne simplement la date d'aujourd'hui.
function fmtDate(d){
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return `${yyyy}-${mm}-${dd}`;
}
function nextSessionDate(){
  if(typeof DATA.playDayOfWeek !== 'number') return fmtDate(new Date());
  const now = new Date();
  const diff = (DATA.playDayOfWeek - now.getDay() + 7) % 7;
  const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + diff);
  return fmtDate(d);
}
// Calcule la prochaine date de jeu valide à partir d'une date donnée (incluse),
// en sautant les dates bloquées du calendrier de saison. Retourne
// { date, skipped } où skipped liste les dates bloquées sautées en chemin,
// ou { date: null } si ça dépasse la fin de saison configurée.
function nextValidSessionDate(fromDateStr){
  const blocked = new Set(DATA.blockedDates || []);
  const seasonEnd = DATA.seasonEndDate || null;
  let d = new Date(fromDateStr + 'T00:00:00');
  const skipped = [];
  for(let i=0;i<52;i++){ // garde-fou : au plus un an de sauts
    const ds = fmtDate(d);
    if(seasonEnd && ds > seasonEnd) return { date: null, skipped };
    if(blocked.has(ds)){
      skipped.push(ds);
      d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 7);
      continue;
    }
    return { date: ds, skipped };
  }
  return { date: null, skipped };
}
// Point d'entrée unique pour la génération des matchs d'un groupe : respecte
// le mode choisi dans Réglages (automatique ou manuel).
// Effectif d'un groupe ordonné par position (#1, #2, ...), avec le
// remplaçant à la place de chaque joueur absent (ou une case vide si aucun).
// Sert à appliquer le modèle de rotation manuel par numéro de position.
function orderedRosterWithSubs(session, gid){
  const regularOrder = playersInGroup(gid).slice().sort((a,b)=>(typeof a.order==='number'?a.order:0)-(typeof b.order==='number'?b.order:0));
  const gd = session.groupsData.find(x=>x.groupId===gid);
  const subs = (gd && gd.substitutes) || {};
  return regularOrder.map(p=> isAbsent(session, p.id) ? (subs[p.id] || null) : p.id);
}
// Construit les matchs d'un groupe à partir du modèle de rotation défini
// dans Réglages (positions 1,2,3... → joueur occupant cette position).
function matchesFromTemplate(session, gid){
  const ordered = orderedRosterWithSubs(session, gid);
  const groupSize = playersInGroup(gid).length;
  // On choisit le modèle selon la taille réelle du groupe (4 ou 5 joueurs) —
  // le plus proche est utilisé pour une taille atypique.
  const template = (groupSize <= 4 ? (DATA.manualMatchupTemplate4 || []) : (DATA.manualMatchupTemplate5 || []));
  return template.map(t=>{
    const teamA = (t.teamA||[]).map(pos=>ordered[pos-1]).filter(Boolean);
    const teamB = (t.teamB||[]).map(pos=>ordered[pos-1]).filter(Boolean);
    // Le joueur au repos pour ce match : la position du groupe qui n'apparaît
    // dans aucune des deux équipes du modèle (typiquement 1 sur 5 joueurs).
    const usedPositions = new Set([...(t.teamA||[]), ...(t.teamB||[])]);
    const benchPositions = ordered.map((_,idx)=>idx+1).filter(pos=>!usedPositions.has(pos));
    const sit = benchPositions.length===1 ? (ordered[benchPositions[0]-1] || null) : null;
    return { sit, teamA, teamB, scoreA:null, scoreB:null };
  });
}
// Point d'entrée unique pour la génération des matchs d'un groupe : respecte
// le mode choisi dans Réglages (automatique ou modèle manuel par position).
function matchesForGroup(session, gid){
  if(DATA.leagueFormat === 'social') return []; // rotation sociale : aucun match préparé, seulement les terrains
  if(DATA.matchupMode === 'manual' && playersInGroup(gid).length !== 6) return matchesFromTemplate(session, gid); // un groupe de 6 (exception) utilise toujours la rotation fixe
  const ids = activeRosterForGroup(session, gid);
  return ids.length >= 2 ? generateMatches(ids) : [];
}
// ---- Vocabulaire selon le type de ligue : en récréatif (rotation sociale), on parle
// de terrains plutôt que de groupes, et il n'y a ni score, ni classement, ni montée/descente.
function isRecLeague(d){ d = d || DATA; return !!d && (d.leagueFormat === 'social' || d.leagueType === 'recreational'); }
function grpWord(plural, cap, d){
  const w = isRecLeague(d) ? (plural ? 'terrains' : 'terrain') : (plural ? 'groupes' : 'groupe');
  return cap ? w.charAt(0).toUpperCase() + w.slice(1) : w;
}
function myGroupLabel(d){ return 'Mon ' + grpWord(false, false, d); }
// Onglets liés à la performance, retirés en récréatif (joueurs, remplaçants et admin pour le palmarès).
const REC_HIDDEN_TABS = ['stats','historique'];
// Réglages des terrains en récréatif : joueurs par terrain et nombre de terrains disponibles (0 = aucune limite).
const COURT_SIZE_OPTS = { '4':[4,4,'4 joueurs'], '45':[4,5,'4 ou 5 joueurs'], '46':[4,6,'4 à 6 joueurs'] };
function socialCourtLimits(){ const o = COURT_SIZE_OPTS[DATA.socialCourtSize] || COURT_SIZE_OPTS['46']; return { min:o[0], max:o[1], label:o[2] }; }
// Répartition des joueurs présents selon ces réglages : au besoin, on remplit
// au plus les terrains disponibles et les autres attendent leur tour.
function socialPlanFor(n){
  const lim = socialCourtLimits();
  const K = parseInt(DATA.socialMaxCourts, 10) || 0;
  const plan = socialSizes(n, lim.min, lim.max);
  if(K > 0 && plan.sizes.length > K){
    const m = Math.min(n, K * lim.max);
    const base = Math.floor(m / K), extra = m % K, sizes = [];
    for(let i = 0; i < K; i++) sizes.push(base + (i < extra ? 1 : 0));
    return { sizes: sizes, left: n - m };
  }
  return plan;
}
// ---- Rotation sociale : à chaque session, les joueurs présents sont répartis
// au hasard en groupes (terrains) de 4 à 6, en privilégiant les groupes de 4.
function socialSizes(n, min, max){
  min = min || 4; max = max || 6;
  for(let left=0; left<=3; left++){
    const m = n - left; if(m < min) break;
    for(let g=Math.floor(m/min); g>=Math.ceil(m/max); g--){
      const extra = m - min*g; if(g < 1 || extra < 0 || extra > (max-min)*g) continue;
      const sizes = []; for(let i=0;i<g;i++) sizes.push(min);
      for(let i=0, e=extra; e>0; i=(i+1)%g){ if(sizes[i] < max){ sizes[i]++; e--; } }
      return { sizes: sizes, left: left };
    }
  }
  return { sizes: [], left: n };
}
// Historique des duos : combien de fois deux joueurs ont partagé un groupe (et été partenaires).
// Les sessions récentes comptent un peu plus que les anciennes.
function socialPairHistory(excludeSessionId){
  const w = {};
  const key = function(a, b){ return a < b ? a + '|' + b : b + '|' + a; };
  const sessions = (DATA.sessions || []).filter(function(se){ return se.id !== excludeSessionId; });
  const N = sessions.length;
  sessions.forEach(function(se, rank){
    const f = N > 1 ? 0.5 + 0.5 * (rank / (N - 1)) : 1;
    (se.groupsData || []).forEach(function(gd){
      const seen = {};
      (gd.matches || []).forEach(function(m){
        const A = m.teamA || [], B = m.teamB || [];
        A.concat(B).forEach(function(x){ seen[x] = 1; });
        if(A.length === 2) w[key(A[0], A[1])] = (w[key(A[0], A[1])] || 0) + f;
        if(B.length === 2) w[key(B[0], B[1])] = (w[key(B[0], B[1])] || 0) + f;
      });
      const ids = Object.keys(seen);
      for(let i = 0; i < ids.length; i++) for(let j = i + 1; j < ids.length; j++){
        const k = key(ids[i], ids[j]);
        w[k] = (w[k] || 0) + 2 * f;
      }
    });
  });
  return { w: w, key: key };
}
function socialPlayedCounts(excludeSessionId){
  const c = {};
  (DATA.sessions || []).forEach(function(se){
    if(se.id === excludeSessionId) return;
    (se.groupsData || []).forEach(function(gd){
      const seen = {};
      (gd.matches || []).forEach(function(m){ (m.teamA || []).concat(m.teamB || []).forEach(function(x){ seen[x] = 1; }); });
      Object.keys(seen).forEach(function(x){ c[x] = (c[x] || 0) + 1; });
    });
  });
  return c;
}
// Répartit les joueurs en groupes en minimisant les retrouvailles (recherche aléatoire + échanges).
function socialBestGrouping(ids, sizes, hist){
  const cost2 = function(a, b){ return hist.w[hist.key(a, b)] || 0; };
  const gCost = function(g){ let c = 0; for(let i = 0; i < g.length; i++) for(let j = i + 1; j < g.length; j++) c += cost2(g[i], g[j]); return c; };
  const split = function(arr){ const out = []; let idx = 0; sizes.forEach(function(sz){ out.push(arr.slice(idx, idx + sz)); idx += sz; }); return out; };
  let best = null, bestCost = Infinity;
  const restarts = sizes.length > 1 ? 14 : 1;
  for(let r = 0; r < restarts; r++){
    const gs = split(shuffle(ids));
    let total = 0; gs.forEach(function(g){ total += gCost(g); });
    if(sizes.length > 1){
      for(let it = 0; it < 500 && total > 0; it++){
        const ga = Math.floor(Math.random() * gs.length);
        let gb = Math.floor(Math.random() * gs.length);
        if(ga === gb) continue;
        const ia = Math.floor(Math.random() * gs[ga].length), ib = Math.floor(Math.random() * gs[gb].length);
        const before = gCost(gs[ga]) + gCost(gs[gb]);
        const tmp = gs[ga][ia]; gs[ga][ia] = gs[gb][ib]; gs[gb][ib] = tmp;
        const after = gCost(gs[ga]) + gCost(gs[gb]);
        if(after <= before){ total += after - before; }
        else { gs[gb][ib] = gs[ga][ia]; gs[ga][ia] = tmp; }
      }
    }
    if(total < bestCost){ bestCost = total; best = gs.map(function(g){ return g.slice(); }); }
    if(bestCost === 0) break;
  }
  return best;
}
function socialShuffleGroups(session){
  let present = DATA.players.filter(function(p){ return !p.injured && !isAbsent(session, p.id); }).map(function(p){ return p.id; });
  const plan = socialPlanFor(present.length);
  // Quand il y a trop de monde pour les terrains, ceux qui ont le plus joué récemment laissent leur place.
  if(plan.left > 0){
    const played = socialPlayedCounts(session.id);
    present = shuffle(present).sort(function(a, b){ return (played[a] || 0) - (played[b] || 0); }).slice(0, present.length - plan.left);
  }
  while(DATA.groups.length < plan.sizes.length){
    const n = DATA.groups.length + 1;
    DATA.groups.push({ id: uid('g'), name: 'Terrain ' + n, order: n });
  }
  const grouping = plan.sizes.length ? socialBestGrouping(present, plan.sizes, socialPairHistory(session.id)) : [];
  const placed = {};
  (grouping || []).forEach(function(g, gi){ g.forEach(function(id){ placed[id] = DATA.groups[gi].id; }); });
  DATA.players.forEach(function(p){
    if(p.injured) return;
    p.groupId = placed[p.id] || null;
  });
}
// Après une absence (ou un retour) en récréatif : on garde les terrains tels quels si c'est encore
// valable (le terrain de l'absent a simplement une place de moins, un joueur de retour prend une
// place libre) ; sinon, nouveau tirage complet. Retourne 'kept' ou 'redrawn'.
function socialReconcile(session){
  const lim = socialCourtLimits();
  const isOut = function(p){ return p.injured || isAbsent(session, p.id); };
  DATA.players.forEach(function(p){ if(isOut(p)) p.groupId = null; });
  const present = DATA.players.filter(function(p){ return !isOut(p); });
  const plan = socialPlanFor(present.length);
  const counts = {};
  present.forEach(function(p){ if(p.groupId) counts[p.groupId] = (counts[p.groupId] || 0) + 1; });
  present.filter(function(p){ return !p.groupId; }).forEach(function(p){
    let best = null;
    Object.keys(counts).forEach(function(g){ if(counts[g] < lim.max && (best === null || counts[g] < counts[best])) best = g; });
    if(best){ p.groupId = best; counts[best]++; }
  });
  const sizes = Object.keys(counts).map(function(g){ return counts[g]; });
  const unplaced = present.filter(function(p){ return !p.groupId; }).length;
  const ok = sizes.length === plan.sizes.length && unplaced === plan.left && sizes.every(function(n){ return n >= lim.min && n <= lim.max; });
  if(ok) return 'kept';
  socialShuffleGroups(session);
  return 'redrawn';
}
// Prévient les joueurs quand les terrains d'une soirée déjà publiée ont été refaits.
function notifySocialRedraw(session){
  if(!CURRENT_LEAGUE_ID || !session) return;
  invokeSendNotification({ league_id: CURRENT_LEAGUE_ID, audience:'players', category:'league_sessions',
    title: '🎲 Terrains refaits',
    body: `${currentLeagueLabel()} — soirée du ${fdl(session.date)} : les terrains ont été refaits à la suite d'une absence. Vérifie ton terrain.`,
    url: '/' });
}
// Absence déclarée par le joueur lui-même : le serveur l'enregistre sans toucher aux terrains.
// Son application calcule la mise à jour et l'envoie (social_apply_draw vérifie qu'elle est valable).
async function socialRedrawAfterSelfChange(){
  try{
    const open = currentOpenSession();
    if(!open || DATA.leagueFormat !== 'social') return;
    const nGroups = DATA.groups.length;
    const before = {};
    DATA.players.forEach(function(p){ before[p.id] = p.groupId || null; });
    const res = socialReconcile(open);
    let changed = false;
    const assign = {};
    DATA.players.forEach(function(p){
      if(p.groupId && !p.injured) assign[p.id] = p.groupId;
      if((p.groupId || null) !== before[p.id]) changed = true;
    });
    // Rien à changer, ou il faudrait créer des terrains : l'admin s'en chargera à sa prochaine ouverture.
    if(changed && DATA.groups.length === nGroups){
      const { error } = await sb.rpc('social_apply_draw', { p_league_id: CURRENT_LEAGUE_ID, p_session_id: open.id, p_assign: assign });
      if(error) console.error(error);
      else if(res === 'redrawn' && open.published) notifySocialRedraw(open);
    }
  }catch(e){ console.error(e); }
  await scoreReloadFromServer();
}
function socialRedraw(){
  const open = currentOpenSession(); if(!open) return;
  showConfirm('Refaire le tirage au sort des terrains avec les joueurs présents ?', ()=>{
    socialShuffleGroups(open);
    open.groupsData = DATA.groups.map(g=>({ groupId:g.id, matches:[] }));
    saveAndRender();
  });
}
function startNewSession(explicitDate){
  const session = { id: uid('s'), date: explicitDate || nextSessionDate(), status:'open', groupsData: DATA.groups.map(g=>({ groupId:g.id, matches:[] })), movements: null, absences: [], published: false };
  applyPlannedAbsencesToSession(session);
  if(DATA.leagueFormat === 'social'){
    socialShuffleGroups(session);
    session.groupsData = DATA.groups.map(g=>({ groupId:g.id, matches:[] }));
  }
  DATA.sessions.push(session);
  DATA.groups.forEach(g=>{
    const gd = session.groupsData.find(x=>x.groupId===g.id);
    gd.matches = matchesForGroup(session, g.id);
  });
  return session;
}
// ---- Absences planifiées (vacances) : un joueur peut couvrir une plage de
// dates à l'avance. Appliquées automatiquement à toute nouvelle session dont
// la date tombe dans la plage, sans devoir y penser session par session.
function plannedAbsencesForPlayer(playerId){
  return (DATA.plannedAbsences||[]).filter(a=>a.playerId===playerId).sort((a,b)=>a.startDate.localeCompare(b.startDate));
}
function dateInPlannedAbsence(a, dateStr){ return dateStr >= a.startDate && dateStr <= a.endDate; }
function applyPlannedAbsencesToSession(session){
  (DATA.plannedAbsences||[]).forEach(a=>{
    if(dateInPlannedAbsence(a, session.date) && !session.absences.includes(a.playerId)){
      session.absences.push(a.playerId);
    }
  });
}
function addPlannedAbsence(playerId, startDate, endDate){
  DATA.plannedAbsences = DATA.plannedAbsences || [];
  DATA.plannedAbsences.push({ id: uid('pa'), playerId, startDate, endDate });
  // Applique immédiatement à la session en cours si sa date tombe dans la plage.
  const open = currentOpenSession();
  if(open && dateInPlannedAbsence({startDate, endDate}, open.date) && !isAbsent(open, playerId)){
    toggleAbsence(playerId);
  }
}
function removePlannedAbsence(id){
  DATA.plannedAbsences = (DATA.plannedAbsences||[]).filter(a=>a.id!==id);
  saveAndRender();
}
function toggleAbsence(playerId){
  const open = currentOpenSession();
  if(!open) return;
  if(isPlayerActor()){
    if(isAbsent(open, playerId)) return;
    const hp = DATA.players.find(p=>p.id===playerId), dt = open.date;
    selfAction('absent_session', { playerId }).then(ok=>{ if(ok){ notifyAdminsPlayerAbsent(hp && hp.name, dt); socialRedrawAfterSelfChange(); } });
    return;
  }
  if(!open.absences) open.absences = [];
  const idx = open.absences.indexOf(playerId);
  const groupsToRefresh = new Set();
  const homeP = DATA.players.find(p=>p.id===playerId);
  if(homeP) groupsToRefresh.add(homeP.groupId);
  const becomingAbsent = idx === -1;
  if(becomingAbsent){
    open.absences.push(playerId);
    // Notifie les admins seulement quand le joueur déclare lui-même son
    // absence — soit via un vrai compte joueur, soit un admin qui bascule
    // sur sa propre vue « Joueur » (pas quand un admin la coche
    // manuellement pour quelqu'un d'autre).
    const isSelfDeclared = (SESSION_USER && SESSION_USER.role==='player' && SESSION_USER.playerId===playerId)
      || (SESSION_USER && SESSION_USER.role==='admin' && ADMIN_VIEWING_AS==='player' && MY_LINK_IN_CURRENT_LEAGUE && MY_LINK_IN_CURRENT_LEAGUE.player_id===playerId);
    if(isSelfDeclared){
      notifyAdminsPlayerAbsent(homeP && homeP.name, open.date);
    }
  } else {
    open.absences.splice(idx,1);
    // s'il avait été prêté à un autre groupe, on annule ce prêt
    if(open.loans && open.loans[playerId]){
      const toGid = open.loans[playerId];
      delete open.loans[playerId];
      const gd2 = open.groupsData.find(x=>x.groupId===toGid);
      if(gd2 && gd2.substitutes){
        Object.keys(gd2.substitutes).forEach(aId=>{ if(gd2.substitutes[aId]===playerId) delete gd2.substitutes[aId]; });
      }
      groupsToRefresh.add(toGid);
    }
  }
  if(DATA.leagueFormat === 'social'){
    // Rotation sociale : une absence (ou un retour) met à jour les terrains pour que tout le monde joue,
    // en touchant le moins de monde possible ; les joueurs sont prévenus si tout a été retiré.
    const res = socialReconcile(open);
    open.groupsData = DATA.groups.map(g=>({ groupId:g.id, matches:[] }));
    if(res === 'redrawn' && open.published) notifySocialRedraw(open);
  } else {
    groupsToRefresh.forEach(gId=>regenerateGroupMatches(open, gId));
  }
  saveAndRender();
}
function isAbsent(session, playerId){ return !!(session && session.absences && session.absences.includes(playerId)); }
// Absent "pour de vrai" (pas juste prêté à un autre groupe, où il joue quand même).
function isTrulyAbsent(session, playerId){ return isAbsent(session, playerId) && !(session && session.loans && session.loans[playerId]); }
function currentOpenSession(){ return DATA.sessions.find(s=>s.status==='open'); }

// Effectif réellement actif d'un groupe pour une session : membres présents,
// plus les remplaçants assignés aux absents. La place d'un absent sans
// remplaçant reste simplement vide.
function activeRosterForGroup(session, gid){
  const groupIds = playersInGroup(gid).map(p=>p.id);
  const gd = session.groupsData.find(x=>x.groupId===gid);
  const subs = (gd && gd.substitutes) || {};
  const roster = [];
  groupIds.forEach(id=>{
    const p = DATA.players.find(x=>x.id===id);
    if(p && p.injured){
      if(subs[id]) roster.push(subs[id]); // un remplaçant peut quand même prendre sa place
      return; // sinon la position reste vide, sans compter comme une absence
    }
    if(isAbsent(session, id)){
      if(subs[id]) roster.push(subs[id]);
    } else {
      roster.push(id);
    }
  });
  return roster;
}
function regenerateGroupMatches(session, gid){
  const gd = session.groupsData.find(x=>x.groupId===gid);
  if(!gd) return;
  gd.matches = matchesForGroup(session, gid);
}
// Joueurs déjà utilisés comme remplaçants ailleurs dans la session (pour éviter
// qu'un même joueur soit assigné à deux groupes en même temps).
function substitutesInUse(session, excludeGid, excludeAbsentId){
  const set = new Set();
  DATA.groups.forEach(g=>{
    const gd2 = session.groupsData.find(x=>x.groupId===g.id);
    if(!gd2 || !gd2.substitutes) return;
    Object.entries(gd2.substitutes).forEach(([aId, subId])=>{
      if(g.id===excludeGid && aId===excludeAbsentId) return;
      if(!isGuestOrSubId(subId)) set.add(subId);
    });
  });
  return set;
}
// Assigne (ou retire) un remplaçant à la place d'un absent. Si le remplaçant
// choisi est un joueur de la ligue actif dans son propre groupe, ce dernier
// est automatiquement marqué absent de son groupe d'origine (« prêté »),
// libérant sa place — qui peut alors être gérée comme n'importe quelle absence.
function setSubstitute(gid, absentId, subId){
  const open = currentOpenSession();
  const gd = open.groupsData.find(x=>x.groupId===gid);
  if(!gd.substitutes) gd.substitutes = {};
  if(!open.loans) open.loans = {};
  const oldSub = gd.substitutes[absentId];
  const groupsToRefresh = new Set([gid]);

  // annuler le prêt précédent s'il y en avait un pour cette place
  if(oldSub && !isGuestOrSubId(oldSub) && open.loans[oldSub] === gid){
    delete open.loans[oldSub];
    const idx2 = open.absences.indexOf(oldSub);
    if(idx2>-1) open.absences.splice(idx2,1);
    const homeOld = DATA.players.find(p=>p.id===oldSub);
    if(homeOld) groupsToRefresh.add(homeOld.groupId);
  }

  if(subId){
    gd.substitutes[absentId] = subId;
    if(!isGuestOrSubId(subId)){
      if(!open.absences.includes(subId)) open.absences.push(subId);
      open.loans[subId] = gid;
      const homeNew = DATA.players.find(p=>p.id===subId);
      if(homeNew && homeNew.groupId !== gid) groupsToRefresh.add(homeNew.groupId);
    }
  } else {
    delete gd.substitutes[absentId];
  }

  groupsToRefresh.forEach(gId2=>regenerateGroupMatches(open, gId2));
  saveAndRender();
}
function onSubSelect(gid, absentId, value){
  if(value === '__guest__'){
    showPrompt("Nom du remplaçant invité (ne fait pas partie de la ligue) :", '', (name)=>{
      if(name && name.trim()){ setSubstitute(gid, absentId, 'guest::' + encodeURIComponent(name.trim())); }
      else { render(); }
    });
  } else {
    setSubstitute(gid, absentId, value);
  }
}

function groupBelow(gid){
  const sorted = groupsSorted();
  const idx = sorted.findIndex(g=>g.id===gid);
  return idx>=0 && idx<sorted.length-1 ? sorted[idx+1].id : null;
}

function finalizeSession(session){
  // Photo de l'état des groupes AVANT la clôture : permet de rouvrir la session
  // et de tout remettre exactement comme avant (groupes + ordre).
  session.preSnapshot = (DATA.players||[]).map(p=>({ id:p.id, groupId:p.groupId, order:p.order }));
  const movements = []; // {playerId, fromGroupId, toGroupId, reason?}
  const sorted = groupsSorted();
  const standingsByGroup = {};
  session.groupsData.forEach(gd=>{
    standingsByGroup[gd.groupId] = computeStandings(activeRosterForGroup(session, gd.groupId), gd.matches);
  });
  session.standingsByGroup = standingsByGroup;

  // Les montées/descentes automatiques ne s'appliquent qu'en format Échelle.
  // En Poules fixes ou Division unique, les groupes ne bougent jamais.
  const isLadderFormat = DATA.leagueFormat !== 'pools' && DATA.leagueFormat !== 'single' && DATA.leagueFormat !== 'social';
  if(isLadderFormat){
    // Nombre d'absents (sans prêt) par groupe d'origine : chacun descend
    // automatiquement plus bas, donc ça compte déjà comme une place qui se
    // libère — pas besoin de faire descendre quelqu'un d'autre en plus pour ça.
    const absentNoLoanByGroup = {};
    (session.absences || []).forEach(pid=>{
      if(session.loans && session.loans[pid]) return;
      const pl = DATA.players.find(p=>p.id===pid);
      if(!pl) return;
      absentNoLoanByGroup[pl.groupId] = (absentNoLoanByGroup[pl.groupId] || 0) + 1;
    });

    // Un même joueur ne doit jamais être à la fois monté et descendu : un
    // groupe intermédiaire agit tour à tour comme groupe "inférieur" (paire
    // précédente) puis "supérieur" (paire suivante) dans cette boucle, avec
    // le même classement des deux côtés — sans ce filtre, un joueur du haut
    // de ce groupe déjà monté vers le groupe au-dessus pouvait aussi être
    // repris parmi les descendants vers le groupe en-dessous (et inversement),
    // et le dernier mouvement appliqué écrasait silencieusement le premier.
    const movedPlayerIds = new Set();
    for(let i=0;i<sorted.length-1;i++){
      const upper = sorted[i];   // meilleur groupe (order plus petit)
      const lower = sorted[i+1];
      // Les remplaçants réguliers (joueurs prêtés) suivent les règles normales du
      // groupe où ils ont joué. Seuls les invités hors ligue ne sont jamais éligibles.
      const upperStand = (standingsByGroup[upper.id] || []).filter(r=> !isGuestOrSubId(r.playerId) && !movedPlayerIds.has(r.playerId));
      const lowerStand = (standingsByGroup[lower.id] || []).filter(r=> !isGuestOrSubId(r.playerId) && !movedPlayerIds.has(r.playerId));
      const nUp = Math.min(DATA.swapCount, upperStand.length, lowerStand.length);
      const absentFromUpper = absentNoLoanByGroup[upper.id] || 0;
      const nDown = Math.max(0, Math.min(DATA.swapCount, upperStand.length, lowerStand.length) - absentFromUpper);
      for(let k=0;k<nUp;k++){
        const goingUp = lowerStand[k];          // top du groupe inférieur
        if(goingUp){ movements.push({ playerId: goingUp.playerId, fromGroupId: lower.id, toGroupId: upper.id }); movedPlayerIds.add(goingUp.playerId); }
      }
      for(let k=0;k<nDown;k++){
        const goingDown = upperStand[upperStand.length-1-k]; // bas du groupe supérieur
        if(goingDown){ movements.push({ playerId: goingDown.playerId, fromGroupId: upper.id, toGroupId: lower.id }); movedPlayerIds.add(goingDown.playerId); }
      }
    }
    movements.forEach(m=>{
      const pl = DATA.players.find(p=>p.id===m.playerId);
      if(pl) pl.groupId = m.toGroupId;
    });

    // Un joueur absent qui n'a pas été prêté ailleurs (donc n'a joué nulle part
    // cette session) descend automatiquement d'un groupe pour la session suivante.
    (session.absences || []).forEach(pid=>{
      if(session.loans && session.loans[pid]) return; // il jouait ailleurs comme remplaçant : pas pénalisé
      const pl = DATA.players.find(p=>p.id===pid);
      if(!pl) return;
      const fromGroupId = pl.groupId;
      const below = groupBelow(fromGroupId);
      if(below){
        movements.push({ playerId: pid, fromGroupId, toGroupId: below, reason:'absence' });
        pl.groupId = below;
      }
    });
  }

  applyRatingUpdates(session);
  reorderGroupsAfterMovements(standingsByGroup, movements);

  session.movements = movements;
  session.status = 'closed';
}

// Réordonne automatiquement chaque groupe après une session, selon la
// provenance des joueurs :
// 1) arrivées du groupe au-dessus (relégués), dans l'ordre de leur ancien
//    classement (ex: 4e puis 5e du groupe au-dessus)
// 2) joueurs restés dans le même groupe, dans leur ordre de classement précédent
// 3) arrivées du groupe en dessous (promus), dans l'ordre de leur ancien
//    classement (ex: 1er puis 2e du groupe en dessous)
// 4) descentes automatiques pour absence, à la fin
function reorderGroupsAfterMovements(standingsByGroup, movements){
  const rankOf = (playerId, groupId)=>{
    const rows = standingsByGroup[groupId];
    if(!rows) return 999;
    const idx = rows.findIndex(r=>r.playerId===playerId);
    return idx===-1 ? 999 : idx;
  };
  groupsSorted().forEach(g=>{
    const relegatedIn = [], promotedIn = [], absenceIn = [];
    movements.forEach(m=>{
      if(m.toGroupId !== g.id) return;
      if(m.reason === 'absence'){ absenceIn.push(m); return; }
      const fromG = groupById(m.fromGroupId);
      if(fromG && fromG.order < g.order) relegatedIn.push(m); // venait d'un groupe plus fort
      else promotedIn.push(m); // venait d'un groupe plus faible
    });
    relegatedIn.sort((a,b)=> rankOf(a.playerId,a.fromGroupId) - rankOf(b.playerId,b.fromGroupId));
    promotedIn.sort((a,b)=> rankOf(a.playerId,a.fromGroupId) - rankOf(b.playerId,b.fromGroupId));
    const movedIds = new Set([...relegatedIn, ...promotedIn, ...absenceIn].map(m=>m.playerId));
    const currentMembers = playersInGroup(g.id);
    const stayed = currentMembers.filter(p=> !movedIds.has(p.id) && standingsByGroup[g.id] && standingsByGroup[g.id].some(r=>r.playerId===p.id));
    stayed.sort((a,b)=> rankOf(a.id,g.id) - rankOf(b.id,g.id));
    const accounted = new Set([...stayed.map(p=>p.id), ...movedIds]);
    const others = currentMembers.filter(p=>!accounted.has(p.id)); // n'a jamais joué / cas particulier : en fin de liste
    const finalOrder = [
      ...relegatedIn.map(m=>m.playerId),
      ...stayed.map(p=>p.id),
      ...promotedIn.map(m=>m.playerId),
      ...absenceIn.map(m=>m.playerId),
      ...others.map(p=>p.id)
    ];
    finalOrder.forEach((pid,i)=>{
      const p = DATA.players.find(x=>x.id===pid);
      if(p) p.order = i+1;
    });
  });
}

// ---------- cote évolutive (ELO adapté au double, échelle ~3.5-5.0) ----------
const RATING_DEFAULT = 4.0;
const RATING_MIN = 2.0;
const RATING_MAX = 8.0;
// Cote v2 : on compare la PART DES POINTS attendue (selon l'écart de cote entre
// les équipes) à la part des points réellement gagnée. Un écart de 1,0 ≈ 76 %
// des points (≈ victoire 9-3) ; 0,5 ≈ 64 % (≈ 9-5). Paramètres choisis par
// simulation (voir classeur « simulation-cote »).
const RATING_SCALE = 2;
const RATING_K_START = 0.2;  // vitesse d'un nouveau joueur
const RATING_K_MIN = 0.05;   // vitesse d'un joueur établi
const RATING_K_TAU = 30;     // matchs joués pour que le K baisse d'environ 63 %
// Un remplaçant régulier (bassin) accumule maintenant lui aussi une cote,
// comme un joueur régulier — seul un invité anonyme (guest::) reste hors
// système. On cherche donc dans les deux listes selon l'id.
function findRatablePerson(pid){
  // Un remplaçant du bassin est référencé dans les équipes sous la forme
  // "sub::<id>" (voir groupAbsenceManagementHTML) — il faut retirer ce
  // préfixe avant de chercher dans substitutePool, sinon la recherche
  // échoue toujours et sa cote ne se met jamais à jour. Mais un remplaçant
  // peut aussi être référencé directement par son id réel (sans préfixe),
  // par exemple depuis son propre popup (bouton "Modifier la cote") — dans
  // ce cas il faut chercher dans substitutePool aussi, pas seulement players,
  // sinon le bouton ne fait rien silencieusement.
  if(isSubPoolId(pid)) pid = pid.slice(5);
  return DATA.players.find(x=>x.id===pid) || (DATA.substitutePool||[]).find(x=>x.id===pid);
}
function ratingOf(pid){
  const p = findRatablePerson(pid);
  return (p && typeof p.rating === 'number') ? p.rating : RATING_DEFAULT;
}
function ratingGamesOf(pid){
  const p = findRatablePerson(pid);
  return (p && typeof p.ratingGames === 'number') ? p.ratingGames : 0;
}
// Facteur K : grand pour un joueur avec peu de matchs (cote encore
// incertaine), puis il se stabilise. Compté en MATCHS joués.
function kFactorFor(matchesPlayed){
  return RATING_K_MIN + (RATING_K_START - RATING_K_MIN) * Math.exp(-matchesPlayed / RATING_K_TAU);
}
// Applique les ajustements de cote pour tous les matchs joués (avec score)
// de la session, tous groupes confondus. Les invités (hors ligue) n'ont pas
// de cote persistante : ils ne gagnent/perdent rien, mais comptent quand
// même comme adversaires réels pour leurs adversaires réguliers.
function applyRatingUpdates(session){
  const snapshot = {}; // cote au début de la session, pour ne pas biaiser selon l'ordre des matchs
  const deltas = {};   // cumul des ajustements par joueur
  const gamesSnapshot = {};
  const gamesStart = {};
  function getSnapshotRating(pid){
    // Un invité anonyme (guest::) reste hors cote ; un remplaçant (sub::) a sa
    // propre cote et compte dans la force d'équipe.
    if(isGuestId(pid)) return null;
    if(!(pid in snapshot)) snapshot[pid] = ratingOf(pid);
    return snapshot[pid];
  }
  function getSnapshotGames(pid){
    if(!(pid in gamesSnapshot)){ gamesSnapshot[pid] = ratingGamesOf(pid); gamesStart[pid] = gamesSnapshot[pid]; }
    return gamesSnapshot[pid];
  }
  (session.groupsData || []).forEach(gd=>{
    (gd.matches || []).forEach(m=>{
      if(m.scoreA === null || m.scoreB === null || m.scoreA === '' || m.scoreB === '') return;
      const sa = Number(m.scoreA), sb = Number(m.scoreB);
      if(sa === sb || !(sa + sb > 0)) return;
      const teamARatings = m.teamA.map(getSnapshotRating).filter(r=>r!==null);
      const teamBRatings = m.teamB.map(getSnapshotRating).filter(r=>r!==null);
      if(teamARatings.length===0 || teamBRatings.length===0) return; // deux équipes d'invités : rien à ajuster
      const teamA = teamARatings.reduce((a,b)=>a+b,0) / teamARatings.length;
      const teamB = teamBRatings.reduce((a,b)=>a+b,0) / teamBRatings.length;
      // Part des points attendue pour l'équipe A, selon l'écart de cote.
      const expectedA = 1 / (1 + Math.pow(10, (teamB - teamA) / RATING_SCALE));
      // Part des points réellement gagnée : une victoire écrasante pèse plus
      // qu'une victoire serrée, et une défaite serrée coûte moins qu'une raclée.
      const actualA = sa / (sa + sb);
      m.teamA.forEach(pid=>{
        if(isGuestId(pid)) return;
        const k = kFactorFor(getSnapshotGames(pid));
        deltas[pid] = (deltas[pid] || 0) + k * (actualA - expectedA);
        gamesSnapshot[pid] = getSnapshotGames(pid) + 1;
      });
      m.teamB.forEach(pid=>{
        if(isGuestId(pid)) return;
        const k = kFactorFor(getSnapshotGames(pid));
        deltas[pid] = (deltas[pid] || 0) + k * ((1-actualA) - (1-expectedA));
        gamesSnapshot[pid] = getSnapshotGames(pid) + 1;
      });
    });
  });
  session.ratingDeltas = {};      // pour pouvoir annuler l'effet de cette session plus tard
  session.ratingGamesDeltas = {}; // matchs comptés par joueur (pour l'annulation)
  Object.keys(deltas).forEach(pid=>{
    const p = findRatablePerson(pid); // joueur régulier OU remplaçant du bassin
    if(!p) return;
    const before = ratingOf(pid);
    const applied = Math.round(deltas[pid] * 1000) / 1000;
    const played = Math.max(1, gamesSnapshot[pid] - (gamesStart[pid] || 0));
    p.rating = Math.round((before + applied) * 1000) / 1000;
    p.ratingGames = ratingGamesOf(pid) + played;
    session.ratingDeltas[pid] = applied;
    session.ratingGamesDeltas[pid] = played;
  });
}
// ---- Recalcul de toutes les cotes avec la formule v2, depuis l'historique ----
function ratingKey(pid){ return isSubPoolId(pid) ? pid.slice(5) : pid; }
function recalcAllRatings(){
  const closed = DATA.sessions.filter(x=>x.status==='closed' && Array.isArray(x.groupsData));
  if(!closed.length){ showAlert("Aucune session terminée à rejouer."); return; }
  showConfirm("Recalculer la cote de tous les joueurs avec la nouvelle formule ?\n\n• " + closed.length + " session(s) terminée(s) seront rejouées dans l'ordre.\n• Le point de départ de chaque joueur est sa cote avant sa première session.\n• Une copie de tes cotes actuelles est gardée : tu pourras revenir en arrière.", doRecalcAllRatings);
}
function doRecalcAllRatings(){
  const closed = DATA.sessions.filter(x=>x.status==='closed' && Array.isArray(x.groupsData))
    .slice().sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')));
  const people = (DATA.players||[]).concat(DATA.substitutePool||[]);
  // copie de sécurité
  const backup = { at:new Date().toISOString(), people:{}, sessions:{} };
  people.forEach(pl=>{ backup.people[pl.id] = { rating: pl.rating, ratingGames: pl.ratingGames }; });
  closed.forEach(x=>{ backup.sessions[x.id] = { ratingDeltas: x.ratingDeltas ? Object.assign({}, x.ratingDeltas) : null, ratingGamesDeltas: x.ratingGamesDeltas ? Object.assign({}, x.ratingGamesDeltas) : null }; });
  // point de départ de chaque joueur : cote actuelle moins ce que ces sessions lui ont apporté
  const sum = {}, cnt = {};
  closed.forEach(x=>Object.keys(x.ratingDeltas||{}).forEach(pid=>{ const k = ratingKey(pid); sum[k] = (sum[k]||0) + x.ratingDeltas[pid]; cnt[k] = (cnt[k]||0) + ((x.ratingGamesDeltas && typeof x.ratingGamesDeltas[pid]==='number') ? 0 : 1); }));
  const before = {};
  people.forEach(pl=>{
    const cur = typeof pl.rating==='number' ? pl.rating : RATING_DEFAULT;
    before[pl.id] = cur;
    pl.rating = Math.round((cur - (sum[pl.id]||0)) * 1000) / 1000;
    const prevGames = typeof pl.ratingGames==='number' ? pl.ratingGames : 0;
    pl.ratingGames = Math.max(0, prevGames - (cnt[pl.id]||0));
    // sessions déjà converties (ratingGamesDeltas) : on retire aussi leurs matchs
    closed.forEach(x=>{ if(x.ratingGamesDeltas){ Object.keys(x.ratingGamesDeltas).forEach(pid=>{ if(ratingKey(pid)===pl.id) pl.ratingGames = Math.max(0, pl.ratingGames - x.ratingGamesDeltas[pid]); }); } });
  });
  closed.forEach(x=>{ delete x.ratingDeltas; delete x.ratingGamesDeltas; applyRatingUpdates(x); });
  DATA.ratingBackup = backup;
  DATA.ratingModel = 2;
  DATA.ratingRecalcAt = new Date().toISOString();
  const diffs = people.map(pl=>({ name:pl.name, before:before[pl.id], after:pl.rating })).filter(d=>Math.abs(d.after-d.before)>=0.005);
  diffs.sort((a,b)=>Math.abs(b.after-b.before)-Math.abs(a.after-a.before));
  const top = diffs.slice(0,6).map(d=>`• ${d.name} : ${d.before.toFixed(2)} → ${d.after.toFixed(2)}`).join('\n');
  saveAndRender();
  showAlert("Cotes recalculées (" + closed.length + " session(s) rejouées, " + diffs.length + " joueur(s) modifié(s))." + (top ? "\n\nPlus gros changements :\n" + top : ""));
}
function restoreRatingBackup(){
  const b = DATA.ratingBackup;
  if(!b){ showAlert("Aucune copie à restaurer."); return; }
  showConfirm("Revenir aux cotes d'avant le recalcul ?", ()=>{
    const people = (DATA.players||[]).concat(DATA.substitutePool||[]);
    people.forEach(pl=>{ const o = b.people[pl.id]; if(o){ pl.rating = o.rating; pl.ratingGames = o.ratingGames; } });
    DATA.sessions.forEach(x=>{
      const o = b.sessions[x.id];
      if(!o) return;
      if(o.ratingDeltas) x.ratingDeltas = o.ratingDeltas; else delete x.ratingDeltas;
      if(o.ratingGamesDeltas) x.ratingGamesDeltas = o.ratingGamesDeltas; else delete x.ratingGamesDeltas;
    });
    delete DATA.ratingBackup; delete DATA.ratingModel; delete DATA.ratingRecalcAt;
    saveAndRender();
  });
}

let NAV_SENTINEL = false, NAV_SKIP_POP = false, NAV_LAST_DEPTH = 0;
function afterRenderNav(){
  const d = navDepth();
  if(d !== NAV_LAST_DEPTH){
    // Glisse depuis la droite en avançant, depuis la gauche en reculant.
    const el = document.getElementById('orgTabContent') || document.getElementById('tabContent');
    if(el){ el.classList.remove('nav-fwd', 'nav-back'); void el.offsetWidth; el.classList.add(d > NAV_LAST_DEPTH ? 'nav-fwd' : 'nav-back'); }
    NAV_LAST_DEPTH = d;
  }
  // Une entrée d'historique « sentinelle » tant qu'on peut revenir : le retour du système (geste
  // de Safari, bouton d'Android) la consomme et déclenche navBack au lieu de quitter l'application.
  try{
    if(navCanGoBack() && !NAV_SENTINEL){ history.pushState({ dinkeoNav: 1 }, ''); NAV_SENTINEL = true; }
    else if(!navCanGoBack() && NAV_SENTINEL){ NAV_SENTINEL = false; NAV_SKIP_POP = true; history.back(); }

// Glisser vers la droite revient en arrière, comme dans les applications iPhone/iPad : depuis le bord
// gauche, ou n'importe où d'un geste net. Si Safari s'empare du geste de bord, il annule le nôtre
// (touchcancel) et c'est la sentinelle d'historique qui fait le retour, une seule fois.
(function(){
  let sx = 0, sy = 0, dx = 0, maxDy = 0, edge = false, tracking = false;
  // Champ de saisie ou zone qui défile à l'horizontale : le glissement lui appartient.
  const inHScroller = function(el){
    for(; el && el !== document.body; el = el.parentElement){
      if(el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT') return true;
      if(el.scrollWidth > el.clientWidth + 4){ const ox = getComputedStyle(el).overflowX; if(ox === 'auto' || ox === 'scroll') return true; }
    }
    return false;
  };
  const target = function(){ const m = document.querySelector('#modalRoot > *'); return m || app; };
  const reset = function(){ const t = target(); if(t){ t.style.transition = 'transform .18s ease-out'; t.style.transform = ''; } };
  document.addEventListener('touchstart', function(e){
    tracking = false;
    if(!e.touches || e.touches.length !== 1 || !navCanGoBack()) return;
    const t = e.touches[0];
    edge = t.clientX <= 40;
    if(!edge && inHScroller(e.target)) return;
    sx = t.clientX; sy = t.clientY; dx = 0; maxDy = 0; tracking = true;
  }, { passive:true });
  document.addEventListener('touchmove', function(e){
    if(!tracking) return;
    const t = e.touches[0];
    dx = t.clientX - sx;
    const dy = Math.abs(t.clientY - sy);
    if(dy > maxDy) maxDy = dy;
    if(dy > 40 && dy > dx){ tracking = false; reset(); return; } // geste vertical : c'est un défilement
    const el = target();
    if(el && dx > 0){ el.style.transition = 'none'; el.style.transform = 'translateX(' + Math.min(dx, 160) * 0.5 + 'px)'; }
  }, { passive:true });
  const end = function(){
    if(!tracking) return;
    tracking = false;
    reset();
    // Depuis le bord : 60 px suffisent. Ailleurs : glissement net vers la droite, peu vertical.
    if(edge ? dx > 60 : (dx > 90 && dx > 2.5 * maxDy)) navBack();
  };
  document.addEventListener('touchend', end);
  document.addEventListener('touchcancel', function(){ tracking = false; reset(); });
})();

// ---- Zones de texte : hauteur automatique + compteur de caractères ----
function enhanceTextarea(t){
  if(!t || t.tagName!=='TEXTAREA' || t.closest('.chat-composer')) return;
  t.style.height = 'auto';
  t.style.height = Math.min(Math.max(t.scrollHeight, 48), 240) + 'px';
  const max = parseInt(t.getAttribute('maxlength'),10);
  if(max){
    let c = t.nextElementSibling;
    if(!c || !c.classList.contains('ta-counter')){
      c = document.createElement('div'); c.className = 'ta-counter';
      t.insertAdjacentElement('afterend', c);
    }
    c.textContent = t.value.length + ' / ' + max;
    c.classList.toggle('warn', t.value.length > max*0.9);
  }
}
document.addEventListener('input', e=>{ if(e.target && e.target.tagName==='TEXTAREA') enhanceTextarea(e.target); });
document.addEventListener('focusin', e=>{ if(e.target && e.target.tagName==='TEXTAREA') enhanceTextarea(e.target); });
// ---- Touche Entrée = valider : dans un champ de saisie, Entrée clique sur le bouton
// principal du même bloc (Enregistrer, Publier, Ajouter…) s'il n'y en a qu'un seul.
// Dans une zone de texte multiligne, c'est Ctrl/Cmd + Entrée (Entrée = nouvelle ligne). ----
document.addEventListener('keydown', e=>{
  if(e.key!=='Enter' || e.isComposing || e.shiftKey || e.altKey) return;
  const t = e.target;
  if(!t || !t.tagName) return;
  const isInput = t.tagName==='INPUT' && ['text','email','number','password','tel','url'].includes((t.getAttribute('type')||'text').toLowerCase());
  const isArea = t.tagName==='TEXTAREA';
  if(!isInput && !isArea) return;
  if(isArea && !(e.ctrlKey || e.metaKey)) return;
  if(isArea && t.closest('.chat-composer')) return; // le chat a sa propre logique
  if(t.hasAttribute('data-noenter') || t.classList.contains('orgpick-search')) return;
  let node = t.parentElement;
  while(node && node!==document.body){
    const btns = Array.from(node.querySelectorAll('button.btn-primary')).filter(b=>!b.disabled && b.offsetParent!==null);
    if(btns.length){
      if(btns.length===1){ e.preventDefault(); btns[0].click(); }
      return;
    }
    node = node.parentElement;
  }
});

// ===== Heures (sessions, annonces) =====
// Extrait une heure d'une étiquette libre du genre « Mardi 19h », « Lundi 19h30 » ou « 19:30 ».
function parseTimeFromLabel(label){
  const m = String(label||'').match(/(\d{1,2})\s*(?:h|:)\s*(\d{2})?/i);
  if(!m) return null;
  const h = parseInt(m[1],10), mn = m[2] ? parseInt(m[2],10) : 0;
  if(h<0 || h>23 || mn<0 || mn>59) return null;
  return String(h).padStart(2,'0')+':'+String(mn).padStart(2,'0');
}
function fmtHM(t){ // '19:00' -> '19h00'
  if(!t) return '';
  const [h,m] = String(t).slice(0,5).split(':');
  return `${parseInt(h,10)}h${m||'00'}`;
}
function addMinutesHM(t, mins){
  const [h,m] = String(t).slice(0,5).split(':').map(Number);
  const tot = (h*60+m+mins) % 1440;
  return String(Math.floor(tot/60)).padStart(2,'0')+':'+String(tot%60).padStart(2,'0');
}
// Heure de début + durée d'une ligue : réglage explicite, sinon déduite de l'étiquette « Jour et heure ».
function leagueTimeOf(L){
  const lg = (LEAGUES||[]).find(x=>x.id===(L&&L.id));
  const start = (L && L.playTime) || parseTimeFromLabel(L && L.scheduleLabel) || parseTimeFromLabel(lg && lg.schedule_label) || null;
  const dur = (L && L.sessionDurationMin) || 120;
  return { start, dur };
}
function leagueTimeRangeLabel(L){
  const t = leagueTimeOf(L);
  return t.start ? `${fmtHM(t.start)} – ${fmtHM(addMinutesHM(t.start, t.dur))}` : '';
}

function calItemsFor(){
  const map = {};
  const add=(d,it)=>{ if(!d) return; (map[d]=map[d]||[]).push(it); };
  const today = fmtDate(new Date());
  const lgs = calLeaguesList();
  lgs.forEach(L=>{
  const real = new Set();
  (L.sessions||[]).forEach(x=>{ real.add(x.date); add(x.date,{t:'session', status:x.status, lg:L.name, lgId:L.id, L}); });
  const blocked = new Set(L.blockedDates||[]);
  blocked.forEach(d=>add(d,{t:'blocked', lg:L.name, lgId:L.id}));
  const dow = L.playDayOfWeek;
  if(typeof dow==='number'){
    const a = L.seasonStartDate, b = L.seasonEndDate;
    const start = new Date(Math.max(new Date(today+'T00:00:00'), a ? new Date(a+'T00:00:00') : 0));
    const horizon = new Date(today+'T00:00:00'); horizon.setMonth(horizon.getMonth()+3); // fenêtre de 3 mois
    const end = (b && new Date(b+'T00:00:00') < horizon) ? new Date(b+'T00:00:00') : horizon;
    for(let d=new Date(start); d<=end; d.setDate(d.getDate()+1)){
      if(d.getDay()!==dow) continue;
      const f = fmtDate(d);
      if(!real.has(f) && !blocked.has(f)) add(f,{t:'planned', lg:L.name, lgId:L.id, L});
    }
  }
  });
  (PARTNER_POSTS||[]).forEach(p=>{ if(p.play_date && p.status!=='closed') add(p.play_date,{t:'partner', p}); });
  (SOCIAL_EVENTS||[]).forEach(e=>add(e.event_date,{t:'event', e}));
  return map;
}

// Vérification de sécurité : calcule l'empreinte SHA-256 de la bibliothèque Supabase depuis deux CDN indépendants.
async function _sha256Hex(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>('0'+b.toString(16)).slice(-2)).join('');
}
async function showLibHashes(){
  showContentModal('Empreinte de la bibliothèque', '<p class="small">Calcul en cours…</p>');
  const urls = (window.__sbUrls || []).slice(0,3);
  const rows = [];
  for(const u of urls){
    try{
      const r = await fetch(u); if(!r.ok) throw new Error('HTTP '+r.status);
      const t = await r.text();
      rows.push({ u, n:t.length, h: await _sha256Hex(t) });
    }catch(e){ rows.push({ u, err: String(e && e.message || e) }); }
  }
  let cached = null;
  try{ const c = localStorage.getItem('dk_sb_lib_v1'); if(c) cached = { n:c.length, h: await _sha256Hex(c) }; }catch(e){}
  const ok = rows.filter(r=>r.h);
  const same = ok.length>=2 && ok[0].h===ok[1].h;
  const html = rows.map(r=>`<div style="margin-bottom:12px;"><div class="small" style="color:var(--muted);word-break:break-all;">${escapeHTML(r.u)}</div>${r.err ? `<div class="small" style="color:var(--danger);">Échec : ${escapeHTML(r.err)}</div>` : `<div class="small">${r.n} caractères</div><div style="font-family:monospace;font-size:12px;word-break:break-all;user-select:all;">${r.h}</div>`}</div>`).join('')
    + (cached ? `<div style="margin-bottom:12px;"><div class="small" style="color:var(--muted);">Copie gardée dans l'appareil</div><div class="small">${cached.n} caractères</div><div style="font-family:monospace;font-size:12px;word-break:break-all;user-select:all;">${cached.h}</div></div>` : '')
    + `<p class="small" style="margin-top:8px;">${cached && cached.h===window.__SB_SHA256 ? '✅ La copie gardée correspond à l\'empreinte attendue.' : (cached ? '⚠️ La copie gardée ne correspond PAS à l\'empreinte attendue.' : 'Aucune copie gardée.')}</p>`
    + `<button class="btn btn-secondary" style="width:100%;margin:6px 0;" onclick="testSriLoad(this)">Tester le chargement sécurisé</button><div id="sriRes" class="small"></div>`
    + `<p class="small" style="margin-top:8px;">${same ? '✅ Les deux sources donnent la même empreinte.' : '⚠️ Les deux sources ne donnent pas la même empreinte (ou une n\'a pas répondu).'}</p>`;
  showContentModal('Empreinte de la bibliothèque', html);
}
function testSriLoad(btn){
  const out = document.getElementById('sriRes'); if(out) out.textContent = 'Test en cours…';
  const old = window.supabase;
  const sc = document.createElement('script');
  sc.src = (window.__sbUrls||[])[0];
  sc.crossOrigin = 'anonymous';
  sc.integrity = 'sha256-hZaWX+kY5lZgChtWjToWj1wNPSKmAIhrtvRKZVXbAec=';
  sc.onload = ()=>{ window.supabase = old; sc.remove(); if(out) out.textContent = '✅ Chargement sécurisé réussi (le navigateur a accepté la bibliothèque).'; };
  sc.onerror = ()=>{ window.supabase = old; sc.remove(); if(out) out.textContent = '❌ Le navigateur a refusé la bibliothèque (ou le réseau a échoué).'; };
  document.head.appendChild(sc);
}

async function onAuthResolved(user){
  if(!user){ SESSION_USER = null; CURRENT_PROFILE = null; render(); if(PENDING_CODE && !MODAL) openLoginModal('signup'); return; }

  let { data: profile, error } = await sb.from('profiles').select('*').eq('id', user.id).single();
  if(!error && profile && PENDING_CODE){
    // Invitation reçue par lien : on l'applique une seule fois, puis on recharge le profil.
    const code = PENDING_CODE; PENDING_CODE = null;
    try{ localStorage.removeItem('dinkeo_pending_code'); }catch(e){}
    try{
      const r = await sb.rpc('redeem_invitation', { p_code: code });
      let msg = null;
      if(r && r.data){
        if(r.data.ok && r.data.pending) notifyAdminsJoinRequest(r.data.league_id, null, 'join');
        if(r.data.ok) msg = r.data.pending ? "Demande envoyée ✅ Un administrateur doit l'approuver. Tu seras averti(e) dès que ce sera fait." : "Invitation acceptée ✅ Bienvenue dans la ligue !";
        else msg = r.data.error || null;
      } else if(r && r.error){ msg = "Invitation : " + r.error.message; }
      const again = await sb.from('profiles').select('*').eq('id', user.id).single();
      if(again && again.data) profile = again.data;
      if(msg) setTimeout(function(){ showAlert(msg); }, 400);
    }catch(e){ console.error('invitation par lien', e); }
  }
  if(error || !profile){
    SESSION_USER = { role:'pending', email: user.email, displayName: user.user_metadata && user.user_metadata.display_name };
    CURRENT_PROFILE = null;
    render();
    return;
  }
  CURRENT_PROFILE = profile;
  // Liaison automatique : un joueur/remplaçant enregistré avec le courriel (confirmé) de ce compte,
  // et pas encore relié, est relié tout de suite — sans passer par « À approuver ».
  try{
    const al = await sb.rpc('auto_link_by_email');
    if(al && al.data && al.data.linked > 0){
      const names = (al.data.leagues || []).join(', ');
      setTimeout(function(){ showAlert('Ton compte a été relié automatiquement à ' + (al.data.linked > 1 ? 'tes ligues' : 'ta ligue') + (names ? ' : ' + names : '') + ' ✅'); }, 400);
    }
  }catch(e){ console.error('liaison automatique', e); }

  if(profile.role === 'admin'){
    SESSION_USER = { role:'admin', email: profile.email };
    await loadMyOrganizations(profile.id);
    if(MY_ORGANIZATIONS.length === 0){
      // Un admin sans organisation (cas rare/legacy) : filet de sécurité.
      CURRENT_ORGANIZATION_ID = null;
      LEAGUES = [];
      CURRENT_LEAGUE_ID = null;
      DATA = defaultData();
      VIEW = { tab:'session' };
      render();
      return;
    }
    CURRENT_ORGANIZATION_ID = (CURRENT_ORGANIZATION_ID && MY_ORGANIZATIONS.some(o=>o.id===CURRENT_ORGANIZATION_ID)) ? CURRENT_ORGANIZATION_ID : MY_ORGANIZATIONS[0].id;
    await loadLeagues();
    await loadMyLeagueLinks(profile.id); // pour le sélecteur de ligue dans sa propre vue joueur
    const orgLeagues = myOrgLeagues();
    if(orgLeagues.length === 0){
      // Aucune ligue n'existe encore : l'admin devra en créer une.
      CURRENT_LEAGUE_ID = null;
      DATA = defaultData();
      VIEW = { tab:'session' };
      render();
      return;
    }
    const target = (CURRENT_LEAGUE_ID && orgLeagues.some(l=>l.id===CURRENT_LEAGUE_ID)) ? CURRENT_LEAGUE_ID : orgLeagues[0].id;
    await switchToLeague(target);
    return;
  }

  // Joueur ou remplaçant : on regarde dans quelle(s) ligue(s) ce compte est
  // lié — peu importe le rôle global du compte, chaque ligue est traitée
  // selon son propre type de lien (régulier ou remplaçant), pour qu'un
  // compte puisse être régulier dans une ligue et remplaçant dans une autre.
  CURRENT_ORGANIZATION_ID = null;
  await loadLeagues();
  await loadMyLeagueLinks(profile.id);
  if(MY_LEAGUE_LINKS.length === 0){
    SESSION_USER = { role:'pending', email: profile.email, displayName: profile.display_name };
    render();
    return;
  }
  const link = MY_LEAGUE_LINKS.find(l=>l.league_id===CURRENT_LEAGUE_ID) || MY_LEAGUE_LINKS[0];
  CURRENT_LEAGUE_ID = link.league_id;
  const loaded = await loadData(CURRENT_LEAGUE_ID);
  DATA = loaded || defaultData();
  migrateData();
  await loadPartnerPosts(CURRENT_LEAGUE_ID);
  await loadSocialEvents();
  setupRealtimeChannels();
  if(link.substitute_id){
    SESSION_USER = { role:'substitute', substituteId: link.substitute_id };
    VIEW = { tab:'dispo' };
  } else {
    SESSION_USER = { role:'player', playerId: link.player_id };
    VIEW = { tab:'classement' };
  }
  render();
}

// La personne pour qui on agit est choisie par ligue et mémorisée sur l'appareil.
function activePersonMap(){ try{ return JSON.parse(localStorage.getItem('dinkeo_active_person') || '{}') || {}; }catch(e){ return {}; } }
function pickActiveLinks(){
  const map = activePersonMap(), byLeague = {}, order = [];
  MY_LEAGUE_LINKS_ALL.forEach(function(l){
    if(!byLeague[l.league_id]){ byLeague[l.league_id] = []; order.push(l.league_id); }
    byLeague[l.league_id].push(l);
  });
  MY_LEAGUE_LINKS = order.map(function(id){
    const list = byLeague[id];
    return list.find(function(l){ return l.id === map[id]; }) || list.find(function(l){ return l.player_id; }) || list[0];
  });
}
function familyLinksFor(leagueId){ return MY_LEAGUE_LINKS_ALL.filter(function(l){ return l.league_id === leagueId; }); }
function linkPersonName(l){
  const id = l.player_id || l.substitute_id;

async function inviteForEntry(id, kind, renew, leagueId){
  leagueId = leagueId || CURRENT_LEAGUE_ID;
  const { data, error } = await sb.rpc('create_invitation', {
    p_league_id: leagueId,
    p_player_id: kind==='p' ? id : null,

    p_renew: !!renew
  });

  markInvited(leagueId, kind, id);
  const code = data && data.code ? String(data.code) : '';
  const exp = data && data.expires_at ? new Date(data.expires_at).toLocaleDateString('fr-CA', { day:'numeric', month:'long' }) : '';
  const url = window.location.origin + window.location.pathname;
  showContentModal("Invitation", `
    <p class="small">Envoie ce code <strong>seulement à cette personne</strong>. Il ne fonctionne qu'une fois${exp ? ' et expire le ' + escapeHTML(exp) : ''}.</p>
    <div style="font-family:Oswald,sans-serif;font-size:34px;letter-spacing:3px;text-align:center;margin:16px 0;color:var(--ball);">${escapeHTML(code)}</div>
    <button class="btn btn-primary" onclick="copyInviteLink('${escapeHTML(code)}')">Copier le lien d'invitation</button>
    <p class="small" style="margin-top:12px;">Avec le lien, la personne crée son compte (ou se connecte) et l'invitation s'applique toute seule. Sinon, elle peut ouvrir <strong>${escapeHTML(url)}</strong> et entrer le code (« J'ai un code d'invitation »).</p>
    <button class="btn btn-secondary" style="margin-top:8px;" onclick="inviteForEntry('${id}','${kind}',true,'${leagueId}')">Générer un nouveau code (annule celui-ci)</button>`);
}
// Mémorise la date d'invitation sur la fiche (pour afficher « Invité » dans Membres).
const INVITE_DAYS = 14;
async function markInvited(leagueId, kind, id){
  const stamp = new Date().toISOString();
  const setOn = function(d){
    const list = kind==='s' ? (d.substitutePool||[]) : (d.players||[]);
    const x = list.find(function(y){ return y.id===id; });
    if(x) x.invitedAt = stamp;
    return !!x;
  };
  try{
    if(leagueId === CURRENT_LEAGUE_ID && DATA){ if(setOn(DATA)) saveData(); }
    else {
      const { data } = await sb.from('league_data').select('data').eq('league_id', leagueId).single();
      const d = data && data.data;
      if(d && setOn(d)) await sb.from('league_data').update({ data: d, updated_at: stamp }).eq('league_id', leagueId);
    }
    await loadOrgRoster();
  }catch(e){}
}
// Statut du compte d'un membre : actif, invité (code encore valide), invitation expirée, ou aucun.
function memberAccountStatus(e){
  if(e.profileId){
    // Compte familial : le même compte relié à plusieurs joueurs d'une même ligue.
    const mine = ALL_PROFILE_PLAYERS.filter(function(pp){ return pp.profile_id === e.profileId; });
    const shared = mine.length > new Set(mine.map(function(pp){ return pp.league_id; })).size;
    return { key:'actif', shared: shared, tag: shared ? '<span class="tag tag-up">Compte actif (partagé)</span>' : '<span class="tag tag-up">Compte actif</span>' };
  }
  const last = e.rows.reduce(function(m, r){ return (r.invitedAt && (!m || r.invitedAt > m)) ? r.invitedAt : m; }, null);
  if(last){
    const exp = new Date(new Date(last).getTime() + INVITE_DAYS*86400000);
    if(exp > new Date()) return { key:'invite', tag:'<span class="tag tag-yellow">Invité</span>', last: last, exp: exp };
    return { key:'expire', tag:'<span class="tag tag-orange">Invitation expirée</span>', last: last, exp: exp };
  }
  return { key:'aucun', tag:'<span class="tag">Aucun compte</span>' };
}
// Invite un membre depuis sa fiche : on utilise sa première place (joueur d'abord).
function inviteOrgMember(idx){
  const e = ORG_ROSTER_ENTRIES_CACHE[idx]; if(!e || !e.rows.length) return;
  const r = e.rows.filter(function(x){ return x.type==='joueur'; })[0] || e.rows[0];
  inviteForEntry(r.refId, r.type==='remplaçant' ? 's' : 'p', false, r.leagueId);
}

const ADMIN_CLASSIC_VIEW = false;
let ADMIN_SUMMARY = {}, ADMIN_SUMMARY_AT = 0, ADMIN_SUMMARY_LOADING = false;
let ADMIN_SUMMARY_TRIED = {}; // ligues déjà lues au moins une fois (même en erreur) : évite de relire en boucle
function summarizeAdminLeague(data, lg){
  const out = { leagueId: lg.id, name: lg.name, schedule: lg.schedule_label || '', mlp: !!(data && data.leagueFormat==='mlp'), rec: !!(data && isRecLeague(data)), players:0, unassigned:0, open:null };
  if(!data) return out;
  const players = data.players || [];
  out.players = players.length;
  const open = (data.sessions||[]).find(x=>x.status==='open');
  // Récréatif : les terrains sont tirés au démarrage, et un absent n'a pas de terrain — ce n'est pas un oubli.
  out.unassigned = (out.rec && !open) ? 0 : players.filter(p=>!p.groupId && !p.injured && !(out.rec && open.absences && open.absences.includes(p.id))).length;
  if(open){
    let total=0, done=0;
    (open.groupsData||[]).forEach(gd=>(gd.matches||[]).forEach(m=>{ total++; if(m.scoreA!=null && m.scoreB!=null && m.scoreA!=='' && m.scoreB!=='') done++; }));
    const absNames = (open.absences||[]).map(function(id){ const pl = players.find(function(x){ return x.id === id; }); return pl ? String(pl.name || '').split(' ')[0] : null; }).filter(Boolean);
    out.open = { date: open.date, published: !!open.published, total, done, absences: (open.absences||[]).length, absNames: absNames };
    if(out.rec){
      const courts = {};
      players.forEach(p=>{ if(p.groupId && !p.injured && !(open.absences||[]).includes(p.id)) courts[p.groupId] = 1; });
      out.open.courts = Object.keys(courts).length;
    }
  }
  out.playDay = typeof data.playDayOfWeek === 'number' ? data.playDayOfWeek : null;
  out.playTime = data.playTime || '';
  return out;
}
function adminSummaryFor(lg){
  if(lg.id === CURRENT_LEAGUE_ID) return summarizeAdminLeague(DATA, lg);

}
async function refreshAdminSummaries(force){
  if(ADMIN_SUMMARY_LOADING) return;
  const others = adminAllLeagues().filter(l=>l.id !== CURRENT_LEAGUE_ID);
  // Le délai de 45 s ne s'applique pas si une carte n'a encore aucun résumé.
  if(!force && Date.now() - ADMIN_SUMMARY_AT < 45000 && others.every(l=>ADMIN_SUMMARY[l.id] || ADMIN_SUMMARY_TRIED[l.id])) return;
  if(!others.length){ ADMIN_SUMMARY_AT = Date.now(); return; }
  ADMIN_SUMMARY_LOADING = true;
  try{
    await Promise.all(others.map(async lg=>{
      ADMIN_SUMMARY_TRIED[lg.id] = true;
      try{
        const { data, error } = await sb.from('league_data').select('data').eq('league_id', lg.id).single();
        if(error) return;
        ADMIN_SUMMARY[lg.id] = summarizeAdminLeague(data && data.data, lg);
      }catch(e){}
    }));
    ADMIN_SUMMARY_AT = Date.now();
  }finally{ ADMIN_SUMMARY_LOADING = false; }
  if(SESSION_USER && SESSION_USER.role==='admin' && !MODAL && !ADMIN_VIEWING_AS && !ADMIN_SHOWING_ORG && (VIEW.atab===undefined || VIEW.atab==='accueil' || VIEW.atab==='orgs') && !VIEW.adet) render();
}

function adminLeagueState(sum){
  if(!sum) return { label:'…', cls:'off', cta:'' };
  if(sum.mlp) return { label:'MLP', cls:'off', cta:'Ouvrir', ghost:true };
  const o = sum.open;
  const w = sum.rec ? 'soirée' : 'session';
  if(!o) return { label: sum.rec ? 'Aucune soirée' : 'Aucune session', cls:'off', cta:'Lancer la ' + w, ghost:true };
  if(!o.published) return { label:'Non publiée', cls:'wait', cta:'Publier la ' + w };
  if(sum.rec) return { label:'Publiée', cls:'on', cta:'Voir les terrains', ghost:true };
  if(o.total>0 && o.done===o.total) return { label:'À terminer', cls:'done', cta:'Terminer la session' };
  return { label:'En cours', cls:'on', cta:'Entrer les scores', ghost:true };
}

function normSearch(t){ return (t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim(); }
function uniqueNameQuiet(name, list){
  const taken = new Set((list||[]).map(x=>(x.name||'').trim().toLowerCase()));
  if(!taken.has(name.trim().toLowerCase())) return name.trim();
  let i = 2;
  while(taken.has((name.trim()+' ('+i+')').toLowerCase())) i++;
  return name.trim()+' ('+i+')';
}

async function confirmAddFromOrg(){
  const picked = Array.from(document.querySelectorAll('.orgpick-cb:checked')).map(el=>ORG_PICK_CANDIDATES[parseInt(el.value,10)]).filter(Boolean);
  const newNames = parseOrgPickNewNames();
  if(!picked.length && !newNames.length) return;
  const teamMode = ORG_PICK_TEAM;
  const type = teamMode ? 'joueur' : document.getElementById('orgPickType').value;
  const placeEl = document.getElementById('orgPickPlace');
  const fill = type==='joueur' && placeEl && placeEl.value==='fill';
  const btn = document.getElementById('orgPickBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Ajout en cours…'; }
  const sortedGroups = (DATA.groups||[]).slice().sort((a,b)=>a.order-b.order);
  const groupForNext = ()=>{
    if(!fill) return null;
    for(const g of sortedGroups){
      if(DATA.players.filter(p=>p.groupId===g.id).length < GROUP_MAX_PLAYERS()) return g.id;
    }
    return null;
  };
  const errors = [];
  // Nouveaux noms sans compte : on crée d'abord leur fiche « membre » de l'organisation.
  const all = picked.slice();
  for(const nm of newNames){
    const m = await createOrgMember(nm, null, null, null);
    if(m) all.push({ name:nm, orgMemberId:m.id, profileId:null, email:null, gender:null, rating:null });
  }
  // Comptes en attente sans fiche membre : on leur en crée une pour garder l'identité canonique.
  for(const c of all){
    if(!c.orgMemberId && c.profileId){
      const m = await createOrgMember(c.name, c.email, null, c.profileId);
      if(m) c.orgMemberId = m.id;
    }
  }
  const links = [];
  const addedIds = [];
  all.forEach(c=>{
    let obj;
    if(type==='remplacant'){
      DATA.substitutePool = DATA.substitutePool || [];
      obj = { id: uid('sub'), name: uniqueNameQuiet(c.name, DATA.substitutePool), rating: typeof c.rating==='number' ? c.rating : RATING_DEFAULT, ratingGames: 0 };
      DATA.substitutePool.push(obj);
    } else {
      const groupId = groupForNext();
      obj = { id: uid('p'), name: uniqueNameQuiet(c.name, DATA.players), groupId, rating: typeof c.rating==='number' ? c.rating : RATING_DEFAULT, ratingGames: 0, order: groupId ? nextOrderInGroup(groupId) : 0, status: 'new' };
      DATA.players.push(obj);
      addedIds.push(obj.id);
    }
    if(c.orgMemberId) obj.orgMemberId = c.orgMemberId;
    if(c.email) obj.email = c.email;
    if(c.gender) obj.gender = c.gender;
    if(c.profileId) links.push(type==='remplacant' ? { profile_id:c.profileId, league_id:CURRENT_LEAGUE_ID, substitute_id:obj.id } : { profile_id:c.profileId, league_id:CURRENT_LEAGUE_ID, player_id:obj.id });
  });
  if(teamMode){
    const tm = (DATA.mlpTeams||[]).find(t=>t.id===teamMode);
    if(tm){ addedIds.forEach(id=>{ if(tm.memberIds.length < (DATA.mlpRosterSize||4) && !tm.memberIds.includes(id)) tm.memberIds.push(id); }); }
  }
  await saveData();
  if(SAVE_ERROR) errors.push(SAVE_ERROR);
  if(links.length){
    const { error } = await sb.from('profile_players').insert(links);
    if(error) errors.push("Liaison des comptes : " + error.message);
  }
  try{ await Promise.all([loadAllProfiles(), loadAllProfilePlayers(), loadOrgRoster(), loadOrgMembers()]); }catch(e){}
  MODAL = null;
  ORG_PICK_TEAM = null; ORG_PICK_MAX = null;
  render();
  if(errors.length) showAlert("Ajout terminé avec des erreurs : " + errors.join(' / '));
  else if(teamMode) openMlpTeamRosterModal(teamMode);
  else showAlert(`✅ ${all.length} personne${all.length>1?'s ajoutées':' ajoutée'} à la ligue.`);
}
