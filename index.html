// ==================== TOURNOIS (Phase 2 — équipes + bracket) ====================
function mlpCompositionLabel(rosterSize){
  return rosterSize===3 ? '2 hommes + 1 femme' : '2 hommes + 2 femmes';
}
function mlpCompositionValid(counts, rosterSize){
  return rosterSize===3 ? (counts.m===2 && counts.f===1 && counts.other===0) : (counts.m===2 && counts.f===2 && counts.other===0);
}
// Calcule qui gagne un affrontement (peut être composé de plusieurs joutes,
// ex: meilleur de 3) à partir de ses joutes déjà jouées.
// ---- Format MLP (Major League Pickleball) : équipes mixtes fixes, 4 joutes
// genrées (double féminin, double masculin, 2 mixtes) + DreamBreaker (simple)
// en cas d'égalité 2-2. Variante 3 joueurs (2H+1F) : 3 joutes, pas de
// DreamBreaker possible (jamais d'égalité avec un nombre impair de joutes).
function mlpGameTypesForRosterSize(rosterSize){
  return rosterSize===3 ? ['mens','mixed1','mixed2'] : ['womens','mens','mixed1','mixed2'];
}
function newMLPGames(rosterSize){
  return mlpGameTypesForRosterSize(rosterSize).map(type=>({ type, scoreA:null, scoreB:null }));
}
function mlpGameTypeLabel(type){
  return { womens:'Double féminin', mens:'Double masculin', mixed1:'Mixte 1', mixed2:'Mixte 2', dreambreaker:'DreamBreaker (simple)' }[type] || type;
}
// Calcule le gagnant d'un affrontement MLP : majorité des joutes principales,
// ou DreamBreaker en cas d'égalité 2-2 (composition à 4 uniquement).
function computeMLPTieWinner(t, games, teamAId, teamBId){
  const rosterSize = t.mlpRosterSize || 4;
  const primaryTypes = mlpGameTypesForRosterSize(rosterSize);
  const primaryGames = (games||[]).filter(g=>primaryTypes.includes(g.type));
  let winsA=0, winsB=0;
  primaryGames.forEach(g=>{
    if(g.scoreA===null || g.scoreB===null || g.scoreA===g.scoreB) return;
    if(g.scoreA > g.scoreB) winsA++; else winsB++;
  });
  const total = primaryTypes.length;
  const majority = Math.floor(total/2) + 1;
  let winnerTeamId = null;
  let needsDreambreaker = false;
  if(winsA>=majority) winnerTeamId = teamAId;
  else if(winsB>=majority) winnerTeamId = teamBId;
  else if((winsA+winsB)===total && winsA===winsB){
    needsDreambreaker = true;
    const db = (games||[]).find(g=>g.type==='dreambreaker');
    if(db && db.scoreA!==null && db.scoreB!==null && db.scoreA!==db.scoreB){
      winnerTeamId = db.scoreA > db.scoreB ? teamAId : teamBId;
    }
  }
  return { winnerTeamId, winsA, winsB, needsDreambreaker };
}
// ==================== LIGUE MLP (format de saison) ====================
// Contrairement au tournoi MLP (équipes éphémères tirées des participants),
// ici les équipes sont persistantes (DATA.mlpTeams) et référencent les
// joueurs directement (DATA.players), modifiables par l'admin à tout moment.
function mlpPlayerGender(playerId){
  const p = DATA.players.find(x=>x.id===playerId);
  return p ? (p.gender||null) : null;
}
function mlpGenderCountsForIds(memberIds){
  let m=0,f=0,other=0;
  (memberIds||[]).forEach(id=>{
    const g = mlpPlayerGender(id);
    if(g==='M') m++; else if(g==='F') f++; else other++;
  });
  return {m,f,other};
}
function mlpLeagueTeamGenderSplit(team){
  const men = team.memberIds.filter(id=>mlpPlayerGender(id)==='M');
  const women = team.memberIds.filter(id=>mlpPlayerGender(id)==='F');
  return { men, women };
}
function mlpLeagueGamePlayers(team, gameType){
  if(!team) return null;
  const { men, women } = mlpLeagueTeamGenderSplit(team);
  if(gameType==='womens') return women.length>=2 ? [women[0], women[1]] : null;
  if(gameType==='mens') return men.length>=2 ? [men[0], men[1]] : null;
  if(gameType==='mixed1') return (men[0]!==undefined && women[0]!==undefined) ? [men[0], women[0]] : null;
  if(gameType==='mixed2'){
    const w = women.length>=2 ? women[1] : women[0];
    return (men[1]!==undefined && w!==undefined) ? [men[1], w] : null;
  }
  if(gameType==='dreambreaker') return team.dreambreakerPlayerId ? [team.dreambreakerPlayerId] : null;
  return null;
}
// Composition d'une joute pour un affrontement : l'ajustement manuel de l'admin
// (tie.lineup) s'il existe et reste valide, sinon la composition automatique.
function mlpTieLineup(tie, side, team, type){
  const ov = tie && tie.lineup && tie.lineup[side] && tie.lineup[side][type];
  if(ov && team && ov.length && ov.every(id=>team.memberIds.includes(id))) return ov;
  return mlpLeagueGamePlayers(team, type);
}
// Points de classement façon MLP réel : 3 pts victoire en règle, 2 pts
// victoire au DreamBreaker, 1 pt défaite au DreamBreaker, 0 pt défaite en règle.
function computeMLPTiePoints(tie, teamAId, teamBId){
  const cfg = { mlpRosterSize: DATA.mlpRosterSize||4 };
  const result = computeMLPTieWinner(cfg, tie.games, teamAId, teamBId);
  if(!result.winnerTeamId) return { pointsA:null, pointsB:null, winnerTeamId:null };
  const viaDreambreaker = (tie.games||[]).some(g=>g.type==='dreambreaker' && g.scoreA!==null && g.scoreB!==null);
  const winPoints = viaDreambreaker ? 2 : 3;
  const losePoints = viaDreambreaker ? 1 : 0;
  return {
    winnerTeamId: result.winnerTeamId,
    pointsA: result.winnerTeamId===teamAId ? winPoints : losePoints,
    pointsB: result.winnerTeamId===teamBId ? winPoints : losePoints
  };
}

// ---- Échange d'équipes entre affrontements (glisser-déposer ou toucher deux badges) ----
let MLP_SWAP_SEL = null;
function mlpTieHasScores(tie){
  return !!tie.winnerTeamId || (tie.games||[]).some(g=>(g.scoreA!=null && g.scoreA!=='') || (g.scoreB!=null && g.scoreB!==''));
}
function mlpSwapTeams(sessionId, tieIdA, keyA, tieIdB, keyB){
  const session = (DATA.mlpSessions||[]).find(s=>s.id===sessionId); if(!session || session.status!=='open') return;
  const tA = session.ties.find(x=>x.id===tieIdA), tB = session.ties.find(x=>x.id===tieIdB);
  if(!tA || !tB || (tieIdA===tieIdB && keyA===keyB)) return;
  const fa = keyA==='A'?'teamAId':'teamBId', fb = keyB==='A'?'teamAId':'teamBId';
  const na = {a:tA.teamAId,b:tA.teamBId}, nb = {a:tB.teamAId,b:tB.teamBId};
  const same = tieIdA===tieIdB;
  const nextA = {teamAId:tA.teamAId, teamBId:tA.teamBId};
  const nextB = same ? nextA : {teamAId:tB.teamAId, teamBId:tB.teamBId};
  const va = tA[fa], vb = tB[fb];
  nextA[fa] = vb; nextB[fb] = va;
  if(nextA.teamAId===nextA.teamBId || nextB.teamAId===nextB.teamBId){ showAlert("Cet échange mettrait une équipe contre elle-même."); return; }
  const apply = ()=>{
    const reset = (t,n)=>{
      const changed = n.teamAId!==t.teamAId || n.teamBId!==t.teamBId;
      t.teamAId = n.teamAId; t.teamBId = n.teamBId;
      if(changed){ t.games = newMLPGames(DATA.mlpRosterSize||4); t.winnerTeamId=null; t.pointsA=null; t.pointsB=null; delete t.lineup; }
    };
    reset(tA,nextA); if(!same) reset(tB,nextB);
    MLP_SWAP_SEL = null;
    saveAndRender();
  };
  if(mlpTieHasScores(tA) || mlpTieHasScores(tB)) showConfirm("Un des affrontements a déjà des scores : ils seront effacés par l'échange. Continuer ?", apply);
  else apply();
}
function mlpSwapPlayers(sessionId, tieId, side, g1, p1, g2, p2){
  const session = (DATA.mlpSessions||[]).find(s=>s.id===sessionId); if(!session || session.status!=='open') return;
  const tie = (session.ties||[]).find(x=>x.id===tieId); if(!tie) return;
  const team = (DATA.mlpTeams||[]).find(t=>t.id===(side==='A'?tie.teamAId:tie.teamBId)); if(!team) return;
  if(g1===g2 && p1===p2) return;
  if(mlpPlayerGender(p1)!==mlpPlayerGender(p2)){ showAlert("Tu peux échanger seulement deux joueurs du même genre (♂ avec ♂, ♀ avec ♀)."); return; }
  const types = (tie.games||[]).map(g=>g.type);
  const cur = {};
  types.forEach(tp=>{ if(tp==='dreambreaker') return; const l = mlpTieLineup(tie, side, team, tp); if(l) cur[tp] = l.slice(); });
  const t1 = types[g1], t2 = types[g2];
  if(!cur[t1] || !cur[t2]) return;
  const i1 = cur[t1].indexOf(p1), i2 = cur[t2].indexOf(p2);
  if(i1<0 || i2<0) return;
  cur[t1][i1] = p2; cur[t2][i2] = p1;
  const dup = a=>new Set(a).size!==a.length;
  if(dup(cur[t1]) || dup(cur[t2])){ showAlert("Cet échange mettrait le même joueur deux fois dans une partie. Essaie avec un joueur d'une autre partie (ex. Mixte 1 ↔ Mixte 2)."); return; }
  tie.lineup = tie.lineup || {};
  tie.lineup[side] = cur;
  MLP_SWAP_SEL = null;
  saveAndRender();
}
(function(){
  let drag = null, ghost = null;
  const SEL = { team:'.ss-side[data-tie]', pl:'.ss-pl[data-tie]' };
  const find = (el,kind)=> el && el.closest ? el.closest(SEL[kind]) : null;
  const clearOver = ()=>document.querySelectorAll('.ss-over').forEach(e=>e.classList.remove('ss-over'));
  const sameScope = (a,b,kind)=> kind==='team' || (a.dataset.tie===b.dataset.tie && a.dataset.side===b.dataset.side);
  const isSame = (a,b)=> a===b;
  function paintSel(){
    document.querySelectorAll('.ss-sel').forEach(e=>e.classList.remove('ss-sel'));
    const sel = MLP_SWAP_SEL; if(!sel) return;
    let q = sel.kind==='team' ? `.ss-side[data-tie="${sel.tie}"][data-side="${sel.side}"]` : `.ss-pl[data-tie="${sel.tie}"][data-side="${sel.side}"][data-game="${sel.game}"][data-pid="${sel.pid}"]`;
    const e = document.querySelector(q); if(e) e.classList.add('ss-sel');
  }
  document.addEventListener('pointerdown', e=>{
    let kind = null, el = null;
    if(e.target.closest){
      const pl = e.target.closest('.ss-pl[data-tie]'); const gr = e.target.closest('.ss-grip');
      if(pl){ kind='pl'; el=pl; } else if(gr){ kind='team'; el=find(gr,'team'); }
    }
    if(!el) return;
    drag = { el, kind, x:e.clientX, y:e.clientY, moving:false };
    try{ (kind==='team' ? el.querySelector('.ss-grip') : el).setPointerCapture(e.pointerId); }catch(_){}
  });
  document.addEventListener('pointermove', e=>{
    if(!drag) return;
    if(!drag.moving){
      if(Math.hypot(e.clientX-drag.x, e.clientY-drag.y) < 8) return;
      drag.moving = true;
      ghost = document.createElement('div'); ghost.className = 'ss-ghost';
      const nm = (drag.kind==='team' ? drag.el.querySelector('.ss-sname') : drag.el.querySelector('.nm')).textContent.replace(/</g,'&lt;');
      ghost.innerHTML = (drag.kind==='team' ? drag.el.querySelector('.ss-grip').innerHTML : drag.el.querySelector('.g-dot').outerHTML) + '<span>'+nm+'</span>';
      document.body.appendChild(ghost);
      drag.el.classList.add('ss-lift');
    }
    e.preventDefault();
    ghost.style.left = e.clientX+'px'; ghost.style.top = e.clientY+'px';
    if(e.clientY > innerHeight-110) window.scrollBy(0,14); else if(e.clientY < 90) window.scrollBy(0,-14);
    clearOver();
    const t = find(document.elementFromPoint(e.clientX, e.clientY), drag.kind);
    if(t && t!==drag.el && sameScope(drag.el,t,drag.kind)) t.classList.add('ss-over');
  }, {passive:false});
  function doSwap(kind, a, b){
    const x = a.dataset, y = b.dataset;
    if(kind==='team') mlpSwapTeams(x.sess, x.tie, x.side, y.tie, y.side);
    else mlpSwapPlayers(x.sess, x.tie, x.side, +x.game, x.pid, +y.game, y.pid);
  }
  function end(e, cancel){
    if(!drag) return;
    const d = drag; drag = null;
    if(ghost){ ghost.remove(); ghost = null; }
    clearOver(); d.el.classList.remove('ss-lift');
    if(cancel) return;
    if(d.moving){
      const t = find(document.elementFromPoint(e.clientX, e.clientY), d.kind);
      if(t && t!==d.el && sameScope(d.el,t,d.kind)) doSwap(d.kind, d.el, t);
      return;
    }
    const q = d.el.dataset;
    const sel = MLP_SWAP_SEL;
    const same = sel && sel.kind===d.kind && sel.tie===q.tie && sel.side===q.side && (d.kind==='team' || (sel.game===q.game && sel.pid===q.pid));
    if(!sel || sel.kind!==d.kind || (d.kind==='pl' && (sel.tie!==q.tie || sel.side!==q.side))){
      MLP_SWAP_SEL = { kind:d.kind, sess:q.sess, tie:q.tie, side:q.side, game:q.game, pid:q.pid }; paintSel(); return;
    }
    if(same){ MLP_SWAP_SEL = null; paintSel(); return; }
    const other = document.querySelector(d.kind==='team' ? `.ss-side[data-tie="${sel.tie}"][data-side="${sel.side}"]` : `.ss-pl[data-tie="${sel.tie}"][data-side="${sel.side}"][data-game="${sel.game}"][data-pid="${sel.pid}"]`);
    MLP_SWAP_SEL = null; paintSel();
    if(other) doSwap(d.kind, other, d.el);
  }
  document.addEventListener('pointerup', e=>end(e,false));
  document.addEventListener('pointercancel', e=>end(e,true));
})();

// Génère des affrontements pour une session via la méthode de rotation
// (round-robin classique) : une équipe reste fixe, les autres tournent
// autour à chaque ronde — garantit qu'aucune paire ne se répète dans les
// rondes générées. Si le nombre d'équipes est impair, une équipe différente
// est au repos à chaque ronde (bye).
function generateRoundRobinRounds(teamIds, numRounds){
  let ids = teamIds.slice();
  if(ids.length % 2 !== 0) ids.push(null); // bye
  const n = ids.length;
  const rounds = [];
  for(let r=0; r<Math.min(numRounds, n-1); r++){
    const roundPairs = [];
    for(let i=0; i<n/2; i++){
      const a = ids[i], b = ids[n-1-i];
      if(a!==null && b!==null) roundPairs.push([a,b]);
    }
    rounds.push(roundPairs);
    const fixed = ids[0];
    const rest = ids.slice(1);
    rest.unshift(rest.pop());
    ids = [fixed, ...rest];
  }
  return rounds;
}
function generateMlpMatchupsForSession(sessionId){
  const session = (DATA.mlpSessions||[]).find(s=>s.id===sessionId);
  if(!session) return;
  if((session.ties||[]).length){ showAlert("Cette session a déjà des affrontements — retire-les d'abord si tu veux régénérer."); return; }
  const teams = DATA.mlpTeams || [];
  if(teams.length < 2){ showAlert("Il faut au moins 2 équipes."); return; }
  const perTeam = Math.max(1, MLP_PER_TEAM || 2);
  const rounds = generateRoundRobinRounds(teams.map(t=>t.id), perTeam);
  const pairs = rounds.flat();
  if(!pairs.length){ showAlert("Impossible de générer des affrontements avec ces réglages."); return; }
  session.ties = pairs.map(([teamAId,teamBId])=>({ id: uid('tie'), teamAId, teamBId, games: newMLPGames(DATA.mlpRosterSize||4), winnerTeamId:null, pointsA:null, pointsB:null }));
  saveAndRender();
}

function setMlpTieScore(sessionId, tieId, gameIndex, which, value){

    if(!g){ showAlert("Joute introuvable (index "+gameIndex+")."); return; }
    if(which==='A') g.scoreA = value===''?null:Number(value);

    // Volontairement : aucune redessine ici. La saisie se contente d'enregistrer
    // la valeur ; le calcul du gagnant/points/DreamBreaker se fait uniquement
    // au clic sur « Valider ce résultat » (voir recomputeMlpTie), pour ne
    // jamais reconstruire la page pendant que l'admin est en train de taper.

// Calcule gagnant / points / DreamBreaker d'un affrontement (modifie `tie`). Retourne true si décidé.
function mlpApplyTieResult(tie){
  const cfg = { mlpRosterSize: DATA.mlpRosterSize||4 };
  const result = computeMLPTieWinner(cfg, tie.games, tie.teamAId, tie.teamBId);
  if(result.needsDreambreaker && !tie.games.some(x=>x.type==='dreambreaker')){
    tie.games.push({ type:'dreambreaker', scoreA:null, scoreB:null });
  } else if(!result.needsDreambreaker){
    tie.games = tie.games.filter(x=>x.type!=='dreambreaker');
  }
  tie.winnerTeamId = result.winnerTeamId;
  if(tie.winnerTeamId){
    const pts = computeMLPTiePoints(tie, tie.teamAId, tie.teamBId);
    tie.pointsA = pts.pointsA; tie.pointsB = pts.pointsB;
  } else { tie.pointsA = null; tie.pointsB = null; }
  return !!tie.winnerTeamId;
}
// Saisie des scores par un joueur des deux équipes : on relit la ligue à jour
// (pour ne pas écraser d'autres changements), on applique, puis on sauvegarde.
async function playerSaveMlpTie(sessionId, tieId, meId){
  if(DATA.mlpPlayerScoreEntry === false){ showAlert("La saisie des scores est réservée aux administrateurs."); return; }
  const tieSess = (DATA.mlpSessions||[]).find(x=>x.id===sessionId);
  if(!scoreDayOpen(tieSess && tieSess.date)){ showAlert(scoreDayMsg(tieSess && tieSess.date)); return; }
  try{
    const inputs = Array.from(document.querySelectorAll(`input[data-ptie="${tieId}"]`));
    const { data, error } = await fetchLeagueData(CURRENT_LEAGUE_ID);
    if(error){ showAlert("Erreur : " + error.message); return; }
    const fresh = data && data.data;
    const session = fresh && (fresh.mlpSessions||[]).find(x=>x.id===sessionId);
    if(!session || session.status!=='open'){ showAlert("Cette session est déjà close — contacte un administrateur."); return; }
    const tie = (session.ties||[]).find(x=>x.id===tieId);
    if(!tie){ showAlert("Affrontement introuvable (il a peut-être été modifié)."); return; }
    const mine = (fresh.mlpTeams||[]).some(t=>(t.id===tie.teamAId||t.id===tie.teamBId) && t.memberIds.includes(meId));
    if(!mine){ showAlert("Tu ne fais pas partie de cet affrontement."); return; }
    const wasDone = !!tie.winnerTeamId, prevTxt = wasDone ? `${tie.pointsA}–${tie.pointsB}` : '';
    tie.games = (tie.games && tie.games.length) ? tie.games : newMLPGames(fresh.mlpRosterSize||4);
    let bad = false;
    inputs.forEach(inp=>{
      const g = tie.games[+inp.dataset.g]; if(!g) return;
      const v = inp.value==='' ? null : Number(inp.value);
      if(v!==null && (!isFinite(v) || v<0)) bad = true;
      if(inp.dataset.s==='A') g.scoreA = v; else g.scoreB = v;
    });
    if(bad){ showAlert("Les scores doivent être des nombres positifs."); return; }
    const prev = DATA; DATA = fresh;
    let decided;
    try{ decided = mlpApplyTieResult(tie); } finally { /* DATA reste = fresh */ }
    const { error: e2 } = await sb.rpc('mlp_submit_tie', {
      p_league_id: CURRENT_LEAGUE_ID, p_session_id: sessionId, p_tie_id: tieId,
      p_games: tie.games, p_winner: tie.winnerTeamId || null,
      p_points_a: tie.pointsA==null ? null : tie.pointsA, p_points_b: tie.pointsB==null ? null : tie.pointsB
    });
    if(e2){ DATA = prev; showAlert("La sauvegarde a échoué : " + e2.message + " (le SQL « mlp-score-entry.sql » est-il exécuté dans Supabase ?)"); return; }
    if(wasDone){ tie.sEdited = true; tie.sPrev = prevTxt; }
    tie.sBy = CURRENT_PROFILE ? CURRENT_PROFILE.id : null; tie.sByName = playerName(meId); tie.sAt = new Date().toISOString();
    render();
    showAlert(decided ? "✅ Résultat enregistré." : "Scores enregistrés. Le résultat sera déterminé quand toutes les parties auront un score.");
  }catch(e){
    showAlert("Erreur : " + (e && e.message ? e.message : e));
  }
}

  </div>`;
  return html;
}
function recomputeMlpTie(sessionId, tieId){
  try{
    const session = (DATA.mlpSessions||[]).find(s=>s.id===sessionId);
    if(!session){ showAlert("Session introuvable."); return; }
    if(session.status!=='open'){ showAlert("Cette session est close : les scores sont verrouillés."); return; }
    const tie = (session.ties||[]).find(x=>x.id===tieId);
    if(!tie){ showAlert("Affrontement introuvable."); return; }
    const cfg = { mlpRosterSize: DATA.mlpRosterSize||4 };
    const result = computeMLPTieWinner(cfg, tie.games, tie.teamAId, tie.teamBId);
    if(result.needsDreambreaker && !tie.games.some(x=>x.type==='dreambreaker')){
      tie.games.push({ type:'dreambreaker', scoreA:null, scoreB:null });
    } else if(!result.needsDreambreaker){
      tie.games = tie.games.filter(x=>x.type!=='dreambreaker');
    }
    tie.winnerTeamId = result.winnerTeamId;
    if(tie.winnerTeamId){
      const pts = computeMLPTiePoints(tie, tie.teamAId, tie.teamBId);
      tie.pointsA = pts.pointsA; tie.pointsB = pts.pointsB;
    } else {
      tie.pointsA = null; tie.pointsB = null;
      showAlert("Résultat pas encore déterminé — vérifie que toutes les joutes ont un score.");
    }
    saveAndRender();
  } catch(e){
    showAlert("Erreur pendant la validation du résultat : " + (e && e.message ? e.message : e));
  }
}

function mlpStandingsHTML(me){
  const myTeam = me ? (DATA.mlpTeams||[]).find(t=>t.memberIds.includes(me.id)) : null;
  const standings = {};
  (DATA.mlpTeams||[]).forEach(t=>{ standings[t.id] = { teamId:t.id, name:t.name, points:0, played:0, wins:0, losses:0 }; });
  (DATA.mlpSessions||[]).filter(s=>s.status==='closed').forEach(session=>{
    (session.ties||[]).forEach(tie=>{
      if(!tie.winnerTeamId) return;
      [[tie.teamAId, tie.pointsA],[tie.teamBId, tie.pointsB]].forEach(([teamId,pts])=>{
        if(!standings[teamId]){
          const tm = (DATA.mlpTeams||[]).find(x=>x.id===teamId);
          standings[teamId] = { teamId, name: tm?tm.name:'?', points:0, played:0, wins:0, losses:0 };
        }
        standings[teamId].points += (pts||0);
        standings[teamId].played += 1;
        if(tie.winnerTeamId===teamId) standings[teamId].wins += 1; else standings[teamId].losses += 1;
      });
    });
  });
  const rows = Object.values(standings).sort((a,b)=>b.points-a.points || b.wins-a.wins);
  if(!rows.length) return `<div class="card"><p class="empty">Aucun classement pour l'instant — crée des équipes et joue des sessions.</p></div>`;
  const medal = i => i===0?'🥇':i===1?'🥈':i===2?'🥉':String(i+1);
  return `<div class="card">
    <h2>Classement de la saison</h2>
    <p class="small">3 pts pour une victoire en règle, 2 pts pour une victoire au DreamBreaker, 1 pt pour une défaite au DreamBreaker, 0 pt pour une défaite en règle.</p>
    <table><tr><th>#</th><th>Équipe</th><th>J</th><th>V-D</th><th>Points</th></tr>
    ${rows.map((r,i)=>`<tr class="${myTeam&&myTeam.id===r.teamId?'me':''}"><td>${medal(i)}</td><td>${escapeHTML(r.name)}${myTeam&&myTeam.id===r.teamId?' <span class="small">(toi)</span>':''}</td><td>${r.played}</td><td>${r.wins}-${r.losses}</td><td><strong>${r.points}</strong></td></tr>`).join('')}
    </table>
  </div>`;
}

// Modification manuelle de la cote d'un joueur, avec bornes raisonnables
// (2.0-8.0) et une confirmation renforcée si le joueur a déjà des matchs
// comptabilisés (pour éviter d'écraser une cote gagnée par erreur).
function applyRatingEdit(pid, rawValue){
  const p = findRatablePerson(pid); // joueur régulier OU remplaçant du bassin
  if(!p) return;
  const value = parseFloat(String(rawValue).replace(',', '.'));
  if(isNaN(value)){ showAlert("Valeur invalide."); return; }
  const clamped = Math.min(RATING_MAX, Math.max(RATING_MIN, value));
  p.rating = Math.round(clamped * 1000) / 1000;
  saveAndRender();
}
function editPlayerRating(pid){
  const p = findRatablePerson(pid); // joueur régulier OU remplaçant du bassin
  if(!p) return;
  const current = typeof p.rating === 'number' ? p.rating : RATING_DEFAULT;
  const games = typeof p.ratingGames === 'number' ? p.ratingGames : 0;
  const promptForValue = ()=>{
    showPrompt(`Nouvelle cote de ${p.name} (entre ${RATING_MIN.toFixed(1)} et ${RATING_MAX.toFixed(1)}) :`, current.toFixed(2), (val)=>{
      if(val !== null && val !== undefined && val.trim() !== '') applyRatingEdit(pid, val.trim());
    });
  };
  if(games > 0){
    showConfirm(`${p.name} a déjà ${games} match${games>1?'s':''} comptabilisé${games>1?'s':''} dans sa cote actuelle (${current.toFixed(2)}). La modifier manuellement écrasera cette progression. Continuer ?`, promptForValue);
  } else {
    promptForValue();
  }
}

// Ajoute un joueur (par son compte lié) dans une AUTRE ligue : crée un nouveau
// joueur là-bas (dans son premier groupe) et lie le compte à celui-ci.
async function addPlayerToLeagueForProfile(leagueId, profileId, name){
  const { data: ex } = await sb.from('profile_players').select('player_id,substitute_id').eq('profile_id', profileId).eq('league_id', leagueId).maybeSingle();
  if(ex) return ex.player_id || ex.substitute_id; // ce compte a déjà une place dans cette ligue
  const { data, error } = await sb.from('league_data').select('data').eq('league_id', leagueId).single();
  if(error){ showAlert("Erreur : " + error.message); return null; }
  const leagueData = (data && data.data && Object.keys(data.data).length>0) ? data.data : defaultData();
  leagueData.players = leagueData.players || [];
  leagueData.groups = leagueData.groups || [];
  const place = newPlayerPlacement(leagueData);
  const finalName = uniquePlayerName(name, leagueData.players);
  const newPlayer = { id: uid('p'), name: finalName, groupId: place.groupId, order: place.order };
  if(place.waiting) newPlayer.status = 'new'; // aucun groupe avec de la place : en attente d'assignation
  leagueData.players.push(newPlayer);
  const { error: err2 } = await sb.from('league_data').update({ data: leagueData, updated_at: new Date().toISOString() }).eq('league_id', leagueId);
  if(err2){ showAlert("Erreur : " + err2.message); return null; }
  const { error: err3 } = await sb.from('profile_players').insert({ profile_id: profileId, league_id: leagueId, player_id: newPlayer.id });
  if(err3){ showAlert("Erreur : " + err3.message); return null; }
  return newPlayer.id;
}

// remplaçant introuvable » côté joueur.
async function addSubstituteToLeagueForProfile(leagueId, profileId, name){

// seulement la ligue actuellement affichée), pour construire le bassin de
// membres de l'organisation. La ligue déjà chargée (DATA) est réutilisée
// telle quelle plutôt que relue, pour économiser un aller-retour.
async function loadOrgRoster(){
  const leagues = myOrgLeagues();
  const results = await Promise.all(leagues.map(async l=>{
    if(l.id === CURRENT_LEAGUE_ID && DATA) return { id:l.id, players: DATA.players||[], substitutePool: DATA.substitutePool||[] };
    const { data } = await sb.from('league_data').select('data').eq('league_id', l.id).single();
    const d = (data && data.data) || {};
    return { id:l.id, players: d.players||[], substitutePool: d.substitutePool||[] };
  }));
  const byLeague = {};
  results.forEach(r=>{ byLeague[r.id] = { players:r.players, substitutePool:r.substitutePool }; });
  ORG_ROSTER_BY_LEAGUE = byLeague;
}
// Construit la liste des membres à partir de la VRAIE table org_members
// (identité canonique — chaque joueur/remplaçant créé depuis ici porte un
// orgMemberId qui pointe vers sa ligne). Les entrées créées avant cette
// table (ou ajoutées directement dans une ligue, hors de cet écran) n'ont
// pas cet identifiant : elles sont rattachées au mieux par compte lié, sinon
// par nom — un repli de compatibilité, plus la source de vérité principale.
function organizationRosterEntries(){
  const leagues = myOrgLeagues();
  const entries = [];
  const byOrgMemberId = {};
  const byProfileId = {};
  const byNameLower = {};
  ORG_MEMBERS.forEach(m=>{
    const entry = { orgMemberId: m.id, name: m.name, email: m.email || null, profileId: m.profile_id || null, rows: [] };
    entries.push(entry);
    byOrgMemberId[m.id] = entry;
    if(m.profile_id) byProfileId[m.profile_id] = entry;
    const norm = m.name.trim().toLowerCase();
    if(!byNameLower[norm]) byNameLower[norm] = entry;
  });
  const findOrCreateLegacyEntry = (profileId, name)=>{
    if(profileId && byProfileId[profileId]) return byProfileId[profileId];
    const norm = name.trim().toLowerCase();
    if(byNameLower[norm]) return byNameLower[norm];
    const entry = { orgMemberId:null, name, email:null, profileId: profileId||null, rows: [] };
    entries.push(entry);
    if(profileId) byProfileId[profileId] = entry;
    byNameLower[norm] = entry;
    return entry;
  };
  leagues.forEach(l=>{
    const bucket = ORG_ROSTER_BY_LEAGUE[l.id];
    if(!bucket) return;
    const leagueLabel = l.schedule_label || l.name;
    const addRow = (person, type)=>{
      let entry;
      const isSubRow = type === 'remplaçant';
      if(person.orgMemberId && byOrgMemberId[person.orgMemberId]){
        entry = byOrgMemberId[person.orgMemberId];
        if(!entry.profileId){
          const lk = ALL_PROFILE_PLAYERS.find(pp=>pp.league_id===l.id && (isSubRow ? pp.substitute_id===person.id : pp.player_id===person.id));
          if(lk) entry.profileId = lk.profile_id;
        }
      } else {
        const link = ALL_PROFILE_PLAYERS.find(pp=>pp.league_id===l.id && (isSubRow ? pp.substitute_id===person.id : pp.player_id===person.id));
        const profileId = link ? link.profile_id : null;
        entry = findOrCreateLegacyEntry(profileId, person.name);
        if(profileId && !entry.profileId) entry.profileId = profileId;
        if(!entry.email){
          const profile = profileId ? ALL_PROFILES.find(pr=>pr.id===profileId) : null;
          entry.email = (profile && profile.email) || person.email || null;
        }
      }
      entry.rows.push({ leagueId:l.id, leagueLabel, type, refId: person.id, invitedAt: person.invitedAt || null });
      // Le genre (utilisé pour la composition des équipes de tournoi MLP)
      // vit encore sur la fiche joueur/remplaçant de chaque ligue, mais se
      // configure maintenant uniquement depuis cette fiche-ci (voir
      // setMemberGender) — on prend la première valeur trouvée parmi ses
      // ligues comme valeur affichée, les écritures la gardent synchronisée
      // partout.
      if(!entry.gender && person.gender) entry.gender = person.gender;
    };
    (bucket.players||[]).forEach(p=>addRow(p, 'joueur'));
    (bucket.substitutePool||[]).forEach(s=>addRow(s, 'remplaçant'));
  });
  entries.sort((a,b)=>a.name.localeCompare(b.name));
  return entries;
}
// Crée un joueur ou remplaçant SANS compte requis, directement dans une
// ligue donnée (pas nécessairement la ligue actuellement affichée) — même
// logique que le formulaire « Ajouter une personne », généralisée à
// n'importe quelle ligue de l'organisation.
async function addNamedEntryToLeague(leagueId, name, type, email, orgMemberId){
  const { data, error } = await sb.from('league_data').select('data').eq('league_id', leagueId).single();
  if(error){ showAlert("Erreur : " + error.message); return null; }
  const leagueData = (data && data.data && Object.keys(data.data).length>0) ? data.data : defaultData();
  // Déjà dans cette ligue (même fiche membre, joueur ou remplaçant) : on ne recrée pas de doublon.
  if(orgMemberId){
    const already = (leagueData.players||[]).concat(leagueData.substitutePool||[]).find(x=>x.orgMemberId===orgMemberId);
    if(already) return already.id;
  }
  let createdId;
  if(type==='remplacant'){
    leagueData.substitutePool = leagueData.substitutePool || [];
    const finalName = uniquePlayerName(name, leagueData.substitutePool);
    const entry = { id: uid('sub'), name: finalName, rating: RATING_DEFAULT, ratingGames: 0 };
    if(email) entry.email = email;
    if(orgMemberId) entry.orgMemberId = orgMemberId;
    leagueData.substitutePool.push(entry);
    createdId = entry.id;
  } else {
    leagueData.players = leagueData.players || [];
    leagueData.groups = leagueData.groups || [];
    const place = newPlayerPlacement(leagueData);
    const finalName = uniquePlayerName(name, leagueData.players);
    const newPlayer = { id: uid('p'), name: finalName, groupId: place.groupId, order: place.order };
    if(place.waiting) newPlayer.status = 'new'; // aucun groupe avec de la place : en attente d'assignation
    if(email) newPlayer.email = email;
    if(orgMemberId) newPlayer.orgMemberId = orgMemberId;
    leagueData.players.push(newPlayer);
    createdId = newPlayer.id;
  }
  const { error: err2 } = await sb.from('league_data').update({ data: leagueData, updated_at: new Date().toISOString() }).eq('league_id', leagueId);
  if(err2){ showAlert("Erreur : " + err2.message); return null; }
  return createdId;
}
// Recharge tout ce qui a pu changer après un ajout/assignation en arrière-
// plan (bassin, comptes) et, si la ligue actuellement affichée en fait
// partie, ses propres données aussi — pour que l'écran reflète le résultat
// sans devoir changer de ligue.
async function refreshAfterOrgRosterChange(affectedLeagueIds){
  // La ligue affichée d'abord : loadOrgRoster reprend DATA tel quel pour elle.
  if(CURRENT_LEAGUE_ID && affectedLeagueIds.includes(CURRENT_LEAGUE_ID)){
    const loaded = await loadData(CURRENT_LEAGUE_ID);
    if(loaded){ DATA = loaded; migrateData(); }
  }
  await Promise.all([loadAllProfilePlayers(), loadOrgRoster(), loadOrgMembers()]);
  render();
}

let ORG_ADD_BUSY = false;
function saveAddOrgMemberForm(){
  if(ORG_ADD_BUSY) return false;
  const name = document.getElementById('orgMemberName').value.trim();
  if(!name){ showAlert("Le nom est requis."); return false; }
  const email = document.getElementById('orgMemberEmail').value.trim();
  // Doublon : même nom (sans accents ni majuscules) ou même courriel déjà dans l'organisation.
  const nn = normPersonName(name), ee = email.toLowerCase();
  const known = organizationRosterEntries().find(e=> normPersonName(e.name)===nn || (ee && e.email && e.email.toLowerCase()===ee));
  if(known){
    showAlert(`« ${known.name} » existe déjà dans l'organisation. Ouvre sa fiche (Membres) pour l'ajouter à une ligue. Si c'est une autre personne, précise le nom (ex. initiale).`);
    return false;
  }
  ORG_ADD_BUSY = true;
  const picks = readPerLeagueTypes('orgMemberLeague');
  (async ()=>{
    // La personne est d'abord créée une fois pour toutes dans org_members —
    // c'est SON identifiant qui sera repris dans chaque ligue cochée, plutôt
    // que de recréer une fiche indépendante à chaque fois.
    try{
      const member = await createOrgMember(name, email, null, null);
      if(!member) return;
      for(const { leagueId, type } of picks){ await addNamedEntryToLeague(leagueId, name, type, email, member.id); }
      await refreshAfterOrgRosterChange(picks.map(p=>p.leagueId));
    } finally { ORG_ADD_BUSY = false; }
  })();
}

// Retire une personne d'une ligue donnée (joueur ou remplaçant) directement
// dans le JSONB de cette ligue, puis délie le compte de cette ligue-là s'il
// y en avait un — sans toucher aux autres ligues où elle reste active.
async function removePersonFromLeague(leagueId, refId, type, profileId){
  const { data, error } = await sb.from('league_data').select('data').eq('league_id', leagueId).single();
  if(error){ showAlert("Erreur : " + error.message); return false; }
  const leagueData = (data && data.data) || {};
  if(type==='remplaçant'){
    leagueData.substitutePool = (leagueData.substitutePool||[]).filter(x=>x.id!==refId);
  } else {
    leagueData.players = (leagueData.players||[]).filter(x=>x.id!==refId);
  }
  const { error: err2 } = await sb.from('league_data').update({ data: leagueData, updated_at: new Date().toISOString() }).eq('league_id', leagueId);
  if(err2){ showAlert("Erreur : " + err2.message); return false; }
  if(profileId){
    await sb.from('profile_players').delete().eq('profile_id', profileId).eq('league_id', leagueId);
  }
  return true;
}
function confirmRemovePersonFromLeague(idx, rowIdx){
  const entry = ORG_ROSTER_ENTRIES_CACHE[idx];

  const row = entry.rows[rowIdx];
  if(!row) return;
  showConfirm(`Retirer ${entry.name} de ${row.leagueLabel} ?`, async ()=>{
    const ok = await removePersonFromLeague(row.leagueId, row.refId, row.type, entry.profileId);
    if(ok) await refreshOrgMemberDetailModal(idx, [row.leagueId]);
  });
}
// Supprime complètement une personne de l'organisation : retirée de TOUTES
// ses ligues (une par une, avec déliaison du compte pour chacune) puis sa
// fiche « membre » elle-même effacée — pas besoin de d'abord vider ses
// ligues une à une avant de pouvoir la supprimer. Son compte (s'il y en a
// un) n'est pas touché, seulement ses liens vers des joueurs/remplaçants.
async function fullyDeleteOrgMember(idx){
  const entry = ORG_ROSTER_ENTRIES_CACHE[idx];
  if(!entry) return;
  for(const row of entry.rows){
    await removePersonFromLeague(row.leagueId, row.refId, row.type, entry.profileId);

// Fait passer une personne de joueur à remplaçant (ou l'inverse) dans UNE
// ligue donnée, directement dans le JSONB de cette ligue — même logique que
// convertPlayerToSubstitute/convertSubstituteToPlayer, mais généralisée à
// n'importe quelle ligue de l'organisation (pas seulement la ligue affichée),
// cote et compte lié conservés.
async function changePersonTypeInLeague(leagueId, refId, fromType, profileId){
  const { data, error } = await sb.from('league_data').select('data').eq('league_id', leagueId).single();
  if(error){ showAlert("Erreur : " + error.message); return false; }
  const leagueData = (data && data.data) || {};
  leagueData.players = leagueData.players || [];
  leagueData.substitutePool = leagueData.substitutePool || [];
  let newId;
  if(fromType==='remplaçant'){
    const s = leagueData.substitutePool.find(x=>x.id===refId);
    if(!s) return false;
    leagueData.substitutePool = leagueData.substitutePool.filter(x=>x.id!==refId);
    const newPlayer = { id: uid('p'), name: s.name, groupId: null, rating: typeof s.rating==='number'?s.rating:RATING_DEFAULT, ratingGames: typeof s.ratingGames==='number'?s.ratingGames:0, order: 0, status:'new' };
    if(s.email) newPlayer.email = s.email;
    if(s.orgMemberId) newPlayer.orgMemberId = s.orgMemberId;
    leagueData.players.push(newPlayer);
    newId = newPlayer.id;
  } else {
    const p = leagueData.players.find(x=>x.id===refId);
    if(!p) return false;
    leagueData.players = leagueData.players.filter(x=>x.id!==refId);
    const newSub = { id: uid('sub'), name: p.name, rating: typeof p.rating==='number'?p.rating:RATING_DEFAULT, ratingGames: typeof p.ratingGames==='number'?p.ratingGames:0 };
    if(p.email) newSub.email = p.email;
    if(p.orgMemberId) newSub.orgMemberId = p.orgMemberId;
    leagueData.substitutePool.push(newSub);
    newId = newSub.id;
  }
  const { error: err2 } = await sb.from('league_data').update({ data: leagueData, updated_at: new Date().toISOString() }).eq('league_id', leagueId);
  if(err2){ showAlert("Erreur : " + err2.message); return false; }
  if(profileId){
    if(fromType==='remplaçant'){
      await sb.from('profile_players').update({ substitute_id: null, player_id: newId }).eq('profile_id', profileId).eq('league_id', leagueId);
    } else {
      await sb.from('profile_players').update({ player_id: null, substitute_id: newId }).eq('profile_id', profileId).eq('league_id', leagueId);
    }
  }
  return true;
}

async function addMemberToLeagues(idx, picks){

function setMemberGender(idx){

  if(!entry || !entry.rows.length) return;
  showChoice('Choisir le genre :', ['Femme', 'Homme', 'Non défini'], (choiceIdx)=>{

async function applyMemberGender(idx, nextGender){
  const entry = ORG_ROSTER_ENTRIES_CACHE[idx];
  if(!entry || !entry.rows.length) return;
  const byLeague = {};
  entry.rows.forEach(r=>{ (byLeague[r.leagueId] = byLeague[r.leagueId] || []).push(r); });
  let hadError = false;
  try{
    for(const leagueId of Object.keys(byLeague)){
      const { data, error } = await sb.from('league_data').select('data').eq('league_id', leagueId).single();
      if(error){ hadError = true; continue; }
      const leagueData = (data && data.data) || {};
      byLeague[leagueId].forEach(r=>{
        const list = r.type==='remplaçant' ? (leagueData.substitutePool||[]) : (leagueData.players||[]);
        const rec = list.find(x=>x.id===r.refId);
        if(rec) rec.gender = nextGender;
      });
      const { error: err2 } = await sb.from('league_data').update({ data: leagueData, updated_at: new Date().toISOString() }).eq('league_id', leagueId);
      if(err2) hadError = true;
    }
  }catch(e){
    console.error('Erreur de mise à jour du genre', e);
    hadError = true;
  }
  await refreshOrgMemberDetailModal(idx, Object.keys(byLeague));
  if(hadError) showAlert("Le genre n'a pas pu être mis à jour dans toutes les ligues. Réessaie plus tard.");
}

// ---- Correspondance automatique pour « À approuver » ----
function normPersonName(s){ return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(); }
// Courriel connu d'un joueur/remplaçant : le sien, sinon celui de sa fiche membre.
function personEmail(person){
  if(person.email) return String(person.email).toLowerCase();
  const m = person.orgMemberId ? ORG_MEMBERS.find(x=>x.id===person.orgMemberId) : null;
  return (m && m.email) ? String(m.email).toLowerCase() : '';
}
// 3 = même courriel, 2 = même nom, 1 = même prénom et même initiale de nom, 0 = rien.
function personMatchScore(person, email, displayName){
  if(email && personEmail(person) === String(email).toLowerCase()) return 3;
  const a = normPersonName(person.name), b = normPersonName(displayName);
  if(!a || !b) return 0;
  if(a === b) return 2;
  const ta = a.split(' '), tb = b.split(' ');
  if(ta.length > 1 && tb.length > 1 && ta[0] === tb[0] && ta[ta.length-1].charAt(0) === tb[tb.length-1].charAt(0)) return 1;
  return 0;
}
// Meilleur candidat [{value, person}], seulement s'il est seul à ce niveau (sinon on laisse choisir).
function bestApprovalMatch(cands, email, displayName){
  let best = null, bestScore = 0, tie = false;
  cands.forEach(function(c){
    const sc = personMatchScore(c.person, email, displayName);
    if(sc > bestScore){ best = c; bestScore = sc; tie = false; }
    else if(sc && sc === bestScore) tie = true;
  });
  return (best && !tie) ? { value: best.value, score: bestScore } : null;
}

// Recharge ce qui a pu changer après une action sur un compte, et si la
// ligue concernée est celle actuellement affichée, ses propres données
// aussi — pour que l'écran (et le classement/les groupes) reflète tout de
// suite un joueur créé depuis cette action.
async function refreshAfterAccountChange(profileId, leagueId){
  // La ligue affichée d'abord : loadOrgRoster reprend DATA tel quel pour elle. Rechargée après,
  // un joueur tout juste créé manquerait au bassin et son compte passerait pour « orphelin ».
  if(CURRENT_LEAGUE_ID === leagueId){
    const loaded = await loadData(CURRENT_LEAGUE_ID);
    if(loaded){ DATA = loaded; migrateData(); }
  }
  await Promise.all([loadAllProfiles(), loadAllProfilePlayers(), loadOrgRoster()]);

// La ligue à lier n'est plus fixée d'avance (CURRENT_LEAGUE_ID) : elle est
// choisie dans le menu déroulant, encodée dans sa valeur en "leagueId::playerId".
async function linkAccount(profileId){
  const select = document.getElementById('linkSelect_'+profileId);
  const raw = select.value;
  if(!raw) return;
  const [leagueId, kind, val] = raw.split('::');
  const pr = ALL_PROFILES.find(p=>p.id===profileId);
  // « En attente » = aucun lien existant avant cette action (peu importe le
  // rôle global du compte) — c'est ce moment précis qu'on veut notifier,
  // pas chaque nouvelle ligue ajoutée à un compte déjà actif.
  const wasPending = !ALL_PROFILE_PLAYERS.some(pp=>pp.profile_id===profileId);
  if(kind === 's'){
    let subId = val;
    if(val === '__new__'){
      subId = await addNamedEntryToLeague(leagueId, pr.display_name || pr.email, 'remplacant', pr.email, null);
      if(!subId) return;
    }
    const { error } = await sb.from('profile_players').insert({ profile_id: profileId, league_id: leagueId, substitute_id: subId });
    if(error){ showAlert("Erreur lors de la liaison : " + error.message); return; }
  } else {
    let playerId = val;
    if(val === '__new__'){
      playerId = await addNamedEntryToLeague(leagueId, pr.display_name || pr.email, 'joueur', pr.email, null);
      if(!playerId) return;
    }
    const { error } = await sb.from('profile_players').insert({ profile_id: profileId, league_id: leagueId, player_id: playerId });
    if(error){ showAlert("Erreur lors de la liaison : " + error.message); return; }
    await migratePlayerNotesToProfile(leagueId, playerId, profileId);
  }
  if(wasPending){
    const leagueMeta = LEAGUES.find(l=>l.id===leagueId);
    notifyAccountApproved(profileId, leagueMeta && (leagueMeta.schedule_label || leagueMeta.name));
  }
  await refreshAfterAccountChange(profileId, leagueId);
}
// Reconnecte un compte dont le joueur associé a été retiré par erreur (le
// lien existe déjà en base pour cette ligue précise, on met juste à jour
// vers quel joueur il pointe, plutôt que de devoir délier puis relier).
async function relinkAccount(profileId, leagueId, kind){
  const select = document.getElementById('relinkSelect_'+profileId);
  const value = select.value;
  if(!value) return;
  const pr = ALL_PROFILES.find(p=>p.id===profileId);
  let id = value;
  if(kind === 's'){
    if(value === '__new__'){
      id = await addNamedEntryToLeague(leagueId, pr.display_name || pr.email, 'remplacant', pr.email, null);
      if(!id) return;
    }
    const { error } = await sb.from('profile_players').update({ substitute_id: id, player_id: null }).eq('profile_id', profileId).eq('league_id', leagueId);
    if(error){ showAlert("Erreur lors de la reconnexion : " + error.message); return; }
  } else {
    if(value === '__new__'){
      id = await addNamedEntryToLeague(leagueId, pr.display_name || pr.email, 'joueur', pr.email, null);
      if(!id) return;
    }
    const { error } = await sb.from('profile_players').update({ player_id: id, substitute_id: null }).eq('profile_id', profileId).eq('league_id', leagueId);
    if(error){ showAlert("Erreur lors de la reconnexion : " + error.message); return; }
    await migratePlayerNotesToProfile(leagueId, id, profileId);
  }
  await refreshAfterAccountChange(profileId, leagueId);
}
async function unlinkAccount(profileId, leagueId){
  showConfirm("Délier ce compte de son joueur pour cette ligue ? (Ses liens avec d'autres ligues, s'il y en a, ne sont pas touchés.)", async ()=>{
    const { error } = await sb.from('profile_players').delete().eq('profile_id', profileId).eq('league_id', leagueId);
    if(error){ showAlert("Erreur : " + error.message); return; }
    if(CURRENT_PROFILE && CURRENT_PROFILE.id === profileId) ADMIN_VIEWING_AS = null;
    await refreshAfterAccountChange(profileId, leagueId);
  });
}

// Gestion des absences/remplaçants pour UN groupe en particulier, intégrée
// directement dans sa carte (au lieu d'une vue centralisée à part).
function groupAbsenceManagementHTML(open, g){
  const gd = open.groupsData.find(x=>x.groupId===g.id);
  if(!gd) return '';
  const groupPlayerIds = playersInGroup(g.id).map(p=>p.id);
  const injuredIds = groupPlayerIds.filter(id=>{ const p = DATA.players.find(x=>x.id===id); return p && p.injured; });
  const absentIds = groupPlayerIds.filter(id=>isAbsent(open,id) && !injuredIds.includes(id));
  const allIds = [...injuredIds, ...absentIds];
  if(allIds.length===0) return '';
  const subs = gd.substitutes || {};
  const inUse = substitutesInUse(open, g.id, null);
  let html = `<div style="margin-top:12px;border-top:1px solid rgba(255,255,255,0.08);padding-top:10px;">
    <h3 style="margin-bottom:8px;">Remplaçants — session du ${fdl(open.date)}</h3>`;
  allIds.forEach(id=>{
    const isInjured = injuredIds.includes(id);
    const currentSub = subs[id];
    const loanedTo = open.loans && open.loans[id] ? groupById(open.loans[id]) : null;
    // Un joueur lui-même absent cette session ne peut pas être "prêté" comme
    // remplaçant ailleurs — il ne joue nulle part cette semaine.
    const eligible = DATA.players.filter(p=> p.id!==id && p.groupId!==g.id && !isAbsent(open,p.id) && (!inUse.has(p.id) || p.id===currentSub));
    const status = isInjured
      ? `<span class="tag tag-down">🤕 blessé</span> <span class="small">— ne descend pas de groupe pour ça</span>`
      : (loanedTo
        ? `<span class="tag tag-up">changement</span> parti(e) au ${escapeHTML(loanedTo.name)}`
        : (isRecLeague() ? '' : `<span class="small">descendra automatiquement d'un groupe</span>`));
    html += `<div class="row" style="margin-bottom:8px;align-items:center;flex-wrap:wrap;">
      <span style="min-width:110px;">${escapeHTML(playerName(id))}</span>
      <span style="min-width:150px;">${status}</span>
      <select onchange="onSubSelect('${g.id}','${id}', this.value)">
        <option value="">— place vide, pas de remplaçant —</option>
        ${eligible.map(p=>{
          const pg = groupById(p.groupId);
          return `<option value="${p.id}" ${p.id===currentSub?'selected':''}>${escapeHTML(p.name)}${pg ? ' ('+escapeHTML(pg.name)+')' : ''}</option>`;
        }).join('')}
        ${(DATA.substitutePool||[]).length ? `<optgroup label="Remplaçants réguliers">
          ${(DATA.substitutePool||[]).map(s=>{
            const subEncoded = 'sub::' + s.id;
            const isAvailable = open && (open.availableSubs||[]).includes(s.id);
            return `<option value="${subEncoded}" ${subEncoded===currentSub?'selected':''}>${escapeHTML(s.name)}${isAvailable ? ' ✓ disponible' : ''}</option>`;
          }).join('')}
        </optgroup>` : ''}
        ${isGuestId(currentSub) ? `<option value="${currentSub}" selected>${escapeHTML(playerName(currentSub))} (invité)</option>` : ''}
        <option value="__guest__">Autre... (invité hors ligue)</option>
      </select>
    </div>`;
  });
  html += `</div>`;
  return html;
}

// Supprime un groupe. S'il contient encore des joueurs, demande confirmation
// et les réassigne automatiquement au premier groupe ayant de la place —
// annule l'opération si un joueur ne peut être replacé nulle part.
// ---------- glisser-déposer d'un joueur entre groupes (ordinateur) ----------
function onPlayerDragStart(ev, pid){
  ev.dataTransfer.setData('text/plain', pid);
  ev.dataTransfer.effectAllowed = 'move';
}
function onGroupDragOver(ev){
  ev.preventDefault();
  ev.currentTarget.classList.add('drop-target-hover');
}
function onGroupDragLeave(ev){
  ev.currentTarget.classList.remove('drop-target-hover');
}
function onGroupDrop(ev, gid){
  ev.preventDefault();
  ev.currentTarget.classList.remove('drop-target-hover');
  const pid = ev.dataTransfer.getData('text/plain');
  if(!pid) return;
  const p = DATA.players.find(x=>x.id===pid);
  const targetGroupId = gid || null;
  if(!p || p.groupId === targetGroupId) return;
  if(!targetGroupId){
    // Déposé sur la carte « En attente d'assignation »
    p.groupId = null;
    p.order = 0;
    saveAndRender();
    return;
  }
  const otherPlayers = DATA.players.filter(x=>x.id!==pid);
  p.groupId = resolveGroupAssignment(targetGroupId, DATA.groups, otherPlayers);
  p.order = nextOrderInGroup(p.groupId);
  saveAndRender();
}
function deleteGroup(gid){
  const g = groupById(gid);
  if(!g) return;
  const members = playersInGroup(gid);
  if(members.length === 0){
    showConfirm(`Supprimer le groupe « ${g.name} » ? Cette action ne peut pas être annulée.`, ()=>{
      DATA.groups = DATA.groups.filter(x=>x.id!==gid);
      saveAndRender();
    });
    return;
  }
  const otherGroups = DATA.groups.filter(x=>x.id!==gid);
  if(otherGroups.length === 0){
    showAlert(`Impossible de supprimer « ${g.name} » : c'est le seul groupe et il contient encore ${members.length} joueur${members.length>1?'s':''}. Crée un autre groupe, ou retire/déplace d'abord ces joueurs.`);
    return;
  }
  showConfirm(`Le groupe « ${g.name} » contient encore ${members.length} joueur${members.length>1?'s':''}. En confirmant, ${members.length>1?'ils seront':'il sera'} automatiquement déplacé${members.length>1?'s':''} vers le premier groupe ayant de la place. Continuer ?`, ()=>{
    const blocked = [];
    members.forEach(p=>{
      const target = firstGroupWithRoom(otherGroups, DATA.players.filter(x=>x.groupId!==gid));
      if(target){ p.groupId = target; } else { blocked.push(p.name); }
    });
    if(blocked.length){
      showAlert(`Tous les autres groupes sont pleins — ${blocked.join(', ')} n'${blocked.length>1?'ont':'a'} pas pu être déplacé${blocked.length>1?'s':''}. Le groupe « ${g.name} » n'a pas été supprimé ; libère de la place ailleurs d'abord.`);
      return;
    }
    DATA.groups = DATA.groups.filter(x=>x.id!==gid);
    saveAndRender();
  });
}

function removePlayer(pid){
  showConfirm('Retirer ce joueur de la ligue ?', async ()=>{
    DATA.players = DATA.players.filter(p=>p.id!==pid);
    (DATA.mlpTeams||[]).forEach(t=>{ t.memberIds = t.memberIds.filter(id=>id!==pid); });
    // Délie aussi le compte éventuellement associé — sinon il reste pointé
    // vers un joueur qui n'existe plus (« compte orphelin », visible dans
    // Organisation > Comptes).
    await sb.from('profile_players').delete().eq('league_id', CURRENT_LEAGUE_ID).eq('player_id', pid);
    saveAndRender();
  });
}

// Vue centralisée de toutes les absences/remplaçants de la session, tous
// groupes confondus, pour éviter d'avoir à fouiller dans chaque groupe.
function adminSessionHTML(){
  const open = currentOpenSession();
  if(!open){
    return `<div class="card"><p class="empty">Aucune session en cours.</p></div>`;
  }
  const manual = DATA.matchupMode === 'manual';
  let html = '';
  groupsSorted().forEach(g=>{
    const gd = open.groupsData.find(x=>x.groupId===g.id);
    if(!gd) return;
    if(DATA.leagueFormat==='social' && activeRosterForGroup(open, g.id).length===0) return; // terrain en trop ce soir
    const expectedRoster = new Set(activeRosterForGroup(open, g.id));
    const inMatches = new Set();
    gd.matches.forEach(m=>{ m.teamA.forEach(id=>inMatches.add(id)); m.teamB.forEach(id=>inMatches.add(id)); });
    const stale = !manual && DATA.leagueFormat !== 'social' && (expectedRoster.size !== inMatches.size || [...expectedRoster].some(id=>!inMatches.has(id)));
    const activeCount = expectedRoster.size;
    const info = DATA.leagueFormat==='social' ? (activeCount+' joueur'+(activeCount>1?'s':'')) : activeCount>0 ? (manual ? `${gd.matches.length} match${gd.matches.length>1?'s':''} (selon le modèle défini dans Réglages)` : `${matchesCountFor(activeCount)} matchs, en ${targetPointsFor(activeCount)} points`) : '';
    const nDone = gd.matches.filter(rsDone).length, nAll = gd.matches.length;
    const showProg = DATA.leagueFormat!=='social' && nAll>0;
    html += `<div class="card rs-card"><div class="rs-top"><div class="rs-name">${escapeHTML(g.name)}</div>${showProg ? `<span class="ah-st ${nDone===nAll?'on':'wait'}" id="rsc_${g.id}">${nDone} / ${nAll}</span>` : ''}</div>${info ? `<div class="ah-meta">${info}</div>` : ''}${showProg ? `<div class="ah-bar rs-bar"><i id="rsb_${g.id}" style="width:${Math.round(100*nDone/nAll)}%"></i></div>` : ''}`;
    if(stale) html += `<div class="rs-warn">Les matchs affichés ne reflètent plus les absences et remplaçants actuels. Refais les matchs de ce groupe.</div>`;
    if(DATA.leagueFormat==='social'){
      const names = activeRosterForGroup(open, g.id).map(playerName).map(escapeHTML);
      html += names.length ? `<div class="pf-list rs-names">${names.map(n=>`<div class="pf-row" style="cursor:default;">${n}</div>`).join('')}</div>` : `<p class="empty">Aucun joueur sur ce terrain.</p>`;
    } else if(gd.matches.length===0){ html += `<p class="empty">${manual ? 'Aucun modèle de rotation défini — configure-le dans Réglages → Paramètres de ligue.' : 'Pas assez de joueurs pour générer des matchs.'}</p>`; }
    gd.matches.forEach((m, mi)=>{
      const nameTag = (id)=>{
        if(!id) return '<span class="rs-tag">position vide</span>';
        if(isGuestId(id)) return escapeHTML(playerName(id)) + ' <span class="rs-tag">invité</span>';
        if(isSubPoolId(id)) return escapeHTML(playerName(id)) + ' <span class="rs-tag">rempl.</span>';
        const p = DATA.players.find(x=>x.id===id);
        const isSub = p && p.groupId !== g.id;
        return escapeHTML(p ? p.name : '?') + (isSub ? ' <span class="rs-tag">rempl.</span>' : '');
      };
      const team = t=> t.length ? t.map(nameTag).join('<br>') : '<span class="rs-tag">position vide</span>';
      const sit = (!manual && m.sit) ? `<div class="rs-sit">Repos : ${escapeHTML(sitLabel(m))}</div>` : '';
      html += `
        <div class="rs-m ${rsClass(m)}" id="rsm_${g.id}_${mi}">
          <div class="rs-mh"><b>Match ${mi+1}</b>${scoreMarkHTML('ladder', g.id, mi, m, false, true)}<span class="rs-state">${rsDone(m)?'✓':'À saisir'}</span></div>
          <div class="rs-line a"><div class="rs-team">${team(m.teamA)}</div><input class="pill-input rs-in" type="number" inputmode="numeric" min="0" aria-label="Score de l'équipe 1" value="${m.scoreA===null?'':m.scoreA}" onchange="setScore('${g.id}','${mi}','A',this.value)"></div>
          <div class="rs-line b"><div class="rs-team">${team(m.teamB)}</div><input class="pill-input rs-in" type="number" inputmode="numeric" min="0" aria-label="Score de l'équipe 2" value="${m.scoreB===null?'':m.scoreB}" onchange="setScore('${g.id}','${mi}','B',this.value)"></div>
          ${sit}
        </div>`;
    });
    html += `<div class="pf-list rs-acts">` + (DATA.leagueFormat==='social' ? `<button class="pf-row" onclick="socialRedraw()"><span class="ic">🎲</span><span class="t">Refaire le tirage des terrains</span><span class="ch">›</span></button>` : `<button class="pf-row" onclick="regenerate('${g.id}')"><span class="ic">↻</span><span class="t">Refaire les matchs de ce groupe</span><span class="ch">›</span></button>`);
    if(DATA.testMode && gd.matches.length){
      html += `<button class="pf-row" onclick="autoFillGroupScores('${g.id}')"><span class="ic">🎲</span><span class="t">Scores aléatoires (test)</span><span class="ch">›</span></button>`;
    }
    html += `</div>`;
    html += `</div>`;
  });
  return html;
}

function rsDone(m){ return m.scoreA!=null && m.scoreB!=null && m.scoreA!=='' && m.scoreB!==''; }
function rsClass(m){
  if(!rsDone(m)) return 'todo';
  const a = Number(m.scoreA), b = Number(m.scoreB);
  return 'done' + (a>b ? ' wa' : (b>a ? ' wb' : ''));
}
// Met à jour la carte du match et la progression du groupe sans redessiner (garde le focus).
function refreshRsMatch(gid, mi, m){
  const el = document.getElementById('rsm_'+gid+'_'+mi);
  if(!el) return;
  el.className = 'rs-m ' + rsClass(m) + (el.classList.contains('me') ? ' me' : '') + (el.getAttribute('data-edit')==='0' ? ' ro' : '');
  const st = el.querySelector('.rs-state'); if(st) st.textContent = rsDone(m) ? '✓' : 'À saisir';
  const open = currentOpenSession(); const gd = open && open.groupsData.find(x=>x.groupId===gid);
  if(!gd) return;
  const n = gd.matches.filter(rsDone).length, t = gd.matches.length;
  const c = document.getElementById('rsc_'+gid); if(c){ c.textContent = n+' / '+t; c.className = 'ah-st '+(n===t?'on':'wait'); }
  const b = document.getElementById('rsb_'+gid); if(b) b.style.width = Math.round(100*n/(t||1))+'%';
}
// Vérifie la date choisie contre les dates bloquées et la fin de saison
// configurées dans le calendrier (jusqu'ici cette vérification n'existait
// que pour l'auto-démarrage après finalisation, jamais pour un démarrage
// manuel — une session pouvait donc être créée un jour explicitement
// bloqué, ou après la fin de saison, sans aucun avertissement).
function checkAndStartSession(explicitDate){
  const date = explicitDate || nextSessionDate();
  const blocked = new Set(DATA.blockedDates || []);
  const seasonEnd = DATA.seasonEndDate || null;
  const warnings = [];
  if(blocked.has(date)) warnings.push(`le ${date} est marqué comme date bloquée dans le calendrier de saison`);
  if(seasonEnd && date > seasonEnd) warnings.push(`le ${date} dépasse la fin de saison configurée (${seasonEnd})`);
  if(warnings.length){
    showConfirm(`Attention : ${warnings.join(' et ')}. Créer quand même une session pour cette date ?`, ()=>{
      startNewSession(date);
      saveAndRender();
    });
    return;
  }
  startNewSession(date);
  saveAndRender();
}
// ---------- Lancement d'une session : présentation simplifiée ----------
const FR_DAYS = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const FR_MONTHS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
function frDateParts(str){
  const d = new Date(String(str) + 'T00:00:00');
  if(isNaN(d.getTime())) return { day:'', rest:String(str), d:null };
  return { day: FR_DAYS[d.getDay()], rest: d.getDate() + (d.getDate()===1 ? 'er' : '') + ' ' + FR_MONTHS[d.getMonth()], d };
}
// Date dans une phrase : « mardi 3 novembre ».
function fdl(str){ return frDateLong(str).toLowerCase(); }
function frDateLong(str){
  const p = frDateParts(str);
  return p.d ? (p.day.charAt(0).toUpperCase() + p.day.slice(1) + ' ' + p.rest) : p.rest;
}
function daysFromToday(str){
  const p = frDateParts(str); if(!p.d) return null;
  const t = new Date(); const t0 = new Date(t.getFullYear(), t.getMonth(), t.getDate());
  return Math.round((p.d.getTime() - t0.getTime()) / 86400000);
}
function launchChecks(){
  // Rotation sociale : les groupes sont tirés au hasard au lancement de chaque session,
  // donc rien à vérifier tant qu'aucune session n'est ouverte.
  const social = DATA.leagueFormat === 'social';
  const openS = social ? currentOpenSession() : null;
  const unassigned = (social && !openS) ? 0 : (DATA.players||[]).filter(p=>!p.groupId && !p.injured && !(openS && isAbsent(openS, p.id))).length;
  const sizes = (DATA.groups||[]).map(g=>playersInGroup(g.id).length).filter(n=>n>0);
  const bad = (social && !openS) ? 0 : sizes.filter(n=>(n<GROUP_MIN_PLAYERS() || n>GROUP_MAX_PLAYERS()) && n!==6).length;
  const total = sizes.reduce((a,b)=>a+b,0);
  return { unassigned, bad, groups:sizes.length, total, min:sizes.length?Math.min.apply(null,sizes):0, max:sizes.length?Math.max.apply(null,sizes):0 };
}
function stepRow(state, title, sub, btn){
  const ic = state==='ok' ? '✓' : (state==='warn' ? '!' : '');
  return `<div class="stp"><div class="stp-ic ${state}">${ic}</div><div class="stp-t"><b>${title}</b>${sub?`<span>${sub}</span>`:''}</div>${btn||''}</div>`;
}

    hero = `<div class="lnc-card${warn?' warn':''}">

      ${warn ? `<div class="lnc-warn"><div class="stp-ic warn" style="background:#E9C23C;color:#0C2622;">!</div><div>${warn}</div></div>` : `<div class="lnc-sub">${escapeHTML(dleft)}${when}</div>`}
      ${warn && valid ? `<button class="lnc-main" onclick="checkAndStartSession('${valid}')">Prendre le ${escapeHTML(frDateLong(valid).toLowerCase())}</button><div style="text-align:center;font-size:14px;color:var(--muted);">Prochaine date libre</div><button class="lnc-alt line" onclick="checkAndStartSession('${baseDate}')">Démarrer quand même le ${escapeHTML(p.rest)}</button>`
        : `<button class="lnc-main" onclick="checkAndStartSession('${baseDate}')">Démarrer la session</button>`}

  if(isRecLeague()){

      : stepRow('warn', nAct + ' joueur' + (nAct>1?'s':'') + ' actif' + (nAct>1?'s':''), 'Il faut au moins 4 joueurs pour former un terrain', `<button class="btn-ghost" onclick="setAdminTab('joueurs')">Joueurs</button>`));
  } else {
  rows.push(c.bad===0 && c.groups>0

    : stepRow('warn', c.groups===0 ? 'Aucun groupe' : c.bad + ' groupe' + (c.bad>1?'s':'') + ' hors limites', 'Vérifie les groupes ci-dessous', c.groups===0 ? '' : `<button class="btn-ghost" onclick="goSessionTab('groupes')">Voir</button>`));

// « Placer » : ouvre l'onglet Groupes, fait défiler jusqu'à « En attente d'assignation » et la fait clignoter.
function focusWaitingPlayers(){
  VIEW.sessionSubTab = 'groupes'; render();

    const el = document.getElementById('waitCard');

    try{ el.scrollIntoView({ behavior:'smooth', block:'center' }); }catch(e){ el.scrollIntoView(); }
    el.classList.remove('flash-hl'); void el.offsetWidth; el.classList.add('flash-hl');

// Étapes cochées d'une session ouverte : groupes prêts, session publiée, scores saisis.
function sessionStepsHTML(open){
  const c = launchChecks();
  let total = 0, done = 0;
  (open.groupsData||[]).forEach(gd=>(gd.matches||[]).forEach(m=>{ total++; if(m.scoreA!=null && m.scoreB!=null && m.scoreA!=='' && m.scoreB!=='') done++; }));
  if(isRecLeague()){
    const nPlaced = (DATA.players||[]).filter(p=>p.groupId && !p.injured && !isAbsent(open, p.id)).length;
    return `<div class="stp-list">${[
      c.unassigned===0 ? stepRow('ok','Terrains tirés au hasard', nPlaced + ' joueur' + (nPlaced>1?'s':'') + ' présent' + (nPlaced>1?'s':'')) : stepRow('warn', c.unassigned + ' joueur' + (c.unassigned>1?'s':'') + ' sans terrain', 'Pas assez de place sur les terrains', `<button class="btn-ghost" onclick="focusWaitingPlayers()">Voir</button>`),
      open.published ? stepRow('ok','Soirée publiée','') : stepRow('todo','Publier la soirée','Les joueurs verront leur terrain')
    ].join('')}</div>`;
  }
  const rows = [
    c.unassigned===0 ? stepRow('ok','Groupes prêts','') : stepRow('warn', c.unassigned + ' joueur' + (c.unassigned>1?'s':'') + ' sans groupe', '', `<button class="btn-ghost" onclick="focusWaitingPlayers()">Placer</button>`),
    open.published ? stepRow('ok','Session publiée','') : stepRow('todo','Publier la session','Les joueurs verront leurs matchs'),
    (total>0 && done===total) ? stepRow('ok','Tous les scores saisis', total + ' matchs') : stepRow('todo','Entrer les scores', done + ' sur ' + total + ' saisis', total>0 ? `<button class="btn-ghost" onclick="goSessionTab('resultats')">Saisir</button>` : '')
  ];
  return `<div class="stp-list">${rows.join('')}</div>`;
}

// Feuille de pointage — pensée pour l'impression en PAYSAGE : un visuel
// simple et aéré, une carte par match avec deux grandes cases de score à
// remplir au crayon (plus faciles à lire/entrer ensuite que de petites
// cases dans un tableau serré).
function printableMatchSheetsHTML(session){
  let html = '';
  groupsSorted().forEach(g=>{
    const gd = session.groupsData.find(x=>x.groupId===g.id);
    if(!gd || !gd.matches || gd.matches.length===0) return;
    const activeCount = activeRosterForGroup(session, g.id).length;
    const target = targetPointsFor(activeCount);
    const n = gd.matches.length;
    // Une seule colonne (un match par ligne) ; la taille des lignes se
    // resserre automatiquement selon le nombre de matchs (palier testé,
    // voir matchSheetTierFor) pour que tout tienne sur une seule page
    // portrait par groupe.
    const rowStyleVars = matchSheetRowStyleVars(n);
    html += `<div class="ms-page">
      <div class="ms-header">
        <div>
          <div class="ms-league">${escapeHTML(DATA.leagueName)}</div>
          <div class="ms-group">${escapeHTML(g.name)}</div>
        </div>

// Vérifie que chaque groupe a des matchs générés et à jour par rapport aux
// absences/remplaçants actuels, avant de permettre la publication aux joueurs.
function sessionCompletionIssues(session){
  const issues = [];
  groupsSorted().forEach(g=>{
    const memberCount = playersInGroup(g.id).length;
    if(memberCount > Math.max(GROUP_MAX_PLAYERS(), GROUP_HARD_MAX)){
      issues.push(`${g.name} : ${memberCount} joueurs, au-dessus de la limite de ${GROUP_HARD_MAX} — déplace des joueurs avant de publier`);
    }
    const gd = session.groupsData.find(x=>x.groupId===g.id);
    if(!gd) return;
    if(DATA.leagueFormat === 'social') return; // rotation sociale : pas de matchs à vérifier
    if(gd.matches.length===0){
      issues.push(`${g.name} : pas assez de joueurs pour générer des matchs`);
      return;
    }
    const expected = new Set(activeRosterForGroup(session, g.id));
    const inMatches = new Set();
    gd.matches.forEach(m=>{ m.teamA.forEach(id=>inMatches.add(id)); m.teamB.forEach(id=>inMatches.add(id)); });
    const stale = expected.size !== inMatches.size || [...expected].some(id=>!inMatches.has(id));
    if(stale) issues.push(`${g.name} : les matchs ne reflètent plus les absences/remplaçants actuels — régénère-les`);
  });
  return issues;
}
// Liste les places vides (absent sans remplaçant, ni joueur ni invité) par groupe.
function emptySpotWarnings(session){
  const warnings = [];
  groupsSorted().forEach(g=>{
    const gd = session.groupsData.find(x=>x.groupId===g.id);
    if(!gd) return;
    const subs = gd.substitutes || {};
    playersInGroup(g.id).forEach(p=>{
      if(isAbsent(session, p.id) && !subs[p.id]){
        warnings.push(`${g.name} : place de ${p.name} vide (aucun remplaçant)`);
      }
    });
  });
  return warnings;
}
function onPublishSession(){
  const open = currentOpenSession();
  if(!open) return;
  const issues = sessionCompletionIssues(open);
  if(issues.length){
    showAlert("Impossible de publier la session — certains groupes ne sont pas complets :\n\n" + issues.map(i=>'• '+i).join('\n'));
    return;
  }
  const empties = emptySpotWarnings(open);
  if(empties.length){
    showConfirm("Attention, certaines places resteront vides pour cette session, sans remplaçant :\n\n" + empties.map(i=>'• '+i).join('\n') + "\n\nPublier quand même ?", ()=>{
      open.published = true;
      saveAndRender();
      notifySessionPublished(open);
    });
    return;
  }
  open.published = true;
  saveAndRender();
  notifySessionPublished(open);
}
function onUnpublishSession(){
  const open = currentOpenSession();
  if(!open) return;
  open.published = false;
  saveAndRender();
}

// Appelé AVANT qu'un admin modifie une unité : marque l'unité « admin »,
// et journalise l'ancien score.
function scoreAdminTouch(u, isMlp, ctx, playerIds){
  const had = scoreComplete(u,isMlp);
  const old = had ? scoreText(u,isMlp) : '';
  if(had){ u.sEdited = true; u.sPrev = isMlp ? `${u.pointsA}–${u.pointsB}` : old; scoreLogAdd({ kind:'admin', by:scoreAdminLabel(), ctx, old }); }
  u.sBy = 'admin'; u.sByName = scoreAdminLabel(); u.sAt = new Date().toISOString();

// Quand un joueur se déclare absent, le serveur ne peut pas recalculer les matchs :
// il marque les groupes concernés, et l'admin les recalcule à sa prochaine ouverture.
// Si l'effectif actif d'un groupe a changé (ex. un 6e joueur ajouté après la génération), les matchs
// d'une séance ouverte sans aucun score sont recalculés pour respecter la règle (5 joueurs = 10, 6 = rotation de 6).
function syncOpenSessionMatchCounts(){
  try{
    const open = currentOpenSession();
    if(!open || !SESSION_USER || SESSION_USER.role!=='admin' || OFFLINE_MODE || DATA.testMode) return;
    let changed = false;
    open.groupsData.forEach(gd=>{
      if(!gd.matches || !gd.matches.length) return;
      if(gd.matches.some(m=>m.scoreA!=null||m.scoreB!=null)) return;
      const n = activeRosterForGroup(open, gd.groupId).length;
      if(n !== 4 && n !== 5 && n !== 6) return;
      if(DATA.matchupMode==='manual' && n !== 6) return;
      const hasSit2 = gd.matches.some(m=>m.sit2);
      if(gd.matches.length !== matchesCountFor(n) || (n===6) !== hasSit2){
        regenerateGroupMatches(open, gd.groupId); changed = true;
      }
    });
    if(changed) saveData();
  }catch(e){ console.error(e); }
}
function processPendingRegen(){
  syncOpenSessionMatchCounts();
  try{
    const o = currentOpenSession();
    if(o && DATA.leagueFormat === 'social' && SESSION_USER && SESSION_USER.role === 'admin' && !OFFLINE_MODE
       && DATA.players.some(function(p){ return p.groupId && (p.injured || isAbsent(o, p.id)); })){
      const res = socialReconcile(o);
      o.groupsData = DATA.groups.map(function(g){ return { groupId:g.id, matches:[] }; });
      saveData();
      if(res === 'redrawn' && o.published) notifySocialRedraw(o);
    }
  }catch(e){ console.error(e); }
  try{
    const open = currentOpenSession();
    if(!open || !Array.isArray(open.regenGroups) || !open.regenGroups.length) return;
    if(!SESSION_USER || SESSION_USER.role!=='admin' || OFFLINE_MODE) return;
    open.regenGroups.forEach(gid=>{
      const gd = open.groupsData.find(x=>x.groupId===gid);
      if(gd && !gd.matches.some(m=>m.scoreA!=null||m.scoreB!=null)) regenerateGroupMatches(open, gid);
    });
    open.regenGroups = [];
    saveData();
  }catch(e){ console.error(e); }
}

  try{ const l = await loadData(CURRENT_LEAGUE_ID); if(l){ DATA = l; migrateData(); } }catch(e){ console.error(e); }
  render();
}

// ---- Côté admin : boîte de réception des corrections ----
// Texte lisible d'une ligne du journal : groupe + joueurs (ou équipes en MLP),
// reconstitué à l'affichage à partir des identifiants.
function scoreLogCtx(e){
  try{
    let gid = e.gid, mi = e.mi, sid = e.sid, tid = null, a = null, b = null;
    let m = /^Match (\d+) — groupe (.+)$/.exec(e.ctx||'');
    if(m && gid==null){ mi = +m[1]-1; gid = m[2]; }
    if(gid!=null && mi!=null){
      const ss = (sid && (DATA.sessions||[]).find(x=>x.id===sid)) || currentOpenSession() || (DATA.sessions||[])[(DATA.sessions||[]).length-1];
      const gd = ss && ss.groupsData.find(x=>x.groupId===gid); const mt = gd && gd.matches[mi];
      if(mt){ const g = groupById(gid); return `${g?g.name+' — ':''}${mt.teamA.map(playerName).join(' & ')} vs ${mt.teamB.map(playerName).join(' & ')}`; }
    }
    m = /^Affrontement (\S+) vs (\S+)$/.exec(e.ctx||'');
    if(m){ a = m[1]; b = m[2]; }
    if(e.tid){ const t0 = (DATA.mlpSessions||[]).flatMap(x=>x.ties||[]).find(x=>x.id===e.tid); if(t0){ a = t0.teamAId; b = t0.teamBId; } }
    if(a && b){ const na = (DATA.mlpTeams||[]).find(t=>t.id===a), nb = (DATA.mlpTeams||[]).find(t=>t.id===b); if(na && nb) return `${na.name} vs ${nb.name}`; }
  }catch(err){}
  return e.ctx || '';
}

function refreshMatchHead(gid, mi, m){

function setScore(gid, mi, which, val){
  const open = currentOpenSession();
  // Verrou : on ne modifie jamais les scores d'une session close/finalisée, et un joueur
  // ne peut saisir que si l'admin a activé la saisie par les joueurs.
  if(!open || open.status!=='open'){ showAlert("Cette session est terminée : les scores sont verrouillés."); render(); return; }
  if(SESSION_USER && SESSION_USER.role!=='admin' && !DATA.allowPlayerScoreEntry){ showAlert("La saisie des scores est réservée aux administrateurs."); render(); return; }
  if(SESSION_USER && SESSION_USER.role!=='admin'){ showAlert("Utilise le bouton « Envoyer le score »."); render(); return; }
  const gd = open.groupsData.find(x=>x.groupId===gid);
  const m = gd.matches[mi];
  if(SESSION_USER && SESSION_USER.role==='admin') scoreAdminTouch(m, false, ladderMatchCtx(open, gid, m), [...m.teamA, ...m.teamB]);
  if(which==='A') m.scoreA = val===''? null : Number(val);
  else m.scoreB = val===''? null : Number(val);
  saveData();
  refreshMatchHead(gid, mi, m);
  refreshRsMatch(gid, mi, m);
}
function regenerate(gid){
  const open = currentOpenSession();
  regenerateGroupMatches(open, gid);

}
// Remplit des scores aléatoires plausibles (mode test) pour accélérer les essais.
function fillGroupScores(open, gid){
  const gd = open.groupsData.find(x=>x.groupId===gid);
  if(!gd) return;
  const activeCount = activeRosterForGroup(open, gid).length;
  const target = targetPointsFor(activeCount);
  gd.matches.forEach(m=>{
    const aWins = Math.random() < 0.5;
    const loserScore = Math.floor(Math.random() * Math.max(1, target - 1));
    if(aWins){ m.scoreA = target; m.scoreB = loserScore; } else { m.scoreB = target; m.scoreA = loserScore; }
  });
}
function autoFillGroupScores(gid){
  const open = currentOpenSession();
  if(!open) return;
  fillGroupScores(open, gid);
  saveAndRender();
}
function autoFillAllScores(){
  const open = currentOpenSession();
  if(!open) return;
  DATA.groups.forEach(g=> fillGroupScores(open, g.id));
  saveAndRender();
}
function onCancelSession(){
  showConfirm('Annuler cette session ?', ()=>{
    DATA.sessions = DATA.sessions.filter(s=>s.status!=='open');
    saveAndRender();
  });
}
function onFinalize(){
  const open = currentOpenSession();
  const incomplete = open.groupsData.some(gd=>gd.matches.some(m=>m.scoreA===null || m.scoreB===null));
  const afterFinalize = ()=>{
    const finishedDate = open.date;
    const wasCorrection = !!open.reopenedAt;
    finalizeSession(open);
    // Récréatif : aucun résultat ni palmarès à annoncer.
    if(!isRecLeague()){
      notifySessionResultsPublished(finishedDate, wasCorrection);
    }
    if(DATA.autoStartSessions){
      autoStartNextSession(finishedDate);
    }
    saveAndRender();
  };
  if(incomplete && DATA.leagueFormat !== 'social'){
    showConfirm('Certains pointages sont manquants et seront ignorés dans le calcul. Continuer ?', afterFinalize);
  } else {
    afterFinalize();
  }
}
// Tente de créer automatiquement la prochaine session, selon le calendrier
// de saison (dates bloquées, fin de saison). Avertit si des dates ont été
// sautées, ou si la fin de saison est atteinte.
function autoStartNextSession(lastSessionDate){
  // Une semaine après la session qu'on vient de terminer — pas "aujourd'hui",
  // sinon terminer une session le jour même en recréerait une à la même date.
  const base = new Date(lastSessionDate + 'T00:00:00');
  const fromDate = fmtDate(new Date(base.getFullYear(), base.getMonth(), base.getDate() + 7));
  const result = nextValidSessionDate(fromDate);
  if(!result.date){
    showAlert(`Fin de saison atteinte (${DATA.seasonEndDate}) — aucune nouvelle session n'a été créée automatiquement. Tu peux ajuster la date de fin dans Réglages si besoin.`);
    return;
  }
  const session = startNewSession(result.date);
  if(DATA.autoPublishSessions){
    session.published = true;
    notifySessionPublished(session);
  }
  // On bascule directement sur la nouvelle session, pour que ce soit visible
  // à l'écran tout de suite plutôt que de rester sur la session terminée.
  VIEW = { tab:'session', sessionSubTab:'groupes' };
  const skipNote = result.skipped.length
    ? ` (${result.skipped.length>1 ? 'les dates suivantes étaient bloquées et ont été sautées' : 'la date '+result.skipped[0]+' était bloquée et a été sautée'} : ${result.skipped.join(', ')})`
    : '';
  showAlert(`✅ Session terminée — la prochaine a été créée automatiquement pour le ${result.date}${DATA.autoPublishSessions ? ', et publiée aux joueurs' : ''}.${skipNote}`);
}

// ---------- Rapports (statistiques calculées à partir de l'historique) ----------
function computePlayerReports(){
  const closed = DATA.sessions.filter(s=>s.status==='closed');
  const stats = {};
  DATA.players.forEach(p=>{ stats[p.id] = { wins:0, losses:0, played:0, scheduled:0, totalPoints:0, sessionsAbsent:0, sessionsAppeared:0, promotions:0, relegations:0, ratingChange:0, subCount:0 }; });
  closed.forEach(s=>{
    const appeared = new Set();
    if(s.standingsByGroup){
      Object.keys(s.standingsByGroup).forEach(gid=>{
        (s.standingsByGroup[gid]||[]).forEach(r=>{
          if(!stats[r.playerId]) return; // invité ou joueur retiré depuis
          stats[r.playerId].wins += r.wins||0;
          stats[r.playerId].losses += r.losses||0;
          stats[r.playerId].played += r.played||0;
          stats[r.playerId].scheduled += r.scheduled||0;
          stats[r.playerId].totalPoints += r.pf||0;
          appeared.add(r.playerId);
        });
      });
    }
    appeared.forEach(pid=>{ if(stats[pid]) stats[pid].sessionsAppeared++; });
    (s.absences||[]).forEach(pid=>{ if(stats[pid]) stats[pid].sessionsAbsent++; });
    (s.movements||[]).forEach(m=>{
      if(!stats[m.playerId]) return;
      const fromG = groupById(m.fromGroupId), toG = groupById(m.toGroupId);
      if(fromG && toG){
        if(toG.order < fromG.order) stats[m.playerId].promotions++;
        else stats[m.playerId].relegations++;
      }
    });
    if(s.ratingDeltas){
      Object.keys(s.ratingDeltas).forEach(pid=>{ if(stats[pid]) stats[pid].ratingChange += s.ratingDeltas[pid]; });
    }
    if(s.loans){
      Object.keys(s.loans).forEach(pid=>{ if(stats[pid]) stats[pid].subCount++; });
    }
  });
  return DATA.players.map(p=>{
    const st = stats[p.id];
    const totalGames = st.wins + st.losses;
    const totalRelevant = st.sessionsAbsent + st.sessionsAppeared;
    return {
      player: p,
      wins: st.wins, losses: st.losses,
      winRate: totalGames>0 ? st.wins/totalGames : null,
      played: st.played, scheduled: st.scheduled, totalPoints: st.totalPoints,
      sessionsAbsent: st.sessionsAbsent, sessionsAppeared: st.sessionsAppeared,
      absenceRate: totalRelevant>0 ? st.sessionsAbsent/totalRelevant : null,
      promotions: st.promotions, relegations: st.relegations,
      ratingChange: st.ratingChange,
      subCount: st.subCount
    };
  });
}
