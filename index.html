<title>Ligue de Pickleball</title>
<style>
:root{
  --court: #0F3B3F;
  --court-light: #15525A;
  --line: #EDEDEA;
  --ball: #CFEA5C;
  --ball-dark: #9FBF3A;
  --paddle: #E96A3C;
  --text: #F3F5EF;
  --muted: #8FB3AE;
  --danger: #E9556B;
  --radius: 10px;
  --font-display: 'Arial Narrow', 'Helvetica Neue Condensed', Arial, sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--court);color:var(--text);font-family:var(--font-body);min-height:100%;}
body{padding:0;}
#app{width:100%;padding:20px 24px 60px;}
h1,h2,h3{font-family:var(--font-display);font-weight:800;letter-spacing:0.02em;margin:0 0 4px;text-transform:uppercase;}
h1{font-size:28px;color:var(--ball);}
h2{font-size:20px;color:var(--line);}
h3{font-size:15px;color:var(--muted);}
p{margin:4px 0;line-height:1.4;}
.eyebrow{font-family:var(--font-display);font-size:12px;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);margin-bottom:2px;}
.card{background:var(--court-light);border-radius:var(--radius);padding:16px;margin-bottom:20px;border:1px solid rgba(255,255,255,0.03);}
.card-divider{border-top:1px solid rgba(255,255,255,0.08);margin:16px 0;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.btn{font-family:var(--font-display);text-transform:uppercase;letter-spacing:0.04em;font-weight:700;font-size:13px;border:none;border-radius:999px;padding:10px 18px;cursor:pointer;transition:transform .1s ease, opacity .15s ease;}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--ball);color:#0F3B3F;}
.btn-primary:hover{background:var(--ball-dark);}
.btn-secondary{background:transparent;color:var(--line);border:1px solid rgba(255,255,255,0.25);}
.btn-secondary:hover{border-color:var(--ball);color:var(--ball);}
.btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}
.btn-danger:hover{background:rgba(233,85,107,0.12);}
.btn-ghost{display:inline-block;background:rgba(255,255,255,0.08);color:var(--line);border:none;border-radius:999px;padding:7px 14px;font-family:var(--font-body);text-transform:none;letter-spacing:0;font-weight:500;font-size:13px;text-decoration:none;cursor:pointer;transition:background .15s ease, color .15s ease, opacity .15s ease;margin:2px 4px 2px 0;}
.btn-ghost:hover{background:rgba(255,255,255,0.16);color:var(--ball);}
.btn-ghost:disabled{opacity:0.4;cursor:not-allowed;}
.btn-ghost-danger{display:inline-block;background:rgba(233,85,107,0.12);color:var(--danger);border:none;border-radius:999px;padding:7px 14px;font-family:var(--font-body);text-transform:none;letter-spacing:0;font-weight:500;font-size:13px;text-decoration:none;cursor:pointer;transition:background .15s ease, opacity .15s ease;margin:2px 4px 2px 0;}
.btn-ghost-danger:hover{background:rgba(233,85,107,0.22);}
.btn-ghost-danger:disabled{opacity:0.4;cursor:not-allowed;}
.btn-icon{display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.08);color:var(--line);border:none;border-radius:10px;width:38px;height:38px;font-size:15px;cursor:pointer;transition:background .15s ease,opacity .15s ease;margin:2px;}
.btn-icon:hover{background:rgba(255,255,255,0.16);color:var(--ball);}
.btn-icon:disabled{opacity:0.35;cursor:not-allowed;}
input,select{font-family:var(--font-body);font-size:14px;padding:9px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.2);background:rgba(0,0,0,0.2);color:var(--text);}
input::placeholder{color:var(--muted);}
input:focus,select:focus{outline:2px solid var(--ball);outline-offset:1px;}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px;}
.field{margin-bottom:10px;}
table{width:100%;border-collapse:collapse;margin-top:8px;}
th{text-align:left;font-family:var(--font-display);font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid rgba(255,255,255,0.15);}
th.sortable{cursor:pointer;user-select:none;}
th.sortable:hover{color:var(--ball);}
td{padding:8px;border-bottom:1px solid rgba(255,255,255,0.06);font-size:14px;}
tr.me{background:rgba(207,234,92,0.1);}
.tag{display:inline-block;font-family:var(--font-display);font-size:11px;padding:3px 9px;border-radius:999px;letter-spacing:0.05em;text-transform:uppercase;}
.tag-up{background:rgba(207,234,92,0.18);color:var(--ball);}
.tag-down{background:rgba(233,85,107,0.15);color:var(--danger);}
.tag-stay{background:rgba(255,255,255,0.08);color:var(--muted);}
.tag-green{background:rgba(76,175,80,0.18);color:#6FCF73;}
.tag-yellow{background:rgba(255,214,10,0.18);color:#FFD60A;}
.tag-orange{background:rgba(255,159,10,0.18);color:#FF9F0A;}
.modal-header-row{display:flex;align-items:center;gap:14px;margin-bottom:6px;}
.avatar-circle{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg, var(--ball), #8FBF3F);color:var(--court);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:19px;flex-shrink:0;}
.modal-badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.stat-chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0;}
.champion-card{background:linear-gradient(135deg, rgba(255,214,10,0.18), rgba(207,234,92,0.10));border:1px solid rgba(255,214,10,0.4);border-radius:18px;padding:26px 20px;text-align:center;}
.champion-card .trophy{font-size:44px;line-height:1;margin-bottom:6px;}
.champion-card .champion-label{font-family:var(--font-display);font-size:12px;text-transform:uppercase;letter-spacing:0.1em;color:#FFD60A;margin-bottom:6px;}
.champion-card .champion-name{font-size:26px;font-weight:800;color:var(--line);margin-bottom:4px;}
.champion-card .runner-up{margin-top:14px;font-size:13px;color:var(--muted);}
.stat-chip{display:flex;flex-direction:column;background:rgba(255,255,255,0.05);border-radius:12px;padding:9px 16px;min-width:84px;}
.stat-chip .stat-label{font-family:var(--font-display);font-size:10px;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);margin-bottom:2px;}
.stat-chip .stat-value{font-size:17px;font-weight:700;color:var(--line);}
.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0;}
.action-btn{display:flex;align-items:center;gap:9px;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,0.05);border:none;color:var(--line);font-family:var(--font-body);font-size:14px;cursor:pointer;text-align:left;transition:background .15s ease;}
.action-btn:hover{background:rgba(255,255,255,0.11);}
.action-btn .icon{font-size:18px;flex-shrink:0;}
.action-btn.danger{color:var(--danger);background:rgba(233,85,107,0.10);}
.action-btn.danger:hover{background:rgba(233,85,107,0.18);}
.modal-section{background:rgba(255,255,255,0.03);border-radius:14px;padding:14px;margin-top:14px;}
.modal-section h3{margin:0 0 10px;font-size:13px;}
.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
.tab{padding:9px 18px;font-family:var(--font-display);font-size:12px;letter-spacing:0.04em;text-transform:uppercase;color:var(--muted);cursor:pointer;border-radius:999px;white-space:nowrap;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);transition:background .15s ease,color .15s ease;}
.tab.active{color:var(--court);background:var(--ball);font-weight:700;border-color:var(--ball);}
.tab:not(.active):hover{background:rgba(255,255,255,0.12);color:var(--line);}

.hamburger-btn{background:none;border:none;color:var(--text);font-size:26px;line-height:1;cursor:pointer;padding:8px 12px 8px 0;flex-shrink:0;min-height:44px;display:flex;align-items:center;}
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:900;display:flex;animation:drawerFadeIn .15s ease-out;}
@keyframes drawerFadeIn{from{opacity:0;}to{opacity:1;}}
.drawer-panel{width:78%;max-width:300px;height:100%;background:var(--court);border-right:1px solid rgba(255,255,255,0.1);display:flex;flex-direction:column;box-shadow:6px 0 28px rgba(0,0,0,0.45);animation:drawerSlideIn .18s ease-out;overflow-y:auto;}
@keyframes drawerSlideIn{from{transform:translateX(-100%);}to{transform:translateX(0);}}
.drawer-header{display:flex;align-items:center;gap:10px;padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,0.08);}
.drawer-header img{width:34px;height:34px;border-radius:8px;object-fit:cover;}
.drawer-header h2{margin:0;font-size:15px;color:var(--line);}
.drawer-extra{padding:12px 18px;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;flex-direction:column;gap:12px;}
.drawer-extra .btn,.drawer-extra .btn-ghost{width:100%;}
.drawer-extra-block label{font-size:12px;color:var(--muted);}
.drawer-extra-block:not(:last-child){padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,0.06);}
.drawer-actions{border-bottom:1px solid rgba(255,255,255,0.08);padding:6px 0;}
.drawer-nav{flex:1;padding:10px 0;}
.drawer-item{display:flex;align-items:center;gap:14px;padding:13px 18px;cursor:pointer;border-left:3px solid transparent;font-family:var(--font-display);font-size:14px;letter-spacing:0.02em;text-transform:uppercase;color:var(--muted);}
.drawer-item.active{background:rgba(255,255,255,0.06);border-left-color:var(--ball);color:var(--ball);}
.drawer-item .drawer-icon{font-size:17px;width:20px;text-align:center;flex-shrink:0;}
.drawer-footer{padding:14px 18px;border-top:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;gap:10px;}
.drawer-avatar{width:34px;height:34px;border-radius:50%;background:var(--ball);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--court);flex-shrink:0;}
.drawer-account-info{flex:1;min-width:0;}
.drawer-account-info .name{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--line);}
.drawer-account-info .email{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.drawer-logout-btn{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;flex-shrink:0;}
.bottom-nav-spacer{height:0;}
.bottom-nav{display:none;}
.bottom-nav-item{background:none;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 18px;cursor:pointer;font-family:var(--font-body);border-radius:10px;min-width:64px;}
.bottom-nav-item.active{color:var(--ball);}
.bottom-nav-item .bn-icon{font-size:20px;line-height:1;}
.bottom-nav-item .bn-label{font-size:11px;letter-spacing:0.02em;}
.bottom-nav-item.raised{margin-top:-22px;}
.bn-icon-circle{width:52px;height:52px;border-radius:50%;background:var(--ball);color:var(--court);display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 8px 18px rgba(0,0,0,0.45);margin-bottom:2px;}
.bottom-nav-item.raised .bn-label{color:var(--muted);}
.topbar{margin-bottom:18px;background:linear-gradient(120deg, var(--court-light), var(--court));border-radius:14px;padding:12px 16px;border:1px solid rgba(255,255,255,0.06);}
.topbar-main{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.topbar-main-3col{display:grid;grid-template-columns:1fr auto 1fr;}
.topbar-center-info{display:none;align-items:center;gap:8px;}
.tci-chip{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.14);border-radius:999px;padding:7px 14px;white-space:nowrap;cursor:pointer;transition:background .15s ease,border-color .15s ease;font:inherit;color:inherit;}
.tci-chip:not(.tci-chip-static):hover{background:rgba(255,255,255,0.16);border-color:rgba(255,255,255,0.3);}
.tci-chip-static{cursor:default;}
.tci-league{font-family:var(--font-display);color:var(--ball);font-weight:700;letter-spacing:0.03em;text-transform:uppercase;font-size:13px;}
.tci-org,.tci-time{color:var(--muted);font-size:12px;}
@media (min-width:900px){
  .topbar-center-info{display:inline-flex;}
}
.mode-switch{display:inline-flex;border-radius:999px;background:rgba(255,255,255,0.08);padding:3px;gap:2px;}
.mode-switch button{border:none;background:transparent;color:var(--muted);font-family:var(--font-display);font-size:11px;letter-spacing:0.04em;text-transform:uppercase;padding:7px 14px;border-radius:999px;cursor:pointer;transition:background .15s ease,color .15s ease;}
.mode-switch button.active{background:var(--ball);color:var(--court);font-weight:700;}
.mode-switch button:not(.active):hover{color:var(--line);}
.view-slide{position:relative;display:flex;background:rgba(255,255,255,0.1);border-radius:999px;padding:3px;flex-shrink:0;}
.view-slide-thumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px) / var(--n));background:var(--ball);border-radius:999px;transition:transform .2s ease;z-index:0;}
.view-slide button{position:relative;z-index:1;border:none;background:transparent;color:var(--muted);font-family:var(--font-display);font-size:11px;letter-spacing:0.03em;text-transform:uppercase;padding:7px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:color .15s ease;}
.view-slide button.active{color:var(--court);font-weight:700;cursor:default;}
.view-slide button:not(.active):hover{color:var(--line);}
tr.draggable-row{cursor:grab;}
tr.clickable-row{cursor:pointer;}
tr.clickable-row:hover td{background:rgba(255,255,255,0.04);}
td.clickable-row{cursor:pointer;text-decoration:underline;text-decoration-color:rgba(255,255,255,0.25);text-underline-offset:3px;}
td.clickable-row:hover{color:var(--ball);}
tr.draggable-row:active{cursor:grabbing;}
.drop-target{transition:background .12s ease, outline .12s ease;}
.drop-target-hover{background:rgba(207,234,92,0.1);outline:2px dashed var(--ball);outline-offset:-2px;}
tr.row-drop-hover td{box-shadow:inset 0 3px 0 var(--ball), inset 0 -3px 0 var(--ball);background:rgba(207,234,92,0.15);}
.court-mark{width:52px;height:52px;border-radius:12px;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.court-mark img{width:100%;height:100%;object-fit:cover;}
.brand{display:flex;gap:10px;align-items:center;}
.pill-input{width:64px;text-align:center;}
.pill-input::-webkit-outer-spin-button,.pill-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.pill-input[type=number]{-moz-appearance:textfield;}
.score-input{width:56px;text-align:center;font-size:20px;font-weight:700;padding:10px 6px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.25);}
.score-input::-webkit-outer-spin-button,.score-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.score-input[type=number]{-moz-appearance:textfield;}
.vs{font-family:var(--font-display);color:var(--muted);font-size:12px;padding:0 4px;}
.match-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.06);flex-wrap:wrap;}
.bracket-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -18px;padding:8px 18px;
  -webkit-mask-image:linear-gradient(to right, transparent 0, black 18px, black calc(100% - 18px), transparent 100%);
  mask-image:linear-gradient(to right, transparent 0, black 18px, black calc(100% - 18px), transparent 100%);
}
.bracket-columns{display:flex;gap:28px;align-items:stretch;min-width:min-content;}
.bracket-round-col{display:flex;flex-direction:column;justify-content:space-around;min-width:190px;flex-shrink:0;}
.bracket-round-title{font-family:var(--font-display);font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);text-align:center;margin-bottom:10px;}
.bracket-match{background:rgba(255,255,255,0.04);border-radius:10px;padding:8px 10px;margin:10px 0;}
.format-chip{display:inline-flex;align-items:center;gap:6px;background:rgba(207,234,92,0.10);color:var(--ball);border:1px solid rgba(207,234,92,0.35);border-radius:999px;padding:5px 12px;font-family:var(--font-body);font-size:12px;font-weight:600;cursor:pointer;transition:background .15s ease;margin:0 auto 10px;}
.format-chip:hover{background:rgba(207,234,92,0.2);}
.pool-match-card{background:rgba(255,255,255,0.04);border-radius:12px;padding:12px 14px;margin-bottom:10px;}
.pool-match-card .pool-team-name{font-weight:600;font-size:14px;}
.pool-game-inputs{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;}
.bracket-match .team-line{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:2px 0;font-size:13px;}
.bracket-match .team-line.won{font-weight:700;color:var(--ball);}
.match-row:last-child{border-bottom:none;}
.team{flex:1;min-width:120px;font-size:14px;}
.empty{color:var(--muted);font-style:italic;font-size:14px;padding:10px 0;}
.small{font-size:12px;color:var(--muted);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media (max-width:520px){.grid2{grid-template-columns:1fr;}}
.err{color:var(--danger);font-size:13px;margin-top:6px;}
/* ---------- Écran de connexion : héro illustré + vitrine de fonctionnalités ---------- */
.hero-illustration-wrap{max-width:640px;margin:40px auto;text-align:center;}
.hero-illustration{position:relative;border-radius:20px;overflow:hidden;box-shadow:0 24px 60px -24px rgba(0,0,0,0.6);}
.hero-illustration img{display:block;width:100%;height:auto;}
.hero-cta{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);box-shadow:0 8px 24px -6px rgba(0,0,0,0.5);}
.loading{color:var(--muted);text-align:center;padding:40px 0;font-family:var(--font-display);letter-spacing:0.1em;text-transform:uppercase;}

/* ---------- Tableaux : défilement horizontal plutôt que colonnes écrasées ---------- */
@media (max-width:900px){
  table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:nowrap;}
}

/* ---------- Onglets : défilement horizontal au lieu d'un retour à la ligne serré ---------- */
.tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,0.3) transparent;
  -webkit-mask-image:linear-gradient(to right, transparent 0, black 14px, black calc(100% - 14px), transparent 100%);
  mask-image:linear-gradient(to right, transparent 0, black 14px, black calc(100% - 14px), transparent 100%);
}
.tabs::-webkit-scrollbar{height:4px;}
.tabs::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.3);border-radius:4px;}
.tabs::-webkit-scrollbar-track{background:transparent;}
.tab{flex:0 0 auto;white-space:nowrap;}

/* ---------- Bureau (écrans larges) : plus d'air, colonnes qui ne s'étirent pas à l'infini ---------- */
@media (min-width:900px){
  #app{padding:32px 32px 70px;}
  h1{font-size:32px;}
  .card{padding:20px 22px;}
  th,td{white-space:normal;}
}

/* ---------- Mobile (écrans étroits) : cibles tactiles plus grandes, texte compact ---------- */
@media (max-width:640px){
  .tabs{display:none;}
  .bottom-nav-spacer{height:74px;}
  .bottom-nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:850;justify-content:center;gap:4px;background:var(--court-light);border-top:1px solid rgba(255,255,255,0.08);padding:8px max(10px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(0,0,0,0.3);overflow-x:auto;}
  #app{padding:14px 12px 50px;}
  h1{font-size:22px;}
  h2{font-size:17px;}
  .card{padding:12px;border-radius:8px;}
  .btn{padding:11px 16px;font-size:12px;}
  .btn,.btn-secondary,.btn-primary,select,input{min-height:42px;}
  .row{gap:8px;}
  .row > .btn,.row > .btn-secondary,.row > .btn-primary{flex:1 1 auto;}
  .topbar h1{font-size:19px;}
  .hamburger-btn{font-size:30px;padding:8px 10px 8px 0;}
  .court-mark{width:44px;height:44px;font-size:14px;}
  th,td{padding:7px 6px;font-size:13px;}
  .tab{padding:9px 12px;font-size:12px;}
  .match-row{gap:6px;padding:9px 0;}
  .team{min-width:90px;font-size:13px;}
  .pill-input{width:48px;}
}
</style>

let OFFLINE_CACHED_AT = null;

async function loadData(leagueId){
  try{
    const { data, error } = await sb.from('league_data').select('data').eq('league_id', leagueId).single();
    if(error) throw error;
    STORAGE_OK = true;
    OFFLINE_MODE = false;
    const result = (data && data.data && Object.keys(data.data).length>0) ? data.data : null;
    if(result) cacheDataLocally(leagueId, result);
    return result;
  }catch(e){
    console.error('Erreur de chargement', e);
    STORAGE_OK = false;
    // Repli sur la dernière copie connue (vue lors d'une connexion précédente
    // sur cet appareil), pour éviter d'afficher une ligue vide.
    const cached = getCachedDataLocally(leagueId);
    if(cached){
      OFFLINE_MODE = true;
      OFFLINE_CACHED_AT = cached.cachedAt;
      return cached.data;
    }
    OFFLINE_MODE = false;
    return null;
  }
}
// ---- Cache local (hors ligne) : garde une copie des dernières données vues
// sur cet appareil, pour pouvoir au moins les consulter sans connexion. ----
function cacheDataLocally(leagueId, data){
  try{ localStorage.setItem('cachedData_'+leagueId, JSON.stringify({ data, cachedAt: new Date().toISOString() })); }catch(e){}
}
function getCachedDataLocally(leagueId){
  try{
    const raw = localStorage.getItem('cachedData_'+leagueId);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
async function saveData(){
  if(!CURRENT_LEAGUE_ID) return;
  try{
    const { error } = await sb.from('league_data').update({ data: DATA, updated_at: new Date().toISOString() }).eq('league_id', CURRENT_LEAGUE_ID);
    if(error) throw error;
    SAVE_ERROR = null;
    STORAGE_OK = true;
  }catch(e){
    SAVE_ERROR = "La sauvegarde a échoué : " + (e && e.message ? e.message : 'erreur inconnue');
    console.error('Erreur de sauvegarde', e);
  }
}

async function loadLeagues(){
  const { data, error } = await sb.from('leagues').select('*, organizations(name)').order('order_index', { ascending:true, nullsFirst:false }).order('created_at', { ascending:true });
  LEAGUES = error ? [] : (data || []);

// Ligues de l'organisation actuellement sélectionnée (vue admin uniquement) —
// LEAGUES lui-même reste complet (toutes les ligues visibles, utile aussi
// pour le sélecteur de ligue côté joueur qui peut couvrir plusieurs
// organisations avec le même compte).
function myOrgLeagues(){
  return LEAGUES.filter(l=>l.organization_id === CURRENT_ORGANIZATION_ID);
}
// Réordonne les ligues (de l'organisation actuelle) par glisser-déposer et
// sauvegarde le nouvel ordre.
async function reorderLeague(draggedId, targetId){
  if(!draggedId || draggedId===targetId) return;
  const list = myOrgLeagues();
  const fromIdx = list.findIndex(l=>l.id===draggedId);
  if(fromIdx===-1) return;
  const [moved] = list.splice(fromIdx,1);
  const targetIdx = list.findIndex(l=>l.id===targetId);
  list.splice(targetIdx===-1 ? list.length : targetIdx, 0, moved);
  // Remplace, dans LEAGUES, les ligues de cette organisation par la nouvelle
  // liste ordonnée — les ligues des autres organisations restent inchangées.
  const otherLeagues = LEAGUES.filter(l=>l.organization_id !== CURRENT_ORGANIZATION_ID);
  LEAGUES = otherLeagues.concat(list);
  render(); // mise à jour immédiate à l'écran, sauvegarde en arrière-plan
  const updates = list.map((l,i)=> sb.from('leagues').update({ order_index: i+1 }).eq('id', l.id));
  await Promise.all(updates);
}

function onLeagueDragOver(ev){

  ev.currentTarget.classList.add('row-drop-hover');
}
function onLeagueDragLeave(ev){
  ev.currentTarget.classList.remove('row-drop-hover');
}
function onLeagueDrop(ev, targetLeagueId){
  ev.preventDefault();
  ev.currentTarget.classList.remove('row-drop-hover');
  const draggedId = ev.dataTransfer.getData('text/plain');
  reorderLeague(draggedId, targetLeagueId);
}
async function createLeague(name, scheduleLabel, format, mlpRosterSize){
  if(!CURRENT_ORGANIZATION_ID){ showAlert("Aucune organisation sélectionnée — impossible de créer une ligue."); return null; }
  const nextOrder = myOrgLeagues().reduce((m,l)=>Math.max(m, typeof l.order_index==='number'?l.order_index:0), 0) + 1;
  const { data, error } = await sb.from('leagues').insert({ name, schedule_label: scheduleLabel || null, order_index: nextOrder, organization_id: CURRENT_ORGANIZATION_ID }).select().single();
  if(error){ showAlert("Erreur lors de la création : " + error.message); return null; }
  const fresh = defaultData();
  fresh.leagueName = name;
  fresh.leagueFormat = format || 'ladder';
  if(format==='mlp'){
    fresh.mlpRosterSize = mlpRosterSize || 4;
    fresh.mlpTeams = [];
    fresh.mlpSessions = [];
  }
  const { error: err2 } = await sb.from('league_data').insert({ league_id: data.id, data: fresh });
  if(err2){ showAlert("Erreur lors de la création : " + err2.message); return null; }
  await loadLeagues();
  return data.id;
}

function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }

function defaultData(){
  return {
    leagueName: 'Ma ligue de pickleball',
    leagueFormat: 'ladder',
    swapCount: 1,
    matchesPerSession: 10,

// ---------- doubles generation ----------
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
// Règle standard : 5 joueurs → 10 matchs (à 9 points) ; 4 joueurs → 6 matchs (à 11 points).
// Le mode test (Réglages) permet de contourner temporairement cette règle pour essayer l'app rapidement.
function matchesCountFor(n){
  if(DATA.testMode){
    if(n === 4) return Math.max(1, DATA.testMatches4 || 2);
    if(n === 5) return Math.max(1, DATA.testMatches5 || 3);
    return Math.max(1, DATA.matchesPerSession || 3);
  }
  if(n === 5) return Math.max(1, DATA.rules5Matches || 10);
  if(n === 4) return Math.max(1, DATA.rules4Matches || 6);
  return DATA.matchesPerSession || 10; // repli pour une taille de groupe atypique
}
function targetPointsFor(n){
  if(n === 5) return Math.max(1, DATA.rules5Points || 9);
  if(n === 4) return Math.max(1, DATA.rules4Points || 11);
  return 11;
}

function generateUnit(playerIds){
  const p = shuffle(playerIds);
  if(p.length === 4){
    return [
      { sit:null, teamA:[p[0],p[1]], teamB:[p[2],p[3]], scoreA:null, scoreB:null },
      { sit:null, teamA:[p[0],p[2]], teamB:[p[1],p[3]], scoreA:null, scoreB:null },
      { sit:null, teamA:[p[0],p[3]], teamB:[p[1],p[2]], scoreA:null, scoreB:null }
    ];
  }
  if(p.length === 5){
    const matches = [];
    for(let sit=0; sit<5; sit++){
      const rest = p.filter((_,i)=>i!==sit);
      const combos = [
        [[rest[0],rest[1]],[rest[2],rest[3]]],
        [[rest[0],rest[2]],[rest[1],rest[3]]],
        [[rest[0],rest[3]],[rest[1],rest[2]]]
      ];
      const c = combos[sit % 3];
      matches.push({ sit:p[sit], teamA:c[0], teamB:c[1], scoreA:null, scoreB:null });
    }
    return matches;
  }
  // fallback for other sizes: simple rotation, one match per 4, leftover sits
  const matches = [];
  for(let i=0;i+3<p.length;i+=4){
    matches.push({ sit:null, teamA:[p[i],p[i+1]], teamB:[p[i+2],p[i+3]], scoreA:null, scoreB:null });
  }
  if(matches.length===0 && p.length>0){
    matches.push({ sit:null, teamA:p.slice(0,Math.ceil(p.length/2)), teamB:p.slice(Math.ceil(p.length/2)), scoreA:null, scoreB:null });
  }
  return matches;
}

// Une session génère un nombre de matchs par groupe selon la règle standard
// (voir matchesCountFor). On enchaîne des blocs (round-robin complet pour 4,
// rotation complète pour 5) en remélangeant à chaque bloc pour varier les partenaires.
function generateMatches(playerIds){
  if(playerIds.length < 2) return [];
  const target = matchesCountFor(playerIds.length);
  let matches = [];
  let guard = 0;
  while(matches.length < target && guard < 20){
    matches = matches.concat(generateUnit(playerIds));
    guard++;
  }
  return matches.slice(0, target);
}

// ---------- standings ----------
// Confrontations directes entre deux joueurs (équipes adverses uniquement).
// Retourne > 0 si pidA a gagné plus souvent contre pidB, < 0 si l'inverse, 0 sinon.
function headToHead(matches, pidA, pidB){
  let winsA = 0, winsB = 0;
  matches.forEach(m=>{
    if(m.scoreA === null || m.scoreB === null || m.scoreA === '' || m.scoreB === '') return;
    const aInA = m.teamA.includes(pidA), aInB = m.teamB.includes(pidA);
    const bInA = m.teamA.includes(pidB), bInB = m.teamB.includes(pidB);
    if(!((aInA && bInB) || (aInB && bInA))) return; // pas adversaires dans ce match
    const sa = Number(m.scoreA), sb = Number(m.scoreB);
    if(sa === sb) return;
    const aWon = aInA ? sa > sb : sb > sa;
    if(aWon) winsA++; else winsB++;
  });
  return winsA - winsB;
}

// Index (ordre chronologique) du premier match perdu par un joueur. Infinity si jamais perdu.
function firstLossIndex(matches, pid){
  for(let i=0;i<matches.length;i++){
    const m = matches[i];
    if(m.scoreA === null || m.scoreB === null || m.scoreA === '' || m.scoreB === '') continue;
    const inA = m.teamA.includes(pid), inB = m.teamB.includes(pid);
    if(!inA && !inB) continue;
    const sa = Number(m.scoreA), sb = Number(m.scoreB);
    const lost = inA ? sa < sb : sb < sa;
    if(lost) return i;
  }
  return Infinity;
}

// Critères de départage disponibles — chacun retourne un nombre négatif si
// "a" doit être classé avant "b" selon ce critère seul, 0 si égalité.
const TIEBREAK_CRITERIA = {
  points: { label: '🎯 Total de points marqués', cmp: (a,b)=> b.pf - a.pf },
  wins: { label: '🏆 Victoires', cmp: (a,b)=> b.wins - a.wins },
  diff: { label: '➕➖ Différentiel de points (marqués − accordés)', cmp: (a,b)=> b.diff - a.diff },
  h2h: { label: '🤝 Face-à-face direct', cmp: (a,b,matches)=> -headToHead(matches, a.playerId, b.playerId) },
  rating: { label: '📊 Cote actuelle (le mieux coté gagne l\'égalité)', cmp: (a,b)=> ratingOf(b.playerId) - ratingOf(a.playerId) },
  firstLoss: { label: '⏱️ A perdu son premier match le plus tard', cmp: (a,b,matches)=> firstLossIndex(matches,b.playerId) - firstLossIndex(matches,a.playerId) }
};
function defaultTiebreakCriteria(){
  return [
    { key:'points', enabled:true },
    { key:'wins', enabled:true },
    { key:'h2h', enabled:true },
    { key:'firstLoss', enabled:true },
    { key:'diff', enabled:false },
    { key:'rating', enabled:false }
  ];
}
// Complète la liste enregistrée avec tout critère manquant (ex: ajouté dans
// une mise à jour future de l'app), désactivé par défaut, sans perdre l'ordre
// choisi par l'admin pour les critères déjà connus.
function normalizedTiebreakCriteria(){
  const existing = (DATA.tiebreakCriteria && DATA.tiebreakCriteria.length) ? DATA.tiebreakCriteria : defaultTiebreakCriteria();
  const keys = existing.map(c=>c.key);
  const merged = existing.map(c=>({ key:c.key, enabled:!!c.enabled }));
  Object.keys(TIEBREAK_CRITERIA).forEach(k=>{ if(!keys.includes(k)) merged.push({ key:k, enabled:false }); });
  return merged;
}

function computeStandings(groupPlayers, matches){
  const stats = {};
  groupPlayers.forEach(pid => stats[pid] = { wins:0, losses:0, pf:0, pa:0, played:0, scheduled:0 });
  matches.forEach(m=>{
    m.teamA.forEach(pid=>{ if(stats[pid]) stats[pid].scheduled++; });
    m.teamB.forEach(pid=>{ if(stats[pid]) stats[pid].scheduled++; });
    if(m.scoreA === null || m.scoreB === null || m.scoreA === '' || m.scoreB === '') return;
    const sa = Number(m.scoreA), sb = Number(m.scoreB);
    m.teamA.forEach(pid=>{ if(stats[pid]){ stats[pid].pf += sa; stats[pid].pa += sb; stats[pid].played++; if(sa>sb) stats[pid].wins++; else if(sa<sb) stats[pid].losses++; } });
    m.teamB.forEach(pid=>{ if(stats[pid]){ stats[pid].pf += sb; stats[pid].pa += sa; stats[pid].played++; if(sb>sa) stats[pid].wins++; else if(sb<sa) stats[pid].losses++; } });
  });
  const rows = groupPlayers.map(pid => ({
    playerId: pid,
    ...stats[pid],
    diff: stats[pid].pf - stats[pid].pa,
    avgPts: stats[pid].played > 0 ? (stats[pid].pf / stats[pid].played) : null
  }));
  // Classement : selon l'ordre de critères activés dans Réglages → Jeu
  // (par défaut : points, victoires, face-à-face, premier match perdu).
  const order = normalizedTiebreakCriteria().filter(c=>c.enabled).map(c=>c.key);
  rows.sort((a,b)=>{
    for(const key of order){
      const crit = TIEBREAK_CRITERIA[key];
      if(!crit) continue;
      const result = crit.cmp(a,b,matches);
      if(result !== 0) return result;
    }
    return 0;
  });
  return rows;
}

function playerName(id){
  if(typeof id === 'string' && id.startsWith('guest::')) return decodeURIComponent(id.slice(7));
  if(typeof id === 'string' && id.startsWith('sub::')){
    const s = (DATA.substitutePool||[]).find(x=>x.id===id.slice(5));
    return s ? s.name : 'Remplaçant';
  }
  const p = DATA.players.find(x=>x.id===id);
  return p ? p.name : '?';
}
function isGuestId(id){ return typeof id === 'string' && id.startsWith('guest::'); }
function isSubPoolId(id){ return typeof id === 'string' && id.startsWith('sub::'); }
// Vrai pour un invité anonyme OU un remplaçant régulier du bassin — les deux
// sont exclus des montées/descentes, de la cote et des statistiques de rivalité.
function isGuestOrSubId(id){ return isGuestId(id) || isSubPoolId(id); }
function groupById(id){ return DATA.groups.find(g=>g.id===id); }
// Retrouve, pour un joueur, le groupe et le classement obtenus lors de sa
// dernière session jouée (pour aider à ajuster les positions actuelles).
function previousSessionInfoForPlayer(pid){
  const closed = DATA.sessions.filter(s=>s.status==='closed').slice().reverse();
  for(const s of closed){
    if(!s.standingsByGroup) continue;
    for(const gid in s.standingsByGroup){
      const rows = s.standingsByGroup[gid];
      const idx = rows.findIndex(r=>r.playerId===pid);
      if(idx !== -1){
        const g = groupById(gid);
        return { groupName: g ? g.name : '(groupe supprimé)', position: idx+1, total: rows.length, date: s.date };
      }
    }
  }
  return null;
}
function groupsSorted(){ return DATA.groups.slice().sort((a,b)=>a.order-b.order); }
function playersInGroup(gid){ return DATA.players.filter(p=>p.groupId===gid); }

function GROUP_MAX_PLAYERS(){ return DATA.groupMaxPlayers || 5; }
function GROUP_MIN_PLAYERS(){ return DATA.groupMinPlayers || 4; }
// Retourne le premier groupe (selon l'ordre de l'échelle) qui a encore de la
// place (moins de GROUP_MAX_PLAYERS() joueurs), ou null si tous sont pleins.
function firstGroupWithRoom(groupsList, playersList){
  const sorted = groupsList.slice().sort((a,b)=>a.order-b.order);
  for(const g of sorted){
    const count = playersList.filter(p=>p.groupId===g.id).length;
    if(count < GROUP_MAX_PLAYERS()) return g.id;
  }
  return sorted.length ? sorted[0].id : null;
}
// Prochaine valeur d'ordre pour placer un joueur en fin de son groupe.
function nextOrderInGroup(groupId){
  const members = DATA.players.filter(p=>p.groupId===groupId);
  const maxOrder = members.reduce((m,p)=>Math.max(m, typeof p.order==='number'?p.order:0), 0);
  return maxOrder + 1;
}
// Échange la position (haut/bas) d'un joueur avec son voisin immédiat dans
// son groupe.
// Sélectionne/désélectionne un joueur pour afficher ses flèches de réordonnancement.
// Glisser-déposer un joueur sur la ligne d'un autre pour l'insérer à cette
// position précise dans son groupe (renumérote tout le groupe ensuite).
function onRowDragOver(ev){
  ev.preventDefault();
  ev.stopPropagation(); // évite de déclencher aussi le surlignage de toute la carte de groupe
  ev.currentTarget.classList.add('row-drop-hover');
}
function onRowDragLeave(ev){
  ev.currentTarget.classList.remove('row-drop-hover');
}
function onRowDrop(ev, gid, targetPid){
  ev.preventDefault();
  ev.stopPropagation();
  ev.currentTarget.classList.remove('row-drop-hover');
  const draggedPid = ev.dataTransfer.getData('text/plain');
  if(!draggedPid || draggedPid === targetPid) return;
  const dragged = DATA.players.find(x=>x.id===draggedPid);
  if(!dragged) return;
  if(dragged.groupId !== gid){
    const otherPlayers = DATA.players.filter(x=>x.id!==draggedPid);
    dragged.groupId = resolveGroupAssignment(gid, DATA.groups, otherPlayers);
  }
  let members = playersInGroup(gid).sort((a,b)=>(typeof a.order==='number'?a.order:0)-(typeof b.order==='number'?b.order:0));
  members = members.filter(p=>p.id!==draggedPid);
  const targetIdx = members.findIndex(p=>p.id===targetPid);
  members.splice(targetIdx===-1 ? members.length : targetIdx, 0, dragged);
  members.forEach((p,i)=>{ p.order = i+1; });
  saveAndRender();
}
// Vérifie la capacité d'un groupe avant d'y placer un joueur. Si plein,
// avertit et retourne plutôt le premier groupe disponible.
function resolveGroupAssignment(desiredGroupId, groupsList, playersList){
  const count = playersList.filter(p=>p.groupId===desiredGroupId).length;
  if(count >= GROUP_MAX_PLAYERS()){
    const desiredName = (groupsList.find(g=>g.id===desiredGroupId)||{}).name || 'ce groupe';
    showAlert(`Attention : ${desiredName} aura maintenant ${count+1} joueurs, au-dessus de la limite recommandée de ${GROUP_MAX_PLAYERS()}. Le joueur a quand même été placé — pense à rééquilibrer avant de publier une session.`);
  }
  return desiredGroupId;
}
// Ajoute un suffixe numéroté si le nom existe déjà, pour éviter les doublons.
function uniquePlayerName(desiredName, playersList, excludePlayerId){
  const base = desiredName.trim();
  const existing = new Set(playersList.filter(p=>p.id!==excludePlayerId).map(p=>p.name.trim().toLowerCase()));
  if(!existing.has(base.toLowerCase())) return base;
  let n = 2;
  while(existing.has(`${base} (${n})`.toLowerCase())) n++;
  const finalName = `${base} (${n})`;
  showAlert(`Le nom « ${base} » existe déjà — ce joueur a été nommé « ${finalName} » pour les distinguer.`);
  return finalName;
}

// ---------- session lifecycle ----------
// Retourne la date (YYYY-MM-DD) du prochain jour correspondant au jour de jeu
// configuré pour la ligue (aujourd'hui inclus si on est justement ce jour-là).
// Si aucun jour n'est configuré, retourne simplement la date d'aujourd'hui.
function fmtDate(d){
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return `${yyyy}-${mm}-${dd}`;
}
function nextSessionDate(){
  if(typeof DATA.playDayOfWeek !== 'number') return fmtDate(new Date());
  const now = new Date();
  const diff = (DATA.playDayOfWeek - now.getDay() + 7) % 7;
  const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + diff);
  return fmtDate(d);
}
// Calcule la prochaine date de jeu valide à partir d'une date donnée (incluse),
// en sautant les dates bloquées du calendrier de saison. Retourne
// { date, skipped } où skipped liste les dates bloquées sautées en chemin,
// ou { date: null } si ça dépasse la fin de saison configurée.
function nextValidSessionDate(fromDateStr){
  const blocked = new Set(DATA.blockedDates || []);
  const seasonEnd = DATA.seasonEndDate || null;
  let d = new Date(fromDateStr + 'T00:00:00');
  const skipped = [];
  for(let i=0;i<52;i++){ // garde-fou : au plus un an de sauts
    const ds = fmtDate(d);
    if(seasonEnd && ds > seasonEnd) return { date: null, skipped };
    if(blocked.has(ds)){
      skipped.push(ds);
      d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 7);
      continue;
    }
    return { date: ds, skipped };
  }
  return { date: null, skipped };
}
// Point d'entrée unique pour la génération des matchs d'un groupe : respecte
// le mode choisi dans Réglages (automatique ou manuel).
// Effectif d'un groupe ordonné par position (#1, #2, ...), avec le
// remplaçant à la place de chaque joueur absent (ou une case vide si aucun).
// Sert à appliquer le modèle de rotation manuel par numéro de position.
function orderedRosterWithSubs(session, gid){
  const regularOrder = playersInGroup(gid).slice().sort((a,b)=>(typeof a.order==='number'?a.order:0)-(typeof b.order==='number'?b.order:0));
  const gd = session.groupsData.find(x=>x.groupId===gid);
  const subs = (gd && gd.substitutes) || {};
  return regularOrder.map(p=> isAbsent(session, p.id) ? (subs[p.id] || null) : p.id);
}
// Construit les matchs d'un groupe à partir du modèle de rotation défini
// dans Réglages (positions 1,2,3... → joueur occupant cette position).
function matchesFromTemplate(session, gid){
  const ordered = orderedRosterWithSubs(session, gid);
  const groupSize = playersInGroup(gid).length;
  // On choisit le modèle selon la taille réelle du groupe (4 ou 5 joueurs) —
  // le plus proche est utilisé pour une taille atypique.
  const template = (groupSize <= 4 ? (DATA.manualMatchupTemplate4 || []) : (DATA.manualMatchupTemplate5 || []));
  return template.map(t=>{
    const teamA = (t.teamA||[]).map(pos=>ordered[pos-1]).filter(Boolean);
    const teamB = (t.teamB||[]).map(pos=>ordered[pos-1]).filter(Boolean);
    return { sit:null, teamA, teamB, scoreA:null, scoreB:null };
  });
}
// Point d'entrée unique pour la génération des matchs d'un groupe : respecte
// le mode choisi dans Réglages (automatique ou modèle manuel par position).
function matchesForGroup(session, gid){
  if(DATA.matchupMode === 'manual') return matchesFromTemplate(session, gid);
  const ids = activeRosterForGroup(session, gid);
  return ids.length >= 2 ? generateMatches(ids) : [];
}
function startNewSession(explicitDate){
  const session = { id: uid('s'), date: explicitDate || nextSessionDate(), status:'open', groupsData: DATA.groups.map(g=>({ groupId:g.id, matches:[] })), movements: null, absences: [], published: false };
  applyPlannedAbsencesToSession(session);
  DATA.sessions.push(session);
  DATA.groups.forEach(g=>{
    const gd = session.groupsData.find(x=>x.groupId===g.id);
    gd.matches = matchesForGroup(session, g.id);
  });
  return session;
}
// ---- Absences planifiées (vacances) : un joueur peut couvrir une plage de
// dates à l'avance. Appliquées automatiquement à toute nouvelle session dont
// la date tombe dans la plage, sans devoir y penser session par session.
function plannedAbsencesForPlayer(playerId){
  return (DATA.plannedAbsences||[]).filter(a=>a.playerId===playerId).sort((a,b)=>a.startDate.localeCompare(b.startDate));
}
function dateInPlannedAbsence(a, dateStr){ return dateStr >= a.startDate && dateStr <= a.endDate; }
function applyPlannedAbsencesToSession(session){
  (DATA.plannedAbsences||[]).forEach(a=>{
    if(dateInPlannedAbsence(a, session.date) && !session.absences.includes(a.playerId)){
      session.absences.push(a.playerId);
    }
  });
}
function addPlannedAbsence(playerId, startDate, endDate){
  DATA.plannedAbsences = DATA.plannedAbsences || [];
  DATA.plannedAbsences.push({ id: uid('pa'), playerId, startDate, endDate });
  // Applique immédiatement à la session en cours si sa date tombe dans la plage.
  const open = currentOpenSession();
  if(open && dateInPlannedAbsence({startDate, endDate}, open.date) && !isAbsent(open, playerId)){
    toggleAbsence(playerId);
  }
}
function removePlannedAbsence(id){
  DATA.plannedAbsences = (DATA.plannedAbsences||[]).filter(a=>a.id!==id);
  saveAndRender();
}
function toggleAbsence(playerId){
  const open = currentOpenSession();
  if(!open) return;
  if(!open.absences) open.absences = [];
  const idx = open.absences.indexOf(playerId);
  const groupsToRefresh = new Set();
  const homeP = DATA.players.find(p=>p.id===playerId);
  if(homeP) groupsToRefresh.add(homeP.groupId);
  if(idx === -1){
    open.absences.push(playerId);
  } else {
    open.absences.splice(idx,1);
    // s'il avait été prêté à un autre groupe, on annule ce prêt
    if(open.loans && open.loans[playerId]){
      const toGid = open.loans[playerId];
      delete open.loans[playerId];
      const gd2 = open.groupsData.find(x=>x.groupId===toGid);
      if(gd2 && gd2.substitutes){
        Object.keys(gd2.substitutes).forEach(aId=>{ if(gd2.substitutes[aId]===playerId) delete gd2.substitutes[aId]; });
      }
      groupsToRefresh.add(toGid);
    }
  }
  groupsToRefresh.forEach(gId=>regenerateGroupMatches(open, gId));
  saveAndRender();
}
function isAbsent(session, playerId){ return !!(session && session.absences && session.absences.includes(playerId)); }
// Absent "pour de vrai" (pas juste prêté à un autre groupe, où il joue quand même).
function isTrulyAbsent(session, playerId){ return isAbsent(session, playerId) && !(session && session.loans && session.loans[playerId]); }
function currentOpenSession(){ return DATA.sessions.find(s=>s.status==='open'); }

// Effectif réellement actif d'un groupe pour une session : membres présents,
// plus les remplaçants assignés aux absents. La place d'un absent sans
// remplaçant reste simplement vide.
function activeRosterForGroup(session, gid){
  const groupIds = playersInGroup(gid).map(p=>p.id);
  const gd = session.groupsData.find(x=>x.groupId===gid);
  const subs = (gd && gd.substitutes) || {};
  const roster = [];
  groupIds.forEach(id=>{
    const p = DATA.players.find(x=>x.id===id);
    if(p && p.injured){
      if(subs[id]) roster.push(subs[id]); // un remplaçant peut quand même prendre sa place
      return; // sinon la position reste vide, sans compter comme une absence
    }
    if(isAbsent(session, id)){
      if(subs[id]) roster.push(subs[id]);
    } else {
      roster.push(id);
    }
  });
  return roster;
}
function regenerateGroupMatches(session, gid){
  const gd = session.groupsData.find(x=>x.groupId===gid);
  if(!gd) return;
  gd.matches = matchesForGroup(session, gid);
}
// Joueurs déjà utilisés comme remplaçants ailleurs dans la session (pour éviter
// qu'un même joueur soit assigné à deux groupes en même temps).
function substitutesInUse(session, excludeGid, excludeAbsentId){
  const set = new Set();
  DATA.groups.forEach(g=>{
    const gd2 = session.groupsData.find(x=>x.groupId===g.id);
    if(!gd2 || !gd2.substitutes) return;
    Object.entries(gd2.substitutes).forEach(([aId, subId])=>{
      if(g.id===excludeGid && aId===excludeAbsentId) return;
      if(!isGuestOrSubId(subId)) set.add(subId);
    });
  });
  return set;
}
// Assigne (ou retire) un remplaçant à la place d'un absent. Si le remplaçant
// choisi est un joueur de la ligue actif dans son propre groupe, ce dernier
// est automatiquement marqué absent de son groupe d'origine (« prêté »),
// libérant sa place — qui peut alors être gérée comme n'importe quelle absence.
function setSubstitute(gid, absentId, subId){
  const open = currentOpenSession();
  const gd = open.groupsData.find(x=>x.groupId===gid);
  if(!gd.substitutes) gd.substitutes = {};
  if(!open.loans) open.loans = {};
  const oldSub = gd.substitutes[absentId];
  const groupsToRefresh = new Set([gid]);

  // annuler le prêt précédent s'il y en avait un pour cette place
  if(oldSub && !isGuestOrSubId(oldSub) && open.loans[oldSub] === gid){
    delete open.loans[oldSub];
    const idx2 = open.absences.indexOf(oldSub);
    if(idx2>-1) open.absences.splice(idx2,1);
    const homeOld = DATA.players.find(p=>p.id===oldSub);
    if(homeOld) groupsToRefresh.add(homeOld.groupId);
  }

  if(subId){
    gd.substitutes[absentId] = subId;
    if(!isGuestOrSubId(subId)){
      if(!open.absences.includes(subId)) open.absences.push(subId);
      open.loans[subId] = gid;
      const homeNew = DATA.players.find(p=>p.id===subId);
      if(homeNew && homeNew.groupId !== gid) groupsToRefresh.add(homeNew.groupId);
    }
  } else {
    delete gd.substitutes[absentId];
  }

  groupsToRefresh.forEach(gId2=>regenerateGroupMatches(open, gId2));
  saveAndRender();
}
function onSubSelect(gid, absentId, value){
  if(value === '__guest__'){
    showPrompt("Nom du remplaçant invité (ne fait pas partie de la ligue) :", '', (name)=>{
      if(name && name.trim()){ setSubstitute(gid, absentId, 'guest::' + encodeURIComponent(name.trim())); }
      else { render(); }
    });
  } else {
    setSubstitute(gid, absentId, value);
  }
}

function groupBelow(gid){
  const sorted = groupsSorted();
  const idx = sorted.findIndex(g=>g.id===gid);
  return idx>=0 && idx<sorted.length-1 ? sorted[idx+1].id : null;
}

function finalizeSession(session){
  const movements = []; // {playerId, fromGroupId, toGroupId, reason?}
  const sorted = groupsSorted();
  const standingsByGroup = {};
  session.groupsData.forEach(gd=>{
    standingsByGroup[gd.groupId] = computeStandings(activeRosterForGroup(session, gd.groupId), gd.matches);
  });
  session.standingsByGroup = standingsByGroup;

  // Les montées/descentes automatiques ne s'appliquent qu'en format Échelle.
  // En Poules fixes ou Division unique, les groupes ne bougent jamais.
  const isLadderFormat = DATA.leagueFormat !== 'pools' && DATA.leagueFormat !== 'single';
  if(isLadderFormat){
    // Nombre d'absents (sans prêt) par groupe d'origine : chacun descend
    // automatiquement plus bas, donc ça compte déjà comme une place qui se
    // libère — pas besoin de faire descendre quelqu'un d'autre en plus pour ça.
    const absentNoLoanByGroup = {};
    (session.absences || []).forEach(pid=>{
      if(session.loans && session.loans[pid]) return;
      const pl = DATA.players.find(p=>p.id===pid);
      if(!pl) return;
      absentNoLoanByGroup[pl.groupId] = (absentNoLoanByGroup[pl.groupId] || 0) + 1;
    });

    for(let i=0;i<sorted.length-1;i++){
      const upper = sorted[i];   // meilleur groupe (order plus petit)
      const lower = sorted[i+1];
      // Les remplaçants réguliers (joueurs prêtés) suivent les règles normales du
      // groupe où ils ont joué. Seuls les invités hors ligue ne sont jamais éligibles.
      const upperStand = (standingsByGroup[upper.id] || []).filter(r=> !isGuestOrSubId(r.playerId));
      const lowerStand = (standingsByGroup[lower.id] || []).filter(r=> !isGuestOrSubId(r.playerId));
      const nUp = Math.min(DATA.swapCount, upperStand.length, lowerStand.length);
      const absentFromUpper = absentNoLoanByGroup[upper.id] || 0;
      const nDown = Math.max(0, Math.min(DATA.swapCount, upperStand.length, lowerStand.length) - absentFromUpper);
      for(let k=0;k<nUp;k++){
        const goingUp = lowerStand[k];          // top du groupe inférieur
        if(goingUp) movements.push({ playerId: goingUp.playerId, fromGroupId: lower.id, toGroupId: upper.id });
      }
      for(let k=0;k<nDown;k++){
        const goingDown = upperStand[upperStand.length-1-k]; // bas du groupe supérieur
        if(goingDown) movements.push({ playerId: goingDown.playerId, fromGroupId: upper.id, toGroupId: lower.id });
      }
    }
    movements.forEach(m=>{
      const pl = DATA.players.find(p=>p.id===m.playerId);
      if(pl) pl.groupId = m.toGroupId;
    });

    // Un joueur absent qui n'a pas été prêté ailleurs (donc n'a joué nulle part
    // cette session) descend automatiquement d'un groupe pour la session suivante.
    (session.absences || []).forEach(pid=>{
      if(session.loans && session.loans[pid]) return; // il jouait ailleurs comme remplaçant : pas pénalisé
      const pl = DATA.players.find(p=>p.id===pid);
      if(!pl) return;
      const fromGroupId = pl.groupId;
      const below = groupBelow(fromGroupId);
      if(below){
        movements.push({ playerId: pid, fromGroupId, toGroupId: below, reason:'absence' });
        pl.groupId = below;
      }
    });
  }

  applyRatingUpdates(session);
  reorderGroupsAfterMovements(standingsByGroup, movements);

  session.movements = movements;
  session.status = 'closed';
}

// Réordonne automatiquement chaque groupe après une session, selon la
// provenance des joueurs :
// 1) arrivées du groupe au-dessus (relégués), dans l'ordre de leur ancien
//    classement (ex: 4e puis 5e du groupe au-dessus)
// 2) joueurs restés dans le même groupe, dans leur ordre de classement précédent
// 3) arrivées du groupe en dessous (promus), dans l'ordre de leur ancien
//    classement (ex: 1er puis 2e du groupe en dessous)
// 4) descentes automatiques pour absence, à la fin
function reorderGroupsAfterMovements(standingsByGroup, movements){
  const rankOf = (playerId, groupId)=>{
    const rows = standingsByGroup[groupId];
    if(!rows) return 999;
    const idx = rows.findIndex(r=>r.playerId===playerId);
    return idx===-1 ? 999 : idx;
  };
  groupsSorted().forEach(g=>{
    const relegatedIn = [], promotedIn = [], absenceIn = [];
    movements.forEach(m=>{
      if(m.toGroupId !== g.id) return;
      if(m.reason === 'absence'){ absenceIn.push(m); return; }
      const fromG = groupById(m.fromGroupId);
      if(fromG && fromG.order < g.order) relegatedIn.push(m); // venait d'un groupe plus fort
      else promotedIn.push(m); // venait d'un groupe plus faible
    });
    relegatedIn.sort((a,b)=> rankOf(a.playerId,a.fromGroupId) - rankOf(b.playerId,b.fromGroupId));
    promotedIn.sort((a,b)=> rankOf(a.playerId,a.fromGroupId) - rankOf(b.playerId,b.fromGroupId));
    const movedIds = new Set([...relegatedIn, ...promotedIn, ...absenceIn].map(m=>m.playerId));
    const currentMembers = playersInGroup(g.id);
    const stayed = currentMembers.filter(p=> !movedIds.has(p.id) && standingsByGroup[g.id] && standingsByGroup[g.id].some(r=>r.playerId===p.id));
    stayed.sort((a,b)=> rankOf(a.id,g.id) - rankOf(b.id,g.id));
    const accounted = new Set([...stayed.map(p=>p.id), ...movedIds]);
    const others = currentMembers.filter(p=>!accounted.has(p.id)); // n'a jamais joué / cas particulier : en fin de liste
    const finalOrder = [
      ...relegatedIn.map(m=>m.playerId),
      ...stayed.map(p=>p.id),
      ...promotedIn.map(m=>m.playerId),
      ...absenceIn.map(m=>m.playerId),
      ...others.map(p=>p.id)
    ];
    finalOrder.forEach((pid,i)=>{
      const p = DATA.players.find(x=>x.id===pid);
      if(p) p.order = i+1;
    });
  });
}

// ---------- cote évolutive (ELO adapté au double, échelle ~3.5-5.0) ----------
const RATING_DEFAULT = 4.0;
const RATING_MIN = 2.0;
const RATING_MAX = 8.0;
const RATING_SCALE = 0.5; // contrôle la sensibilité de la probabilité de victoire attendue
function ratingOf(pid){
  const p = DATA.players.find(x=>x.id===pid);
  return (p && typeof p.rating === 'number') ? p.rating : RATING_DEFAULT;
}
function ratingGamesOf(pid){
  const p = DATA.players.find(x=>x.id===pid);
  return (p && typeof p.ratingGames === 'number') ? p.ratingGames : 0;
}
// Facteur K plus grand pour les joueurs avec peu de matchs (cote encore
// incertaine), qui se stabilise ensuite — comme DUPR.
function kFactorFor(gamesPlayed){
  if(gamesPlayed < 10) return 0.05;
  if(gamesPlayed < 30) return 0.03;
  return 0.015;
}
// Applique les ajustements de cote pour tous les matchs joués (avec score)
// de la session, tous groupes confondus. Les invités (hors ligue) n'ont pas
// de cote persistante : ils ne gagnent/perdent rien, mais comptent quand
// même comme adversaires réels pour leurs adversaires réguliers.
function applyRatingUpdates(session){
  const snapshot = {}; // cote au début de la session, pour ne pas biaiser selon l'ordre des matchs
  const deltas = {};   // cumul des ajustements par joueur
  const gamesSnapshot = {};
  function getSnapshotRating(pid){
    if(isGuestOrSubId(pid)) return null;
    if(!(pid in snapshot)) snapshot[pid] = ratingOf(pid);
    return snapshot[pid];
  }
  function getSnapshotGames(pid){
    if(!(pid in gamesSnapshot)) gamesSnapshot[pid] = ratingGamesOf(pid);
    return gamesSnapshot[pid];
  }
  (session.groupsData || []).forEach(gd=>{
    const g = groupById(gd.groupId);
    if(!g) return;
    const target = targetPointsFor(activeRosterForGroup(session, gd.groupId).length);
    (gd.matches || []).forEach(m=>{
      if(m.scoreA === null || m.scoreB === null || m.scoreA === '' || m.scoreB === '') return;
      const sa = Number(m.scoreA), sb = Number(m.scoreB);
      if(sa === sb) return;
      const teamARatings = m.teamA.map(getSnapshotRating).filter(r=>r!==null);
      const teamBRatings = m.teamB.map(getSnapshotRating).filter(r=>r!==null);
      if(teamARatings.length===0 || teamBRatings.length===0) return; // deux équipes d'invités : rien à ajuster
      const teamA = teamARatings.reduce((a,b)=>a+b,0) / teamARatings.length;
      const teamB = teamBRatings.reduce((a,b)=>a+b,0) / teamBRatings.length;
      const expectedA = 1 / (1 + Math.pow(10, (teamB - teamA) / RATING_SCALE));
      // Résultat réel pondéré par l'écart de score (comme DUPR) : une victoire
      // écrasante compte plus qu'une victoire serrée, et vice-versa pour la défaite.
      const actualA = Math.min(1, Math.max(0, 0.5 + (sa - sb) / (2 * target)));
      m.teamA.forEach(pid=>{
        if(isGuestOrSubId(pid)) return;
        const k = kFactorFor(getSnapshotGames(pid));
        deltas[pid] = (deltas[pid] || 0) + k * (actualA - expectedA);
        gamesSnapshot[pid] = getSnapshotGames(pid) + 1;
      });
      m.teamB.forEach(pid=>{
        if(isGuestOrSubId(pid)) return;
        const k = kFactorFor(getSnapshotGames(pid));
        deltas[pid] = (deltas[pid] || 0) + k * ((1-actualA) - (1-expectedA));
        gamesSnapshot[pid] = getSnapshotGames(pid) + 1;
      });
    });
  });
  session.ratingDeltas = {}; // pour pouvoir annuler l'effet de cette session plus tard
  Object.keys(deltas).forEach(pid=>{
    const p = DATA.players.find(x=>x.id===pid);
    if(!p) return;
    const before = ratingOf(pid);
    const applied = Math.round(deltas[pid] * 1000) / 1000;
    p.rating = Math.round((before + applied) * 1000) / 1000;
    p.ratingGames = ratingGamesOf(pid) + 1; // au moins un match joué cette session
    session.ratingDeltas[pid] = applied;
  });
}

// options: [{label, active, onclick}] — un contrôle en forme de pilule avec
// un fond qui glisse vers l'option choisie (bascule Admin/Joueur/Remplaçant).
// Masqué automatiquement s'il n'y a rien à basculer (une seule option).
function viewSlideHTML(options){
  if(!options || options.length < 2) return '';
  const activeIndex = Math.max(0, options.findIndex(o=>o.active));
  return `<div class="view-slide" style="--n:${options.length};">
    <div class="view-slide-thumb" style="transform:translateX(${activeIndex * 100}%);"></div>
    ${options.map(o=>`<button class="${o.active?'active':''}" ${o.active?'disabled':''} onclick="${o.onclick}">${escapeHTML(o.label)}</button>`).join('')}
  </div>`;
}
// Barre d'onglets horizontale classique (pilules), affichée directement sur
// la page — navigation principale sur ordinateur. Sur mobile, une barre du
// bas avec icône + texte prend le relais pour chaque onglet (voir CSS
// .bottom-nav, masquée sur ordinateur). extraItems (optionnel) permet
// d'ajouter des actions supplémentaires à cette barre du bas (ex: Absence).
function tabsBarHTML(tabs, activeKey, setTabFn, extraItems){
  const pillsHTML = `<div class="tabs">${tabs.map(([k,label,icon])=>`<div class="tab ${k===activeKey?'active':''}" onclick="${setTabFn}('${k}')">${icon?icon+' ':''}${escapeHTML(label)}</div>`).join('')}</div>`;
  const bottomItems = tabs.map(([k,label,icon])=>({key:k, icon, label, onclick:`${setTabFn}('${k}')`}));
  if(extraItems && extraItems.length){
    // Insérées au centre plutôt qu'à la fin, pour un équilibre visuel (ex :
    // le bouton surélevé Absence entre les onglets plutôt que collé au bord).
    const mid = Math.ceil(bottomItems.length / 2);
    bottomItems.splice(mid, 0, ...extraItems);
  }
  return pillsHTML + bottomNavHTML(bottomItems, activeKey);
}

    leagues = myOrgLeagues();
    fn = 'switchToLeague';
  } else {
    leagues = MY_LEAGUE_LINKS.map(l=>LEAGUES.find(x=>x.id===l.league_id)).filter(Boolean);
    fn = 'switchMyLeague';
  }
  const html = `<div class="row" style="gap:6px;flex-wrap:wrap;">${leagues.map(l=>`<button class="${l.id===CURRENT_LEAGUE_ID?'btn btn-primary':'btn btn-secondary'}" onclick="closeModal();${fn}('${l.id}')">${escapeHTML(l.name)}${l.schedule_label ? ' — '+escapeHTML(l.schedule_label) : ''}</button>`).join('')}</div>`;
  showContentModal('Changer de ligue', html);
}

// cercle surélevé (action principale mise en avant, comme le QR code dans

function bottomNavHTML(items, activeKey){
  return `<div class="bottom-nav-spacer"></div><div class="bottom-nav">

      <button class="bottom-nav-item raised" onclick="${it.onclick}">
        <span class="bn-icon-circle">${it.icon}</span><span class="bn-label">${escapeHTML(it.label)}</span>
      </button>` : `
      <button class="bottom-nav-item ${it.key===activeKey?'active':''}" onclick="${it.onclick}">
        <span class="bn-icon">${it.icon}</span><span class="bn-label">${escapeHTML(it.label)}</span>
      </button>`).join('')}
  </div>`;
}
function closeDrawer(){ DRAWER_OPEN = false; render(); }
// contextHTML : tout le contenu du tiroir (org/ligue, bascule de vue,
// réglages) construit par l'appelant. subtitle : contexte affiché sous le
// titre dans l'en-tête du tiroir (ex: « Espace administrateur »).
function drawerHTML(contextHTML, subtitle){
  if(!DRAWER_OPEN) return '';
  const email = (CURRENT_PROFILE && CURRENT_PROFILE.email) || (SESSION_USER && SESSION_USER.email) || '';
  const displayName = (CURRENT_PROFILE && (CURRENT_PROFILE.display_name || CURRENT_PROFILE.email)) || email || '?';
  const initial = displayName.trim().charAt(0).toUpperCase() || '?';
  const currentLeagueMeta = (typeof LEAGUES !== 'undefined') ? LEAGUES.find(l=>l.id===CURRENT_LEAGUE_ID) : null;
  const orgName = (currentLeagueMeta && currentLeagueMeta.organizations && currentLeagueMeta.organizations.name)
    || ((typeof MY_ORGANIZATIONS !== 'undefined' ? MY_ORGANIZATIONS : []).find(o=>o.id===CURRENT_ORGANIZATION_ID)||{}).name
    || '';
  const scheduleLabel = (currentLeagueMeta && currentLeagueMeta.schedule_label) || '';
  const headerInfo = [orgName, scheduleLabel, subtitle].filter(Boolean).join(' · ');
  return `
  <div class="drawer-overlay" onclick="if(event.target===this) closeDrawer()">
    <div class="drawer-panel">
      <div class="drawer-header">
        <img src="${LOGO_DATA_URI}" alt="Logo">
        <div>
          <h2>${escapeHTML(DATA ? DATA.leagueName : 'Ligue de Pickleball')}</h2>
          ${headerInfo ? `<div class="small" style="color:var(--muted);">${escapeHTML(headerInfo)}</div>` : ''}
        </div>
      </div>
      <div class="drawer-extra" onclick="closeDrawer()">${contextHTML}</div>
      ${SESSION_USER ? `
      <div class="drawer-footer">
        <div class="drawer-avatar">${escapeHTML(initial)}</div>
        <div class="drawer-account-info">
          <div class="name">${escapeHTML(displayName)}</div>
          <div class="email">${escapeHTML(email)}</div>
        </div>
        <button class="drawer-logout-btn" title="Déconnexion" onclick="logout()">⎋</button>
      </div>` : ''}
    </div>
  </div>`;
}

function escapeHTML(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderSetNewPassword(){
  app.innerHTML = `

      <h2>Choisis un nouveau mot de passe</h2>
      ${VIEW.error ? `<p class="small" style="color:var(--danger);">${escapeHTML(VIEW.error)}</p>` : ''}
      ${VIEW.info ? `<p class="small" style="color:var(--ball);">${escapeHTML(VIEW.info)}</p>` : ''}
      <div class="field"><label>Nouveau mot de passe</label><input id="newPassword" type="password" placeholder="6 caractères minimum"></div>
      <div class="field"><label>Confirme le nouveau mot de passe</label><input id="newPasswordConfirm" type="password" placeholder="Retape le même mot de passe"></div>
      <button class="btn btn-primary" onclick="onSetNewPassword()">Enregistrer le nouveau mot de passe</button>
    </div>`;

async function onSetNewPassword(){
  const password = document.getElementById('newPassword').value;
  const passwordConfirm = document.getElementById('newPasswordConfirm').value;
  if(!password || password.length < 6){ VIEW.error = 'Le mot de passe doit contenir au moins 6 caractères.'; render(); return; }
  if(password !== passwordConfirm){ VIEW.error = 'Les deux mots de passe ne correspondent pas.'; render(); return; }
  VIEW.error = null; VIEW.info = 'Mise à jour…'; render();
  const { error } = await sb.auth.updateUser({ password });
  if(error){ VIEW.info = null; VIEW.error = error.message; render(); return; }
  PASSWORD_RECOVERY_MODE = false;
  VIEW = {};
  const { data: { user } } = await sb.auth.getUser();
  await onAuthResolved(user);
}

function setLoginMode(m){ VIEW.loginMode = m; VIEW.error=null; VIEW.info=null; render(); }

async function onSignUp(){
  const name = document.getElementById('signupName').value.trim();
  const email = document.getElementById('signupEmail').value.trim();
  const emailConfirm = document.getElementById('signupEmailConfirm').value.trim();
  const password = document.getElementById('signupPassword').value;
  const passwordConfirm = document.getElementById('signupPasswordConfirm').value;
  if(!name){ VIEW.error='Entre ton nom.'; render(); return; }
  if(!email || !password){ VIEW.error='Courriel et mot de passe requis.'; render(); return; }
  if(email.toLowerCase() !== emailConfirm.toLowerCase()){ VIEW.error='Les deux courriels ne correspondent pas.'; render(); return; }
  if(password !== passwordConfirm){ VIEW.error='Les deux mots de passe ne correspondent pas.'; render(); return; }
  VIEW.error=null; VIEW.info='Création du compte…'; render();
  const { data, error } = await sb.auth.signUp({ email, password, options: { data: { display_name: name, organization_id: SIGNUP_ORG_ID || undefined }, emailRedirectTo: window.location.origin + window.location.pathname } });
  if(error){ VIEW.info=null; VIEW.error = error.message; render(); return; }
  VIEW.info = "Compte créé ! Vérifie tes courriels pour confirmer ton adresse, puis connecte-toi. Un administrateur devra ensuite associer ton compte à ton profil de joueur.";
  VIEW.loginMode = 'signin';
  render();
}
async function onSignIn(){
  const email = document.getElementById('signinEmail').value.trim();
  const password = document.getElementById('signinPassword').value;
  if(!email || !password){ VIEW.error='Courriel et mot de passe requis.'; render(); return; }
  VIEW.error=null; VIEW.info='Connexion…'; render();
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ VIEW.info=null; VIEW.error = error.message; render(); return; }
  MODAL = null;
  await onAuthResolved(data.user);
}
async function onResetPassword(){
  const email = document.getElementById('resetEmail').value.trim();
  if(!email){ VIEW.error='Entre ton courriel.'; render(); return; }
  VIEW.error=null; VIEW.info='Envoi en cours…'; render();
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + window.location.pathname });
  if(error){ VIEW.info=null; VIEW.error = error.message; render(); return; }
  VIEW.info = "Si ce courriel correspond à un compte, un lien de réinitialisation vient d'être envoyé.";
  render();
}
async function onAuthResolved(user){
  if(!user){ SESSION_USER = null; CURRENT_PROFILE = null; render(); return; }

  const { data: profile, error } = await sb.from('profiles').select('*').eq('id', user.id).single();
  if(error || !profile){
    SESSION_USER = { role:'pending', email: user.email, displayName: user.user_metadata && user.user_metadata.display_name };
    CURRENT_PROFILE = null;
    render();
    return;
  }
  CURRENT_PROFILE = profile;

  if(profile.role === 'admin'){
    SESSION_USER = { role:'admin', email: profile.email };
    await loadMyOrganizations(profile.id);
    if(MY_ORGANIZATIONS.length === 0){
      // Un admin sans organisation (cas rare/legacy) : filet de sécurité.
      CURRENT_ORGANIZATION_ID = null;
      LEAGUES = [];
      CURRENT_LEAGUE_ID = null;
      DATA = defaultData();
      VIEW = { tab:'session' };
      render();
      return;
    }
    CURRENT_ORGANIZATION_ID = (CURRENT_ORGANIZATION_ID && MY_ORGANIZATIONS.some(o=>o.id===CURRENT_ORGANIZATION_ID)) ? CURRENT_ORGANIZATION_ID : MY_ORGANIZATIONS[0].id;
    await loadLeagues();
    await loadMyLeagueLinks(profile.id); // pour le sélecteur de ligue dans sa propre vue joueur
    const orgLeagues = myOrgLeagues();
    if(orgLeagues.length === 0){
      // Aucune ligue n'existe encore : l'admin devra en créer une.
      CURRENT_LEAGUE_ID = null;
      DATA = defaultData();
      VIEW = { tab:'session' };
      render();
      return;
    }
    const target = (CURRENT_LEAGUE_ID && orgLeagues.some(l=>l.id===CURRENT_LEAGUE_ID)) ? CURRENT_LEAGUE_ID : orgLeagues[0].id;
    await switchToLeague(target);
    return;
  }

  // Joueur ou remplaçant : on regarde dans quelle(s) ligue(s) ce compte est
  // lié — peu importe le rôle global du compte, chaque ligue est traitée
  // selon son propre type de lien (régulier ou remplaçant), pour qu'un
  // compte puisse être régulier dans une ligue et remplaçant dans une autre.
  CURRENT_ORGANIZATION_ID = null;
  await loadLeagues();
  await loadMyLeagueLinks(profile.id);
  if(MY_LEAGUE_LINKS.length === 0){
    SESSION_USER = { role:'pending', email: profile.email, displayName: profile.display_name };
    render();
    return;
  }
  const link = MY_LEAGUE_LINKS.find(l=>l.league_id===CURRENT_LEAGUE_ID) || MY_LEAGUE_LINKS[0];
  CURRENT_LEAGUE_ID = link.league_id;
  const loaded = await loadData(CURRENT_LEAGUE_ID);
  DATA = loaded || defaultData();
  migrateData();
  if(link.substitute_id){
    SESSION_USER = { role:'substitute', substituteId: link.substitute_id };
    VIEW = { tab:'dispo' };
  } else {
    SESSION_USER = { role:'player', playerId: link.player_id };
    VIEW = { tab:'classement' };
  }
  render();
}
async function loadMyLeagueLinks(profileId){
  const { data, error } = await sb.from('profile_players').select('*').eq('profile_id', profileId);
  MY_LEAGUE_LINKS = error ? [] : (data || []);
}
function renderPending(){
  const canCreateOrg = CURRENT_PROFILE && !CURRENT_PROFILE.organization_id;
  app.innerHTML = `
    ${topbarHTML('Compte en attente')}
    ${storageBannerHTML()}
    <div class="card">
      <h2>Compte créé ✅</h2>
      <p class="small">Ton compte (${escapeHTML(SESSION_USER.email||'')}) n'est pas encore associé à un joueur de la ligue. Un administrateur doit faire ce lien dans l'onglet « Joueurs ». Reviens un peu plus tard, ou contacte ton administrateur.</p>
      <button class="btn btn-secondary" onclick="logout()">Déconnexion</button>
    </div>
    ${canCreateOrg ? `
    <div class="card">
      <h3>Tu démarres ta propre ligue ?</h3>
      <p class="small">Si tu n'attends pas d'invitation d'un administrateur existant, tu peux créer ta propre organisation et devenir administrateur de tes propres ligues.</p>
      <button class="btn btn-primary" onclick="onCreateMyOwnOrganization()">Créer mon organisation</button>
    </div>` : ''}`;
}
async function onCreateMyOwnOrganization(){
  showPrompt("Nom de ton organisation (ex: ton nom, ton club) :", '', async (name)=>{
    if(!name || !name.trim()) return;
    const { data: org, error } = await sb.from('organizations').insert({ name: name.trim() }).select().single();
    if(error){ showAlert("Erreur lors de la création : " + error.message); return; }
    const { error: err2 } = await sb.from('profiles').update({ role:'admin', organization_id: org.id }).eq('id', CURRENT_PROFILE.id);
    if(err2){ showAlert("Erreur lors de la mise à jour du compte : " + err2.message); return; }
    const { error: err3 } = await sb.from('organization_admins').insert({ profile_id: CURRENT_PROFILE.id, organization_id: org.id });
    if(err3){ showAlert("Erreur lors de la liaison à l'organisation : " + err3.message); return; }
    const { data: { user } } = await sb.auth.getUser();
    await onAuthResolved(user);
  });
}
// Un admin déjà en poste crée une organisation supplémentaire (et y reste
// admin en plus de ses organisations actuelles).
async function onCreateOrganization(){
  showPrompt("Nom de la nouvelle organisation :", '', async (name)=>{
    if(!name || !name.trim()) return;
    const { data: org, error } = await sb.from('organizations').insert({ name: name.trim() }).select().single();
    if(error){ showAlert("Erreur lors de la création : " + error.message); return; }
    const { error: err2 } = await sb.from('organization_admins').insert({ profile_id: CURRENT_PROFILE.id, organization_id: org.id });
    if(err2){ showAlert("Erreur lors de la liaison à l'organisation : " + err2.message); return; }
    await loadMyOrganizations(CURRENT_PROFILE.id);
    await switchToOrganization(org.id);
  });
}
async function logout(){
  await sb.auth.signOut();
  SESSION_USER = null;
  CURRENT_PROFILE = null;
  ADMIN_VIEWING_AS = null;
  LEAGUES = [];
  CURRENT_LEAGUE_ID = null;
  MY_LEAGUE_LINKS = [];
  MY_LINK_IN_CURRENT_LEAGUE = null;
  MY_ORGANIZATIONS = [];
  CURRENT_ORGANIZATION_ID = null;
  SUPER_ADMIN_MODE = false;
  OFFLINE_MODE = false;
  OFFLINE_CACHED_AT = null;
  ALL_ORGANIZATIONS = [];
  DATA = null;
  VIEW = {};
  render();
}

    const orgSwitcher0 = MY_ORGANIZATIONS.length > 1 ? `

        </div>

    app.innerHTML = `
      ${topbarHTML('Espace administrateur' + (CURRENT_PROFILE && CURRENT_PROFILE.is_super_admin ? ' · 🛡️ Super admin' : ''), null, `<button class="btn btn-secondary" onclick="logout()">Déconnexion</button>`)}

    return;
