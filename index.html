<title>Ligue de Pickleball</title>
<style>
:root{
  --court: #0F3B3F;
  --court-light: #15525A;
  --line: #EDEDEA;
  --ball: #CFEA5C;
  --ball-dark: #9FBF3A;
  --paddle: #E96A3C;
  --text: #F3F5EF;
  --muted: #8FB3AE;
  --danger: #E9556B;
  --radius: 10px;
  --font-display: 'Arial Narrow', 'Helvetica Neue Condensed', Arial, sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--court);color:var(--text);font-family:var(--font-body);min-height:100%;}
body{padding:0;}
#app{max-width:900px;margin:0 auto;padding:20px 16px 60px;}
h1,h2,h3{font-family:var(--font-display);font-weight:800;letter-spacing:0.02em;margin:0 0 4px;text-transform:uppercase;}
h1{font-size:28px;color:var(--ball);}
h2{font-size:20px;color:var(--line);}
h3{font-size:15px;color:var(--muted);}
p{margin:4px 0;line-height:1.4;}
.eyebrow{font-family:var(--font-display);font-size:12px;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);margin-bottom:2px;}
.card{background:var(--court-light);border-radius:var(--radius);padding:16px;margin-bottom:14px;border:1px solid rgba(255,255,255,0.06);}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.btn{font-family:var(--font-display);text-transform:uppercase;letter-spacing:0.04em;font-weight:700;font-size:13px;border:none;border-radius:999px;padding:10px 18px;cursor:pointer;transition:transform .1s ease, opacity .15s ease;}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--ball);color:#0F3B3F;}
.btn-primary:hover{background:var(--ball-dark);}
.btn-secondary{background:transparent;color:var(--line);border:1px solid rgba(255,255,255,0.25);}
.btn-secondary:hover{border-color:var(--ball);color:var(--ball);}
.btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}
.btn-ghost{display:inline-block;background:rgba(255,255,255,0.08);color:var(--line);border:none;border-radius:999px;padding:5px 12px;font-family:var(--font-body);text-transform:none;letter-spacing:0;font-weight:500;font-size:12px;text-decoration:none;cursor:pointer;transition:background .15s ease, color .15s ease, opacity .15s ease;margin:2px 3px 2px 0;}
.btn-ghost:hover{background:rgba(255,255,255,0.16);color:var(--ball);}
.btn-ghost:disabled{opacity:0.4;cursor:not-allowed;}
input,select{font-family:var(--font-body);font-size:14px;padding:9px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.2);background:rgba(0,0,0,0.2);color:var(--text);}
input::placeholder{color:var(--muted);}
input:focus,select:focus{outline:2px solid var(--ball);outline-offset:1px;}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px;}
.field{margin-bottom:10px;}
table{width:100%;border-collapse:collapse;margin-top:8px;}
th{text-align:left;font-family:var(--font-display);font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid rgba(255,255,255,0.15);}
th.sortable{cursor:pointer;user-select:none;}
th.sortable:hover{color:var(--ball);}
td{padding:8px;border-bottom:1px solid rgba(255,255,255,0.06);font-size:14px;}
tr.me{background:rgba(207,234,92,0.1);}
.tag{display:inline-block;font-family:var(--font-display);font-size:11px;padding:3px 9px;border-radius:999px;letter-spacing:0.05em;text-transform:uppercase;}
.tag-up{background:rgba(207,234,92,0.18);color:var(--ball);}
.tag-down{background:rgba(233,85,107,0.15);color:var(--danger);}
.tag-stay{background:rgba(255,255,255,0.08);color:var(--muted);}
.tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid rgba(255,255,255,0.1);padding-bottom:0;}
.tab{padding:9px 14px;font-family:var(--font-display);font-size:13px;letter-spacing:0.03em;text-transform:uppercase;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;}
.tab.active{color:var(--ball);border-bottom-color:var(--ball);}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;}
.mode-switch{display:inline-flex;border-radius:999px;background:rgba(255,255,255,0.08);padding:3px;gap:2px;}
.mode-switch button{border:none;background:transparent;color:var(--muted);font-family:var(--font-display);font-size:11px;letter-spacing:0.04em;text-transform:uppercase;padding:7px 14px;border-radius:999px;cursor:pointer;transition:background .15s ease,color .15s ease;}
.mode-switch button.active{background:var(--ball);color:var(--court);font-weight:700;}
.mode-switch button:not(.active):hover{color:var(--line);}
.court-mark{width:34px;height:34px;border-radius:8px;background:var(--ball);display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:900;color:var(--court);font-size:16px;}
.brand{display:flex;gap:10px;align-items:center;}
.pill-input{width:64px;text-align:center;}
.vs{font-family:var(--font-display);color:var(--muted);font-size:12px;padding:0 4px;}
.match-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.06);flex-wrap:wrap;}
.match-row:last-child{border-bottom:none;}
.team{flex:1;min-width:120px;font-size:14px;}
.empty{color:var(--muted);font-style:italic;font-size:14px;padding:10px 0;}
.small{font-size:12px;color:var(--muted);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media (max-width:520px){.grid2{grid-template-columns:1fr;}}
.err{color:var(--danger);font-size:13px;margin-top:6px;}
.loading{color:var(--muted);text-align:center;padding:40px 0;font-family:var(--font-display);letter-spacing:0.1em;text-transform:uppercase;}

/* ---------- Tableaux : défilement horizontal plutôt que colonnes écrasées ---------- */
@media (max-width:900px){
  table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:nowrap;}
}

/* ---------- Onglets : défilement horizontal au lieu d'un retour à la ligne serré ---------- */
.tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex:0 0 auto;white-space:nowrap;}

/* ---------- Bureau (écrans larges) : plus d'air, colonnes qui ne s'étirent pas à l'infini ---------- */
@media (min-width:900px){
  #app{max-width:1080px;padding:32px 24px 70px;}
  h1{font-size:32px;}
  .card{padding:20px 22px;}
  th,td{white-space:normal;}
}

/* ---------- Mobile (écrans étroits) : cibles tactiles plus grandes, texte compact ---------- */
@media (max-width:640px){
  #app{padding:14px 12px 50px;}
  h1{font-size:22px;}
  h2{font-size:17px;}
  .card{padding:12px;border-radius:8px;}
  .btn{padding:11px 16px;font-size:12px;}
  .btn,.btn-secondary,.btn-primary,select,input{min-height:42px;}
  .row{gap:8px;}
  .row > .btn,.row > .btn-secondary,.row > .btn-primary{flex:1 1 auto;}
  .topbar{align-items:center;}
  .topbar h1{font-size:19px;}
  .topbar .small{display:none;} /* le sous-titre encombre sur petit écran, le contenu de la page suffit */
  .court-mark{width:30px;height:30px;font-size:14px;}
  th,td{padding:7px 6px;font-size:13px;}
  .tab{padding:9px 12px;font-size:12px;}
  .match-row{gap:6px;padding:9px 0;}
  .team{min-width:90px;font-size:13px;}
  .pill-input{width:48px;}
}

#printArea{display:none;}
.print-page{page-break-after:always;}
.print-page:last-child{page-break-after:auto;}
.print-title{font-family:var(--font-display);font-size:20px;font-weight:800;text-transform:uppercase;margin:0 0 2px;}
.print-sub{font-size:13px;color:#333;margin:0 0 14px;}
.print-table{width:100%;border-collapse:collapse;margin-bottom:10px;}
.print-table th,.print-table td{border:1px solid #999;padding:8px 10px;font-size:13px;text-align:left;}
.print-table th{background:#eee;text-transform:uppercase;font-family:var(--font-display);font-size:11px;letter-spacing:0.04em;}
.print-score-box{display:inline-block;width:42px;height:24px;border:1px solid #666;vertical-align:middle;}
@media print{
  body.print-mode #app{display:none !important;}
  body.print-mode #printArea{display:block !important;color:#000;background:#fff;font-family:var(--font-body);padding:0;}
  body.print-mode{background:#fff;}
}

<script>
const SUPABASE_URL = 'https://gywgvldkljwhjclwxtgb.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5d2d2bGRrbGp3aGpjbHd4dGdiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxNDE5MzMsImV4cCI6MjEwMzcxNzkzM30.pB_pkDI5ru9HUPwSAMipwStovt02OYLtzTqpMtx0d30';

// L'app est maintenant hébergée sur un vrai site web (pas dans l'aperçu
// fermé de Claude), donc le stockage normal du navigateur fonctionne bien ici
// et permet de rester connecté d'un rafraîchissement à l'autre.
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: true, autoRefreshToken: true }
});

let DATA = null;
let SESSION_USER = null; // {role:'admin'|'player'|'pending', playerId?, email?, displayName?}
let CURRENT_PROFILE = null;
let ADMIN_VIEWING_AS_PLAYER = false;
let VIEW = { tab: null, error: null };

// ---------- multi-ligues ----------
let LEAGUES = [];              // toutes les ligues (admins) ou non utilisé (joueurs)
let CURRENT_LEAGUE_ID = null;  // ligue actuellement affichée
let MY_LEAGUE_LINKS = [];      // pour un joueur : [{league_id, player_id}, ...]
let MY_LINK_IN_CURRENT_LEAGUE = null; // pour un admin qui joue aussi : son propre lien dans la ligue affichée

// ---------- stockage (Supabase) ----------
let STORAGE_OK = null; // null=inconnu, true/false une fois vérifié
let SAVE_ERROR = null;

async function loadData(leagueId){
  try{
    const { data, error } = await sb.from('league_data').select('data').eq('league_id', leagueId).single();
    if(error) throw error;
    STORAGE_OK = true;
    return (data && data.data && Object.keys(data.data).length>0) ? data.data : null;
  }catch(e){
    console.error('Erreur de chargement', e);
    STORAGE_OK = false;
    return null;
  }
}
async function saveData(){
  if(!CURRENT_LEAGUE_ID) return;
  try{
    const { error } = await sb.from('league_data').update({ data: DATA, updated_at: new Date().toISOString() }).eq('league_id', CURRENT_LEAGUE_ID);
    if(error) throw error;
    SAVE_ERROR = null;
    STORAGE_OK = true;
  }catch(e){
    SAVE_ERROR = "La sauvegarde a échoué : " + (e && e.message ? e.message : 'erreur inconnue');
    console.error('Erreur de sauvegarde', e);
  }
}
async function loadLeagues(){
  const { data, error } = await sb.from('leagues').select('*').order('created_at', { ascending:true });
  LEAGUES = error ? [] : (data || []);
}
async function createLeague(name, scheduleLabel){
  const { data, error } = await sb.from('leagues').insert({ name, schedule_label: scheduleLabel || null }).select().single();
  if(error){ showAlert("Erreur lors de la création : " + error.message); return null; }
  const fresh = defaultData();
  fresh.leagueName = name;
  const { error: err2 } = await sb.from('league_data').insert({ league_id: data.id, data: fresh });
  if(err2){ showAlert("Erreur lors de la création : " + err2.message); return null; }
  await loadLeagues();
  return data.id;
}
function onCreateLeague(){
  showPrompt("Nom de la nouvelle ligue :", '', (name)=>{
    if(!name || !name.trim()) return;
    showPrompt("Jour/heure de jeu (optionnel, ex: Lundi 19h) :", '', async (schedule)=>{
      const id = await createLeague(name.trim(), schedule ? schedule.trim() : '');
      if(id){ await switchToLeague(id); }
    });
  });
}
// Change la ligue affichée par un administrateur.
async function switchToLeague(leagueId){
  CURRENT_LEAGUE_ID = leagueId;
  const loaded = await loadData(leagueId);
  DATA = loaded || defaultData();
  migrateData();
  await refreshMyLinkForCurrentLeague();
  VIEW = { tab:'session' };
  render();
}
// Vérifie si le compte admin courant est lui-même lié à un joueur dans cette ligue.
async function refreshMyLinkForCurrentLeague(){
  if(!CURRENT_PROFILE || !CURRENT_LEAGUE_ID){ MY_LINK_IN_CURRENT_LEAGUE = null; return; }
  const { data, error } = await sb.from('profile_players').select('*').eq('profile_id', CURRENT_PROFILE.id).eq('league_id', CURRENT_LEAGUE_ID).maybeSingle();
  MY_LINK_IN_CURRENT_LEAGUE = error ? null : data;
}
// Change la ligue affichée par un joueur qui joue dans plusieurs ligues.
async function switchMyLeague(leagueId){
  const link = MY_LEAGUE_LINKS.find(l=>l.league_id===leagueId);
  if(!link) return;
  CURRENT_LEAGUE_ID = leagueId;
  const loaded = await loadData(leagueId);
  DATA = loaded || defaultData();
  migrateData();
  if(SESSION_USER.role === 'admin'){
    // Un admin qui consulte sa propre vue joueur : on ne touche pas à son
    // rôle, seulement à la ligue et au lien joueur affichés.
    MY_LINK_IN_CURRENT_LEAGUE = link;
  } else {
    SESSION_USER = { role:'player', playerId: link.player_id };
  }
  VIEW = { tab:'classement' };
  render();
}
// Recharge à la fois le lien joueur de l'admin dans la ligue affichée et la
// liste complète de ses ligues (pour le sélecteur en vue joueur).
async function refreshMyOwnLinks(){
  if(!CURRENT_PROFILE) return;
  await loadMyLeagueLinks(CURRENT_PROFILE.id);
  await refreshMyLinkForCurrentLeague();
}

function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }

function defaultData(){
  return {
    leagueName: 'Ma ligue de pickleball',
    swapCount: 1,
    matchesPerSession: 10,
    testMode: false,
    groups: [ { id: uid('g'), name: 'Groupe 1', order: 1 } ],
    players: [],
    sessions: [],
    substitutePool: []
  };
}

// ---------- doubles generation ----------
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
// Règle standard : 5 joueurs → 10 matchs (à 9 points) ; 4 joueurs → 6 matchs (à 11 points).
// Le mode test (Réglages) permet de contourner temporairement cette règle pour essayer l'app rapidement.
function matchesCountFor(n){
  if(DATA.testMode) return Math.max(1, DATA.matchesPerSession || 3);
  if(n === 5) return 10;
  if(n === 4) return 6;
  return DATA.matchesPerSession || 10; // repli pour une taille de groupe atypique
}
function targetPointsFor(n){
  if(n === 5) return 9;
  if(n === 4) return 11;
  return 11;
}

function generateUnit(playerIds){
  const p = shuffle(playerIds);
  if(p.length === 4){
    return [
      { sit:null, teamA:[p[0],p[1]], teamB:[p[2],p[3]], scoreA:null, scoreB:null },
      { sit:null, teamA:[p[0],p[2]], teamB:[p[1],p[3]], scoreA:null, scoreB:null },
      { sit:null, teamA:[p[0],p[3]], teamB:[p[1],p[2]], scoreA:null, scoreB:null }
    ];
  }
  if(p.length === 5){
    const matches = [];
    for(let sit=0; sit<5; sit++){
      const rest = p.filter((_,i)=>i!==sit);
      const combos = [
        [[rest[0],rest[1]],[rest[2],rest[3]]],
        [[rest[0],rest[2]],[rest[1],rest[3]]],
        [[rest[0],rest[3]],[rest[1],rest[2]]]
      ];
      const c = combos[sit % 3];
      matches.push({ sit:p[sit], teamA:c[0], teamB:c[1], scoreA:null, scoreB:null });
    }
    return matches;
  }
  // fallback for other sizes: simple rotation, one match per 4, leftover sits
  const matches = [];
  for(let i=0;i+3<p.length;i+=4){
    matches.push({ sit:null, teamA:[p[i],p[i+1]], teamB:[p[i+2],p[i+3]], scoreA:null, scoreB:null });
  }
  if(matches.length===0 && p.length>0){
    matches.push({ sit:null, teamA:p.slice(0,Math.ceil(p.length/2)), teamB:p.slice(Math.ceil(p.length/2)), scoreA:null, scoreB:null });
  }
  return matches;
}

// Une session génère un nombre de matchs par groupe selon la règle standard
// (voir matchesCountFor). On enchaîne des blocs (round-robin complet pour 4,
// rotation complète pour 5) en remélangeant à chaque bloc pour varier les partenaires.
function generateMatches(playerIds){
  if(playerIds.length < 2) return [];
  const target = matchesCountFor(playerIds.length);
  let matches = [];
  let guard = 0;
  while(matches.length < target && guard < 20){
    matches = matches.concat(generateUnit(playerIds));
    guard++;
  }
  return matches.slice(0, target);
}

// ---------- standings ----------
// Confrontations directes entre deux joueurs (équipes adverses uniquement).
// Retourne > 0 si pidA a gagné plus souvent contre pidB, < 0 si l'inverse, 0 sinon.
function headToHead(matches, pidA, pidB){
  let winsA = 0, winsB = 0;
  matches.forEach(m=>{
    if(m.scoreA === null || m.scoreB === null || m.scoreA === '' || m.scoreB === '') return;
    const aInA = m.teamA.includes(pidA), aInB = m.teamB.includes(pidA);
    const bInA = m.teamA.includes(pidB), bInB = m.teamB.includes(pidB);
    if(!((aInA && bInB) || (aInB && bInA))) return; // pas adversaires dans ce match
    const sa = Number(m.scoreA), sb = Number(m.scoreB);
    if(sa === sb) return;
    const aWon = aInA ? sa > sb : sb > sa;
    if(aWon) winsA++; else winsB++;
  });
  return winsA - winsB;
}

// Index (ordre chronologique) du premier match perdu par un joueur. Infinity si jamais perdu.
function firstLossIndex(matches, pid){
  for(let i=0;i<matches.length;i++){
    const m = matches[i];
    if(m.scoreA === null || m.scoreB === null || m.scoreA === '' || m.scoreB === '') continue;
    const inA = m.teamA.includes(pid), inB = m.teamB.includes(pid);
    if(!inA && !inB) continue;
    const sa = Number(m.scoreA), sb = Number(m.scoreB);
    const lost = inA ? sa < sb : sb < sa;
    if(lost) return i;
  }
  return Infinity;
}

function computeStandings(groupPlayers, matches){
  const stats = {};
  groupPlayers.forEach(pid => stats[pid] = { wins:0, losses:0, pf:0, pa:0, played:0, scheduled:0 });
  matches.forEach(m=>{
    m.teamA.forEach(pid=>{ if(stats[pid]) stats[pid].scheduled++; });
    m.teamB.forEach(pid=>{ if(stats[pid]) stats[pid].scheduled++; });
    if(m.scoreA === null || m.scoreB === null || m.scoreA === '' || m.scoreB === '') return;
    const sa = Number(m.scoreA), sb = Number(m.scoreB);
    m.teamA.forEach(pid=>{ if(stats[pid]){ stats[pid].pf += sa; stats[pid].pa += sb; stats[pid].played++; if(sa>sb) stats[pid].wins++; else if(sa<sb) stats[pid].losses++; } });
    m.teamB.forEach(pid=>{ if(stats[pid]){ stats[pid].pf += sb; stats[pid].pa += sa; stats[pid].played++; if(sb>sa) stats[pid].wins++; else if(sb<sa) stats[pid].losses++; } });
  });
  const rows = groupPlayers.map(pid => ({
    playerId: pid,
    ...stats[pid],
    diff: stats[pid].pf - stats[pid].pa,
    avgPts: stats[pid].played > 0 ? (stats[pid].pf / stats[pid].played) : null
  }));
  // Classement : 1) total de points  2) nombre de victoires  3) face-à-face direct
  // 4) le premier des deux à avoir perdu un match est départagé en dernier (perd le bris d'égalité)
  rows.sort((a,b)=>{
    if(b.pf !== a.pf) return b.pf - a.pf;
    if(b.wins !== a.wins) return b.wins - a.wins;
    const h2h = headToHead(matches, a.playerId, b.playerId);
    if(h2h !== 0) return -h2h;
    const fa = firstLossIndex(matches, a.playerId);
    const fb = firstLossIndex(matches, b.playerId);
    if(fa !== fb) return fb - fa; // celui qui a perdu le plus tard (ou jamais) est classé devant
    return 0;
  });
  return rows;
}

function playerName(id){
  if(typeof id === 'string' && id.startsWith('guest::')) return decodeURIComponent(id.slice(7));
  const p = DATA.players.find(x=>x.id===id);
  return p ? p.name : '?';
}
function isGuestId(id){ return typeof id === 'string' && id.startsWith('guest::'); }
function groupById(id){ return DATA.groups.find(g=>g.id===id); }
function groupsSorted(){ return DATA.groups.slice().sort((a,b)=>a.order-b.order); }
function playersInGroup(gid){ return DATA.players.filter(p=>p.groupId===gid); }

const GROUP_MAX_PLAYERS = 5;
// Retourne le premier groupe (selon l'ordre de l'échelle) qui a encore de la
// place (moins de GROUP_MAX_PLAYERS joueurs), ou null si tous sont pleins.
function firstGroupWithRoom(groupsList, playersList){
  const sorted = groupsList.slice().sort((a,b)=>a.order-b.order);
  for(const g of sorted){
    const count = playersList.filter(p=>p.groupId===g.id).length;
    if(count < GROUP_MAX_PLAYERS) return g.id;
  }
  return sorted.length ? sorted[0].id : null;
}
// Vérifie la capacité d'un groupe avant d'y placer un joueur. Si plein,
// avertit et retourne plutôt le premier groupe disponible.
function resolveGroupAssignment(desiredGroupId, groupsList, playersList){
  const count = playersList.filter(p=>p.groupId===desiredGroupId).length;
  if(count < GROUP_MAX_PLAYERS) return desiredGroupId;
  const alt = firstGroupWithRoom(groupsList, playersList);
  const desiredName = (groupsList.find(g=>g.id===desiredGroupId)||{}).name || 'ce groupe';
  const altName = (groupsList.find(g=>g.id===alt)||{}).name || '—';
  showAlert(`${desiredName} a déjà ${GROUP_MAX_PLAYERS} joueurs (maximum). Le joueur a plutôt été placé dans ${altName}.`);
  return alt;
}
// Ajoute un suffixe numéroté si le nom existe déjà, pour éviter les doublons.
function uniquePlayerName(desiredName, playersList, excludePlayerId){
  const base = desiredName.trim();
  const existing = new Set(playersList.filter(p=>p.id!==excludePlayerId).map(p=>p.name.trim().toLowerCase()));
  if(!existing.has(base.toLowerCase())) return base;
  let n = 2;
  while(existing.has(`${base} (${n})`.toLowerCase())) n++;
  const finalName = `${base} (${n})`;
  showAlert(`Le nom « ${base} » existe déjà — ce joueur a été nommé « ${finalName} » pour les distinguer.`);
  return finalName;
}

// ---------- session lifecycle ----------
// Retourne la date (YYYY-MM-DD) du prochain jour correspondant au jour de jeu
// configuré pour la ligue (aujourd'hui inclus si on est justement ce jour-là).
// Si aucun jour n'est configuré, retourne simplement la date d'aujourd'hui.
function fmtDate(d){
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return `${yyyy}-${mm}-${dd}`;
}
function nextSessionDate(){
  if(typeof DATA.playDayOfWeek !== 'number') return fmtDate(new Date());
  const now = new Date();
  const diff = (DATA.playDayOfWeek - now.getDay() + 7) % 7;
  const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + diff);
  return fmtDate(d);
}
function startNewSession(explicitDate){
  const groupsData = DATA.groups.map(g=>{
    const ids = playersInGroup(g.id).map(p=>p.id);
    return { groupId: g.id, matches: ids.length >= 2 ? generateMatches(ids) : [] };
  });
  const session = { id: uid('s'), date: explicitDate || nextSessionDate(), status:'open', groupsData, movements: null, absences: [], published: false };
  DATA.sessions.push(session);
  return session;
}
function toggleAbsence(playerId){
  const open = currentOpenSession();
  if(!open) return;
  if(!open.absences) open.absences = [];
  const idx = open.absences.indexOf(playerId);
  const groupsToRefresh = new Set();
  const homeP = DATA.players.find(p=>p.id===playerId);
  if(homeP) groupsToRefresh.add(homeP.groupId);
  if(idx === -1){
    open.absences.push(playerId);
  } else {
    open.absences.splice(idx,1);
    // s'il avait été prêté à un autre groupe, on annule ce prêt
    if(open.loans && open.loans[playerId]){
      const toGid = open.loans[playerId];
      delete open.loans[playerId];
      const gd2 = open.groupsData.find(x=>x.groupId===toGid);
      if(gd2 && gd2.substitutes){
        Object.keys(gd2.substitutes).forEach(aId=>{ if(gd2.substitutes[aId]===playerId) delete gd2.substitutes[aId]; });
      }
      groupsToRefresh.add(toGid);
    }
  }
  groupsToRefresh.forEach(gId=>regenerateGroupMatches(open, gId));
  saveAndRender();
}
function isAbsent(session, playerId){ return !!(session && session.absences && session.absences.includes(playerId)); }
function currentOpenSession(){ return DATA.sessions.find(s=>s.status==='open'); }

// Effectif réellement actif d'un groupe pour une session : membres présents,
// plus les remplaçants assignés aux absents. La place d'un absent sans
// remplaçant reste simplement vide.
function activeRosterForGroup(session, gid){
  const groupIds = playersInGroup(gid).map(p=>p.id);
  const gd = session.groupsData.find(x=>x.groupId===gid);
  const subs = (gd && gd.substitutes) || {};
  const roster = [];
  groupIds.forEach(id=>{
    if(isAbsent(session, id)){
      if(subs[id]) roster.push(subs[id]);
    } else {
      roster.push(id);
    }
  });
  return roster;
}
function regenerateGroupMatches(session, gid){
  const gd = session.groupsData.find(x=>x.groupId===gid);
  if(!gd) return;
  const ids = activeRosterForGroup(session, gid);
  gd.matches = ids.length>=2 ? generateMatches(ids) : [];
}
// Joueurs déjà utilisés comme remplaçants ailleurs dans la session (pour éviter
// qu'un même joueur soit assigné à deux groupes en même temps).
function substitutesInUse(session, excludeGid, excludeAbsentId){
  const set = new Set();
  DATA.groups.forEach(g=>{
    const gd2 = session.groupsData.find(x=>x.groupId===g.id);
    if(!gd2 || !gd2.substitutes) return;
    Object.entries(gd2.substitutes).forEach(([aId, subId])=>{
      if(g.id===excludeGid && aId===excludeAbsentId) return;
      if(!isGuestId(subId)) set.add(subId);
    });
  });
  return set;
}
// Assigne (ou retire) un remplaçant à la place d'un absent. Si le remplaçant
// choisi est un joueur de la ligue actif dans son propre groupe, ce dernier
// est automatiquement marqué absent de son groupe d'origine (« prêté »),
// libérant sa place — qui peut alors être gérée comme n'importe quelle absence.
function setSubstitute(gid, absentId, subId){
  const open = currentOpenSession();
  const gd = open.groupsData.find(x=>x.groupId===gid);
  if(!gd.substitutes) gd.substitutes = {};
  if(!open.loans) open.loans = {};
  const oldSub = gd.substitutes[absentId];
  const groupsToRefresh = new Set([gid]);

  // annuler le prêt précédent s'il y en avait un pour cette place
  if(oldSub && !isGuestId(oldSub) && open.loans[oldSub] === gid){
    delete open.loans[oldSub];
    const idx2 = open.absences.indexOf(oldSub);
    if(idx2>-1) open.absences.splice(idx2,1);
    const homeOld = DATA.players.find(p=>p.id===oldSub);
    if(homeOld) groupsToRefresh.add(homeOld.groupId);
  }

  if(subId){
    gd.substitutes[absentId] = subId;
    if(!isGuestId(subId)){
      if(!open.absences.includes(subId)) open.absences.push(subId);
      open.loans[subId] = gid;
      const homeNew = DATA.players.find(p=>p.id===subId);
      if(homeNew && homeNew.groupId !== gid) groupsToRefresh.add(homeNew.groupId);
    }
  } else {
    delete gd.substitutes[absentId];
  }

  groupsToRefresh.forEach(gId2=>regenerateGroupMatches(open, gId2));
  saveAndRender();
}
function onSubSelect(gid, absentId, value){
  if(value === '__guest__'){
    showPrompt("Nom du remplaçant invité (ne fait pas partie de la ligue) :", '', (name)=>{
      if(name && name.trim()){ setSubstitute(gid, absentId, 'guest::' + encodeURIComponent(name.trim())); }
      else { render(); }
    });
  } else {
    setSubstitute(gid, absentId, value);
  }
}

function groupBelow(gid){
  const sorted = groupsSorted();
  const idx = sorted.findIndex(g=>g.id===gid);
  return idx>=0 && idx<sorted.length-1 ? sorted[idx+1].id : null;
}

function finalizeSession(session){
  const movements = []; // {playerId, fromGroupId, toGroupId, reason?}
  const sorted = groupsSorted();
  const standingsByGroup = {};
  session.groupsData.forEach(gd=>{
    standingsByGroup[gd.groupId] = computeStandings(activeRosterForGroup(session, gd.groupId), gd.matches);
  });
  session.standingsByGroup = standingsByGroup;

  for(let i=0;i<sorted.length-1;i++){
    const upper = sorted[i];   // meilleur groupe (order plus petit)
    const lower = sorted[i+1];
    // Les remplaçants réguliers (joueurs prêtés) suivent les règles normales du
    // groupe où ils ont joué. Seuls les invités hors ligue ne sont jamais éligibles.
    const upperStand = (standingsByGroup[upper.id] || []).filter(r=> !isGuestId(r.playerId));
    const lowerStand = (standingsByGroup[lower.id] || []).filter(r=> !isGuestId(r.playerId));
    const n = Math.min(DATA.swapCount, upperStand.length, lowerStand.length);
    for(let k=0;k<n;k++){
      const goingUp = lowerStand[k];          // top du groupe inférieur
      const goingDown = upperStand[upperStand.length-1-k]; // bas du groupe supérieur
      if(goingUp) movements.push({ playerId: goingUp.playerId, fromGroupId: lower.id, toGroupId: upper.id });
      if(goingDown) movements.push({ playerId: goingDown.playerId, fromGroupId: upper.id, toGroupId: lower.id });
    }
  }
  movements.forEach(m=>{
    const pl = DATA.players.find(p=>p.id===m.playerId);
    if(pl) pl.groupId = m.toGroupId;
  });

  // Un joueur absent qui n'a pas été prêté ailleurs (donc n'a joué nulle part
  // cette session) descend automatiquement d'un groupe pour la session suivante.
  (session.absences || []).forEach(pid=>{
    if(session.loans && session.loans[pid]) return; // il jouait ailleurs comme remplaçant : pas pénalisé
    const pl = DATA.players.find(p=>p.id===pid);
    if(!pl) return;
    const fromGroupId = pl.groupId;
    const below = groupBelow(fromGroupId);
    if(below){
      movements.push({ playerId: pid, fromGroupId, toGroupId: below, reason:'absence' });
      pl.groupId = below;
    }
  });

  applyRatingUpdates(session);

  session.movements = movements;
  session.status = 'closed';
}

// ---------- cote évolutive (ELO adapté au double, échelle ~3.5-5.0) ----------
const RATING_DEFAULT = 4.0;
const RATING_MIN = 2.0;
const RATING_MAX = 8.0;
const RATING_SCALE = 0.5; // contrôle la sensibilité de la probabilité de victoire attendue
function ratingOf(pid){
  const p = DATA.players.find(x=>x.id===pid);
  return (p && typeof p.rating === 'number') ? p.rating : RATING_DEFAULT;
}
function ratingGamesOf(pid){
  const p = DATA.players.find(x=>x.id===pid);
  return (p && typeof p.ratingGames === 'number') ? p.ratingGames : 0;
}
// Facteur K plus grand pour les joueurs avec peu de matchs (cote encore
// incertaine), qui se stabilise ensuite — comme DUPR.
function kFactorFor(gamesPlayed){
  if(gamesPlayed < 10) return 0.05;
  if(gamesPlayed < 30) return 0.03;
  return 0.015;
}
// Applique les ajustements de cote pour tous les matchs joués (avec score)
// de la session, tous groupes confondus. Les invités (hors ligue) n'ont pas
// de cote persistante : ils ne gagnent/perdent rien, mais comptent quand
// même comme adversaires réels pour leurs adversaires réguliers.
function applyRatingUpdates(session){
  const snapshot = {}; // cote au début de la session, pour ne pas biaiser selon l'ordre des matchs
  const deltas = {};   // cumul des ajustements par joueur
  const gamesSnapshot = {};
  function getSnapshotRating(pid){
    if(isGuestId(pid)) return null;
    if(!(pid in snapshot)) snapshot[pid] = ratingOf(pid);
    return snapshot[pid];
  }
  function getSnapshotGames(pid){
    if(!(pid in gamesSnapshot)) gamesSnapshot[pid] = ratingGamesOf(pid);
    return gamesSnapshot[pid];
  }
  (session.groupsData || []).forEach(gd=>{
    const g = groupById(gd.groupId);
    if(!g) return;
    const target = targetPointsFor(activeRosterForGroup(session, gd.groupId).length);
    (gd.matches || []).forEach(m=>{
      if(m.scoreA === null || m.scoreB === null || m.scoreA === '' || m.scoreB === '') return;
      const sa = Number(m.scoreA), sb = Number(m.scoreB);
      if(sa === sb) return;
      const teamARatings = m.teamA.map(getSnapshotRating).filter(r=>r!==null);
      const teamBRatings = m.teamB.map(getSnapshotRating).filter(r=>r!==null);
      if(teamARatings.length===0 || teamBRatings.length===0) return; // deux équipes d'invités : rien à ajuster
      const teamA = teamARatings.reduce((a,b)=>a+b,0) / teamARatings.length;
      const teamB = teamBRatings.reduce((a,b)=>a+b,0) / teamBRatings.length;
      const expectedA = 1 / (1 + Math.pow(10, (teamB - teamA) / RATING_SCALE));
      // Résultat réel pondéré par l'écart de score (comme DUPR) : une victoire
      // écrasante compte plus qu'une victoire serrée, et vice-versa pour la défaite.
      const actualA = Math.min(1, Math.max(0, 0.5 + (sa - sb) / (2 * target)));
      m.teamA.forEach(pid=>{
        if(isGuestId(pid)) return;
        const k = kFactorFor(getSnapshotGames(pid));
        deltas[pid] = (deltas[pid] || 0) + k * (actualA - expectedA);
        gamesSnapshot[pid] = getSnapshotGames(pid) + 1;
      });
      m.teamB.forEach(pid=>{
        if(isGuestId(pid)) return;
        const k = kFactorFor(getSnapshotGames(pid));
        deltas[pid] = (deltas[pid] || 0) + k * ((1-actualA) - (1-expectedA));
        gamesSnapshot[pid] = getSnapshotGames(pid) + 1;
      });
    });
  });
  session.ratingDeltas = {}; // pour pouvoir annuler l'effet de cette session plus tard
  Object.keys(deltas).forEach(pid=>{
    const p = DATA.players.find(x=>x.id===pid);
    if(!p) return;
    const before = ratingOf(pid);
    const applied = Math.round(deltas[pid] * 1000) / 1000;
    p.rating = Math.round((before + applied) * 1000) / 1000;
    p.ratingGames = ratingGamesOf(pid) + 1; // au moins un match joué cette session
    session.ratingDeltas[pid] = applied;
  });
}

async function onSignUp(){
  const name = document.getElementById('signupName').value.trim();
  const email = document.getElementById('signupEmail').value.trim();
  const password = document.getElementById('signupPassword').value;
  if(!name){ VIEW.error='Entre ton nom.'; render(); return; }
  if(!email || !password){ VIEW.error='Courriel et mot de passe requis.'; render(); return; }
  VIEW.error=null; VIEW.info='Création du compte…'; render();
  const { data, error } = await sb.auth.signUp({ email, password, options: { data: { display_name: name } } });
  if(error){ VIEW.info=null; VIEW.error = error.message; render(); return; }
  VIEW.info = "Compte créé ! Vérifie tes courriels pour confirmer ton adresse, puis connecte-toi. Un administrateur devra ensuite associer ton compte à ton profil de joueur.";
  VIEW.loginMode = 'signin';
  render();

async function onSignIn(){
  const email = document.getElementById('signinEmail').value.trim();
  const password = document.getElementById('signinPassword').value;
  if(!email || !password){ VIEW.error='Courriel et mot de passe requis.'; render(); return; }
  VIEW.error=null; VIEW.info='Connexion…'; render();
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ VIEW.info=null; VIEW.error = error.message; render(); return; }
  await onAuthResolved(data.user);
}
async function onResetPassword(){
  const email = document.getElementById('resetEmail').value.trim();
  if(!email){ VIEW.error='Entre ton courriel.'; render(); return; }
  VIEW.error=null; VIEW.info='Envoi en cours…'; render();
  const { error } = await sb.auth.resetPasswordForEmail(email);
  if(error){ VIEW.info=null; VIEW.error = error.message; render(); return; }
  VIEW.info = "Si ce courriel correspond à un compte, un lien de réinitialisation vient d'être envoyé.";
  render();

async function onAuthResolved(user){
  if(!user){ SESSION_USER = null; CURRENT_PROFILE = null; render(); return; }

  const { data: profile, error } = await sb.from('profiles').select('*').eq('id', user.id).single();
  if(error || !profile){
    SESSION_USER = { role:'pending', email: user.email, displayName: user.user_metadata && user.user_metadata.display_name };
    CURRENT_PROFILE = null;
    render();
    return;
  }
  CURRENT_PROFILE = profile;
  await loadLeagues();

  if(profile.role === 'admin'){
    SESSION_USER = { role:'admin', email: profile.email };
    await loadMyLeagueLinks(profile.id); // pour le sélecteur de ligue dans sa propre vue joueur
    if(LEAGUES.length === 0){
      // Aucune ligue n'existe encore : l'admin devra en créer une.
      CURRENT_LEAGUE_ID = null;
      DATA = defaultData();
      VIEW = { tab:'session' };
      render();
      return;
    }
    const target = (CURRENT_LEAGUE_ID && LEAGUES.some(l=>l.id===CURRENT_LEAGUE_ID)) ? CURRENT_LEAGUE_ID : LEAGUES[0].id;
    await switchToLeague(target);
    return;
  }

  // Joueur : on regarde dans quelle(s) ligue(s) ce compte est lié.
  await loadMyLeagueLinks(profile.id);
  if(MY_LEAGUE_LINKS.length === 0){
    SESSION_USER = { role:'pending', email: profile.email, displayName: profile.display_name };
    render();
    return;
  }
  const link = MY_LEAGUE_LINKS.find(l=>l.league_id===CURRENT_LEAGUE_ID) || MY_LEAGUE_LINKS[0];
  CURRENT_LEAGUE_ID = link.league_id;
  const loaded = await loadData(CURRENT_LEAGUE_ID);
  DATA = loaded || defaultData();
  migrateData();
  SESSION_USER = { role:'player', playerId: link.player_id };
  VIEW = { tab:'classement' };
  render();
}
async function loadMyLeagueLinks(profileId){
  const { data, error } = await sb.from('profile_players').select('*').eq('profile_id', profileId);
  MY_LEAGUE_LINKS = error ? [] : (data || []);
}

function addPlayerFromList(){

  const groupEl = document.getElementById('newPlayerGroup');

  const rawName = nameEl.value.trim();
  const desiredGroupId = groupEl.value;
  if(!rawName || !desiredGroupId) return;
  const name = uniquePlayerName(rawName, DATA.players);

  const rating = isNaN(rawRating) ? RATING_DEFAULT : Math.min(RATING_MAX, Math.max(RATING_MIN, rawRating));

function renamePlayer(pid){
  const p = DATA.players.find(x=>x.id===pid);

// Modification manuelle de la cote d'un joueur, avec bornes raisonnables
// (2.0-8.0) et une confirmation renforcée si le joueur a déjà des matchs
// comptabilisés (pour éviter d'écraser une cote gagnée par erreur).
function applyRatingEdit(pid, rawValue){
  const p = DATA.players.find(x=>x.id===pid);
  if(!p) return;
  const value = parseFloat(String(rawValue).replace(',', '.'));
  if(isNaN(value)){ showAlert("Valeur invalide."); return; }
  const clamped = Math.min(RATING_MAX, Math.max(RATING_MIN, value));
  p.rating = Math.round(clamped * 1000) / 1000;
  saveAndRender();
}
function editPlayerRating(pid){
  const p = DATA.players.find(x=>x.id===pid);
  if(!p) return;
  const current = typeof p.rating === 'number' ? p.rating : RATING_DEFAULT;
  const games = typeof p.ratingGames === 'number' ? p.ratingGames : 0;
  const promptForValue = ()=>{
    showPrompt(`Nouvelle cote de ${p.name} (entre ${RATING_MIN.toFixed(1)} et ${RATING_MAX.toFixed(1)}) :`, current.toFixed(2), (val)=>{
      if(val !== null && val !== undefined && val.trim() !== '') applyRatingEdit(pid, val.trim());
    });
  };
  if(games > 0){
    showConfirm(`${p.name} a déjà ${games} match${games>1?'s':''} comptabilisé${games>1?'s':''} dans sa cote actuelle (${current.toFixed(2)}). La modifier manuellement écrasera cette progression. Continuer ?`, promptForValue);
  } else {
    promptForValue();
  }
}

// Ajoute un joueur (par son compte lié) dans une AUTRE ligue : crée un nouveau
// joueur là-bas (dans son premier groupe) et lie le compte à celui-ci.
async function addPlayerToLeagueForProfile(leagueId, profileId, name){
  const { data, error } = await sb.from('league_data').select('data').eq('league_id', leagueId).single();
  if(error){ showAlert("Erreur : " + error.message); return null; }
  const leagueData = (data && data.data && Object.keys(data.data).length>0) ? data.data : defaultData();
  leagueData.players = leagueData.players || [];
  leagueData.groups = leagueData.groups || [];
  const groupId = firstGroupWithRoom(leagueData.groups, leagueData.players);
  if(!groupId){ showAlert("Cette ligue n'a pas encore de groupe (ou tous sont pleins à 5 joueurs) — crée-en un d'abord (en y basculant)."); return null; }
  const finalName = uniquePlayerName(name, leagueData.players);
  const newPlayer = { id: uid('p'), name: finalName, groupId };
  leagueData.players.push(newPlayer);
  const { error: err2 } = await sb.from('league_data').update({ data: leagueData, updated_at: new Date().toISOString() }).eq('league_id', leagueId);
  if(err2){ showAlert("Erreur : " + err2.message); return null; }
  const { error: err3 } = await sb.from('profile_players').insert({ profile_id: profileId, league_id: leagueId, player_id: newPlayer.id });
  if(err3){ showAlert("Erreur : " + err3.message); return null; }
  return newPlayer.id;
}
async function removePlayerFromLeagueForProfile(leagueId, profileId){
  const { error } = await sb.from('profile_players').delete().eq('profile_id', profileId).eq('league_id', leagueId);
  if(error){ showAlert("Erreur : " + error.message); }
}

// Gestion des absences/remplaçants pour UN groupe en particulier, intégrée
// directement dans sa carte (au lieu d'une vue centralisée à part).
function groupAbsenceManagementHTML(open, g){
  const gd = open.groupsData.find(x=>x.groupId===g.id);
  if(!gd) return '';
  const groupPlayerIds = playersInGroup(g.id).map(p=>p.id);
  const absentIds = groupPlayerIds.filter(id=>isAbsent(open,id));
  if(absentIds.length===0) return '';
  const subs = gd.substitutes || {};
  const inUse = substitutesInUse(open, g.id, null);
  let html = `<div style="margin-top:12px;border-top:1px solid rgba(255,255,255,0.08);padding-top:10px;">
    <h3 style="margin-bottom:8px;">Remplaçants — session du ${open.date}</h3>`;
  absentIds.forEach(id=>{
    const currentSub = subs[id];
    const loanedTo = open.loans && open.loans[id] ? groupById(open.loans[id]) : null;
    const eligible = DATA.players.filter(p=> p.id!==id && p.groupId!==g.id && (!inUse.has(p.id) || p.id===currentSub));
    const status = loanedTo
      ? `<span class="tag tag-up">changement</span> parti(e) au ${escapeHTML(loanedTo.name)}`
      : `<span class="small">descendra automatiquement d'un groupe</span>`;

      <select onchange="onSubSelect('${g.id}','${id}', this.value)">
        <option value="">— place vide, pas de remplaçant —</option>
        ${eligible.map(p=>{
          const pg = groupById(p.groupId);
          return `<option value="${p.id}" ${p.id===currentSub?'selected':''}>${escapeHTML(p.name)}${pg ? ' ('+escapeHTML(pg.name)+')' : ''}</option>`;
        }).join('')}
        ${(DATA.substitutePool||[]).length ? `<optgroup label="Remplaçants réguliers">
          ${(DATA.substitutePool||[]).map(s=>{
            const gid = 'guest::' + encodeURIComponent(s.name);
            if(gid === currentSub) return '';

// Vue centralisée de toutes les absences/remplaçants de la session, tous
// groupes confondus, pour éviter d'avoir à fouiller dans chaque groupe.
function adminSessionHTML(){
  const open = currentOpenSession();
  if(!open){
    return `<div class="card"><p class="empty">Aucune session en cours.</p></div>`;
  }
  let html = '';
  groupsSorted().forEach(g=>{
    const gd = open.groupsData.find(x=>x.groupId===g.id);
    if(!gd) return;
    const expectedRoster = new Set(activeRosterForGroup(open, g.id));
    const inMatches = new Set();
    gd.matches.forEach(m=>{ m.teamA.forEach(id=>inMatches.add(id)); m.teamB.forEach(id=>inMatches.add(id)); });
    const stale = expectedRoster.size !== inMatches.size || [...expectedRoster].some(id=>!inMatches.has(id));
    const activeCount = expectedRoster.size;
    const info = activeCount>0 ? `${matchesCountFor(activeCount)} matchs, en ${targetPointsFor(activeCount)} points` : '';
    html += `<div class="card"><h3>${escapeHTML(g.name)}</h3>${info ? `<p class="small">${info}</p>` : ''}`;
    if(stale) html += `<p class="small" style="color:var(--danger);">Les matchs affichés ne reflètent plus les absences/remplaçants actuels — clique sur « régénérer » ci-dessous.</p>`;
    if(gd.matches.length===0){ html += `<p class="empty">Pas assez de joueurs pour générer des matchs.</p>`; }
    gd.matches.forEach((m, mi)=>{
      const nameTag = (id)=>{
        if(isGuestId(id)) return escapeHTML(playerName(id)) + ' <span class="small">(invité)</span>';
        const p = DATA.players.find(x=>x.id===id);
        const isSub = p && p.groupId !== g.id;
        return escapeHTML(p ? p.name : '?') + (isSub ? ' <span class="small">(remplaçant)</span>' : '');
      };
      html += `
        <div class="match-row">
          <div class="team">${m.teamA.map(nameTag).join(' & ')}</div>
          <input class="pill-input" type="number" min="0" value="${m.scoreA===null?'':m.scoreA}" onchange="setScore('${g.id}','${mi}','A',this.value)">
          <div class="vs">VS</div>
          <input class="pill-input" type="number" min="0" value="${m.scoreB===null?'':m.scoreB}" onchange="setScore('${g.id}','${mi}','B',this.value)">
          <div class="team" style="text-align:right;">${m.teamB.map(nameTag).join(' & ')}</div>
        </div>`;
    });
    if(m_hasSitOut(gd.matches)){
      html += `<p class="small">Repos par match : ${gd.matches.map(m=>m.sit?playerName(m.sit):'—').join(', ')}</p>`;
    }
    html += `<button class="btn-ghost" onclick="regenerate('${g.id}')">régénérer les matchs de ce groupe</button>`;
    if(DATA.testMode && gd.matches.length){
      html += ` <button class="btn-ghost" onclick="autoFillGroupScores('${g.id}')">🎲 générer des scores aléatoires (test)</button>`;
    }
    html += `</div>`;
  });
  return html;
}
function m_hasSitOut(matches){ return matches.some(m=>m.sit); }

// Vérifie que chaque groupe a des matchs générés et à jour par rapport aux
// absences/remplaçants actuels, avant de permettre la publication aux joueurs.
function sessionCompletionIssues(session){
  const issues = [];
  groupsSorted().forEach(g=>{
    const gd = session.groupsData.find(x=>x.groupId===g.id);
    if(!gd) return;
    if(gd.matches.length===0){
      issues.push(`${g.name} : pas assez de joueurs pour générer des matchs`);
      return;
    }
    const expected = new Set(activeRosterForGroup(session, g.id));
    const inMatches = new Set();
    gd.matches.forEach(m=>{ m.teamA.forEach(id=>inMatches.add(id)); m.teamB.forEach(id=>inMatches.add(id)); });
    const stale = expected.size !== inMatches.size || [...expected].some(id=>!inMatches.has(id));
    if(stale) issues.push(`${g.name} : les matchs ne reflètent plus les absences/remplaçants actuels — régénère-les`);
  });
  return issues;
}
// Liste les places vides (absent sans remplaçant, ni joueur ni invité) par groupe.
function emptySpotWarnings(session){
  const warnings = [];
  groupsSorted().forEach(g=>{
    const gd = session.groupsData.find(x=>x.groupId===g.id);
    if(!gd) return;
    const subs = gd.substitutes || {};
    playersInGroup(g.id).forEach(p=>{
      if(isAbsent(session, p.id) && !subs[p.id]){
        warnings.push(`${g.name} : place de ${p.name} vide (aucun remplaçant)`);
      }
    });
  });
  return warnings;
}
function onPublishSession(){
  const open = currentOpenSession();
  if(!open) return;
  const issues = sessionCompletionIssues(open);
  if(issues.length){
    showAlert("Impossible de publier la session — certains groupes ne sont pas complets :\n\n" + issues.map(i=>'• '+i).join('\n'));
    return;
  }
  const empties = emptySpotWarnings(open);
  if(empties.length){
    showConfirm("Attention, certaines places resteront vides pour cette session, sans remplaçant :\n\n" + empties.map(i=>'• '+i).join('\n') + "\n\nPublier quand même ?", ()=>{
      open.published = true;
      saveAndRender();
    });
    return;
  }
  open.published = true;
  saveAndRender();
}
function onUnpublishSession(){
  const open = currentOpenSession();
  if(!open) return;
  open.published = false;
  saveAndRender();
}
function setScore(gid, mi, which, val){

  if(which==='A') m.scoreA = val===''? null : Number(val);
  else m.scoreB = val===''? null : Number(val);
  saveData();
}

}
// Remplit des scores aléatoires plausibles (mode test) pour accélérer les essais.
function fillGroupScores(open, gid){
  const gd = open.groupsData.find(x=>x.groupId===gid);
  if(!gd) return;
  const activeCount = activeRosterForGroup(open, gid).length;
  const target = targetPointsFor(activeCount);
  gd.matches.forEach(m=>{
    const aWins = Math.random() < 0.5;
    const loserScore = Math.floor(Math.random() * Math.max(1, target - 1));
    if(aWins){ m.scoreA = target; m.scoreB = loserScore; } else { m.scoreB = target; m.scoreA = loserScore; }
  });
}
function autoFillGroupScores(gid){
  const open = currentOpenSession();
  if(!open) return;
  fillGroupScores(open, gid);
  saveAndRender();
}
function autoFillAllScores(){
  const open = currentOpenSession();
  if(!open) return;
  DATA.groups.forEach(g=> fillGroupScores(open, g.id));
  saveAndRender();
}
function onCancelSession(){
  showConfirm('Annuler cette session ?', ()=>{
    DATA.sessions = DATA.sessions.filter(s=>s.status!=='open');
    saveAndRender();
  });
}
function onFinalize(){
  const open = currentOpenSession();
  const incomplete = open.groupsData.some(gd=>gd.matches.some(m=>m.scoreA===null || m.scoreB===null));
  if(incomplete){
    showConfirm('Certains pointages sont manquants et seront ignorés dans le calcul. Continuer ?', ()=>{
      finalizeSession(open);
      saveAndRender();
    });
  } else {
    finalizeSession(open);
    saveAndRender();
  }
}

// Retrouve le groupe où un joueur a réellement joué lors d'une session donnée
// (peut différer de son groupe actuel s'il a été déplacé depuis, ou prêté ce jour-là).
function playerSessionGroupId(s, playerId){
  const byGroup = s.standingsByGroup || {};
  for(const gid in byGroup){
    if(byGroup[gid].some(r=>r.playerId===playerId)) return gid;
  }
  return null;
}
// Contenu détaillé des matchs d'une session. Si onlyGroupId est fourni, seul ce groupe est affiché.
function matchListInnerHTML(s, onlyGroupId){
  let html = '';
  let any = false;
  groupsSorted().forEach(g=>{
    if(onlyGroupId && g.id !== onlyGroupId) return;
    const gd = s.groupsData ? s.groupsData.find(x=>x.groupId===g.id) : null;
    if(!gd || !gd.matches || gd.matches.length===0) return;
    any = true;
    const subValues = new Set(gd.substitutes ? Object.values(gd.substitutes) : []);
    html += `<h3 style="margin-top:10px;">${escapeHTML(g.name)}</h3>`;
    gd.matches.forEach(m=>{
      const nameTag = (id)=>{
        if(isGuestId(id)) return escapeHTML(playerName(id)) + ' <span class="small">(invité)</span>';
        const isSub = subValues.has(id);
        return escapeHTML(playerName(id)) + (isSub ? ' <span class="small">(remplaçant)</span>' : '');
      };
      const sa = (m.scoreA===null || m.scoreA==='' || m.scoreA===undefined) ? '—' : m.scoreA;
      const sb = (m.scoreB===null || m.scoreB==='' || m.scoreB===undefined) ? '—' : m.scoreB;
      html += `<div class="match-row">
        <div class="team">${m.teamA.map(nameTag).join(' & ')}</div>
        <div class="vs">${sa} : ${sb}</div>
        <div class="team" style="text-align:right;">${m.teamB.map(nameTag).join(' & ')}</div>
      </div>`;
    });
  });
  if(!any) html += `<p class="empty">Aucun match enregistré pour cette session.</p>`;
  return html;
}

function showMatchHistoryModal(sessionId, onlyGroupId){
  const s = DATA.sessions.find(x=>x.id===sessionId);
  if(!s) return;

  const title = 'Matchs — session du ' + s.date + (g ? ' — ' + g.name : '');
  showContentModal(title, matchListInnerHTML(s, onlyGroupId));
}
function deleteSession(sessionId){
  const s = DATA.sessions.find(x=>x.id===sessionId);
  if(!s) return;
  const hasMovements = s.movements && s.movements.length > 0;
  const hasRatingChanges = s.ratingDeltas && Object.keys(s.ratingDeltas).length > 0;
  if(!hasMovements && !hasRatingChanges){
    showConfirm("Supprimer définitivement cette session ? Cette action ne peut pas être annulée.", ()=>{
      DATA.sessions = DATA.sessions.filter(x=>x.id!==sessionId);
      saveAndRender();
    });
    return;
  }
  showChoice("Cette session a appliqué des montées/descentes et/ou des changements de cote. Que veux-tu faire en la supprimant ?", [
    "Supprimer seulement l'historique (garder les joueurs et cotes où ils sont)",
    "Supprimer et tout annuler (déplacements ET cotes, comme si cette session n'avait pas eu lieu)"
  ], (choiceIdx)=>{
    let skipped = [];
    if(choiceIdx === 1){
      (s.movements||[]).forEach(m=>{
        const pl = DATA.players.find(p=>p.id===m.playerId);
        if(!pl) return;
        if(pl.groupId === m.toGroupId){ pl.groupId = m.fromGroupId; }
        else { skipped.push(pl.name); }
      });
      Object.keys(s.ratingDeltas||{}).forEach(pid=>{
        const pl = DATA.players.find(p=>p.id===pid);
        if(!pl) return;
        pl.rating = Math.round(((typeof pl.rating==='number'?pl.rating:RATING_DEFAULT) - s.ratingDeltas[pid]) * 1000) / 1000;
        pl.ratingGames = Math.max(0, (typeof pl.ratingGames==='number'?pl.ratingGames:0) - 1);
      });
    }
    DATA.sessions = DATA.sessions.filter(x=>x.id!==sessionId);
    saveAndRender();
    if(skipped.length){
      showAlert("Session supprimée. Le déplacement de " + skipped.join(', ') + " n'a pas pu être annulé, car son groupe a changé depuis par une session plus récente — ajuste-le manuellement si besoin. Les cotes, elles, ont bien été annulées.");
    }
  });
}
function sessionSummaryHTML(s, withDelete, viewerPlayerId){
  const restrictGroupId = viewerPlayerId ? playerSessionGroupId(s, viewerPlayerId) : null;
  let html = `<div class="card">
    <div class="row" style="justify-content:space-between;align-items:center;">
      <h3 style="margin:0;">Session du ${s.date}</h3>
      <div class="row" style="gap:8px;">
        <button class="tag tag-stay" style="cursor:pointer;border:none;" onclick="showMatchHistoryModal('${s.id}'${restrictGroupId ? `,'${restrictGroupId}'` : ''})">🎾 Matchs${viewerPlayerId ? ' de mon groupe' : ''}</button>
        ${withDelete ? `<button class="btn-ghost" style="color:var(--danger);" onclick="deleteSession('${s.id}')">supprimer</button>` : ''}
      </div>
    </div>`;
  groupsSorted().forEach(g=>{
    const rows = s.standingsByGroup ? s.standingsByGroup[g.id] : null;
    if(!rows || rows.length===0) return;
    const gd = s.groupsData ? s.groupsData.find(x=>x.groupId===g.id) : null;
    const subValues = new Set(gd && gd.substitutes ? Object.values(gd.substitutes) : []);
    html += `<h3 style="margin-top:10px;">${escapeHTML(g.name)}</h3><table><tr><th>#</th><th>Joueur</th><th>Points</th><th>Moy./match</th><th>Joués</th><th>V-D</th><th></th></tr>`;
    rows.forEach((r,i)=>{
      const isGuest = isGuestId(r.playerId);
      const isSub = !isGuest && subValues.has(r.playerId);
      const mv = (s.movements||[]).find(m=>m.playerId===r.playerId && m.fromGroupId===g.id);
      let tag;
      if(isGuest){ tag = `<span class="tag tag-stay">invité</span>`; }
      else {
        const moveTag = mv ? (mv.toGroupId===groupAbove(g.id) ? `<span class="tag tag-up">monte</span>` : `<span class="tag tag-down">descend</span>`) : `<span class="tag tag-stay">reste</span>`;
        tag = isSub ? moveTag + ` <span class="small">(remplaçant)</span>` : moveTag;
      }
      const avg = (r.avgPts === null || r.avgPts === undefined) ? '—' : r.avgPts.toFixed(1);
      const played = r.played || 0;
      const scheduled = r.scheduled || 0;
      const incomplete = scheduled > 0 && played < scheduled;
      html += `<tr><td>${i+1}</td><td>${escapeHTML(playerName(r.playerId))}</td><td>${r.pf}</td><td>${avg}</td><td>${scheduled ? played+'/'+scheduled : '—'}${incomplete ? ' <span class="small" style="color:var(--paddle);">⚠</span>' : ''}</td><td>${r.wins}-${r.losses}</td><td>${tag}</td></tr>`;
    });
    html += `</table>`;
  });
  const absenceDemotions = (s.movements||[]).filter(m=>m.reason==='absence');
  if(absenceDemotions.length){
    html += `<h3 style="margin-top:10px;">Descentes automatiques (absence)</h3><table><tr><th>Joueur</th><th>De</th><th>Vers</th></tr>`;
    absenceDemotions.forEach(m=>{
      const fromG = groupById(m.fromGroupId), toG = groupById(m.toGroupId);
      html += `<tr><td>${escapeHTML(playerName(m.playerId))}</td><td>${escapeHTML(fromG?fromG.name:'—')}</td><td>${escapeHTML(toG?toG.name:'—')}</td></tr>`;
    });
    html += `</table>`;
  }
  html += `</div>`;
  return html;
}
function groupAbove(gid){
  const sorted = groupsSorted();
  const idx = sorted.findIndex(g=>g.id===gid);
  return idx>0 ? sorted[idx-1].id : null;
}

// ---------- boot ----------
function saveAndRender(){ saveData(); render(); }

// ---------- modale interne (confirm/prompt/alert natifs sont bloqués dans cet environnement) ----------
let MODAL = null; // { kind:'confirm'|'prompt'|'alert'|'choice', message, defaultValue, choices, onConfirm }

function showConfirm(message, onConfirm){ MODAL = { kind:'confirm', message, onConfirm }; render(); }
function showAlert(message){ MODAL = { kind:'alert', message }; render(); }
function showPrompt(message, defaultValue, onConfirm){ MODAL = { kind:'prompt', message, defaultValue: defaultValue||'', onConfirm }; render(); }
function showChoice(message, choices, onConfirm){ MODAL = { kind:'choice', message, choices, onConfirm }; render(); }
function showContentModal(title, htmlContent){ MODAL = { kind:'content', title, htmlContent }; render(); }
function closeModal(){ MODAL = null; render(); }
function modalConfirmClick(){
  if(!MODAL) return;
  const cb = MODAL.onConfirm;
  let value = true;
  if(MODAL.kind === 'prompt'){ value = document.getElementById('modalPromptInput').value; }
  MODAL = null;
  if(cb) cb(value);
  render();
}
function modalChoiceClick(idx){
  if(!MODAL) return;
  const cb = MODAL.onConfirm;
  MODAL = null;
  if(cb) cb(idx);
  render();
}
function modalHTML(){
  if(!MODAL) return '';
  const overlay = 'position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px;';
  if(MODAL.kind === 'content'){
    const box = 'background:var(--court-light);border-radius:var(--radius);padding:18px;max-width:560px;width:100%;max-height:85vh;overflow-y:auto;border:1px solid rgba(255,255,255,0.15);';
    const inner = `
      <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:10px;">
        <h3 style="margin:0;">${escapeHTML(MODAL.title)}</h3>
        <button class="btn-ghost" onclick="closeModal()">✕ fermer</button>
      </div>
      ${MODAL.htmlContent}`;
    return `<div style="${overlay}"><div style="${box}">${inner}</div></div>`;
  }
  const box = 'background:var(--court-light);border-radius:var(--radius);padding:18px;max-width:380px;width:100%;border:1px solid rgba(255,255,255,0.15);';
  let inner = `<p style="margin:0 0 14px;white-space:pre-line;">${escapeHTML(MODAL.message)}</p>`;
  if(MODAL.kind === 'prompt'){
    inner += `<input id="modalPromptInput" value="${escapeHTML(MODAL.defaultValue)}" style="width:100%;margin-bottom:14px;" autofocus>
      <div class="row" style="justify-content:flex-end;">
        <button class="btn btn-secondary" onclick="closeModal()">Annuler</button>
        <button class="btn btn-primary" onclick="modalConfirmClick()">OK</button>
      </div>`;
  } else if(MODAL.kind === 'confirm'){
    inner += `<div class="row" style="justify-content:flex-end;">
        <button class="btn btn-secondary" onclick="closeModal()">Annuler</button>
        <button class="btn btn-primary" onclick="modalConfirmClick()">Confirmer</button>
      </div>`;
  } else if(MODAL.kind === 'choice'){
    inner += MODAL.choices.map((c,i)=>`<button class="btn btn-secondary" style="display:block;width:100%;margin-bottom:8px;text-align:left;" onclick="modalChoiceClick(${i})">${escapeHTML(c)}</button>`).join('')
      + `<button class="btn-ghost" onclick="closeModal()">Annuler</button>`;
  } else { // alert
    inner += `<div class="row" style="justify-content:flex-end;"><button class="btn btn-primary" onclick="closeModal()">OK</button></div>`;
  }
  return `<div style="${overlay}"><div style="${box}">${inner}</div></div>`;
}

// ---------- sauvegarde manuelle (fonctionne peu importe l'environnement) ----------
function exportData(){
  const blob = new Blob([JSON.stringify(DATA, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `ligue-pickleball-sauvegarde-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function triggerImport(){
  document.getElementById('importFileInput').click();
}
function handleImportFile(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const parsed = JSON.parse(e.target.result);
      if(!parsed || !Array.isArray(parsed.players) || !Array.isArray(parsed.groups)){
        showAlert("Ce fichier ne semble pas être une sauvegarde valide de la ligue.");
        return;
      }
      showConfirm("Importer cette sauvegarde va remplacer toutes les données actuelles. Continuer ?", ()=>{
        if(parsed.matchesPerSession === undefined) parsed.matchesPerSession = 10;
        if(parsed.testMode === undefined) parsed.testMode = false;
        if(parsed.swapCount === undefined) parsed.swapCount = 1;
        (parsed.sessions||[]).forEach(s=>{ if(s.published === undefined) s.published = true; });
        DATA = parsed;
        saveAndRender();
        showAlert("Sauvegarde importée avec succès.");
      });
    }catch(err){
      showAlert("Impossible de lire ce fichier : " + err.message);
    }
  };
  reader.readAsText(file);
  input.value = '';
}

function migrateData(){
  if(DATA.matchesPerSession === undefined) DATA.matchesPerSession = 10;
  if(DATA.testMode === undefined) DATA.testMode = false;
  if(DATA.substitutePool === undefined) DATA.substitutePool = [];
  (DATA.players||[]).forEach(p=>{
    if(typeof p.rating !== 'number') p.rating = RATING_DEFAULT;
    if(typeof p.ratingGames !== 'number') p.ratingGames = 0;
  });
  (DATA.sessions||[]).forEach(s=>{ if(s.published === undefined) s.published = true; });
}
async function boot(){
  // Les données ne sont chargées qu'une fois connecté et une ligue choisie
  // (voir onAuthResolved) — avant ça, DATA reste vide et l'écran de connexion
  // s'affiche avec un titre générique.
  const { data: { session } } = await sb.auth.getSession();
  if(session && session.user){
    await onAuthResolved(session.user);
  } else {
    render();
  }

  // Recharge automatiquement le profil quand l'état de connexion change
  // (ex: après confirmation d'un lien de réinitialisation de mot de passe).
  sb.auth.onAuthStateChange((event, newSession)=>{
    if(event === 'SIGNED_OUT'){ SESSION_USER = null; CURRENT_PROFILE = null; render(); }
  });
}
boot();
</script>
