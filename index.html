// ---- Rouvrir une session terminée (format Échelle) ----
function isLatestClosedSession(s){
  const closed = (DATA.sessions||[]).filter(x=>x.status==='closed');
  return closed.length>0 && closed[closed.length-1].id===s.id;
}
function reopenLadderSession(sessionId){
  const s = DATA.sessions.find(x=>x.id===sessionId);
  if(!s || s.status!=='closed') return;
  if(!isLatestClosedSession(s)){ showAlert("Seule la dernière session terminée peut être rouverte : les suivantes dépendent d'elle."); return; }
  const open = currentOpenSession();
  const hasScores = open && (open.groupsData||[]).some(gd=>(gd.matches||[]).some(m=>m.scoreA!==null && m.scoreA!=='' && m.scoreA!==undefined || m.scoreB!==null && m.scoreB!=='' && m.scoreB!==undefined));
  if(hasScores){ showAlert("La session suivante (" + open.date + ") a déjà des scores. Termine-la ou annule-la d'abord, puis rouvre celle-ci."); return; }
  const exact = !!s.preSnapshot;
  const msg = "Rouvrir la session du " + s.date + " ? Les montées/descentes et les changements de cote seront annulés, et tu pourras corriger les scores puis la terminer de nouveau."
    + (open ? " La session suivante (" + open.date + "), encore vide, sera supprimée." : "")
    + (exact ? "" : " ⚠️ Cette session est ancienne : les groupes seront restaurés, mais l'ordre des joueurs dans chaque groupe pourrait différer légèrement.");
  showConfirm(msg, ()=>{
    if(open) DATA.sessions = DATA.sessions.filter(x=>x.id!==open.id);
    if(exact){
      s.preSnapshot.forEach(snap=>{
        const pl = DATA.players.find(p=>p.id===snap.id);
        if(pl){ pl.groupId = snap.groupId; pl.order = snap.order; }
      });
    } else {
      (s.movements||[]).forEach(m=>{
        const pl = DATA.players.find(p=>p.id===m.playerId);
        if(pl && pl.groupId===m.toGroupId) pl.groupId = m.fromGroupId;
      });
    }
    Object.keys(s.ratingDeltas||{}).forEach(pid=>{
      const pl = findRatablePerson(pid);
      if(!pl) return;
      pl.rating = Math.round(((typeof pl.rating==='number'?pl.rating:RATING_DEFAULT) - s.ratingDeltas[pid]) * 1000) / 1000;
      pl.ratingGames = Math.max(0, (typeof pl.ratingGames==='number'?pl.ratingGames:0) - ((s.ratingGamesDeltas && typeof s.ratingGamesDeltas[pid]==='number') ? s.ratingGamesDeltas[pid] : 1));
    });
    delete s.standingsByGroup; delete s.movements; delete s.ratingDeltas; delete s.ratingGamesDeltas; delete s.preSnapshot;
    s.status = 'open';
    s.reopenedAt = new Date().toISOString();
    VIEW = { tab:'session', sessionSubTab:'groupes' };
    saveAndRender();
  });
}
function deleteSession(sessionId){
  const s = DATA.sessions.find(x=>x.id===sessionId);
  if(!s) return;
  const hasMovements = s.movements && s.movements.length > 0;
  const hasRatingChanges = s.ratingDeltas && Object.keys(s.ratingDeltas).length > 0;
  if(!hasMovements && !hasRatingChanges){
    showConfirm("Supprimer définitivement cette session ? Cette action ne peut pas être annulée.", ()=>{
      DATA.sessions = DATA.sessions.filter(x=>x.id!==sessionId);
      saveAndRender();
    });
    return;
  }
  showChoice("Cette session a appliqué des montées/descentes et/ou des changements de cote. Que veux-tu faire en la supprimant ?", [
    "Supprimer seulement l'historique (garder les joueurs et cotes où ils sont)",
    "Supprimer et tout annuler (déplacements ET cotes, comme si cette session n'avait pas eu lieu)"
  ], (choiceIdx)=>{
    let skipped = [];
    if(choiceIdx === 1){
      (s.movements||[]).forEach(m=>{
        const pl = DATA.players.find(p=>p.id===m.playerId);
        if(!pl) return;
        if(pl.groupId === m.toGroupId){ pl.groupId = m.fromGroupId; }
        else { skipped.push(pl.name); }
      });
      Object.keys(s.ratingDeltas||{}).forEach(pid=>{
        const pl = findRatablePerson(pid); // joueur régulier OU remplaçant du bassin
        if(!pl) return;
        pl.rating = Math.round(((typeof pl.rating==='number'?pl.rating:RATING_DEFAULT) - s.ratingDeltas[pid]) * 1000) / 1000;
        pl.ratingGames = Math.max(0, (typeof pl.ratingGames==='number'?pl.ratingGames:0) - ((s.ratingGamesDeltas && typeof s.ratingGamesDeltas[pid]==='number') ? s.ratingGamesDeltas[pid] : 1));
      });
    }
    DATA.sessions = DATA.sessions.filter(x=>x.id!==sessionId);
    saveAndRender();
    if(skipped.length){
      showAlert("Session supprimée. Le déplacement de " + skipped.join(', ') + " n'a pas pu être annulé, car son groupe a changé depuis par une session plus récente — ajuste-le manuellement si besoin. Les cotes, elles, ont bien été annulées.");
    }
  });
}
function sessionSummaryHTML(s, withDelete, viewerPlayerId, isOpen){
  const restrictGroupId = viewerPlayerId ? playerSessionGroupId(s, viewerPlayerId) : null;
  const showRating = !viewerPlayerId || DATA.showRatingToPlayers; // toujours visible pour l'admin (pas de viewerPlayerId)
  const mvs = (s.movements||[]);
  const ups = mvs.filter(m=>m.reason!=='absence' && m.toGroupId===groupAbove(m.fromGroupId)).length;
  const downs = mvs.length - ups;
  const chips = [];
  if(s.reopenedAt) chips.push(`<span class="pf-chip warn">Corrigée</span>`);
  if(viewerPlayerId){
    const myMv = mvs.find(m=>m.playerId===viewerPlayerId);
    if(myMv) chips.push(myMv.toGroupId===groupAbove(myMv.fromGroupId) ? `<span class="pf-chip on">▲ Tu montes</span>` : `<span class="pf-chip warn">▼ Tu descends</span>`);
  } else if(mvs.length){
    if(ups) chips.push(`<span class="pf-chip on">▲ ${ups}</span>`);
    if(downs) chips.push(`<span class="pf-chip warn">▼ ${downs}</span>`);
  }
  let body = '';
  groupsSorted().forEach(g=>{
    const rows = s.standingsByGroup ? s.standingsByGroup[g.id] : null;
    if(!rows || rows.length===0) return;
    const gd = s.groupsData ? s.groupsData.find(x=>x.groupId===g.id) : null;
    const subValues = new Set(gd && gd.substitutes ? Object.values(gd.substitutes) : []);
    body += `<div class="hs-g">${escapeHTML(g.name)}</div><div class="pf-list">`;
    rows.forEach((r,i)=>{
      const isGuest = isGuestId(r.playerId);
      const isSub = !isGuest && subValues.has(r.playerId);
      const mv = mvs.find(m=>m.playerId===r.playerId && m.fromGroupId===g.id);
      const move = (!isGuest && mv) ? (mv.toGroupId===groupAbove(g.id) ? `<span class="hs-mv up" title="Monte">▲</span>` : `<span class="hs-mv down" title="Descend">▼</span>`) : '';
      const avg = (r.avgPts === null || r.avgPts === undefined) ? '—' : r.avgPts.toFixed(1);
      const played = r.played || 0, scheduled = r.scheduled || 0;
      const incomplete = scheduled > 0 && played < scheduled;
      const delta = s.ratingDeltas ? s.ratingDeltas[r.playerId] : undefined;
      const tags = (isGuest ? ' <span class="rs-tag">invité</span>' : '') + (isSub ? ' <span class="rs-tag">rempl.</span>' : '') + (r.playerId===viewerPlayerId ? ' <span class="rs-tag me">toi</span>' : '');
      const sub = `${r.wins}-${r.losses} · ${r.pf} pts · moy. ${avg}${incomplete ? ` · <span style="color:var(--paddle);">${played}/${scheduled} joués</span>` : ''}`;
      const right = (showRating && typeof delta === 'number') ? `<span class="hs-d ${delta>=0?'p':'n'}">${delta>=0?'+':''}${delta.toFixed(3)}</span>` : '';
      body += `<div class="pf-row hs-row${r.playerId===viewerPlayerId?' me':''}" style="cursor:default;">
        <span class="hs-rk">${i+1}</span>
        <span class="t">${escapeHTML(playerName(r.playerId))}${tags}<small>${sub}</small></span>
        ${right}${move}
      </div>`;
    });
    body += `</div>`;
  });
  const absenceDemotions = mvs.filter(m=>m.reason==='absence');
  if(absenceDemotions.length){
    body += `<div class="hs-g">Descentes automatiques (absence)</div><div class="pf-list">`;
    absenceDemotions.forEach(m=>{
      const fromG = groupById(m.fromGroupId), toG = groupById(m.toGroupId);
      body += `<div class="pf-row" style="cursor:default;"><span class="t">${escapeHTML(playerName(m.playerId))}<small>${escapeHTML(fromG?fromG.name:'—')} → ${escapeHTML(toG?toG.name:'—')}</small></span><span class="hs-mv down">▼</span></div>`;
    });
    body += `</div>`;
  }
  body += `<div class="pf-list hs-acts"><button class="pf-row" onclick="showMatchHistoryModal('${s.id}'${restrictGroupId ? `,'${restrictGroupId}'` : ''})"><span class="ic">${pbIcon()}</span><span class="t">${viewerPlayerId ? 'Matchs de mon groupe' : 'Voir les matchs'}</span><span class="ch">›</span></button>`;
  if(withDelete && !viewerPlayerId && isLatestClosedSession(s)) body += `<button class="pf-row" onclick="reopenLadderSession('${s.id}')"><span class="ic">🔓</span><span class="t">Rouvrir pour corriger les scores</span><span class="ch">›</span></button>`;
  if(withDelete) body += `<button class="pf-row hs-del" onclick="deleteSession('${s.id}')"><span class="ic">🗑</span><span class="t">Supprimer cette session</span><span class="ch">›</span></button>`;
  body += `</div>`;
  return `<details class="card hs-card"${isOpen?' open':''}>
    <summary class="hs-sum"><span class="hs-t"><b>${escapeHTML(frDateLong(s.date))}</b>${chips.length ? `<span class="hs-chips">${chips.join('')}</span>` : ''}</span><span class="hs-ch">›</span></summary>
    <div class="hs-body">${body}</div>
  </details>`;
}
function groupAbove(gid){
  const sorted = groupsSorted();

    safe(loadAllProfiles), safe(loadAllProfilePlayers), safe(loadOrgRoster), safe(loadOrgMembers)
  ]).then(()=>{

// Personnes à approuver dans une organisation : comptes sans joueur + demandes d'adhésion (pas l'intérêt).
function approvalsCountForOrg(orgId){
  const ids = new Set(LEAGUES.filter(l=>l.organization_id===orgId).map(l=>l.id));
  const linked = new Set(ALL_PROFILE_PLAYERS.filter(pp=>ids.has(pp.league_id)).map(pp=>pp.profile_id));
  const accts = ALL_PROFILES.filter(p=>p.organization_id===orgId && !linked.has(p.id)).length;
  const reqs = (ALL_JOIN_REQUESTS||[]).filter(r=>r.status==='pending' && ids.has(r.league_id) && r.kind !== 'interest').length;
  return accts + reqs;
}
// Demandes d'intérêt (ligue complète) en attente dans une organisation.
function interestCountForOrg(orgId){
  const ids = new Set(LEAGUES.filter(l=>l.organization_id===orgId).map(l=>l.id));
  return (ALL_JOIN_REQUESTS||[]).filter(r=>r.status==='pending' && ids.has(r.league_id) && r.kind === 'interest').length;
}
function organizationStatsSummary(){
  const orgLeagues = myOrgLeagues();
  const pending = approvalsCountForOrg(CURRENT_ORGANIZATION_ID);
  const members = organizationRosterEntries().length;
  return { leagues: orgLeagues.length, members, pending };
}

// ---- Membres de l'organisation : gérer une personne une seule fois, puis
// l'assigner dans une ou plusieurs ligues, plutôt que de devoir la recréer
// séparément dans chacune. Bassin construit en fusionnant, sur toutes les
// ligues de l'organisation, les joueurs/remplaçants qui partagent le même
// compte (profil lié) ou, à défaut, le même nom. Voir loadOrgRoster().
// ---- Filtres / tri partagés par Membres et Rapport (état gardé dans VIEW).
function orgFilterState(){
  if(!VIEW.orgFilter) VIEW.orgFilter = { q:'', league:'', status:'', sort:'name', sortDir:1 };
  return VIEW.orgFilter;
}
function orgEntryMatches(e){
  const f = orgFilterState();
  const q = (f.q||'').trim().toLowerCase();
  if(q && !((e.name||'').toLowerCase().includes(q) || (e.email||'').toLowerCase().includes(q))) return false;
  const rows = f.league ? e.rows.filter(r=>r.leagueId===f.league) : e.rows;
  if(f.league && !rows.length) return false;
  switch(f.status){
    case 'joueur': return rows.some(r=>r.type==='joueur');
    case 'remplaçant': return rows.some(r=>r.type==='remplaçant');
    case 'sans-ligue': return e.rows.length===0;
    case 'compte': return !!e.profileId;
    case 'sans-compte': return !e.profileId;
  }
  return true;
}
// Retourne [{e, i}] filtrés et triés ; i = index dans ORG_ROSTER_ENTRIES_CACHE
// (les boutons de fiche/suppression s'y réfèrent, donc on le conserve).
function orgFilteredEntries(entries){
  const f = orgFilterState();
  const rank = (e, leagueId)=>{ const r=e.rows.find(x=>x.leagueId===leagueId); return !r ? 2 : (r.type==='joueur' ? 0 : 1); };
  const list = entries.map((e,i)=>({e,i})).filter(x=>orgEntryMatches(x.e));
  const byName = (x,y)=>x.e.name.localeCompare(y.e.name);
  list.sort((x,y)=>{
    let c = 0;
    if(f.sort==='leagues') c = y.e.rows.length - x.e.rows.length;
    else if(f.sort==='compte') c = (y.e.profileId?1:0) - (x.e.profileId?1:0);
    else if(f.sort && f.sort.indexOf('L:')===0){ const id=f.sort.slice(2); c = (rank(x.e,id)-rank(y.e,id)) * f.sortDir; }
    else if(f.sort==='name') c = byName(x,y) * f.sortDir;
    return c || byName(x,y);
  });
  return list;
}

function setOrgFilter(key, val, keepFocus){
  const f = orgFilterState();
  // Les chips déjà actives se désélectionnent (retour à « Toutes »/« Tous »).
  if(!keepFocus && (key==='league'||key==='status') && f[key]===val) val = '';
  f[key] = val;
  if(key==='sort' && !String(val).startsWith('L:')) f.sortDir = 1;
  if(keepFocus) refreshOrgList(); else render();
}
function setOrgReportSort(key){
  const f = orgFilterState();
  if(f.sort===key) f.sortDir = -f.sortDir; else { f.sort = key; f.sortDir = 1; }
  render();
}
function resetOrgFilters(){ VIEW.orgFilter = null; render(); }

function exportOrgListCSV(){
  const leagues = myOrgLeagues().slice().sort((a,b)=>(a.schedule_label||a.name).localeCompare(b.schedule_label||b.name));
  const list = orgFilteredEntries(ORG_ROSTER_ENTRIES_CACHE);
  const esc = v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const head = ['Nom','Courriel','Compte lié'].concat(leagues.map(l=>l.schedule_label||l.name));
  const lines = [head.map(esc).join(',')];
  list.forEach(({e})=>{
    lines.push([e.name, e.email||'', e.profileId?'Oui':'Non'].concat(leagues.map(l=>{
      const r = e.rows.find(x=>x.leagueId===l.id);
      return r ? (r.type==='remplaçant'?'Remplaçant':'Joueur') : '';
    })).map(esc).join(','));
  });
  const blob = new Blob(['﻿'+lines.join('\r\n')], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'membres-organisation.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

// Rapport : vue d'ensemble en tableau de tous les joueurs de l'organisation,
// une colonne par ligue, pour voir en un coup d'œil qui joue où et avec
// quel statut — plutôt que de devoir ouvrir chaque fiche séparément.
// Les en-têtes de colonne (Nom / chaque ligue) sont cliquables pour trier.
function orgReportBodyHTML(){
  const f = orgFilterState();
  const leagues = myOrgLeagues().slice().sort((a,b)=>(a.schedule_label||a.name).localeCompare(b.schedule_label||b.name));
  const entries = ORG_ROSTER_ENTRIES_CACHE;
  const list = orgFilteredEntries(entries);
  setTimeout(()=>orgUpdateCount(list.length, entries.length), 0);
  if(!entries.length || !leagues.length) return `<p class="empty">Aucun joueur pour l'instant.</p>`;
  if(!list.length) return `<p class="empty">Aucun résultat avec ces filtres</p>`;
  const cellFor = (entry, leagueId)=>{
    const row = entry.rows.find(r=>r.leagueId===leagueId);
    if(!row) return '<span class="small" style="opacity:.35;">—</span>';
    return `<span class="tag ${row.type==='remplaçant'?'tag-yellow':'tag-up'}">${row.type==='remplaçant'?'🔄 Rempl.':'Joueur'}</span>`;
  };
  const arrow = key=> f.sort===key ? (f.sortDir>0?' ▲':' ▼') : '';
  const th = (key,label)=>`<th class="sortable ${f.sort===key?'active':''}" onclick="setOrgReportSort('${key}')">${label}${arrow(key)}</th>`;
  const shownLeagues = f.league ? leagues.filter(l=>l.id===f.league) : leagues;
  return `<div style="overflow-x:auto;"><table>
    <tr>${th('name','Nom')}${shownLeagues.map(l=>th('L:'+l.id, escapeHTML(l.schedule_label||l.name))).join('')}</tr>
    ${list.map(({e,i})=>`<tr>
      <td class="clickable-row" onclick="openOrgMemberDetailModal(${i})">${escapeHTML(e.name)}${e.profileId?' <span class="tag tag-up">Compte lié</span>':''}</td>
      ${shownLeagues.map(l=>`<td>${cellFor(e, l.id)}</td>`).join('')}
    </tr>`).join('')}
  </table></div>`;
}

// Supprime une ligue et tout ce qui lui est propre (données, liens de
// comptes). Les comptes des joueurs eux-mêmes ne sont pas touchés.
async function deleteLeagueCascade(leagueId){
  await sb.from('profile_players').delete().eq('league_id', leagueId);
  await sb.from('league_data').delete().eq('league_id', leagueId);
  const { error } = await sb.from('leagues').delete().eq('id', leagueId);
  return error;
}
function onDeleteLeague(){
  const league = LEAGUES.find(l=>l.id===CURRENT_LEAGUE_ID);
  if(!league) return;
  showPrompt(`Pour confirmer la suppression définitive de « ${league.name} », retape exactement son nom :`, '', async (typed)=>{
    if(typed !== league.name){ showAlert("Le nom ne correspond pas — rien n'a été supprimé."); return; }
    const error = await deleteLeagueCascade(league.id);
    if(error){ showAlert("Erreur lors de la suppression : " + error.message); return; }
    await loadLeagues();
    const remaining = myOrgLeagues();
    if(remaining.length === 0){
      CURRENT_LEAGUE_ID = null;
      DATA = defaultData();
      VIEW = { tab:'session' };
      render();
    } else {
      await switchToLeague(remaining[0].id);
    }
  });
}
function onDeleteOrganization(){
  const org = MY_ORGANIZATIONS.find(o=>o.id===CURRENT_ORGANIZATION_ID);
  if(!org) return;
  if(MY_ORGANIZATIONS.length <= 1){ showAlert("Tu ne peux pas supprimer ta seule organisation."); return; }
  showPrompt(`Pour confirmer la suppression définitive de « ${org.name} » et de toutes ses ligues, retape exactement son nom :`, '', async (typed)=>{
    if(typed !== org.name){ showAlert("Le nom ne correspond pas — rien n'a été supprimé."); return; }
    showAlert("Suppression en cours…");
    const { data: orgLeagues } = await sb.from('leagues').select('id').eq('organization_id', org.id);
    for(const l of (orgLeagues||[])){ await deleteLeagueCascade(l.id); }
    // Détache les comptes en attente rattachés à cette organisation, pour ne
    // pas bloquer la suppression (leur compte n'est pas supprimé).
    await sb.from('profiles').update({ organization_id: null }).eq('organization_id', org.id);
    const { error } = await sb.from('organizations').delete().eq('id', org.id);
    if(error){ showAlert("Erreur lors de la suppression : " + error.message); return; }
    await loadMyOrganizations(CURRENT_PROFILE.id);
    await switchToOrganization(MY_ORGANIZATIONS[0].id);
  });
}

let TEMPLATE_MODAL_STATE = null;
function openTemplateModal(size){
  const countKey = size===4 ? 'manualMatchCount4' : 'manualMatchCount5';
  const templateKey = size===4 ? 'manualMatchupTemplate4' : 'manualMatchupTemplate5';
  const count = Math.max(1, DATA[countKey] || (size===4?6:10));
  const saved = DATA[templateKey] || [];
  const rows = Array.from({ length: count }, (_,i)=> saved[i] ? { teamA:(saved[i].teamA||[]).slice(), teamB:(saved[i].teamB||[]).slice() } : { teamA:[], teamB:[] });
  TEMPLATE_MODAL_STATE = { size, count, rows };
  showFormModal(`Modèle de rotation — groupes de ${size}`, templateModalFormHTML, saveTemplateModalForm);
}
function templateModalFormHTML(){
  const st = TEMPLATE_MODAL_STATE;
  const posOptions = (current)=>{
    let opts = '<option value="">—</option>';
    for(let i=1;i<=st.size;i++){ opts += `<option value="${i}" ${current===i?'selected':''}>${i}</option>`; }
    return opts;
  };
  const rowsHtml = st.rows.map((r,i)=>`
    <div class="row" style="align-items:center;margin-bottom:6px;flex-wrap:nowrap;">
      <span class="small" style="min-width:64px;">Match ${i+1}</span>
      <select onchange="updateTemplateSlot(${i},'A',0,this.value)">${posOptions(r.teamA[0])}</select>
      <select onchange="updateTemplateSlot(${i},'A',1,this.value)">${posOptions(r.teamA[1])}</select>
      <span class="vs">VS</span>
      <select onchange="updateTemplateSlot(${i},'B',0,this.value)">${posOptions(r.teamB[0])}</select>
      <select onchange="updateTemplateSlot(${i},'B',1,this.value)">${posOptions(r.teamB[1])}</select>
    </div>`).join('');
  return `
    <div class="field" style="max-width:220px;">
      <label>Nombre de matchs</label>
      <input type="number" min="1" value="${st.count}" onchange="updateTemplateCount(this.value)">
    </div>
    <div style="margin-top:10px;">${rowsHtml}</div>`;
}
function updateTemplateSlot(rowIdx, team, slotIdx, value){
  const st = TEMPLATE_MODAL_STATE;
  if(!st) return;
  const arr = team==='A' ? st.rows[rowIdx].teamA : st.rows[rowIdx].teamB;
  arr[slotIdx] = value ? Number(value) : undefined;
  render();
}
function updateTemplateCount(value){
  const st = TEMPLATE_MODAL_STATE;
  if(!st) return;
  const count = Math.max(1, parseInt(value,10) || st.count);
  if(count > st.rows.length){ while(st.rows.length < count) st.rows.push({ teamA:[], teamB:[] }); }
  else { st.rows.length = count; }
  st.count = count;
  render();
}
function saveTemplateModalForm(){
  const st = TEMPLATE_MODAL_STATE;
  if(!st) return;
  const countKey = st.size===4 ? 'manualMatchCount4' : 'manualMatchCount5';
  const templateKey = st.size===4 ? 'manualMatchupTemplate4' : 'manualMatchupTemplate5';
  DATA[countKey] = st.count;

function toggleSubAvailability(subId){
  const open = currentOpenSession();
  if(!open) return;
  open.availableSubs = open.availableSubs || [];
  const idx = open.availableSubs.indexOf(subId);
  if(isPlayerActor()){
    const sub0 = (DATA.substitutePool||[]).find(s=>s.id===subId), dt = open.date, becoming = idx===-1;
    selfAction('sub_available', { subId, available: becoming }).then(ok=>{ if(ok && becoming) notifyAdminsSubAvailable(sub0 && sub0.name, dt); });
    return;
  }
  if(idx===-1){
    open.availableSubs.push(subId);
    // Notifie les admins seulement quand c'est le remplaçant lui-même qui
    // s'indique disponible — soit via un vrai compte remplaçant, soit un
    // admin qui bascule sur sa propre vue « Remplaçant ».
    const isSelfDeclared = (SESSION_USER && SESSION_USER.role==='substitute' && SESSION_USER.substituteId===subId)
      || (SESSION_USER && SESSION_USER.role==='admin' && ADMIN_VIEWING_AS==='substitute' && MY_LINK_IN_CURRENT_LEAGUE && MY_LINK_IN_CURRENT_LEAGUE.substitute_id===subId);
    if(isSelfDeclared){
      const sub = (DATA.substitutePool||[]).find(s=>s.id===subId);
      notifyAdminsSubAvailable(sub && sub.name, open.date);
    }
  } else {
    open.availableSubs.splice(idx,1);
  }
  saveAndRender();
}
// Recherche, dans tout l'historique, les sessions où ce remplaçant a
// effectivement joué (peu importe le groupe), avec le résultat pour chacune.
function computeSubstituteAppearances(subId){
  const enc = 'sub::' + subId; // forme utilisée dans les matchs
  const closed = DATA.sessions.filter(s=>s.status==='closed');
  const appearances = [];
  closed.forEach(s=>{
    (s.groupsData||[]).forEach(gd=>{
      let wins=0, losses=0, pf=0, played=0;
      (gd.matches||[]).forEach(m=>{
        if(m.scoreA===null||m.scoreB===null||m.scoreA===''||m.scoreB==='') return;
        const inA = (m.teamA||[]).includes(subId) || (m.teamA||[]).includes(enc), inB = (m.teamB||[]).includes(subId) || (m.teamB||[]).includes(enc);
        if(!inA && !inB) return;
        const sa=Number(m.scoreA), sb=Number(m.scoreB);
        if(sa===sb) return;
        played++;
        const won = inA ? sa>sb : sb>sa;
        if(won) wins++; else losses++;
        pf += inA ? sa : sb;
      });
      if(played>0){
        const g = groupById(gd.groupId);
        appearances.push({ date:s.date, groupName: g?g.name:'(groupe supprimé)', wins, losses, pf, played });
      }
    });
  });
  return appearances.sort((a,b)=> b.date.localeCompare(a.date));
}
function substituteHistoryHTML(sub){
  const appearances = computeSubstituteAppearances(sub.id);
  const totalWins = appearances.reduce((s,a)=>s+a.wins,0);
  const totalLosses = appearances.reduce((s,a)=>s+a.losses,0);
  const totalGames = totalWins+totalLosses;
  const winRate = totalGames>0 ? Math.round(totalWins/totalGames*100)+'%' : '—';
  const groupCounts = {};
  appearances.forEach(a=>{ groupCounts[a.groupName] = (groupCounts[a.groupName]||0)+1; });
  const favoriteGroup = Object.keys(groupCounts).sort((a,b)=>groupCounts[b]-groupCounts[a])[0];
  const tile = (v, l)=>`<div class="sb-tile"><b>${v}</b><span>${l}</span></div>`;
  let html = `<div class="card"><div class="pf-sec" style="margin-top:0;">Mes statistiques</div><div class="sb-tiles">
    ${DATA.showRatingToSubs ? tile((typeof sub.rating==='number'?sub.rating:RATING_DEFAULT).toFixed(2), 'Cote') : ''}
    ${tile(appearances.length, appearances.length>1?'Sessions':'Session')}
    ${tile(totalWins+'-'+totalLosses, 'V-D')}
    ${tile(winRate, 'Victoires')}
  </div>
  ${favoriteGroup ? `<div class="ah-meta" style="margin:10px 2px 0;">Groupe le plus fréquent : <b style="color:var(--text);">${escapeHTML(favoriteGroup)}</b></div>` : ''}
  ${DATA.showRatingToSubs ? `<div class="ah-meta" style="margin:6px 2px 0;">Ta cote évolue au fil des matchs que tu dépannes (${typeof sub.ratingGames==='number'?sub.ratingGames:0} comptés).</div>` : ''}
  </div>`;
  html += `<div class="card"><div class="pf-sec" style="margin-top:0;">Sessions dépannées</div>`;
  html += appearances.length ? `<div class="pf-list">${appearances.map(a=>`<div class="pf-row" style="cursor:default;"><span class="t">${escapeHTML(frDateLong(a.date))}<small>${escapeHTML(a.groupName)} · ${a.pf} pts</small></span><span class="pf-chip ${a.wins>=a.losses?'on':'acc'}">${a.wins}-${a.losses}</span></div>`).join('')}</div>` : `<div class="ah-meta">Aucune session jouée comme remplaçant pour l'instant.</div>`;
  html += `</div>`;
  return html;
}

let MY_LEAGUE_SUMMARY = {}, MY_SUMMARY_AT = 0, MY_SUMMARY_LOADING = false;
let MY_SUMMARY_TRIED = {}; // ligues déjà lues au moins une fois (même en erreur) : évite de relire en boucle
function summarizeLeagueData(data, link, leagueId){
  const lg = LEAGUES.find(x=>x.id===leagueId) || {};
  const out = { leagueId, name: lg.name || 'Ligue', schedule: lg.schedule_label || '', orgId: lg.organization_id || null, isSub: !!link.substitute_id, showRating: !!(data && data.showRatingToPlayers), open: null, groupName: null, rating: null, injured: false, playerId: link.player_id || null };
  if(data){
    out.rec = isRecLeague(data);
    out.playDay = typeof data.playDayOfWeek === 'number' ? data.playDayOfWeek : null;
    out.playTime = data.playTime || '';
  }
  if(!data || out.isSub) return out;
  const me = (data.players||[]).find(x=>x.id===link.player_id);
  if(!me) return out;
  const g = (data.groups||[]).find(x=>x.id===me.groupId);
  out.groupName = g ? g.name : null;
  out.meName = me.name || null;
  out.rating = typeof me.rating === 'number' ? me.rating : RATING_DEFAULT;
  out.injured = !!me.injured;
  const open = (data.sessions||[]).find(x=>x.status==='open');
  if(open){
    out.open = { date: open.date, published: !!open.published, canScore: !!data.allowPlayerScoreEntry && scoreDayOpen(open.date), visible: !!(open.published || data.showGroupBeforePublish), rec: isRecLeague(data), absent: !!(open.absences && open.absences.includes(me.id)) };
  }
  return out;
}
function leagueSummaryFor(leagueId){
  const link = MY_LEAGUE_LINKS.find(l=>l.league_id===leagueId);
  if(!link) return null;
  if(leagueId === CURRENT_LEAGUE_ID) return summarizeLeagueData(DATA, link, leagueId);
  return MY_LEAGUE_SUMMARY[leagueId] || null;
}
async function refreshMySummaries(force){
  if(MY_SUMMARY_LOADING) return;
  // Remplaçants inclus : leur ligue a aussi sa carte sur l'accueil.
  const others = MY_LEAGUE_LINKS.filter(l=>l.league_id !== CURRENT_LEAGUE_ID);
  // Comme pour l'admin : le délai ne s'applique pas tant qu'une carte n'a jamais été lue.
  if(!force && Date.now() - MY_SUMMARY_AT < 45000 && others.every(l=>MY_LEAGUE_SUMMARY[l.league_id] || MY_SUMMARY_TRIED[l.league_id])) return;
  if(!others.length){ MY_SUMMARY_AT = Date.now(); return; }
  MY_SUMMARY_LOADING = true;
  try{
    await Promise.all(others.map(async l=>{
      MY_SUMMARY_TRIED[l.league_id] = true;
      try{
        const { data, error } = await fetchLeagueData(l.league_id);
        if(error) return;
        MY_LEAGUE_SUMMARY[l.league_id] = summarizeLeagueData(data && data.data, l, l.league_id);
      }catch(e){}
    }));
    MY_SUMMARY_AT = Date.now();
  }finally{ MY_SUMMARY_LOADING = false; }
  // Rafraîchit l'écran seulement si le joueur est toujours sur Accueil / Organisations
  if(SESSION_USER && !MODAL && (VIEW.ptab===undefined || VIEW.ptab==='accueil' || VIEW.ptab==='orgs') && !VIEW.pdet) render();
}

function requestJoinLeague(leagueId, full){
  const msg = full
    ? "Cette ligue est complète. Signaler ton intérêt ? L'administrateur verra ta demande et pourra t'ajouter quand une place se libère."
    : "Envoyer une demande pour rejoindre cette ligue ? L'administrateur devra l'approuver.";
  showConfirm(msg, async ()=>{
    const { data, error } = await sb.rpc('request_join_league', { p_league_id: leagueId });
    if(error || !data || !data.ok){ showAlert((data && data.error) || ("Impossible d'envoyer la demande" + (error ? ' : ' + error.message : '.'))); return; }
    const lsItem = LEAGUE_SEARCH && LEAGUE_SEARCH.list.find(function(x){ return x.league_id === leagueId; });
    notifyAdminsJoinRequest(leagueId, lsItem && lsItem.league_name, data.kind);
    showAlert(data.kind === 'interest' ? "Intérêt signalé ✅ L'administrateur de la ligue verra ta demande." : "Demande envoyée ✅ Tu seras averti(e) dès qu'elle sera approuvée.");
  });
}

function myCurrentGender(){
  if(SESSION_USER && SESSION_USER.role==='player'){ const p = DATA.players.find(x=>x.id===SESSION_USER.playerId); return p ? p.gender : null; }
  if(SESSION_USER && SESSION_USER.role==='substitute'){ const s=(DATA.substitutePool||[]).find(x=>x.id===SESSION_USER.substituteId); return s ? s.gender : null; }
  if(SESSION_USER && SESSION_USER.role==='admin' && MY_LINK_IN_CURRENT_LEAGUE){
    if(MY_LINK_IN_CURRENT_LEAGUE.substitute_id){ const s=(DATA.substitutePool||[]).find(x=>x.id===MY_LINK_IN_CURRENT_LEAGUE.substitute_id); return s ? s.gender : null; }
    if(MY_LINK_IN_CURRENT_LEAGUE.player_id){ const p = DATA.players.find(x=>x.id===MY_LINK_IN_CURRENT_LEAGUE.player_id); return p ? p.gender : null; }
  }
  return null;
}

// Envoie la photo choisie vers le bucket Supabase Storage "avatars" (un
// fichier par compte, toujours au même chemin avec upsert) puis enregistre
// son URL publique sur le compte.
// Redimensionne et compresse une image côté appareil avant envoi (canvas →
// JPEG) pour qu'une photo de cellulaire de plusieurs Mo devienne quelques
// dizaines de Ko — important une fois multiplié par tous les joueurs d'une
// ligue. Retourne le fichier original si la compression échoue pour une
// raison quelconque (format non décodable, etc.) plutôt que de bloquer l'envoi.
function compressImageFile(file, maxDim, quality){
  return new Promise((resolve)=>{
    try{
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = ()=>{
        let w = img.naturalWidth, h = img.naturalHeight;
        if(w>maxDim || h>maxDim){
          if(w>=h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        canvas.toBlob(blob=>resolve(blob || file), 'image/jpeg', quality);
      };
      img.onerror = ()=>{ URL.revokeObjectURL(url); resolve(file); };
      img.src = url;
    }catch(e){ resolve(file); }
  });
}
async function onMyProfilePhotoChosen(inputEl){
  const file = inputEl.files && inputEl.files[0];
  if(!file || !CURRENT_PROFILE) return;
  const compressed = await compressImageFile(file, 480, 0.82);
  // Toujours en .jpg après compression, chemin fixe — une seule photo par
  // compte, remplacée à chaque envoi (voir commentaire sur le bucket).
  const path = CURRENT_PROFILE.id + '/avatar.jpg';
  const { error: upErr } = await sb.storage.from('avatars').upload(path, compressed, { upsert: true, cacheControl: '3600', contentType: 'image/jpeg' });
  if(upErr){ showAlert('Impossible d\'envoyer la photo. Vérifie que le bucket "avatars" existe bien dans Supabase.'); return; }
  const { data: pub } = sb.storage.from('avatars').getPublicUrl(path);
  const url = (pub && pub.publicUrl) ? (pub.publicUrl + '?t=' + Date.now()) : null;
  await sb.from('profiles').update({ avatar_url: url }).eq('id', CURRENT_PROFILE.id);
  CURRENT_PROFILE.avatar_url = url;
  const mine = ALL_PROFILES.find(pr=>pr.id===CURRENT_PROFILE.id);
  if(mine) mine.avatar_url = url;
  openMyProfileModal();
}

        ({ error } = await sb.rpc('set_my_gender', { p_league_id: link.league_id, p_gender: nextGender }));
      }
      if(error) hadError = true;
    }
    const loaded = await loadData(CURRENT_LEAGUE_ID);
    if(loaded){ DATA = loaded; migrateData(); }

}

// Reconstitue une estimation de l'historique de cote (à partir des
// ajustements enregistrés par session) pour trouver le plus haut/bas atteint.
function computePlayerRatingHistory(pid){
  const closed = DATA.sessions.filter(s=>s.status==='closed');
  let running = RATING_DEFAULT;
  const history = [running];
  closed.forEach(s=>{
    if(s.ratingDeltas && typeof s.ratingDeltas[pid] === 'number'){
      running += s.ratingDeltas[pid];
      history.push(running);
    }
  });
  return history;
}
// Le meilleur (plus haut) groupe atteint par un joueur, selon l'historique des sessions.
function computePlayerBestGroup(pid){
  let best = null;
  DATA.sessions.filter(s=>s.status==='closed').forEach(s=>{
    if(!s.standingsByGroup) return;
    Object.keys(s.standingsByGroup).forEach(gid=>{
      if(s.standingsByGroup[gid].some(r=>r.playerId===pid)){
        const g = groupById(gid);
        if(g && (!best || g.order < best.order)) best = g;
      }
    });
  });
  return best;
}

function computePlayerFunStats(pid){
  const closed = DATA.sessions.filter(s=>s.status==='closed');
  const headToHead = {}; // adversaireId -> {wins, losses} (de mon point de vue)
  const partnerStats = {}; // partenaireId -> {wins, losses}
  const timeline = []; // 'W'/'L' dans l'ordre chronologique
  closed.forEach(s=>{
    (s.groupsData||[]).forEach(gd=>{
      (gd.matches||[]).forEach(m=>{
        if(m.scoreA===null||m.scoreB===null||m.scoreA===''||m.scoreB==='') return;
        const sa=Number(m.scoreA), sb=Number(m.scoreB);
        if(sa===sb) return;
        const inA = m.teamA.includes(pid), inB = m.teamB.includes(pid);
        if(!inA && !inB) return;
        const myTeam = inA ? m.teamA : m.teamB;
        const oppTeam = inA ? m.teamB : m.teamA;
        const won = inA ? sa>sb : sb>sa;
        oppTeam.forEach(oppId=>{
          if(isGuestOrSubId(oppId)) return;
          if(!headToHead[oppId]) headToHead[oppId] = {wins:0, losses:0};
          if(won) headToHead[oppId].wins++; else headToHead[oppId].losses++;
        });
        myTeam.forEach(partnerId=>{
          if(partnerId===pid || isGuestOrSubId(partnerId)) return;
          if(!partnerStats[partnerId]) partnerStats[partnerId] = {wins:0, losses:0};
          if(won) partnerStats[partnerId].wins++; else partnerStats[partnerId].losses++;
        });
        timeline.push(won ? 'W' : 'L');
      });
    });
  });
  return { headToHead, partnerStats, timeline };
}
function playerFunStatsHTML(me){
  const { headToHead, partnerStats, timeline } = computePlayerFunStats(me.id);
  const MIN_COUNT = 2;
  const sameGroup = (id)=>{ const p = DATA.players.find(x=>x.id===id); return p && p.groupId === me.groupId; };
  const opponents = Object.keys(headToHead)
    .filter(sameGroup)
    .map(id=>{ const s=headToHead[id]; const total=s.wins+s.losses; return { id, wins:s.wins, losses:s.losses, total, rate: total>0?s.wins/total:0 }; })
    .filter(o=>o.total>=MIN_COUNT);
  const partners = Object.keys(partnerStats)
    .filter(sameGroup)
    .map(id=>{ const s=partnerStats[id]; const total=s.wins+s.losses; return { id, wins:s.wins, losses:s.losses, total, rate: total>0?s.wins/total:0 }; })
    .filter(o=>o.total>=MIN_COUNT);

  const facts = [];
  const nemesis = opponents.filter(o=>o.rate<0.5).sort((a,b)=>a.rate-b.rate || b.losses-a.losses)[0];
  if(nemesis) facts.push(`🎯 <strong>Ta bête noire</strong> — ${escapeHTML(playerName(nemesis.id))}. Vous vous êtes affrontés ${nemesis.total} fois, il/elle en a gagné ${nemesis.losses}. Il va falloir un plan de match !`);

  const favorite = opponents.filter(o=>o.rate>0.5).sort((a,b)=>b.rate-a.rate || b.wins-a.wins)[0];
  if(favorite) facts.push(`🔥 <strong>Ta cible favorite</strong> — ${escapeHTML(playerName(favorite.id))}. ${favorite.wins} victoires sur ${favorite.total} face à lui/elle. Tu sais comment le/la jouer !`);

  const closest = opponents.filter(o=>o.id!==(nemesis&&nemesis.id) && o.id!==(favorite&&favorite.id))
    .sort((a,b)=>Math.abs(a.rate-0.5)-Math.abs(b.rate-0.5))[0];
  if(closest) facts.push(`⚔️ <strong>Ton duel le plus serré</strong> — contre ${escapeHTML(playerName(closest.id))}, c'est presque du 50/50 (${closest.wins} victoires, ${closest.losses} défaites). Chaque match compte double !`);

  const bestPartner = partners.filter(o=>o.rate>0.5).sort((a,b)=>b.rate-a.rate || b.wins-a.wins)[0];
  if(bestPartner) facts.push(`🤝 <strong>Ton meilleur allié</strong> — en équipe avec ${escapeHTML(playerName(bestPartner.id))}, vous gagnez ${bestPartner.wins} fois sur ${bestPartner.total}. Une paire à ne pas séparer !`);

  if(timeline.length>=MIN_COUNT){
    const last = timeline[timeline.length-1];
    let streak = 0;
    for(let i=timeline.length-1;i>=0 && timeline[i]===last;i--) streak++;
    if(streak>=MIN_COUNT){
      facts.push(last==='W'
        ? `🔥 <strong>En feu</strong> — ${streak} victoires de suite !`
        : `💪 <strong>Ça va revenir</strong> — après ${streak} défaites d'affilée, la prochaine est pour toi.`);
    }
  }

  if(facts.length===0) return '';
  return `<div class="card"><h3>Tes stats</h3>${facts.map(f=>`<p>${f}</p>`).join('')}</div>`;
}

          <div class="rs-line b"><div class="rs-team">${team(m.teamB)}</div>${cell('B', m.scoreB)}</div>
          ${m.sit ? `<div class="rs-sit">Repos : ${escapeHTML(sitLabel(m))}</div>` : ''}
        </div>`;
      });
      html += `</div>`;
    }
  }
  return html;
}
function absenceHistoryHTML(playerId){
  const sess = (DATA.sessions||[]).filter(x=>x.date).slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const abs = sess.filter(x=>isAbsent(x, playerId));
  const closedN = sess.filter(x=>x.status==='closed').length;
  const closedAbs = abs.filter(x=>x.status==='closed').length;
  let html = `<div class="pf-sec" style="margin-top:20px;">Historique</div>`;
  if(closedN) html += `<p class="small" style="margin:0 2px 8px;color:var(--muted);">${closedAbs} absence${closedAbs>1?'s':''} sur ${closedN} session${closedN>1?'s':''} terminée${closedN>1?'s':''}</p>`;
  if(abs.length){
    html += `<div class="acc-group">${abs.map(x=>`<div class="acc-row" style="cursor:default;min-height:52px;"><span class="acc-row-t"><b>${escapeHTML(frDateLong ? frDateLong(x.date) : x.date)}</b><small>${x.status==='closed' ? 'Session terminée' : 'Session à venir'}</small></span><span class="tag tag-orange">Absent(e)</span></div>`).join('')}</div>`;
  } else html += `<p class="small" style="color:var(--muted);margin:0 2px;">Aucune absence enregistrée.</p>`;
  // Les absences prévues sont déjà listées juste au-dessus dans l'écran Absence.

  return html;
}
// Écran Absence du joueur : même modèle que l'écran admin « Blessé / absent ». Le joueur peut se
// déclarer absent ou blessé et ajouter des absences prévues ; seul un admin peut annuler.
function absenceHubContentHTML(playerId){
  const p = DATA.players.find(x=>x.id===playerId);
  if(!p) return `<p class="small">Introuvable.</p>`;
  const open = currentOpenSession();
  const absent = !!(open && isAbsent(open, playerId));
  const planned = plannedAbsencesForPlayer(playerId);
  const adminNote = `<p class="small" style="color:var(--muted);margin:6px 2px 0;">Pour annuler, communique avec un administrateur de la ligue.</p>`;
  let h = '';
  if(open){
    h += `<div class="pf-sec" style="margin-top:0;">${isRecLeague() ? 'Soirée' : 'Session'} du ${escapeHTML(frDateLong(open.date).toLowerCase())}</div>
      <div class="pf-seg">
        <button type="button" class="${!absent?'on':''}">✓ ${gw(p,'Présent','Présente','Présent(e)')}</button>
        <button type="button" class="${absent?'on bad':''}" onclick="${absent ? '' : `confirmMyAbsence('${playerId}')`}">${gw(p,'Absent','Absente','Absent(e)')}</button>
      </div>
      ${absent ? adminNote : ''}`;
  }
  h += `<div class="pf-sec">Blessure</div>
    <div class="pf-seg">
      <button type="button" class="${!p.injured?'on':''}">En forme</button>
      <button type="button" class="${p.injured?'on bad':''}" onclick="${p.injured ? '' : `confirmMyInjury('${playerId}')`}">${gw(p,'Blessé','Blessée','Blessé(e)')}</button>
    </div>
    ${p.injured ? adminNote : ''}
    <div class="pf-sec">Absences prévues (vacances)</div>
    <div class="pf-list">${planned.length ? planned.map(a=>`<div class="pf-row" style="cursor:default;"><span class="t">${escapeHTML(frDateLong(a.startDate))}${a.startDate!==a.endDate ? ' → ' + escapeHTML(frDateLong(a.endDate)) : ''}</span></div>`).join('') : `<div class="pf-row" style="cursor:default;"><span class="t" style="color:var(--muted);">Aucune absence prévue.</span></div>`}</div>
    <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:10px;">
      <div class="field" style="margin:0;min-width:0;"><label>Du</label><input id="paStart" type="date" style="width:100%;min-width:0;box-sizing:border-box;"></div>
      <div class="field" style="margin:0;min-width:0;"><label>Au</label><input id="paEnd" type="date" style="width:100%;min-width:0;box-sizing:border-box;"></div>
    </div>
    <button class="btn btn-secondary" style="width:100%;margin-top:10px;" onclick="submitPlannedAbsence('${playerId}')">+ Ajouter une absence prévue</button>
    <p class="small" style="color:var(--muted);margin:6px 2px 0;">Tu seras automatiquement ${gw(p,'absent','absente','absent(e)')} pour toute ${isRecLeague() ? 'soirée' : 'session'} dans cette plage.</p>
    ${absenceHistoryHTML(playerId)}`;
  return h;
}
function confirmMyAbsence(pid){
  const open = currentOpenSession(); if(!open) return;
  showConfirm(`Te déclarer absent(e) pour la ${isRecLeague() ? 'soirée' : 'session'} du ${frDateLong(open.date).toLowerCase()} ? Seul un administrateur pourra l'annuler.`, function(){ toggleAbsence(pid); openAbsenceHub(pid); });
}
function confirmMyInjury(pid){
  showConfirm("Te déclarer blessé(e) ? Tu sortiras de ton groupe jusqu'à ce qu'un administrateur te réintègre.", function(){ toggleMyInjured(pid); openAbsenceHub(pid); });
}
function openAbsenceHub(playerId){
  showContentModal('Absence', ()=>absenceHubContentHTML(playerId));
}
function submitPlannedAbsence(playerId){
  const start = document.getElementById('paStart').value;
  const end = document.getElementById('paEnd').value;
  if(!start || !end || start > end){ showAlert("Plage de dates invalide."); return; }
  if(isPlayerActor()){
    const hp = DATA.players.find(x=>x.id===playerId);
    selfAction('planned_absence', { playerId, startDate:start, endDate:end }).then(ok=>{ if(ok){ notifyAdminsPlannedAbsence(hp && hp.name, start, end); socialRedrawAfterSelfChange(); } });
    return;
  }
  addPlannedAbsence(playerId, start, end);
  const p = DATA.players.find(x=>x.id===playerId);
  notifyAdminsPlannedAbsence(p && p.name, start, end);
  saveAndRender();
}
function playerHistoryHTML(me){
  const closed = DATA.sessions.filter(s=>s.status==='closed').slice().reverse();
  if(closed.length===0) return `<div class="card"><p class="empty">Aucune session terminée pour l'instant.</p></div>`;
  return closed.map((s,i)=>sessionSummaryHTML(s, false, me.id, i===0)).join('');
}


// ---------- boot ----------
function saveAndRender(){ saveData(); render(); }

// ---------- modale interne (confirm/prompt/alert natifs sont bloqués dans cet environnement) ----------
let MODAL = null; // { kind:'confirm'|'prompt'|'alert'|'choice', message, defaultValue, choices, onConfirm }

// Pile de fenêtres : une fenêtre ouverte PAR-DESSUS une « feuille » (Partenaire / Événements)
// la met de côté, et la fermer ramène la feuille.
let MODAL_UNDER = null;
function setModal(m){
  if(MODAL && MODAL.sheet && !m.sheet){ MODAL_UNDER = MODAL; m.under = true; }
  MODAL = m;
}
function dropModal(){
  const u = (MODAL && MODAL.under) ? MODAL_UNDER : null;
  MODAL_UNDER = null;
  MODAL = u;
}
function showConfirm(message, onConfirm){ setModal({ kind:'confirm', message, onConfirm }); render(); }
function showAlert(message){ setModal({ kind:'alert', message }); render(); }
function showPrompt(message, defaultValue, onConfirm){ setModal({ kind:'prompt', message, defaultValue: defaultValue||'', onConfirm }); render(); }
function showChoice(message, choices, onConfirm){ setModal({ kind:'choice', message, choices, onConfirm }); render(); }
function showContentModal(title, htmlContent){ setModal({ kind:'content', title, htmlContent }); render(); }
// Pop-up formulaire réutilisable : affiche du HTML (avec des champs), un
// bouton Enregistrer qui appelle onSave() (qui lit les champs elle-même,
// pendant que le pop-up est encore ouvert), puis referme et rafraîchit.
function showFormModal(title, htmlContent, onSave){ setModal({ kind:'form', title, htmlContent, onSave }); render(); }
function modalFormSaveClick(){
  if(!MODAL || !MODAL.onSave) return;
  const cb = MODAL.onSave;
  const result = cb();
  if(result === false){ render(); return; } // validation a échoué : le pop-up reste ouvert (ex: showAlert affiché)
  dropModal();
  saveAndRender();
}
function closeModal(){ if(MODAL && (MODAL.sheet==='partenaire'||MODAL.sheet==='evenements')) markQuickSeen(MODAL.sheet); dropModal(); render(); }
function modalConfirmClick(){
  if(!MODAL) return;
  const cb = MODAL.onConfirm;
  let value = true;
  if(MODAL.kind === 'prompt'){ value = document.getElementById('modalPromptInput').value; }
  dropModal();
  if(cb) cb(value);
  render();
}
function modalChoiceClick(idx){
  if(!MODAL) return;
  const cb = MODAL.onConfirm;
  dropModal();
  if(cb) cb(idx);
  render();
}
function modalHTML(){
  if(!MODAL) return '';
  const overlay = 'position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px;';
  if(MODAL.kind === 'content' && MODAL.sheet) return sheetModalHTML();
  if(MODAL.kind === 'content' || MODAL.kind === 'form'){
    const box = 'background:var(--court-light);border-radius:var(--radius);padding:18px;max-width:560px;width:100%;max-height:85vh;overflow-y:auto;border:1px solid rgba(255,255,255,0.15);';
    const bodyHtml = typeof MODAL.htmlContent === 'function' ? MODAL.htmlContent() : MODAL.htmlContent;
    const inner = `
      <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:10px;">
        <h3 style="margin:0;">${escapeHTML(MODAL.title)}</h3>
        <button type="button" class="m-x" onclick="closeModal()" aria-label="Fermer">✕</button>
      </div>
      ${bodyHtml}
      ${MODAL.kind==='form' ? `<div class="row" style="justify-content:flex-end;margin-top:14px;border-top:1px solid rgba(255,255,255,0.08);padding-top:12px;">
        <button class="btn btn-secondary" onclick="closeModal()">Annuler</button>
        <button class="btn btn-primary" onclick="modalFormSaveClick()">Enregistrer</button>
      </div>` : ''}`;
    return `<div class="m-ov" style="${overlay}" onclick="if(event.target===this) closeModal()"><div class="m-box" style="${box}"><div class="m-grab"></div>${inner}</div></div>`;
  }
  const box = 'background:var(--court-light);border-radius:var(--radius);padding:18px;max-width:380px;width:100%;border:1px solid rgba(255,255,255,0.15);';
  let inner = `<p style="margin:0 0 14px;white-space:pre-line;">${escapeHTML(MODAL.message)}</p>`;
  if(MODAL.kind === 'prompt'){
    inner += `<input id="modalPromptInput" value="${escapeHTML(MODAL.defaultValue)}" style="width:100%;margin-bottom:14px;" autofocus>
      <div class="row" style="justify-content:flex-end;">
        <button class="btn btn-secondary" onclick="closeModal()">Annuler</button>
        <button class="btn btn-primary" onclick="modalConfirmClick()">OK</button>
      </div>`;
  } else if(MODAL.kind === 'confirm'){
    inner += `<div class="row" style="justify-content:flex-end;">
        <button class="btn btn-secondary" onclick="closeModal()">Annuler</button>
        <button class="btn btn-primary" onclick="modalConfirmClick()">Confirmer</button>
      </div>`;
  } else if(MODAL.kind === 'choice'){
    inner += MODAL.choices.map((c,i)=>`<button class="btn btn-secondary" style="display:block;width:100%;margin-bottom:8px;text-align:left;" onclick="modalChoiceClick(${i})">${escapeHTML(c)}</button>`).join('')
      + `<button class="btn-ghost" onclick="closeModal()">Annuler</button>`;
  } else { // alert
    inner += `<div class="row" style="justify-content:flex-end;"><button class="btn btn-primary" onclick="closeModal()">OK</button></div>`;
  }
  return `<div style="${overlay}" onclick="if(event.target===this) closeModal()"><div style="${box}">${inner}</div></div>`;
}

// ---------- sauvegarde manuelle (fonctionne peu importe l'environnement) ----------
function exportData(){
  const blob = new Blob([JSON.stringify(DATA, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `ligue-pickleball-sauvegarde-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function triggerImport(){
  document.getElementById('importFileInput').click();
}
function handleImportFile(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const parsed = JSON.parse(e.target.result);
      if(!parsed || !Array.isArray(parsed.players) || !Array.isArray(parsed.groups)){
        showAlert("Ce fichier ne semble pas être une sauvegarde valide de la ligue.");
        return;
      }
      showConfirm("Importer cette sauvegarde va remplacer toutes les données actuelles. Continuer ?", ()=>{
        if(parsed.matchesPerSession === undefined) parsed.matchesPerSession = 10;
        if(parsed.testMode === undefined) parsed.testMode = false;
        if(parsed.swapCount === undefined) parsed.swapCount = 1;
        (parsed.sessions||[]).forEach(s=>{ if(s.published === undefined) s.published = true; });
        DATA = parsed;
        saveAndRender();
        showAlert("Sauvegarde importée avec succès.");
      });
    }catch(err){
      showAlert("Impossible de lire ce fichier : " + err.message);
    }
  };
  reader.readAsText(file);
  input.value = '';
}

function migrateData(){
  if(DATA.matchesPerSession === undefined) DATA.matchesPerSession = 10;
  if(DATA.testMode === undefined) DATA.testMode = false;
  if(DATA.leagueFormat === undefined) DATA.leagueFormat = 'ladder';
  if(DATA.testMatches4 === undefined) DATA.testMatches4 = 2;
  if(DATA.testMatches5 === undefined) DATA.testMatches5 = 3;
  if(DATA.groupMinPlayers === undefined) DATA.groupMinPlayers = 4;
  if(DATA.groupMaxPlayers === undefined) DATA.groupMaxPlayers = 5;
  if(DATA.rules4Matches === undefined) DATA.rules4Matches = 6;
  if(DATA.rules4Points === undefined) DATA.rules4Points = 11;
  if(DATA.rules5Matches === undefined) DATA.rules5Matches = 10;
  if(DATA.rules5Points === undefined) DATA.rules5Points = 9;
  if(DATA.rules6Matches === undefined) DATA.rules6Matches = 6;
  if(DATA.rules6Points === undefined) DATA.rules6Points = 11;
  // v181 : ancienne valeur par défaut (9 matchs à 9 points) → nouvelle rotation (6 matchs à 11 points)
  if(DATA.rules6Matches === 9 && DATA.rules6Points === 9){ DATA.rules6Matches = 6; DATA.rules6Points = 11; }
  if(DATA.matchupMode === undefined) DATA.matchupMode = 'auto';
  if(DATA.allowPlayerScoreEntry === undefined) DATA.allowPlayerScoreEntry = false;
  if(DATA.showGroupBeforePublish === undefined) DATA.showGroupBeforePublish = false;
  if(!Array.isArray(DATA.palHidden)) DATA.palHidden = [];
  if(!Array.isArray(DATA.scoreLog)) DATA.scoreLog = [];
  if(DATA.seasonStartDate === undefined) DATA.seasonStartDate = null;
  if(DATA.tiebreakCriteria === undefined) DATA.tiebreakCriteria = defaultTiebreakCriteria();
  if(DATA.seasonEndDate === undefined) DATA.seasonEndDate = null;
  if(DATA.blockedDates === undefined) DATA.blockedDates = [];
  if(DATA.plannedAbsences === undefined) DATA.plannedAbsences = [];
  if(DATA.mlpTeams === undefined) DATA.mlpTeams = [];
  if(DATA.mlpSessions === undefined) DATA.mlpSessions = [];
  if(DATA.mlpRosterSize === undefined) DATA.mlpRosterSize = 4;
  if(DATA.prospects === undefined) DATA.prospects = [];
  if(DATA.tournaments === undefined) DATA.tournaments = [];
  if(DATA.showRatingToPlayers === undefined) DATA.showRatingToPlayers = true;
  (DATA.tournaments||[]).forEach(t=>{
    if(!t.matchFormat) t.matchFormat = { pointsToWin: 11, bestOf: 1, winByTwo: true };
  });
  if(DATA.autoStartSessions === undefined) DATA.autoStartSessions = false;
  if(DATA.autoPublishSessions === undefined) DATA.autoPublishSessions = false;
  if(DATA.manualMatchCount4 === undefined) DATA.manualMatchCount4 = 6;
  if(DATA.manualMatchupTemplate4 === undefined) DATA.manualMatchupTemplate4 = [];
  if(DATA.manualMatchCount5 === undefined) DATA.manualMatchCount5 = 10;
  if(DATA.manualMatchupTemplate5 === undefined) DATA.manualMatchupTemplate5 = [];
  if(DATA.substitutePool === undefined) DATA.substitutePool = [];
  if(DATA.showRatingToSubs === undefined) DATA.showRatingToSubs = false;
  if(DATA.hiddenPlayerTabs === undefined) DATA.hiddenPlayerTabs = [];
  if(DATA.hiddenSubTabs === undefined) DATA.hiddenSubTabs = [];
  (DATA.players||[]).forEach(p=>{
    if(typeof p.rating !== 'number') p.rating = RATING_DEFAULT;
    if(typeof p.ratingGames !== 'number') p.ratingGames = 0;
    if(p.status === undefined) p.status = 'confirmed';
    if(p.injured === undefined) p.injured = false;
  });
  // Les remplaçants accumulent maintenant eux aussi une cote (voir
  // findRatablePerson) — on initialise les entrées existantes du bassin.
  (DATA.substitutePool||[]).forEach(s=>{
    if(typeof s.rating !== 'number') s.rating = RATING_DEFAULT;
    if(typeof s.ratingGames !== 'number') s.ratingGames = 0;
  });
  // Ordre manuel au sein d'un groupe : si absent, on l'initialise selon
  // l'ordre alphabétique actuel, groupe par groupe.
  (DATA.groups||[]).forEach(g=>{
    const members = (DATA.players||[]).filter(p=>p.groupId===g.id);
    if(members.every(p=>typeof p.order==='number')) return;
    members.sort((a,b)=>a.name.localeCompare(b.name)).forEach((p,i)=>{ p.order = i+1; });
  });
  (DATA.sessions||[]).forEach(s=>{ if(s.published === undefined) s.published = true; });
}
async function boot(){
  // Enregistré avant tout appel à getSession(), pour ne jamais manquer
  // l'événement PASSWORD_RECOVERY si les jetons sont déjà dans l'URL.
  // Demande au navigateur de ne pas effacer les données de l'app (session
  // comprise) quand il manque d'espace ; sans effet si refusé.
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  sb.auth.onAuthStateChange((event, newSession)=>{
    if(event === 'SIGNED_OUT'){
      const lost = !EXPLICIT_LOGOUT && !!SESSION_USER; // session perdue sans que l'utilisateur l'ait demandé
      EXPLICIT_LOGOUT = false;
      SESSION_USER = null; CURRENT_PROFILE = null;
      if(lost){ VIEW = { loginMode:'signin', info:'Ta session a expiré. Reconnecte-toi pour continuer.' }; openLoginModal('signin'); }
      else render();
    }
    if(event === 'PASSWORD_RECOVERY'){ PASSWORD_RECOVERY_MODE = true; render(); }
  });

  // Les données ne sont chargées qu'une fois connecté et une ligue choisie
  // (voir onAuthResolved) — avant ça, DATA reste vide et l'écran de connexion
  // s'affiche avec un titre générique.
  if(SIGNUP_ORG_ID){
    // Nom de l'organisation du lien d'inscription : via une fonction serveur (la liste des organisations n'est plus publique).
    // Repli sur l'ancienne lecture directe tant que la fonction n'est pas installée côté serveur.
    try{
      const r = await sb.rpc('org_signup_name', { p_id: SIGNUP_ORG_ID });
      if(!r.error && r.data) SIGNUP_ORG_NAME = r.data;
      else if(r.error){
        const { data } = await sb.from('organizations').select('name').eq('id', SIGNUP_ORG_ID).maybeSingle();
        if(data) SIGNUP_ORG_NAME = data.name;
      }
    }catch(e){}
  }
  // Liens des courriels (modèles Supabase en français) : « ?token_hash=…&type=… » pointent vers
  // dinkeo.ca plutôt que vers supabase.co. On valide le jeton ici, ce qui ouvre la session.
  let linkError = null;
  try{
    const qs = new URLSearchParams(window.location.search);
    const th = qs.get('token_hash'), tt = qs.get('type');
    if(th && tt){
      try{ window.history.replaceState(null, '', window.location.pathname + window.location.hash); }catch(e){}
      const { error } = await sb.auth.verifyOtp({ token_hash: th, type: tt });
      if(error) linkError = "Ce lien est expiré ou a déjà été utilisé. Connecte-toi, ou redemande un nouveau lien.";
      else if(tt === 'recovery') PASSWORD_RECOVERY_MODE = true;
    }
  }catch(e){ console.error('lien du courriel', e); }
  if(linkError) setTimeout(function(){ showAlert(linkError); }, 400);
  const { data: { session } } = await sb.auth.getSession();
  if(PASSWORD_RECOVERY_MODE){ render(); return; } // déjà intercepté par l'événement ci-dessus
  if(session && session.user){
    await onAuthResolved(session.user);
  } else {
    render();
  }
}
boot();
